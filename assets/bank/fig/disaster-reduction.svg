<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">三种地理信息技术怎么分工</text><rect x="68.0" y="96.0" width="104.0" height="96.0" rx="6.0" fill="rgba(255,255,255,.9)" stroke="#3E6B93" stroke-width="1.10"/><text x="120.0" y="128.0" font-size="13.0" fill="#3E6B93" text-anchor="middle" font-weight="600">RS 遥感</text><text x="120.0" y="150.0" font-size="10.7" fill="#6C7787" text-anchor="middle">大面积、快速获</text><text x="120.0" y="164.0" font-size="10.7" fill="#6C7787" text-anchor="middle">取地表影像</text><rect x="188.0" y="96.0" width="104.0" height="96.0" rx="6.0" fill="rgba(255,255,255,.9)" stroke="#5C7F52" stroke-width="1.10"/><text x="240.0" y="128.0" font-size="13.0" fill="#5C7F52" text-anchor="middle" font-weight="600">GPS 定位</text><text x="240.0" y="150.0" font-size="10.7" fill="#6C7787" text-anchor="middle">给出精确的三维</text><text x="240.0" y="164.0" font-size="10.7" fill="#6C7787" text-anchor="middle">坐标</text><rect x="308.0" y="96.0" width="104.0" height="96.0" rx="6.0" fill="rgba(255,255,255,.9)" stroke="#8A6B4A" stroke-width="1.10"/><text x="360.0" y="128.0" font-size="13.0" fill="#8A6B4A" text-anchor="middle" font-weight="600">GIS 分析</text><text x="360.0" y="150.0" font-size="10.7" fill="#6C7787" text-anchor="middle">叠加图层、做空</text><text x="360.0" y="164.0" font-size="10.7" fill="#6C7787" text-anchor="middle">间分析</text><line x1="178.0" y1="144.0" x2="196.6" y2="144.0" stroke="#7C8794" stroke-width="1.20" stroke-linecap="butt"/><polygon points="202.0,144.0 196.0,147.0 196.0,141.0" fill="#7C8794"/><line x1="298.0" y1="144.0" x2="316.6" y2="144.0" stroke="#7C8794" stroke-width="1.20" stroke-linecap="butt"/><polygon points="322.0,144.0 316.0,147.0 316.0,141.0" fill="#7C8794"/><text x="240.0" y="226.0" font-size="11.6" fill="#4A5563" text-anchor="middle">看影像找现象 → 定位到坐标 → 叠加分析出结论</text><text x="240.0" y="262.0" font-size="10.7" fill="#9AA5B3" text-anchor="middle">监测范围最大的是遥感；要"量算、规划、选址"靠 GIS</text></svg>