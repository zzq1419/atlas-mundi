<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">南极是大陆，北极是海洋</text><text x="120.0" y="84.0" font-size="13.6" fill="#2B3644" text-anchor="middle" font-weight="600">南极</text><path d="M40,150 L200,150 L200,232 Q120,252 40,232 Z" fill="rgba(214,226,238,.9)" stroke="#7C8794" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" /><path d="M40,232 Q120,252 200,232 L200,244 Q120,264 40,244 Z" fill="rgba(150,175,200,.6)" stroke="#7C8794" stroke-width="0.90" stroke-linecap="round" stroke-linejoin="round" /><text x="120.0" y="190.0" font-size="12.5" fill="#3F5C78" text-anchor="middle">冰盖（陆）</text><text x="120.0" y="214.0" font-size="11.6" fill="#6C7787" text-anchor="middle">基岩</text><text x="360.0" y="84.0" font-size="13.6" fill="#2B3644" text-anchor="middle" font-weight="600">北极</text><path d="M280,196 L440,196 L440,206 Q360,216 280,206 Z" fill="rgba(214,226,238,.95)" stroke="#7C8794" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round" /><path d="M280,150 L280,206 Q360,216 440,206 L440,150 Z" fill="rgba(160,190,214,.55)" stroke="#7C8794" stroke-width="0.90" stroke-linecap="round" stroke-linejoin="round" /><text x="360.0" y="186.0" font-size="12.2" fill="#3F5C78" text-anchor="middle">海冰</text><text x="360.0" y="234.0" font-size="12.2" fill="#6C7787" text-anchor="middle">北冰洋（水）</text><text x="240.0" y="300.0" font-size="11.9" fill="#9AA5B3" text-anchor="middle">陆地下垫面 → 升温快、降温也快；海洋下垫面 → 温差小</text></svg>