<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">背斜与向斜：地形常常是反的</text><rect x="0.0" y="176.0" width="480.0" height="120.0" rx="0.0" fill="rgba(214,203,178,.45)" stroke="#8A7A5C" stroke-width="1.00"/><path d="M20,200 Q120,166 190,200 T460,194" fill="none" stroke="#8A6B4A" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" /><path d="M20,222 Q120,188 190,222 T460,216" fill="none" stroke="#8A6B4A" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" /><path d="M20,244 Q120,210 190,244 T460,238" fill="none" stroke="#8A6B4A" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" /><path d="M20,266 Q120,232 190,266 T460,260" fill="none" stroke="#8A6B4A" stroke-width="1.00" stroke-linecap="round" stroke-linejoin="round" /><text x="150.0" y="128.0" font-size="11.3" fill="#5A4A32" text-anchor="middle">背斜（岩层向上拱）</text><text x="340.0" y="128.0" font-size="11.3" fill="#5A4A32" text-anchor="middle">向斜（岩层向下弯）</text><path d="M190,180 Q240,206 290,180" fill="none" stroke="#5A6473" stroke-width="1.20" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" /><text x="150.0" y="196.0" font-size="11.0" fill="#6C7787" text-anchor="middle">顶部被侵蚀成谷地</text><text x="350.0" y="196.0" font-size="11.0" fill="#6C7787" text-anchor="middle">槽部受挤压成山</text><text x="240.0" y="300.0" font-size="10.7" fill="#9AA5B3" text-anchor="middle">背斜顶部受张力、岩石破碎，容易被侵蚀成谷；向斜槽部岩性坚实，反而残留成山</text></svg>