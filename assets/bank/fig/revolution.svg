<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">公转与四季：地轴倾斜是关键</text><ellipse cx="240" cy="176" rx="176" ry="76" fill="none" stroke="#8A9AAA" stroke-width="1" stroke-dasharray="5 5"/><circle cx="240" cy="176" r="18" fill="rgba(230,170,80,.55)" stroke="#C08A3E" stroke-width="1"/><text x="240.0" y="210.0" font-size="11.3" fill="#8A6B2A" text-anchor="middle">太阳</text><circle cx="240" cy="100" r="13" fill="rgba(160,190,214,.5)" stroke="#7C8794" stroke-width="1"/><text x="240.0" y="82.0" font-size="11.3" fill="#2B3644" text-anchor="middle">夏至</text><circle cx="416" cy="176" r="13" fill="rgba(160,190,214,.5)" stroke="#7C8794" stroke-width="1"/><text x="416.0" y="158.0" font-size="11.3" fill="#2B3644" text-anchor="middle">秋分</text><circle cx="240" cy="252" r="13" fill="rgba(160,190,214,.5)" stroke="#7C8794" stroke-width="1"/><text x="240.0" y="278.0" font-size="11.3" fill="#2B3644" text-anchor="middle">冬至</text><circle cx="64" cy="176" r="13" fill="rgba(160,190,214,.5)" stroke="#7C8794" stroke-width="1"/><text x="64.0" y="158.0" font-size="11.3" fill="#2B3644" text-anchor="middle">春分</text><text x="240.0" y="330.0" font-size="10.7" fill="#9AA5B3" text-anchor="middle">地轴倾斜且方向不变，太阳直射点在南北回归线之间来回移动</text></svg>