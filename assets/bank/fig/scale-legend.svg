<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">比例尺：分母越大，比例尺越小</text><text x="40.0" y="101.0" font-size="12.5" fill="#2B3644" text-anchor="start" font-weight="600">1:10000</text><line x1="150.0" y1="96.0" x2="470.0" y2="96.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="150.0" y1="90.0" x2="150.0" y2="102.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="470.0" y1="90.0" x2="470.0" y2="102.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><text x="310.0" y="86.0" font-size="10.4" fill="#9AA5B3" text-anchor="middle">同一段图上的长度</text><text x="480.0" y="100.0" font-size="11.0" fill="#6C7787" text-anchor="start">图上 1cm = 实地 100m</text><text x="40.0" y="120.0" font-size="10.4" fill="#9AA5B3" text-anchor="start">比例尺大，内容越</text><text x="40.0" y="175.0" font-size="12.5" fill="#2B3644" text-anchor="start" font-weight="600">1:100000</text><line x1="150.0" y1="170.0" x2="350.0" y2="170.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="150.0" y1="164.0" x2="150.0" y2="176.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="350.0" y1="164.0" x2="350.0" y2="176.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><text x="250.0" y="160.0" font-size="10.4" fill="#9AA5B3" text-anchor="middle">同一段图上的长度</text><text x="360.0" y="174.0" font-size="11.0" fill="#6C7787" text-anchor="start">图上 1cm = 实地 1km</text><text x="40.0" y="194.0" font-size="10.4" fill="#9AA5B3" text-anchor="start">比例尺中，内容越</text><text x="40.0" y="249.0" font-size="12.5" fill="#2B3644" text-anchor="start" font-weight="600">1:1000000</text><line x1="150.0" y1="244.0" x2="260.0" y2="244.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="150.0" y1="238.0" x2="150.0" y2="250.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><line x1="260.0" y1="238.0" x2="260.0" y2="250.0" stroke="#4A5563" stroke-width="1.40" stroke-linecap="butt"/><text x="205.0" y="234.0" font-size="10.4" fill="#9AA5B3" text-anchor="middle">同一段图上的长度</text><text x="270.0" y="248.0" font-size="11.0" fill="#6C7787" text-anchor="start">图上 1cm = 实地 10km</text><text x="40.0" y="268.0" font-size="10.4" fill="#9AA5B3" text-anchor="start">比例尺小，内容越</text><text x="240.0" y="330.0" font-size="10.7" fill="#9AA5B3" text-anchor="middle">图幅相同时，分母越大 → 比例尺越小 → 范围越大、内容越粗略</text></svg>