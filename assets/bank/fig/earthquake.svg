<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">地震：震源、震中与等震线</text><rect x="0.0" y="120.0" width="480.0" height="200.0" rx="0.0" fill="rgba(214,203,178,.45)" stroke="#8A7A5C" stroke-width="1.00"/><line x1="0.0" y1="120.0" x2="480.0" y2="120.0" stroke="#8A7A5C" stroke-width="1.40" stroke-linecap="butt"/><circle cx="220.0" cy="268.0" r="4.0" fill="#C0392B" stroke="#fff" stroke-width="1.4"/><text x="220.0" y="288.0" font-size="11.6" fill="#C0392B" text-anchor="middle" font-weight="600">震源</text><line x1="220.0" y1="268.0" x2="236.0" y2="120.0" stroke="#B4453A" stroke-width="1.20" stroke-linecap="butt" stroke-dasharray="5 3"/><circle cx="236.0" cy="120.0" r="3.4" fill="#C0392B" stroke="#fff" stroke-width="1.4"/><text x="236.0" y="110.0" font-size="11.6" fill="#C0392B" text-anchor="middle" font-weight="600">震中</text><ellipse cx="236" cy="120" rx="30" ry="8" fill="none" stroke="#B4453A" stroke-width=".9" stroke-dasharray="4 4"/><ellipse cx="236" cy="120" rx="56" ry="15" fill="none" stroke="#B4453A" stroke-width=".9" stroke-dasharray="4 4"/><ellipse cx="236" cy="120" rx="84" ry="23" fill="none" stroke="#B4453A" stroke-width=".9" stroke-dasharray="4 4"/><text x="236.0" y="132.0" font-size="10.7" fill="#B4453A" text-anchor="middle">等震线</text><text x="236.0" y="168.0" font-size="11.0" fill="#6C7787" text-anchor="middle">震源深度</text><text x="240.0" y="300.0" font-size="11.0" fill="#9AA5B3" text-anchor="middle">烈度：离震中越远越小；一次地震只有一个震级，却有很多个烈度</text></svg>