<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" font-family="PingFang SC, Microsoft YaHei, Source Han Sans SC, sans-serif"><rect width="480" height="360" fill="#fff"/><text x="18.0" y="22.0" font-size="16.7" fill="#6C7787" text-anchor="start">可持续发展的三个内涵</text><circle cx="168" cy="150" r="74" fill="rgba(62,107,147,.22)" stroke="#7C8794" stroke-width="1"/><circle cx="110" cy="214" r="74" fill="rgba(92,127,82,.22)" stroke="#7C8794" stroke-width="1"/><circle cx="226" cy="214" r="74" fill="rgba(196,182,150,.35)" stroke="#7C8794" stroke-width="1"/><text x="168.0" y="122.0" font-size="12.5" fill="#2F5578" text-anchor="middle" font-weight="600">经济</text><text x="96.0" y="240.0" font-size="12.5" fill="#3F5A38" text-anchor="middle" font-weight="600">社会</text><text x="240.0" y="240.0" font-size="12.5" fill="#6B5B45" text-anchor="middle" font-weight="600">生态</text><text x="168.0" y="186.0" font-size="11.0" fill="#3A4351" text-anchor="middle">可持续</text><text x="168.0" y="202.0" font-size="11.0" fill="#3A4351" text-anchor="middle">发展</text><text x="348.0" y="120.0" font-size="11.0" fill="#6C7787" text-anchor="start">只讲经济</text><text x="348.0" y="136.0" font-size="11.0" fill="#9AA5B3" text-anchor="start">→ 资源耗竭</text><text x="348.0" y="168.0" font-size="11.0" fill="#6C7787" text-anchor="start">只讲生态</text><text x="348.0" y="184.0" font-size="11.0" fill="#9AA5B3" text-anchor="start">→ 发展停滞</text><text x="348.0" y="216.0" font-size="11.0" fill="#2B3644" text-anchor="start" font-weight="600">三个都要</text><text x="348.0" y="232.0" font-size="11.0" fill="#9AA5B3" text-anchor="start">→ 可持续</text><text x="240.0" y="316.0" font-size="10.7" fill="#9AA5B3" text-anchor="middle">既满足当代人的需要，又不损害后代人满足其需要的能力</text></svg>