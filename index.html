}
</style>
</head>
<body>
<!-- 全屏 3D 舞台。地球是页面主体，不是"页面里的一个区块" ——
     所以这里用 fixed 铺满视口，其余 UI 全部浮在它上面。 -->
<div id="globe-stage">
  <div id="labels"></div>
  <div class="globe-msg" id="globe-msg">正在加载地表数据…</div>
</div>

<!-- 顶部悬浮栏：品牌 + 搜索 -->
<header id="topbar">
  <div class="brand">
    <span class="brand-cn">寰宇图志</span>
  </div>
  <!-- 搜索：默认就是一个短输入框，点一下（或聚焦）展开变长。
       展开后才在右端出现下拉按钮 —— 国家列表要用户自己点，不再一点搜索就糊一脸。 -->
  <div class="search-wrap" id="search-wrap">
    <div class="search-panel" id="search-panel">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <line x1="16" y1="16" x2="21" y2="21"></line>
      </svg>
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             aria-label="搜索国家、地标、语言、饮食与节庆">
      <button class="search-drop" id="search-drop" type="button" aria-label="展开国家列表">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="6 9.5 12 15.5 18 9.5"></polyline>
        </svg>
      </button>
    </div>
    <div class="search-res" id="q-res" hidden></div>
  </div>
</header>

<!-- 国家入口已并入搜索框：空输入聚焦时列出已收录国家，
     不再用底部胶囊 —— 那排按钮和搜索框一起把地球压掉一条。 -->
<div id="cards" hidden></div>

<!-- 右侧档案面板 -->
<aside id="detail" aria-hidden="true">
  <button class="dclose" id="d-close" aria-label="关闭档案">×</button>
  <div class="dhead">
    <h2 id="d-title">国家档案</h2>
    <div id="d-sub"></div>
  </div>
  <div class="dscroll"><div id="d-body"></div></div>
</aside>

<!-- 左下角只留一个视图开关。国名不再用开关 —— 像地图那样按缩放自动分级；
     复位也不再要按钮，双击画面即可。 -->
<div id="tools">
  <button class="tool-btn" id="btn-night" type="button" title="切换夜晚模式（看城市灯光）">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.4 14.6A8.6 8.6 0 1 1 9.4 3.6a6.8 6.8 0 0 0 11 11z"/>
    </svg>
  </button>
</div>

<!-- 旧版遗留的状态位，保留 id 以免脚本取空 -->
<span id="globe-sub" hidden></span>
<span id="cards-sub" hidden></span>
<span id="cards-hint" hidden></span>
<span id="search-sub" hidden></span>

<script>
(function () {
  var cardsEl = document.getElementById('cards');
  var hintEl = document.getElementById('cards-hint');
  var subEl = document.getElementById('cards-sub');
  var detail = document.getElementById('detail');
  var dTitle = document.getElementById('d-title');
  var dSub = document.getElementById('d-sub');
  var dBody = document.getElementById('d-body');

  var MOD_LABEL = { image: '地标', audio: '语音', text: '文本', coords: '坐标', geometry: '边界' };
  var CUR = null;

  /* ---------- 素材双源 ----------
     优先从华为云 OBS（上海节点）取图片与音频，实测 0.17 秒；失败自动回退到
     仓库相对路径（GitHub Pages）。回退不是为了好看 —— OBS 欠费、桶策略变更、
     某地节点不通时，页面不至于整片破图。

     注意：OBS 对静态站默认域名强制 Content-Disposition: attachment（平台策略，
     2022 年起上海一等区域生效），所以 OBS 只能做素材源，不能做站点。
     但 <img> 与 <audio> 作为子资源不受该头影响 —— 这点是实测过的，不是推断。 */
  var OBS_BASE = 'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/';

  function assetSrc(rel) {
    if (!rel) return '';
    if (/^https?:\/\//i.test(rel)) return rel;
    return OBS_BASE + rel.replace(/^\/+/, '');
  }

  function setAsset(node, rel) {
    var fellBack = false;
    node.addEventListener('error', function () {
      if (!fellBack) {
        fellBack = true;
        node.src = rel;                       // 回退到仓库相对路径
        return;
      }
      if (typeof node.__onfail === 'function') node.__onfail();
    });
    node.src = assetSrc(rel);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* 按句切分。中文长段落不缩进、不分段会连成一片，读起来非常吃力；
     每句都单独成段又太碎，所以调用方按两句一段拼回去。 */
  function splitSent(text) {
    var src = String(text || '').trim();
    var out = [], buf = '', marks = '。！？；';
    for (var i = 0; i < src.length; i++) {
      buf += src.charAt(i);
      if (marks.indexOf(src.charAt(i)) >= 0) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  function fmtTime(x) {
    x = Math.max(0, Math.floor(x || 0));
    return Math.floor(x / 60) + ':' + ('0' + (x % 60)).slice(-2);
  }

  /* 摘要的末尾本来就含着一份"历史与民俗"（采集时为凑字数拼进去的），
     再单列一次就是把同样两段念两遍 —— 面板里最扎眼的废话就是它。
     拿 custom 的前 5 个字去摘要里找落点，找到就从那句起截断。 */
  function trimDup(sum, cus) {
    if (!sum || !cus) return sum;
    var probe = cus.replace(/\s/g, '').slice(0, 5);
    if (probe.length < 4) return sum;
    var ss = splitSent(sum);
    for (var i = 0; i < ss.length; i++) {
      if (ss[i].replace(/\s/g, '').indexOf(probe) >= 0) return ss.slice(0, i).join('');
    }
    return sum;
  }

  /* 自绘播放器。浏览器原生 <audio controls> 是一整块浅色系统控件，
     在深色面板里像贴了一张白纸 —— 所以自己画。 */
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1"/>'
                 + '<rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';

  function makePlayer(src) {
    var wrap = el('div', 'aud');
    var btn = el('button', 'aud-btn');
    btn.type = 'button';
    btn.setAttribute('aria-label', '播放');
    btn.innerHTML = ICON_PLAY;
    var bar = el('div', 'aud-bar');
    var track = el('div', 'aud-track');
    var fill = el('div', 'aud-fill');
    track.appendChild(fill);
    bar.appendChild(track);
    var time = el('span', 'aud-time', '0:00');
    wrap.appendChild(btn);
    wrap.appendChild(bar);
    wrap.appendChild(time);

    var au = new Audio();
    au.preload = 'metadata';
    setAsset(au, src);

    /* 计时显示「已播 / 总长」：总长也直接说明这段语音有多长，
       3 秒的国名读音和 40 秒的介绍，一眼能分出来。 */
    function paint(now) {
      var d = au.duration || 0;
      var cur = (now == null ? au.currentTime : now) || 0;
      time.textContent = fmtTime(cur) + ' / ' + fmtTime(d);
      fill.style.width = d ? Math.min(100, (cur / d) * 100).toFixed(1) + '%' : '0%';
    }
    function reset() {
      wrap.classList.remove('playing');
      btn.innerHTML = ICON_PLAY;
      btn.setAttribute('aria-label', '播放');
    }
    btn.addEventListener('click', function () {
      if (au.paused) {
        var p = au.play();
        if (p && p.catch) p.catch(function () { reset(); });
      } else {
        au.pause();
      }
    });
    au.addEventListener('play', function () {
      wrap.classList.add('playing');
      btn.innerHTML = ICON_PAUSE;
      btn.setAttribute('aria-label', '暂停');
    });
    au.addEventListener('pause', reset);
    au.addEventListener('ended', function () { reset(); paint(0); });
    au.addEventListener('loadedmetadata', function () { paint(); });
    au.addEventListener('timeupdate', function () { paint(); });
    bar.addEventListener('click', function (e) {
      var d = au.duration || 0;
      if (!d) return;
      var r = track.getBoundingClientRect();
      if (!r.width) return;
      au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d;
      paint();
    });
    return wrap;
  }

  function paraText(text, perPara) {
    var host = el('div', 'prose');
    var parts = splitSent(text);
    if (!parts.length) return host;
    var per = perPara || 2;
    for (var k = 0; k < parts.length; k += per) {
      var seg = parts.slice(k, k + per).join('');
      if (seg.replace(/\s/g, '').length < 6) continue;
      host.appendChild(el('p', null, seg));
    }
    return host;
  }

  function onGlobeReady() {
    /* 提示文字和地球一起淡出，不要"啪"一下子消失 —— 那一下也算一次闪。 */
    var m = document.getElementById('globe-msg');
    if (m) {
      m.classList.add('gone');
      setTimeout(function () { if (m.parentNode) m.remove(); }, 700);
    }
  }

  function fail(msg) {
    hintEl.innerHTML = '';
    hintEl.appendChild(el('span', '', msg));
    cardsEl.innerHTML = '';
  }

  /* ---------- 国家入口 ----------
     底部胶囊已删除：它和搜索框一起把地球压掉一条。
     现在入口并入搜索框 —— 空输入聚焦时列出已收录国家（见 showCountryList）。 */
  function renderCards(list) {
    cardsEl.innerHTML = '';
    // 右上角那行"3 国 · 3 完整"已去掉：它是构建期统计，压在画面上没用还碍眼。
  }

  /* ---------- 详情 ---------- */
  function openPanel() {
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  function closePanel() {
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.remove('active');
    });
    if (typeof flyOut === 'function') flyOut();
  }

  function openDetail(iso, item, quiet) {
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.toggle('active', n === item);
    });
    if (typeof setActive === 'function') setActive(iso);

    dTitle.textContent = '读取中…';
    dSub.textContent = iso;
    dBody.innerHTML = '';
    openPanel();
    if (typeof flyToCountry === 'function') flyToCountry(iso);

    fetch('data/' + iso.toLowerCase() + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { renderDetail(d, true); })
      .catch(function (e) {
        dTitle.textContent = '档案未就绪';
        dSub.textContent = iso;
        dBody.appendChild(el('p', 'hint',
          '读取 data/' + iso.toLowerCase() + '.json 失败（' + e.message + '）。' +
          '该国家/地区的数据尚未采集，属预期状态。'));
      });
  }

  /* 面板关闭按钮 + Esc */
  (function bindPanel() {
    var btn = document.getElementById('d-close');
    if (btn) btn.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && detail.classList.contains('open')) closePanel();
    });
  })();

  function renderDetail(d, quiet) {
    dTitle.textContent = d.name_zh;
    dSub.textContent = d.name_en + ' · ' + d.iso_a2 + ' / ' + d.iso_a3 + ' · ' + d.qid;

    var wrap = el('div', 'dwrap');

    /* 左：影像 */
    var left = el('div');
    var imgs = d.landmark_images || [];
    if (imgs.length) {
      var picWrap = el('div', 'dimg-wrap loading');
      var pic = el('img', 'dimg');
      picWrap.appendChild(pic);
      var capEl = el('div', 'cap', '');
      var licEl = el('div', 'cap dim', '');
      var strip = imgs.length > 1 ? el('div', 'thumbstrip') : null;
      var items = [];

      function showPic(idx) {
        var it = imgs[idx];
        picWrap.classList.remove('loaded');
        picWrap.classList.add('loading');
        pic.alt = it.caption_zh || it.caption || d.name_zh;
        pic.onload = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('loaded');
          // 竖构图（如埃菲尔铁塔 1400x2591）用 cover 会把塔顶塔基裁掉，
          // 改 contain 装下整张，两侧用底色补。横构图仍用 cover 铺满。
          var portrait = pic.naturalHeight > pic.naturalWidth * 1.15;
          picWrap.classList.toggle('fit', portrait);
        };
        pic.__onfail = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('blank');
        };
        setAsset(pic, it.url);
        capEl.textContent = it.caption_zh || it.caption || '';
        licEl.textContent = it.license
          ? '授权：' + it.license + (it.author ? ' · ' + it.author : '')
          : '授权待确认（来源已记录：' + (it.title || 'Commons') + '）';
        items.forEach(function (n, i) { n.classList.toggle('active', i === idx); });
      }

      left.appendChild(picWrap);
      if (strip) {
        imgs.forEach(function (it, i) {
          var t = el('img', 'ts-item');
          t.alt = it.caption_zh || it.caption || (d.name_zh + ' 图片 ' + (i + 1));
          t.title = t.alt;
          t.loading = 'lazy';
          setAsset(t, it.thumb_url || it.url);
          t.addEventListener('click', function () { showPic(i); });
          items.push(t);
          strip.appendChild(t);
        });
      }
      showPic(0);
      if (strip) left.appendChild(strip);
      left.appendChild(capEl);
      left.appendChild(licEl);
    } else {
      left.appendChild(el('div', 'dimg blank', '暂无地标影像'));
    }

    /* 右：结构化 + 文本 */
    var right = el('div');

    var meta = el('dl', 'dmeta');
    [['首都', d.capital || '—'],
     ['大洲', d.continent || '—'],
     ['坐标', d.centroid ? d.centroid[1].toFixed(2) + '°N, ' + d.centroid[0].toFixed(2) + '°E' : '—'],
     ['语言', (d.languages || []).map(function (l) { return l.name_zh; }).join(' / ') || '—'],
     ['边界', d.geometry
        ? 'Natural Earth 50m · ' + ((d.geometry_stats || {}).vertices || '?') + ' 顶点'
        : '待采集']
    ].forEach(function (p) {
      meta.appendChild(el('dt', null, p[0]));
      meta.appendChild(el('dd', null, p[1]));
    });
    right.appendChild(meta);

    // 边界不能只写"已采集"——用户看不见等于没采。这里用等距圆柱投影画成 SVG 轮廓，
    // 无第三方库、离线可用，也顺带验证了阶段 D 要用的 GeoJSON 是好的。
    if (d.geometry) {
      var geoBox = el('div', 'geo-box');
      geoBox.appendChild(el('div', 'sub-label', '国界轮廓'));
      var svgHost = el('div', 'geo-svg', '读取边界数据…');
      geoBox.appendChild(svgHost);
      right.appendChild(geoBox);
      renderOutline(d.geometry, svgHost);
    }

    var txt = el('div', 'dtext');
    var sumTxt = trimDup(d.summary_text, d.custom_text);
    if (sumTxt) txt.appendChild(paraText(sumTxt, 2));
    if (d.custom_text) {
      txt.appendChild(el('div', 'sub-label', '历史与民俗'));
      txt.appendChild(paraText(d.custom_text, 2));
    }
    right.appendChild(txt);

    /* 文化特征：由大模型在构建期从摘要与民俗文本抽取，页面只读结果。
       每个标签的 title 属性挂着抽取时的原文片段，鼠标悬停可核对依据。 */
    var facets = d.custom_facets || {};
    var fgroups = [
      ['节庆', facets.festivals],
      ['饮食', facets.cuisine],
      ['宗教', facets.religion],
      ['建筑', facets.architecture],
      ['遗产', facets.heritage]
    ].filter(function (g) { return g[1] && g[1].length; });
    var kws = facets.keywords || [];

    if (fgroups.length || kws.length) {
      var fbox = el('div', 'facets');
      fbox.appendChild(el('div', 'sub-label', '文化特征'));
      if (kws.length) {
        var krow = el('div', 'frow');
        krow.appendChild(el('span', 'fkey', '关键词'));
        var kwrap = el('div', 'fval');
        kws.forEach(function (k) {
          var c = el('span', 'chip chip-kw', k.v || k);
          if (k.evidence) c.title = '原文：' + k.evidence;
          kwrap.appendChild(c);
        });
        krow.appendChild(kwrap);
        fbox.appendChild(krow);
      }
      fgroups.forEach(function (g) {
        var row = el('div', 'frow');
        row.appendChild(el('span', 'fkey', g[0]));
        var wrap = el('div', 'fval');
        g[1].forEach(function (x) {
          var c = el('span', 'chip', x.v || x);
          if (x.evidence) c.title = '原文：' + x.evidence;
          wrap.appendChild(c);
        });
        row.appendChild(wrap);
        fbox.appendChild(row);
      });
      right.appendChild(fbox);
    }

    /* 音频：每个语言一条，区域语言也在内 */
    var withAudio = (d.languages || []).filter(function (l) { return l.audio_url; });
    var without = (d.languages || []).filter(function (l) { return !l.audio_url; });
    if (withAudio.length) {
      right.appendChild(el('div', 'sub-label', '语音'));
      withAudio.forEach(function (l) {
        var row = el('div', 'lang-audio');
        row.appendChild(el('span', 'la-name', l.name_zh));
        row.appendChild(el('span', 'la-role', l.role === 'official' ? '官方' : '区域'));
        row.appendChild(makePlayer(l.audio_url));
        right.appendChild(row);
      });
    }
    if (without.length) {
      right.appendChild(el('div', 'pending',
        '暂无语音：' + without.map(function (l) { return l.name_zh; }).join('、')));
    }

    /* 数据待补：只写短标签，一行说完。
       详细成因（P443 语种不符、Commons 无音源…）留在 docs 与 CI 日志里 ——
       面板是给人看国家的地方，不是构建日志。 */
    var brief = d.review_short || [];
    if (brief.length) {
      var dq = el('div', 'dq');
      dq.appendChild(el('span', 'dq-k', '待补'));
      dq.appendChild(el('span', 'dq-v', brief.join(' · ')));
      right.appendChild(dq);
    }

    wrap.appendChild(left);
    wrap.appendChild(right);
    dBody.innerHTML = '';
    dBody.appendChild(wrap);
  }

  /* ---------- 国界轮廓（等距圆柱投影，纯 SVG） ---------- */
  function renderOutline(url, host) {
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (gj) {
        var rings = [];
        (gj.features || []).forEach(function (f) {
          var g = f.geometry || {};
          var polys = g.type === 'Polygon' ? [g.coordinates]
            : (g.type === 'MultiPolygon' ? g.coordinates : []);
          polys.forEach(function (poly) {
            poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
          });
        });
        if (!rings.length) { host.textContent = '边界数据为空'; return; }

        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        rings.forEach(function (ring) {
          ring.forEach(function (pt) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
            if (pt[1] < minY) minY = pt[1];
            if (pt[1] > maxY) maxY = pt[1];
          });
        });
        var W = 300, pad = 10;
        var spanX = Math.max(maxX - minX, 0.01);
        var spanY = Math.max(maxY - minY, 0.01);
        var scale = Math.min((W - pad * 2) / spanX, 150 / spanY);
        var H = Math.round(spanY * scale + pad * 2);
        var ox = (W - spanX * scale) / 2;
        var oy = (H - spanY * scale) / 2;

        var d = rings.map(function (ring) {
          return ring.map(function (pt, i) {
            var x = (ox + (pt[0] - minX) * scale).toFixed(1);
            var y = (oy + (maxY - pt[1]) * scale).toFixed(1);
            return (i ? 'L' : 'M') + x + ' ' + y;
          }).join('') + 'Z';
        }).join('');

        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
          '<path d="' + d + '" fill="rgba(111,214,232,.10)" stroke="rgba(111,214,232,.75)" ' +
          'stroke-width=".8" stroke-linejoin="round"/></svg>';
        host.setAttribute('data-rings', rings.length);
      })
      .catch(function (e) {
        host.textContent = '边界读取失败（' + e.message + '）';
      });
  }

  /* ---------- 知识库检索（2-gram + BM25，纯本地） ----------
     为什么在前端检索而不是每次调大模型：
     1) key 不能进浏览器，公开仓库的静态站更是碰都不能碰；
     2) 三个国家的知识库只有几十条，本地算比一次网络往返快两个数量级；
     3) 断网、无代理也能演示 —— 这是录屏的硬要求。
     中文没有空格，用 2-gram 切分（不分词、不引词典），BM25 打分。 */
  var IDX = null;
  var qInput = document.getElementById('q');
  var qRes = document.getElementById('q-res');
  var qSub = document.getElementById('search-sub');

  function tokenize(text) {
    var s = String(text || '').toLowerCase();
    var toks = [], buf = '', mode = null;
    function flushCJK(b) {
      if (!b) return;
      if (b.length === 1) { toks.push(b); return; }
      for (var i = 0; i < b.length - 1; i++) toks.push(b.substr(i, 2));
    }
    function flushWord(b) { if (b.length >= 2) toks.push(b); }
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var m = /[\u3400-\u9fff]/.test(ch) ? 'c' : (/[a-z0-9]/.test(ch) ? 'a' : null);
      if (m !== mode) {
        if (mode === 'c') flushCJK(buf);
        else if (mode === 'a') flushWord(buf);
        buf = ''; mode = m;
      }
      if (m) buf += ch;
    }
    if (mode === 'c') flushCJK(buf);
    else if (mode === 'a') flushWord(buf);
    return toks;
  }

  function buildIdx(docs) {
    var postings = {}, df = {}, lens = [];
    docs.forEach(function (d, i) {
      var toks = tokenize(d.index_text);
      lens[i] = toks.length || 1;
      var tf = {};
      toks.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
      for (var t in tf) {
        if (!postings[t]) postings[t] = {};
        postings[t][i] = tf[t];
        df[t] = (df[t] || 0) + 1;
      }
    });
    var sum = lens.reduce(function (a, b) { return a + b; }, 0);
    return { docs: docs, postings: postings, df: df, lens: lens,
             avgdl: sum / (docs.length || 1), N: docs.length };
  }

  /* 疑问句里的虚词。中文 2-gram 会把「哪里能看」切成「哪里/里能/能看」，
     这些碎片在多个文档里都出现，是纯噪声 —— 实测「哪里能看长城」会把
     「法国面积有多大？首都是哪里？」顶到第二名，就因为含「哪里」。 */
  var STOP = {};
  ('哪里 里能 能看 什么 怎么 哪些 哪个 多少 哪儿 有什 么地 么语 么节 么样 么东 ' +
   '有哪 些地 请问 一下 告诉 知道 我想 想要 是否 可以 应该 这个 那个 ' +
   '这些 那些 是什 为什 一个 有些 有没 没有 是不 不是').split(' ').forEach(function (w) {
    if (w) STOP[w] = 1;
  });

  var MIN_SCORE = 1.5;   // 绝对阈值：低于此分视为噪声（实测「日本有什么」最高只有 1.74）
  var REL_RATIO = 0.35;  // 相对阈值：只保留最高分的 35% 以上

  function bm25(q, topk) {
    if (!IDX) return [];
    var k1 = 1.5, b = 0.75, score = {};
    tokenize(q).forEach(function (t) {
      if (STOP[t]) return;
      var pl = IDX.postings[t];
      if (!pl) return;
      var n = IDX.df[t] || 0;
      var idf = Math.log(1 + (IDX.N - n + 0.5) / (n + 0.5));
      for (var i in pl) {
        var tf = pl[i], dl = IDX.lens[i];
        score[i] = (score[i] || 0) +
          idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / IDX.avgdl));
      }
    });
    var arr = [];
    for (var i in score) { if (score[i] > MIN_SCORE) arr.push([IDX.docs[i], score[i]]); }
    arr.sort(function (a, b) { return b[1] - a[1]; });
    if (!arr.length) return [];
    var floor = arr[0][1] * REL_RATIO;
    arr = arr.filter(function (x) { return x[1] >= floor; });
    return arr.slice(0, topk || 5);
  }

  function cardOf(iso) {
    var all = cardsEl.children;
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset && all[i].dataset.iso === iso) return all[i];
    }
    return null;
  }

  function renderResults(q) {
    var hits = bm25(q, 5);
    qRes.innerHTML = '';
    qRes.hidden = false;
    if (!hits.length) {
      qRes.appendChild(el('div', 'sr-empty',
        '没有匹配内容（知识库共 ' + (IDX ? IDX.N : 0) + ' 条）'));
      return;
    }
    hits.forEach(function (h) {
      var d = h[0];
      var item = el('div', 'sr-item');
      var top = el('div', 'sr-top');
      top.appendChild(el('span', 'sr-country', d.name));
      top.appendChild(el('span', 'sr-q', d.q));
      item.appendChild(top);
      item.appendChild(el('div', 'sr-a', d.a));
      item.addEventListener('click', function () {
        openDetail(d.iso, cardOf(d.iso), false);
        setSearch(false);              // 选中即收起，视线回到地球
        if (qInput) qInput.blur();
      });
      qRes.appendChild(item);
    });
  }

  /* 国家列表：由搜索框右端的下拉按钮触发（不自动弹）。
     空输入直接点开时它就是入口，用户不用先背关键词。 */
  function showCountryList() {
    if (!IDX || !IDX.docs) {
      qRes.innerHTML = '';
      qRes.hidden = false;
      qRes.appendChild(el('div', 'sr-empty', '知识库索引尚未就绪'));
      return;
    }
    var seen = {}, list = [];
    IDX.docs.forEach(function (d) {
      if (d.iso && !seen[d.iso]) { seen[d.iso] = 1; list.push(d); }
    });
    qRes.innerHTML = '';
    qRes.hidden = false;
    list.forEach(function (d) {
      var item = el('div', 'sr-item sr-country-row');
      item.appendChild(el('span', 'sr-country', d.iso));
      item.appendChild(el('span', 'sr-q', d.name));
      item.appendChild(el('span', 'sr-arrow', '›'));
      item.addEventListener('click', function () {
        openDetail(d.iso, cardOf(d.iso), false);
        setSearch(false);
        if (qInput) qInput.blur();
      });
      qRes.appendChild(item);
    });
  }

  var searchWrap = document.getElementById('search-wrap');
  var searchPanel = document.getElementById('search-panel');
  var searchDrop = document.getElementById('search-drop');

  /* 开合只有一个入口，避免三处各改一半导致状态对不上 */
  function setSearch(open, list) {
    if (!searchWrap) return;
    searchWrap.classList.toggle('open', !!open);
    if (!open) {
      qRes.hidden = true;
      searchWrap.classList.remove('list-open');
      return;
    }
    searchWrap.classList.toggle('list-open', !!list);
    if (list) showCountryList(); else qRes.hidden = true;
  }

  /* 框本身常驻：点框内任何位置都算"要输入"，展开并聚焦。
     不再有那个圆钮 —— 一眼看不出是搜索框，反而像工具菜单。 */
  if (searchPanel) {
    searchPanel.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!searchWrap.classList.contains('open')) setSearch(true, false);
      if (qInput && document.activeElement !== qInput) {
        setTimeout(function () { qInput.focus(); }, 130);
      }
    });
  }
  if (qInput) {
    qInput.addEventListener('focus', function () {
      if (!searchWrap.classList.contains('open')) setSearch(true, false);
    });
    qInput.addEventListener('blur', function () {
      // 点了下拉列表的话不收起；空输入离开才收起
      setTimeout(function () {
        if (document.activeElement === qInput) return;
        if (searchWrap.classList.contains('list-open')) return;
        if (!qInput.value.trim()) setSearch(false);
      }, 140);
    });
  }

  /* 下拉按钮：只有点了它才列国家。搜索钮只管"打开搜索框"。 */
  if (searchDrop) {
    searchDrop.addEventListener('click', function (e) {
      e.stopPropagation();
      var openList = searchWrap.classList.contains('list-open');
      if (openList) { setSearch(true, false); return; }
      if (qInput) qInput.value = '';
      setSearch(true, true);
    });
  }

  document.addEventListener('click', function (e) {
    if (searchWrap && !searchWrap.contains(e.target)) setSearch(false);
  });

  if (qInput) {
    var qTimer = null;
    qInput.addEventListener('input', function () {
      clearTimeout(qTimer);
      var v = qInput.value.trim();
      searchWrap.classList.remove('list-open');
      qTimer = setTimeout(function () {
        if (v.length < 2) { qRes.hidden = true; qRes.innerHTML = ''; return; }
        renderResults(v);
      }, 180);
    });
    qInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        qInput.value = '';
        setSearch(false);
        qInput.blur();
      }
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sr-ex'), function (btn) {
    btn.addEventListener('click', function () {
      qInput.value = btn.dataset.q;
      renderResults(btn.dataset.q);
      qInput.focus();
    });
  });

  function loadSearchIndex() {
    fetch('data/search.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) {
        IDX = buildIdx(d.docs || []);
        if (qSub) qSub.textContent = '知识库 ' + IDX.N + ' 条 · 2-gram + BM25 本地检索';
      })
      .catch(function (e) {
        if (qSub) qSub.textContent = '索引未加载（' + e.message + '）';
      });
  }

  /* ---------- 3D 地球 ----------
     设计上的四个决定：

     1) 懒加载。three.min.js 670KB，若在首屏加载会把 LCP 拖到 3 秒以上。
        用 IntersectionObserver 等区块进入视口再加载，首屏完全不受影响。

     2) 不用贴图，只用我们自己的 GeoJSON。真实地球纹理（4K 等距柱状图）动辄
        2~8MB，且来源授权要单独确认；而我们的数据只有 110KB —— 大陆轮廓 + 三国
        国界，全部来自 Natural Earth 与既有 geo/*.geojson。视觉上反而更统一：
        暗球 + 淡色大陆 + 金色国界，和站点其余部分同一套配色。

     3) 球面插值细分。国界相邻两点若相距较远，直接用直线连会在球体内部穿过去
        （弦切进球），表现为"线条沉到球里"。所以每条边按 ≤2° 插值成折线。

     4) 点击拾取要 worldToLocal。射线与球求交得到的是**世界坐标**，而我们要反算
        经纬度，必须先把交点转回 spinGroup 的局部坐标 —— 否则球体转过之后
        算出的经纬度全是错的。 */
  var GLOBE_SRC = [
    'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/vendor/three.min.js',
    'vendor/three.min.js'
  ];
  var globe = {
    state: 'idle', ready: false, data: null,
    scene: null, camera: null, renderer: null,
    tilt: null, spin: null, sphere: null,
    groups: {},           // iso -> LineSegments
    matOn: null, matOff: null,
    active: null,
    autoSpin: true,
    inView: false,
    dragging: false,
    last: { x: 0, y: 0 },
    vel: { x: 0, y: 0 },
    idleUntil: 0,
    raf: 0,
    labels: null,
    nightTarget: 0,       // 0=昼夜，1=全夜
    texReady: false,
    fadeStart: 0,         // 淡入起点（performance.now），0 表示已完成
    mixBTarget: 0,        // 8K 交叉淡化的目标值
    tex8k: null,          // 8K 日面贴图（按需加载，无 mipmap）
    tex8kLoading: false,
    tex8kReady: false,    // 已下载，等交互停止再绑 GPU
    tex8kPrefetched: false,
    lastInput: 0,
    can8k: false,
    atmo: null,
    camTarget: 3.02,      // 相机的目标 z，每帧阻尼逼近
    camMode: 'far',       // far=全球视角 / near=聚焦某国 / manual=用户滚轮缩放
    rotTargetY: 0,        // 飞行目标经度（弧度）
    rotTargetX: 0,
    flying: false
  };

  var D2R = Math.PI / 180;
  var R2D = 180 / Math.PI;

  function globeStage() { return document.getElementById('globe-stage'); }
  function globeMsg(text, isErr) {
    var st = globeStage();
    if (!st) return;
    var m = document.getElementById('globe-msg');
    if (!m) {
      m = el('div', 'globe-msg');
      m.id = 'globe-msg';
      st.appendChild(m);
    }
    m.textContent = text;
    m.className = 'globe-msg' + (isErr ? ' err' : '');
  }

  function loadScriptOnce(urls, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { done(new Error('all sources failed')); return; }
      var src = urls[i++];
      var sc = document.createElement('script');
      sc.src = src;
      sc.async = true;
      sc.onload = function () { done(null); };
      sc.onerror = function () {
        sc.remove();
        next();
      };
      document.head.appendChild(sc);
    }
    next();
  }

  /* 经纬度 → 球面坐标。y 轴朝北，经度 0 落在 -Z 方向（正对初始相机）。 */
  function llToVec3(lon, lat, r, out) {
    var phi = (90 - lat) * D2R;
    var theta = (lon + 180) * D2R;
    var sp = Math.sin(phi);
    out.set(-r * sp * Math.cos(theta), r * Math.cos(phi), r * sp * Math.sin(theta));
    return out;
  }

  /* 把一条边按 ≤2° 插值成折线，避免弦切进球体 */
  function pushEdge(a, b, r, arr) {
    var dLon = b[0] - a[0];
    if (dLon > 180) dLon -= 360;
    if (dLon < -180) dLon += 360;
    var dLat = b[1] - a[1];
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dLon), Math.abs(dLat)) / 2));
    var va = new THREE.Vector3();
    llToVec3(a[0], a[1], r, va);
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      var vb = new THREE.Vector3();
      llToVec3(a[0] + dLon * t, a[1] + dLat * t, r, vb);
      arr.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
      va = vb;
    }
  }

  /* rings（环数组，null 表示断点）→ LineSegments */
  function ringsToLines(rings, radius, material) {
    var pos = [];
    rings.forEach(function (ring) {
      var prev = null;
      for (var i = 0; i < ring.length; i++) {
        var pt = ring[i];
        if (!pt) { prev = null; continue; }
        if (prev) pushEdge(prev, pt, radius, pos);
        prev = pt;
      }
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, material);
  }

  /* 经纬网：每 30° 一条 */
  function graticule(radius) {
    var pos = [];
    var lon, lat, i;
    for (lon = -180; lon < 180; lon += 30) {
      for (i = -88; i < 88; i += 2) {
        pushEdge([lon, i], [lon, i + 2], radius, pos);
      }
    }
    for (lat = -60; lat <= 60; lat += 30) {
      for (i = -178; i < 178; i += 2) {
        pushEdge([i, lat], [i + 2, lat], radius, pos);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color: 0x2c5478, transparent: true, opacity: 0.42
    }));
  }

  /* 世界坐标（球面）→ 经纬度 */
  function vec3ToLL(v) {
    var n = v.clone().normalize();
    var lat = Math.asin(Math.max(-1, Math.min(1, n.y))) * R2D;
    var lon = Math.atan2(n.z, -n.x) * R2D - 180;
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lon: lon, lat: lat };
  }

  function countryAt(lon, lat) {
    var list = globe.data.countries || [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i].bbox;
      if (!b) continue;
      // bbox 放宽 2°，球面上点击有像素级误差
      if (lon >= b[0] - 2 && lon <= b[2] + 2 && lat >= b[1] - 2 && lat <= b[3] + 2) {
        return list[i];
      }
    }
    return null;
  }

  function setActive(iso) {
    globe.active = iso;
    Object.keys(globe.groups).forEach(function (k) {
      var on = (k === iso);
      globe.groups[k].visible = on;
      if (on) globe.groups[k].material = globe.matOn;
    });
    Array.prototype.forEach.call(
      document.querySelectorAll('.dock-item'),
      function (n) { n.classList.toggle('active', n.dataset.iso === iso); }
    );
  }

  /* 把某国转到正对相机。
     spin 绕 Y：点 (lon,lat) 的方位角 θ=(lon+180)°，令 θ+ry=90° 即朝向 +Z，
     得 ry = -lon - 90。
     tilt 绕 X：正角度使北极转向相机，故北半球国家用正 lat。 */
  function focusCountry(iso, ms) {
    var c = null;
    (globe.data.countries || []).forEach(function (x) { if (x.iso === iso) c = x; });
    if (!c || !globe.spin) return;
    var toY = -c.center[0] * D2R - Math.PI / 2;
    var toX = c.center[1] * D2R;
    var fromY = globe.spin.rotation.y;
    var fromX = globe.tilt.rotation.x;
    var dY = toY - fromY;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    var dX = toX - fromX;
    var t0 = performance.now();
    var dur = ms || 760;
    globe.idleUntil = performance.now() + dur + 2600;
    globe.autoSpin = false;
    (function step() {
      var k = Math.min(1, (performance.now() - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      globe.spin.rotation.y = fromY + dY * e;
      globe.tilt.rotation.x = fromX + dX * e;
      if (k < 1) requestAnimationFrame(step);
      else globe.autoSpin = true;
    })();
  }

  /* ---------- 地球贴图与材质 ----------
     为什么需要 CORS：<img> 展示图片不受跨域限制，但 WebGL **纹理**必须有
     Access-Control-Allow-Origin，否则纹理会加载失败（画布被污染）。这是
     图片与纹理最容易踩的差别 —— 之前 assets 里的图片能显示，不代表贴图能用。

     贴图分两级加载，不是一次性等：
       1. 4K（约 1MB）先到 → 球先淡入，用户不用盯着黑星空等 8K
       2. 8K 后台补 → 到位后和 4K 交叉淡化 0.7 秒，不硬切
     这样既解决"清晰度"，也解决"从无到好那一下很僵硬"。 */
  var TEX_BASES = [OBS_BASE + 'assets/tex/', 'assets/tex/'];

  /* 单文件多源尝试：OBS 失败退仓库同域 */
  function loadTex(loader, name, ok, fail) {
    var i = 0;
    (function next() {
      if (i >= TEX_BASES.length) { fail(); return; }
      var url = TEX_BASES[i++] + name;
      loader.load(url, function (t) { ok(t, url); }, undefined, next);
    })();
  }

  /* 8K 只在真有本钱的情况下加载：
     - GPU 最大纹理尺寸够 8192（老集显/手机常见上限 4096）
     - 不是移动端（移动端 8K 纹理 ~180MB 显存，容易直接掉帧）
     - 用户没开省流量 */
  function canUse8K() {
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return false;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
    if (navigator.connection && navigator.connection.saveData) return false;
    if ((window.innerWidth || 0) < 1024) return false;
    return true;
  }

  function loadEarthTextures(cb) {
    var loader = new THREE.TextureLoader();
    var day4 = null, night = null, pending = 2;

    function maybeDone() {
      if (--pending > 0) return;
      cb(day4, night);
    }
    loadTex(loader, 'earth-day.webp',
      function (t) { day4 = t; maybeDone(); },
      function () { day4 = null; maybeDone(); });
    loadTex(loader, 'earth-night.webp',
      function (t) { night = t; maybeDone(); },
      function () { night = null; maybeDone(); });
  }

  /* ---------- 8K 贴图：按需取、不建 mipmap ----------
     它只负责"放大时更清楚"，缩小交给带 mipmap 的 4K（见 shader 里的 k），
     所以这张 8192×4096 完全不需要 mipmap —— 省掉的正是最贵的那一步
     （对 3300 万像素做 mipmap 生成，软件渲染上要一秒）。
     同理不在首屏拉：用户没拉近之前，这 3.5MB 和 134MB 显存都不该花。 */
  function bind8k() {
    if (!globe.tex8k || !globe.earthMat) return;
    globe.tex8kReady = false;
    globe.earthMat.uniforms.dayMapB.value = globe.tex8k;
    globe.mixBTarget = 1;
  }

  function ensure8k() {
    if (!globe.can8k || globe.tex8k || globe.tex8kLoading) return;
    globe.tex8kLoading = true;
    loadTex(new THREE.TextureLoader(), 'earth-day-8k.webp', function (t) {
      t.anisotropy = 1;
      t.generateMipmaps = false;
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
      t.needsUpdate = true;
      globe.tex8k = t;
      globe.tex8kLoading = false;
      /* 先不绑定。绑定的那一刻要把 134MB 传上 GPU，如果正好落在用户滚轮过程中，
         就是"滑到某个位置卡一下，之后又好了"——因为只有第一次要传。
         等滚轮停 0.4 秒再绑，卡顿落在停顿里，基本感知不到。 */
      if (performance.now() - (globe.lastInput || 0) > 420) bind8k();
      else globe.tex8kReady = true;
    }, function () {
      globe.tex8kLoading = false;
      globe.can8k = false;      // 取不到就别再试，4K 已经够用
    });
  }

  /* 提前把 8K 的字节抓下来（只抓字节、不解码），这样用户第一次拉近时
     不需要等 3.5MB 的下载，只剩一次上传。失败就算了，不影响 4K。 */
  function prefetch8k() {
    if (!globe.can8k || globe.tex8kPrefetched || !window.fetch) return;
    globe.tex8kPrefetched = true;
    fetch(TEX_BASES[0] + 'earth-day-8k.webp')
      .then(function (r) { return r.ok ? r.blob() : null; })
      .catch(function () { globe.tex8kPrefetched = false; });
  }

  /* 星空：球面均匀分布的点云，带闪烁。
     用 PointsMaterial 出来的是"一堆死白点"；换成自定义 shader，每颗星带一个
     随机相位，亮度按 sin 缓慢呼吸（周期各不相同），才有真正夜空的感觉。
     半径 26~66 落在相机 far(100) 之内，不跟随地球自转，所以它是"背景"。 */
  var STAR_MAT = null;
  function addStars(scene) {
    /* 相机永远看着球心、fov 固定，所以视野其实是**一个固定的圆锥**。
       把星星撒满整个球面，只有 3% 会出现在画面里 —— 3200 颗看起来像 100 颗。
       所以直接在视野锥里撒（半角 44°，覆盖宽屏的水平视场），
       1400 颗就真的能看到 1400 颗，密度才像夜空。 */
    var N = 1400;
    var COSA = Math.cos(44 * Math.PI / 180);
    var pos = new Float32Array(N * 3);
    var col = new Float32Array(N * 3);
    var pha = new Float32Array(N);
    var siz = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      var cosT = 1 - Math.random() * (1 - COSA);
      var sinT = Math.sqrt(Math.max(0, 1 - cosT * cosT));
      var ph = Math.random() * Math.PI * 2;
      var r = 26 + Math.pow(Math.random(), 0.65) * 40;
      pos[i * 3] = r * sinT * Math.cos(ph);
      pos[i * 3 + 1] = r * sinT * Math.sin(ph);
      pos[i * 3 + 2] = -r * cosT;          // -Z 是相机朝向，星星在正前方
      // 星色微差：少量暖白、一部分冷蓝、其余纯白，避免一片死白
      var b = 0.46 + Math.random() * 0.54;
      var t = Math.random();
      if (t < 0.18) { col[i*3] = b; col[i*3+1] = b*0.86; col[i*3+2] = b*0.72; }
      else if (t < 0.50) { col[i*3] = b*0.78; col[i*3+1] = b*0.89; col[i*3+2] = b; }
      else { col[i*3] = b; col[i*3+1] = b; col[i*3+2] = b; }
      pha[i] = Math.random() * Math.PI * 2;
      // 幂次压低：多数是小星，少数几颗明显亮 —— 真实夜空就是这个分布
      siz[i] = 0.85 + Math.pow(Math.random(), 2.4) * 2.4;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(pha, 1));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));

    STAR_MAT = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) }
      },
      vertexShader: [
        'attribute vec3 aColor;',
        'attribute float aPhase;',
        'attribute float aSize;',
        'uniform float uTime;',
        'uniform float uDpr;',
        'varying vec3 vC;',
        'varying float vA;',
        'void main() {',
        '  vC = aColor;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        // 每颗星的呼吸周期不同（0.9~2.3 倍速），相位也随机
        '  float tw = 0.5 + 0.5 * sin(uTime * (0.9 + fract(aPhase) * 2.4) + aPhase * 7.0);',
        '  vA = 0.5 + 0.5 * tw;',
        // 点的大小要给足：1 像素以下的点在浏览器里基本看不见，
         // 之前那版就是这样，整片夜空看起来"没有星星"
        '  gl_PointSize = clamp(aSize * uDpr * (52.0 / -mv.z) * (0.85 + 0.3 * tw),',
        '                       1.0, 6.0 * uDpr);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vC;',
        'varying float vA;',
        'void main() {',
        // 圆点而不是方块：按到中心的距离做软边
        '  float d = length(gl_PointCoord - vec2(0.5));',
        '  float a = smoothstep(0.5, 0.10, d);',
        '  gl_FragColor = vec4(vC * vA, a * vA);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Points(g, STAR_MAT));
  }

  function srgbToLin(c) { return Math.pow(c, 2.2); }

  function earthMaterial(dayTex, nightTex) {
    var hasNight = nightTex ? 1 : 0;
    var uniforms = {
      dayMap: { value: dayTex },
      dayMapB: { value: dayTex },   // 8K 到达前先指向同一张，mix 恒为 0
      uMixB: { value: 0 },          // 0 → 1 时从 dayMap 交叉淡化到 dayMapB
      nightMap: { value: nightTex || dayTex },
      hasNight: { value: hasNight },
      nightMix: { value: 0 },       // 0=白天，1=全夜（看城市灯光）
      uFade: { value: 0 }           // 整球淡入，避免"啪"一下贴上来
    };

    var vert = [
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vV;',
      'void main() {',
      '  vUv = uv;',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vV = normalize(cameraPosition - wp.xyz);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    /* 光照只跟「面朝相机」有关，不再跟世界坐标里的太阳位置有关。
       原因很直接：地球一转，固定光源就会把暗面转到正面，于是"白天模式"
       看起来总有半颗球是黑的。现在亮面永远朝着观察者，边缘做一点收暗
       保留球体的立体感，但不再出现晨昏线 —— 白天就是全球白天。 */
    var frag = [
      'uniform sampler2D dayMap;',
      'uniform sampler2D dayMapB;',
      'uniform sampler2D nightMap;',
      'uniform float uMixB;',
      'uniform float hasNight;',
      'uniform float nightMix;',
      'uniform float uFade;',
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vV;',
      'vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }',
      'vec3 l2s(vec3 c){ return pow(c, vec3(1.0/2.2)); }',
      'void main() {',
      '  vec3 n = normalize(vN);',
      '  vec3 v = normalize(vV);',
      '  float facing = max(dot(n, v), 0.0);',
      // 只在轮缘收暗到 80%，既有体积感又不出现"暗面"
      '  float limb = mix(0.80, 1.0, smoothstep(0.0, 0.66, facing));',
      '  vec3 dA = s2l(texture2D(dayMap, vUv).rgb);',
      '  vec3 dB = s2l(texture2D(dayMapB, vUv).rgb);',
      /* 一张像素覆盖几个 uv × 8192 = 每屏幕像素吃几个 8K 纹理像素。
         放大时（<1）才用 8K；缩小时 8K 会走 mip 缺失的最近邻采样而闪烁，
         所以缩小时退回带 mipmap 的 4K —— 两张图按这个比例软过渡，没有跳变。 */
      '  float tpp = max(fwidth(vUv.x), fwidth(vUv.y)) * 8192.0;',
      '  float k = smoothstep(1.5, 0.8, tpp) * uMixB;',
      '  vec3 day = mix(dA, dB, k) * limb;',
      '  vec3 col = day;',
      '  if (hasNight > 0.5) {',
      '    vec3 lights = s2l(texture2D(nightMap, vUv).rgb);',
      // 夜空 = 城市灯光 + 极淡的地表底色，否则除灯光外纯黑一片
      '    vec3 night = lights * 2.6 + day * 0.055;',
      '    col = mix(day, night, nightMix);',
      '  }',
      // 边缘大气：Fresnel 越靠轮廓越亮，模拟散射
      '  float rim = pow(1.0 - facing, 3.8);',
      '  col += vec3(0.12, 0.32, 0.66) * rim * 0.26;',
      '  gl_FragColor = vec4(l2s(col) * uFade, 1.0);',
      '}'
    ].join('\n');

    return new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vert,
      fragmentShader: frag
    });
  }

  /* ---------- 球面地名标注 ----------
     "像谷歌地图"拆开就是两件事，都靠数据 + 一次贪心排布解决：

     ① 每个地名自带「从第几级缩放开始出现」的门槛。这个门槛不是我们拍的，
        是 Natural Earth 的 MIN_LABEL（制图师标好的）—— 世界视角只出现
        二十来个大国与洲名，拉近了小国才逐个浮出。
     ② 放不下的让位。按重要度从高到低试着放，和已放的矩形一撞就藏。
        242 个国家名同时铺上去必然糊成一团，避让才是"专业感"的来源。

     用 3D 点投影到屏幕坐标，而不是 CSS2DRenderer（那要多引一个模块）。 */
  var NE_FAR_ZOOM = 2.0;          // 世界视角 ≈ Natural Earth zoom 2.0
  var _lp = null;                 // 复用的投影临时量，避免每帧分配

  function neZoomNow() {
    var z = globe.camTarget || CAM_FAR;
    return NE_FAR_ZOOM + (CAM_FAR - z) * 2.4;
  }

  function buildLabels(pack) {
    var host = document.getElementById('labels');
    if (!host || !pack) return;
    host.innerHTML = '';
    globe.labels = [];
    if (!_lp) _lp = new THREE.Vector3();

    var list = [];
    (pack.countries || []).forEach(function (c) {
      list.push({ c: c, cls: c.iso ? 'mk' : '', pri: c.iso ? 0 : 3 });
    });
    (pack.continents || []).forEach(function (c) { list.push({ c: c, cls: 'mc', pri: 1 }); });
    (pack.oceans || []).forEach(function (c) { list.push({ c: c, cls: 'mo', pri: 2 }); });
    /* 岛 / 湖 / 海峡：都要放大到很后面才出现，优先级最低 —— 位置冲突时先让国家名 */
    (pack.features || []).forEach(function (c) {
      list.push({ c: c, cls: c.k === 'i' ? 'mi' : (c.k === 'l' ? 'ml' : 'ms'), pri: 4 });
    });

    // 只排一次。同优先级内保持数据本身的顺序（国家已按 LABELRANK 排好）
    list.sort(function (a, b) { return a.pri - b.pri; });

    list.forEach(function (it) {
      var c = it.c, d = el('div', 'mlabel' + (it.cls ? ' ' + it.cls : ''), c.n);
      var rec = {
        el: d, lon: c.lon, lat: c.lat, z: c.z || 0,
        kind: it.cls || 'kp', iso: c.iso || '',
        v: new THREE.Vector3(), w: 0, h: 0, on: false
      };
      if (c.iso) {
        d.dataset.iso = c.iso;
        d.addEventListener('click', function (e) {
          e.stopPropagation();
          openDetail(c.iso, cardOf(c.iso), false);
        });
      }
      host.appendChild(d);
      globe.labels.push(rec);
    });

    // 量一遍尺寸（此时全部 opacity:0 但已布局，一次 reflow 拿全）
    globe.labels.forEach(function (L) {
      L.w = L.el.offsetWidth || 40;
      L.h = L.el.offsetHeight || 16;
    });
  }

  function hideLabel(L) {
    if (L.on) { L.on = false; L.el.style.opacity = '0'; }
    if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
  }

  function updateLabels() {
    var arr = globe.labels;
    if (!arr || !arr.length) return;
    var stage = globeStage();
    if (!stage) return;
    if (!_lp) _lp = new THREE.Vector3();
    var w = stage.clientWidth, h = stage.clientHeight;
    var nz = neZoomNow();
    var camPos = globe.camera.position;
    var camLen = camPos.length() || 1;
    var placed = [];               // 已占用矩形 [x0,y0,x1,y1]

    for (var i = 0; i < arr.length; i++) {
      var L = arr[i];
      // ① 缩放门槛：洲名远了才在、洋名中段、国名按 MIN_LABEL 逐个放开
      /* 国家名一律走 MIN_LABEL，中法美也不例外 ——
         "永远显示"会让缩小以后只剩三个名字挂在球上，看着像作弊。
         可点这件事不靠显示来保证：它们仍然排在最前面（避让时优先）。 */
      var show;
      if (L.kind === 'mc') show = nz < 3.5;          // 大洲：拉近就撤
      else if (L.kind === 'mo') show = nz >= (L.z || 0);  // 海域：按各自的门槛浮现
      else show = nz >= L.z;
      if (!show) { hideLabel(L); continue; }

      llToVec3(L.lon, L.lat, 1.02, L.v);
      L.v.applyMatrix4(globe.spin.matrixWorld);
      // 背面判定：点与相机连线同球心法线的夹角
      var dot = (L.v.x * camPos.x + L.v.y * camPos.y + L.v.z * camPos.z) /
                (L.v.length() * camLen);
      /* 只留"正对镜头的那一面"。之前阈值 0.14 太松，球edge一圈的国家名
         全被投影到画面边界上挤成一圈 —— 现在 0.30 起步，再往上渐显。 */
      /* 国名要求正对镜头（球面 61° 以内），否则球边缘那一圈压缩得最厉害、
         文字挤成一排。大洲大洋例外：它们本来就稀疏、一个字管一大片，
         放宽到 75° 才能压住画面四周的空。 */
      var dotMin = (L.kind === 'mc' || L.kind === 'mo') ? 0.26 : 0.48;
      if (dot < dotMin) { hideLabel(L); continue; }

      _lp.copy(L.v).project(globe.camera);
      var x = (_lp.x * 0.5 + 0.5) * w;
      var y = (-_lp.y * 0.5 + 0.5) * h;
      // 出画一半的地名直接藏：贴着边缘被切一半的字比没有还难看
      var rx = x - L.w / 2, ry = y - L.h / 2;
      if (rx < 2 || rx + L.w > w - 2 || ry < 2 || ry + L.h > h - 2) { hideLabel(L); continue; }

      // ② 矩形避让
      var clash = false;
      for (var k = 0; k < placed.length; k++) {
        var q = placed[k];
        if (rx < q[2] && rx + L.w > q[0] && ry < q[3] && ry + L.h > q[1]) { clash = true; break; }
      }
      if (clash) { hideLabel(L); continue; }
      placed.push([rx, ry, rx + L.w, ry + L.h]);

      /* 两道渐隐：越靠近球轮廓越淡（转过去就不会突然消失），
         越靠近屏幕边缘越淡（不贴着边界堆成一圈）。 */
      // 距阈值 0.18 以内渐显，再往里满亮
      var limb = Math.min(1, Math.max(0, (dot - dotMin) / 0.18));
      var edge = Math.min(Math.min(rx, w - rx - L.w), Math.min(ry, h - ry - L.h));
      var edgeA = Math.min(1, Math.max(0, edge / 110));
      var alpha = limb * edgeA;
      if (alpha < 0.08) { hideLabel(L); continue; }

      L.el.style.transform = 'translate(-50%,-50%) translate(' +
        x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      L.el.style.opacity = alpha.toFixed(2);
      if (L.iso) L.el.style.pointerEvents = 'auto';
      L.on = true;
    }
  }

  /* ---------- 相机与飞行动画 ----------
     用"目标值 + 每帧阻尼逼近"而不是 tween 时间轴：这样飞行途中随时可以
     被拖拽打断，不会出现动画和手动操作互相抢控制权。 */
  /* 相机距离要保证「整颗球 + 大气层」都在画面里：
     fov=42° 时视口高 = 2*z*tan(21°)，要装下半径 R 的球，z ≥ R/tan(21°)。
     之前的 CAM_NEAR=2.60 是按半径 1.0 算出来的临界值，可大气层半径 1.095，
     于是点到某个国家、相机压到 2.60 时上下各被切掉一条 —— 这才是
     "点开之后上面一小部分被截断"的真凶。现在两个距离都由 fitZ() 按实际
     大气外缘反算，竖屏时还会把水平方向一起算进去。
     手动缩放下限单独给（比聚焦距离近得多），才能像以前一样贴到地表看细节。 */
  var CAM_FAR = 3.02;      // 全球视角（buildGlobe 里按视口重算）
  var CAM_NEAR = 2.81;     // 聚焦某国（整球入画）
  var CAM_MIN = 1.42;      // 手动缩放最近：球会超出画面，等于贴近看
  var CAM_MAX = 5.20;

  function flyTo(lon, lat, camZ) {
    if (!globe.spin) return;
    globe.rotTargetY = -lon * D2R - Math.PI / 2;
    globe.rotTargetX = Math.max(-1.15, Math.min(1.15, lat * D2R));
    globe.camTarget = camZ;
    globe.flying = true;
    globe.autoSpin = false;
  }

  function flyToCountry(iso) {
    var list = (globe.data && globe.data.countries) || [];
    var c = null;
    for (var i = 0; i < list.length; i++) if (list[i].iso === iso) c = list[i];
    if (!c) return;
    globe.camMode = 'near';
    flyTo(c.center[0], c.center[1], CAM_NEAR);
    ensure8k();                                  // 聚焦会拉近，该上高清贴图了
    globe.idleUntil = performance.now() + 1e9;   // 面板开着就不自转
  }

  /* 只退回"全球尺度"，**不动朝向**。
     点开中国 → 关面板，应该还是看着中国，只是镜头拉回；
     转球和挪镜头是两件事，混在一起就变成了"关闭 = 重置"。
     双击同理：只缩回去，不把球转回初始角度。 */
  function flyOut() {
    if (!globe.spin) return;
    globe.camMode = 'far';
    globe.camTarget = CAM_FAR;
    globe.autoSpin = true;
    globe.idleUntil = performance.now() + 1200;
  }

  function buildGlobe(data) {
    var stage = globeStage();

    var w = stage.clientWidth || 640;
    var h = stage.clientHeight || 480;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);

    /* 整球入画所需的相机距离。
       注意是 sin 不是 tan：球体的投影边界由切线锥决定，视半角 = asin(R/z)。
       用 tan（当平面圆盘算）会得到偏小的距离，球顶球底就差那一两条像素被切掉。
       竖屏时水平方向更紧，所以取竖直/水平中更小的那个半角。
       比例直接量 DOM，不用 camera.aspect —— 首帧那一刻的 aspect 有可能还没定。 */
    function stageAspect() {
      return (stage.clientHeight > 0) ? (stage.clientWidth / stage.clientHeight) : 1.78;
    }
    function fitZ(R) {
      var vHalf = 21 * D2R;
      var hHalf = Math.atan(Math.tan(vHalf) * stageAspect());
      return R / Math.sin(Math.min(vHalf, hHalf));
    }
    /* 竖屏时若严格按 1.14（含大气外缘）装下，球只能占屏高四成，太小。
       竖屏改按 1.02 —— 球体本身几乎满宽，大气在左右各裁掉一点点看不出。 */
    function farZ() { return fitZ(stageAspect() < 1.05 ? 1.02 : 1.14); }
    /* 聚焦就该真的拉近。上一版按"整球入画"取 1.07，只比全球视角近 6%，
       点完国家几乎看不出变化 —— 那不叫聚焦。现在按 0.74 取：
       球约放大到画面的 1.38 倍，国家明显变大，边缘自然溢出画面，
       读起来是"飞近去了"，而不是"被切掉一条"。 */
    function nearZ() { return fitZ(stageAspect() < 1.05 ? 0.80 : 0.74); }

    CAM_FAR = farZ();
    CAM_NEAR = nearZ();
    camera.position.set(0, 0, CAM_FAR);
    globe.camTarget = CAM_FAR;
    globe.camMode = 'far';

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    stage.appendChild(renderer.domElement);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        renderer.domElement.classList.add('ready');
      });
    });

    addStars(scene);

    var tilt = new THREE.Group();
    var spin = new THREE.Group();
    tilt.add(spin);
    scene.add(tilt);

    /* 先建素色球，贴图到位再换材质。这样即使纹理跨域失败，
       地球仍然是可见的实心球，而不是一片空白。 */
    /* 贴图到位前不显示球体。之前用深蓝色兜底球，在星空背景里看着像
       "一个透明的球"，比什么都不显示更差。现在加载期间只有星空 + 进度提示，
       贴图到了再把球显示出来。 */
    var fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0e2438 });
    /* 分段提到 160×100：贴到近处看时轮廓不再是折线。
       贴图 UV 不受影响，代价只有多几千个三角形。 */
    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 100), fallbackMat);
    sphere.visible = false;
    spin.add(sphere);

    /* 大气：两层。内层贴着球面做轮廓辉光，外层再散开一点。
       外缘 1.055 和 fitZ(1.07) 配套 —— 聚焦时不会被上下切掉。
       opacity 初始为 0，跟着地球一起淡入；否则会先出现一圈光晕、球还没出来。 */
    globe.atmo = [
      { mat: new THREE.MeshBasicMaterial({
          color: 0x4a90d0, transparent: true, opacity: 0, side: THREE.BackSide }), base: 0.05 },
      { mat: new THREE.MeshBasicMaterial({
          color: 0x2a6096, transparent: true, opacity: 0, side: THREE.BackSide }), base: 0.026 }
    ];
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.006, 64, 48), globe.atmo[0].mat));
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.055, 48, 32), globe.atmo[1].mat));

    /* 经纬网与大陆轮廓：只在没有贴图时显示（兜底形态）。
       有贴图后它们会显得杂乱，所以贴图一到就隐藏。 */
    var grat = graticule(1.001);
    spin.add(grat);
    var landLine = ringsToLines(data.land || [], 1.0015, new THREE.LineBasicMaterial({
      color: 0x4a7ea8, transparent: true, opacity: 0.40
    }));
    spin.add(landLine);

    /* 三国国界：这是数据标记，贴图之上也要保留，否则看不出"收录了哪里" */
    globe.matOn = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 1
    });
    globe.matOff = new THREE.LineBasicMaterial({
      color: 0xe8c078, transparent: true, opacity: 0.5
    });
    /* 国界默认隐藏。满屏金线会把照片级的地球拉回"数据可视化"的观感，
       而且哪块是哪国并不需要常驻提示。选中某国时才把它的轮廓点亮。 */
    (data.countries || []).forEach(function (c) {
      var line = ringsToLines(c.rings, 1.004, globe.matOn);
      line.visible = false;
      spin.add(line);
      globe.groups[c.iso] = line;
    });

    /* 贴图异步替换 */
    loadEarthTextures(function (dayTex, nightTex) {
      if (!dayTex) {
        sphere.visible = true;      // 贴图失败才退回素色球
        grat.visible = true;
        landLine.visible = true;
        globeMsg('地表纹理未能加载，已回退为轮廓模式', true);
        return;
      }
      /* 各向异性过滤 —— 这是"糊"的主因。
         球面越靠近轮廓，贴图被压缩得越厉害（水平方向几乎压成一条线）。
         没有各向异性过滤时只能做各向同性的 mipmap 采样，边缘必然模糊。
         开到硬件上限后，同样的贴图会明显锐利。 */
      var maxAniso = renderer.capabilities.getMaxAnisotropy
        ? renderer.capabilities.getMaxAnisotropy() : 1;
      function tune(t) {
        if (!t) return;
        t.anisotropy = maxAniso;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true;
        t.needsUpdate = true;
      }
      tune(dayTex);
      tune(nightTex);

      sphere.material = earthMaterial(dayTex, nightTex);
      globe.earthMat = sphere.material;
      sphere.visible = true;
      grat.visible = false;
      landLine.visible = false;
      globe.texReady = true;
      /* 不直接显示，而是 2 秒淡入：之前 1.1 秒还是显得"啪一下就贴上去"，
         尤其球体已经从星空里出来之后，贴图突然出现很突兀。 */
      globe.fadeStart = performance.now();
      if (typeof onGlobeReady === 'function') onGlobeReady();

      /* ---- 8K 只按需取，不在首屏抢 ----
         首屏那次 8K 上传 + 生成 mipmap 是 134MB 级别的 GPU 操作，
         在集显/软件渲染上能卡住一两秒 —— 观感就是"地球转两下突然卡死"。
         所以：8K 改成用户真的拉近了才下载、才上传绑定；
         而且它在 shader 里只负责"放大"，minification 继续交给带 mipmap 的 4K，
         于是 8K 这张根本不需要 mipmap，上传成本少掉一大半。 */
      var maxTex = renderer.capabilities.maxTextureSize || 4096;
      globe.can8k = (maxTex >= 8192 && canUse8K());
      if (globe.can8k) setTimeout(prefetch8k, 2600);   // 空闲时先把字节抓下来
      var subEl3 = document.getElementById('globe-sub');
      if (subEl3) subEl3.textContent = '拖动旋转 · 滚轮缩放 · 点击国土开档';
    });

    globe.scene = scene;
    globe.camera = camera;
    globe.renderer = renderer;
    globe.tilt = tilt;
    globe.spin = spin;
    globe.sphere = sphere;
    globe.data = data;
    globe.ready = true;

    // ---- 交互：拖拽 ----
    var cv = renderer.domElement;
    var downAt = { x: 0, y: 0 };
    cv.addEventListener('pointerdown', function (e) {
      globe.dragging = true;
      globe.lastInput = performance.now();
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      downAt.x = e.clientX;
      downAt.y = e.clientY;
      globe.vel.x = globe.vel.y = 0;
      cv.classList.add('dragging');
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
      globe.autoSpin = false;
      globe.flying = false;        // 手动接管，打断正在进行的飞行
    });
    cv.addEventListener('pointermove', function (e) {
      if (!globe.dragging) return;
      globe.lastInput = performance.now();
      var dx = e.clientX - globe.last.x;
      var dy = e.clientY - globe.last.y;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      // 0.0022 弧度/像素 ≈ 每像素 0.126°，拖满 1200px 约转 150°。
      // 原来 0.005 是整屏 280°，手一抖就转到背面去了。
      globe.vel.x = dx * 0.0022;
      globe.vel.y = dy * 0.0022;
      globe.spin.rotation.y += globe.vel.x;
      globe.tilt.rotation.x += globe.vel.y;
      var lim = 78 * D2R;
      globe.tilt.rotation.x = Math.max(-lim, Math.min(lim, globe.tilt.rotation.x));
    });
    function endDrag() {
      if (!globe.dragging) return;
      globe.dragging = false;
      cv.classList.remove('dragging');
      /* 只有真正拖动过才延时恢复自转。
         之前这里一律 +2.4 秒，于是"点一下画面"也会让地球停两秒半 ——
         单击本来只是看看，不该改变自转状态。 */
      var moved = Math.abs(downAt.x - globe.last.x) + Math.abs(downAt.y - globe.last.y);
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + (moved > 6 ? 2400 : 0);
    }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', endDrag);

    // ---- 交互：缩放 ----
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      // 触控板捏合会带 ctrlKey，deltaY 很小，得放大步长才跟手
      var d = e.deltaY * (e.ctrlKey ? 0.006 : 0.0016);
      globe.camMode = 'manual';
      globe.lastInput = performance.now();
      globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget + d));
      if (globe.camTarget < 2.95) ensure8k();   // 拉近了才去取 8K
      // 开始缩放就是想看地球了，搜索框该收回去（滚轮不会让 input 失焦）
      if (searchWrap && searchWrap.classList.contains('open')) setSearch(false);
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + 2600;
      globe.flying = false;         // 手动缩放接管，别再和飞行抢相机
    }, { passive: false });

    /* 双击复位：不再占一个按钮。双击同时会给两次 click，
       所以 click 里用 e.detail > 1 忽略掉第二次，避免顺手打开档案。 */
    cv.addEventListener('dblclick', function () {
      closePanel();
      setActive(null);
      flyOut();
    });

    // ---- 交互：点击拾取 ----
    var ray = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    cv.addEventListener('click', function (e) {
      // 拖拽结束时浏览器也会派发 click，位移超过 6px 视为拖动而非点击
      if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 6) return;
      if (e.detail > 1) return;        // 双击的第二次，交给 dblclick 复位
      var rect = cv.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      var hits = ray.intersectObject(sphere);
      if (!hits.length) return;
      // 关键：交点在世界坐标，必须转回 spin 的局部坐标才能反算经纬度
      var local = globe.spin.worldToLocal(hits[0].point.clone());
      var ll = vec3ToLL(local);
      var c = countryAt(ll.lon, ll.lat);
      if (!c) return;
      setActive(c.iso);
      openDetail(c.iso, cardOf(c.iso), false);
    });

    // ---- 渲染循环 ----
    function render() {
      globe.raf = requestAnimationFrame(render);
      if (document.hidden) return;          // 切到别的标签页就停，省电

      /* 帧间隔归一化。所有"每帧加一点"的动画都必须乘这个系数，
         否则 144Hz 屏上转得比 60Hz 快 2.4 倍 —— 之前自转就是"每帧固定加"。 */
      var nowMs = performance.now();
      var dtf = Math.min(3, (nowMs - (globe.lastMs || nowMs)) / 16.667) || 1;
      globe.lastMs = nowMs;

      // 飞行：朝目标角度阻尼逼近。用阻尼而不是时间轴 tween，
      // 是为了飞行途中被拖拽打断时不会两套动画抢控制权。
      if (globe.flying && !globe.dragging) {
        var dy = globe.rotTargetY - spin.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        spin.rotation.y += dy * 0.075;
        tilt.rotation.x += (globe.rotTargetX - tilt.rotation.x) * 0.075;
        if (Math.abs(dy) < 0.0015 &&
            Math.abs(globe.rotTargetX - tilt.rotation.x) < 0.0015) {
          globe.flying = false;
        }
      }

      camera.position.z += (globe.camTarget - camera.position.z) * 0.075;
      if (STAR_MAT) STAR_MAT.uniforms.uTime.value = performance.now() / 1000;
      // 滚轮停下来了，才把 8K 传上 GPU
      /* 只在"手停下来"的时候才把 8K 传上 GPU。拖拽过程中 pointerdown 之后
         就没有新的输入事件了，所以必须同时看 dragging 标记 ——
         否则用户拖到一半正好命中上传，就是"拖拽途中卡一下"。 */
      if (globe.tex8kReady && !globe.dragging &&
          nowMs - (globe.lastInput || 0) > 420) bind8k();

      if (globe.earthMat) {
        var U = globe.earthMat.uniforms;
        U.nightMix.value += (globe.nightTarget - U.nightMix.value) * 0.09;

        /* 整球淡入：0 → 1 用 1.1 秒、smoothstep 缓动。
           不是过渡动画炫技 —— 贴图从无到有如果硬切，观感就是"闪了一下"。
           两层大气一起淡，避免出现"光晕先到、球后到"。 */
        if (globe.fadeStart) {
          var kf = (performance.now() - globe.fadeStart) / 2000;
          kf = kf > 1 ? 1 : kf;
          var ef = kf * kf * (3 - 2 * kf);
          U.uFade.value = ef;
          if (globe.atmo) {
            globe.atmo.forEach(function (a) { a.mat.opacity = a.base * ef; });
          }
          if (kf >= 1) globe.fadeStart = 0;
        }

        /* 8K 淡入：只把 uMixB 推到 1，不接管 dayMap、也不释放 4K ——
           4K 还要负责缩小时的 mipmap 采样。 */
        if (U.uMixB.value < globe.mixBTarget) {
          U.uMixB.value = Math.min(globe.mixBTarget,
            U.uMixB.value + (globe.mixBTarget - U.uMixB.value) * 0.055 + 0.002);
        }
      }

      if (globe.autoSpin && !globe.dragging && !globe.flying &&
          nowMs > globe.idleUntil) {
        /* 自转：0.0009 弧度/帧@60fps ≈ 116 秒一圈（原来 0.0013 = 80 秒，偏快）。
           再按相机距离减速：同样的角速度，凑近看时地表掠过屏幕的速度会快得多，
           乘 z/CAM_FAR 正好把这个放大抵消掉，远近看着一样从容。 */
        var spd = 0.0009 * Math.min(1.2, Math.max(0.35, camera.position.z / CAM_FAR));
        spin.rotation.y += spd * dtf;
      }
      if (!globe.dragging && Math.abs(globe.vel.x) + Math.abs(globe.vel.y) > 0.0002) {
        var decay = Math.pow(0.93, dtf);
        globe.vel.x *= decay;
        globe.vel.y *= decay;
        spin.rotation.y += globe.vel.x * dtf;
        tilt.rotation.x += globe.vel.y * dtf;
        var lim2 = 78 * D2R;
        tilt.rotation.x = Math.max(-lim2, Math.min(lim2, tilt.rotation.x));
      }
      renderer.render(scene, camera);
      updateLabels();
    }
    render();

    // ---- 尺寸变化 ----
    function resize() {
      var w2 = stage.clientWidth, h2 = stage.clientHeight;
      if (!w2 || !h2) return;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2, false);
      /* 视口一变，"整球入画"所需的距离也变（竖窗口时水平方向更紧）。
         处在这两个"贴合"状态时要把相机重新对到新值上，否则窗口一改
         球就被裁 —— 只在 buildGlobe 里算一次是不够的。 */
      CAM_FAR = farZ();
      CAM_NEAR = nearZ();
      if (globe.camMode === 'far') globe.camTarget = CAM_FAR;
      else if (globe.camMode === 'near') globe.camTarget = CAM_NEAR;
      else globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget));
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);

    /* 地名标注数据（242 个国家/地区 + 洲名洋名），和三国档案分开取，
       标注加载失败不影响地球本体 */
    fetch('geo/labels.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(buildLabels)
      .catch(function () { /* 静默降级：没有地名，球还在 */ });

    setActive(null);        // 初始不点亮任何国界
  }

  function startGlobe() {
    if (globe.state !== 'idle') return;
    if (!window.WebGLRenderingContext) {
      globeMsg('当前浏览器不支持 WebGL，3D 地球无法显示。国界轮廓在各国详情页内仍可查看。', true);
      globe.state = 'failed';
      return;
    }
    globe.state = 'loading';
    globeMsg('正在加载地球模型…');
    loadScriptOnce(GLOBE_SRC, function (err) {
      if (err || !window.THREE) {
        globe.state = 'failed';
        globeMsg('3D 模型未能加载（three.js 不可达）。国界轮廓在各国详情页内仍可查看。', true);
        return;
      }
      fetch('geo/globe.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          try {
            buildGlobe(data);
            globe.state = 'ok';
          } catch (e2) {
            globe.state = 'failed';
            globeMsg('3D 初始化失败：' + e2.message, true);
          }
        })
        .catch(function (e3) {
          globe.state = 'failed';
          globeMsg('地球数据未能加载（' + e3.message + '）', true);
        });
    });
  }

  /* ---------- 左下角工具 ----------
     国名不再是开关（改成按缩放自动分级），复位也不再是按钮（双击画面）。
     这里只剩"白天/夜晚"一个真开关。 */
  (function bindTools() {
    var bni = document.getElementById('btn-night');
    if (bni) {
      bni.addEventListener('click', function () {
        globe.nightTarget = globe.nightTarget > 0.5 ? 0 : 1;
        bni.classList.toggle('on', globe.nightTarget > 0.5);
        bni.title = globe.nightTarget > 0.5 ? '回到白天' : '切换夜晚模式（看城市灯光）';
      });
    }
  })();

  /* ---------- 首屏就是地球，直接启动。之前那套"滚到区块才加载"已经不适用 ——
     现在地球是页面主体，拖到后面才出现是不可接受的。 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGlobe);
  } else {
    startGlobe();
  }

  /* ---------- 启动 ---------- */
  fetch('data/index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (idx) {
      renderCards(idx.countries || []);
      var total = (idx.countries || []).length;
      var ready = (idx.countries || []).filter(function (c) { return c.status !== 'placeholder'; }).length;
      subEl.textContent = total + ' 个国家/地区 · ' + ready + ' 条已接入 · schema v' + idx.schema_version;
      hintEl.textContent = '';
      // 注意：这里**不**自动打开任何档案。首屏应该是完整的地球，
      // 由用户点击国土或底部胶囊再展开面板。
      loadSearchIndex();
    })
    .catch(function (e) {
      subEl.textContent = '数据未加载';
      fail('读取 data/index.json 失败：' + e.message +
           '。若你是直接双击打开本地文件（file:// 协议），浏览器会禁止 fetch —— 请用公网地址或起一个本地服务器。');
    });
})();
</script>

</body>
</html>
