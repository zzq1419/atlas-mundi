  }

  /* ---------- 3D 地球 ----------
     设计上的四个决定：

     1) 懒加载。three.min.js 670KB，若在首屏加载会把 LCP 拖到 3 秒以上。
        用 IntersectionObserver 等区块进入视口再加载，首屏完全不受影响。

     2) 不用贴图，只用我们自己的 GeoJSON。真实地球纹理（4K 等距柱状图）动辄
        2~8MB，且来源授权要单独确认；而我们的数据只有 110KB —— 大陆轮廓 + 已采集国家的国界
        国界，全部来自 Natural Earth 与既有 geo/*.geojson。视觉上反而更统一：
        暗球 + 淡色大陆 + 金色国界，和站点其余部分同一套配色。

     3) 球面插值细分。国界相邻两点若相距较远，直接用直线连会在球体内部穿过去
        （弦切进球），表现为"线条沉到球里"。所以每条边按 ≤2° 插值成折线。

     4) 点击拾取要 worldToLocal。射线与球求交得到的是**世界坐标**，而我们要反算
        经纬度，必须先把交点转回 spinGroup 的局部坐标 —— 否则球体转过之后
        算出的经纬度全是错的。 */
  var GLOBE_SRC = [
    'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/vendor/three.min.js',
    'vendor/three.min.js'
  ];
  var globe = {
    state: 'idle', ready: false, data: null,
    scene: null, camera: null, renderer: null,
    tilt: null, spin: null, sphere: null,
    groups: {},           // iso -> LineSegments（内置三家的轮廓，其它按需进 borderCache）
    matOn: null, matLit: null, matAll: null,
    active: null,
    autoSpin: true,
    inView: false,
    dragging: false,
    last: { x: 0, y: 0 },
    vel: { x: 0, y: 0 },
    idleUntil: 0,
    raf: 0,
    labels: null,
    nightTarget: 0,       // 0=昼夜，1=全夜
    texReady: false,
    fadeStart: 0,         // 淡入起点（performance.now），0 表示已完成
    mixBTarget: 0,        // 8K 交叉淡化的目标值
    tex8k: null,          // 8K 日面贴图（按需加载，无 mipmap）
    tex8kReady: false,    // 已下载，等交互停止再绑 GPU
    lastInput: 0,
    can8k: false,
    atmo: null,
    camTarget: 3.02,      // 相机的目标 z，每帧阻尼逼近
    camMode: 'far',       // far=全球视角 / near=聚焦某国 / manual=用户滚轮缩放
    rotTargetY: 0,        // 飞行目标经度（弧度）
    rotTargetX: 0,
    flying: false
  };

  var D2R = Math.PI / 180;
  var R2D = 180 / Math.PI;

  function globeStage() { return document.getElementById('globe-stage'); }
  function globeMsg(text, isErr) {
    var st = globeStage();
    if (!st) return;
    var m = document.getElementById('globe-msg');
    if (!m) {
      m = el('div', 'globe-msg');
      m.id = 'globe-msg';
      st.appendChild(m);
    }
    m.className = 'globe-msg' + (isErr ? ' err' : '');
    while (m.firstChild) m.removeChild(m.firstChild);
    if (!isErr) m.appendChild(el('span', 'globe-spin'));
    m.appendChild(el('span', 'gm-txt', text));
    /* 文字本身也做一次淡入：换文案时不要硬切 */
    var tx = m.querySelector('.gm-txt');
    if (tx) { tx.style.opacity = '0'; void tx.offsetWidth; tx.style.opacity = '1'; }
  }

  function loadScriptOnce(urls, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { done(new Error('all sources failed')); return; }
      var src = urls[i++];
      var sc = document.createElement('script');
      sc.src = src;
      sc.async = true;
      sc.onload = function () { done(null); };
      sc.onerror = function () {
        sc.remove();
        next();
      };
      document.head.appendChild(sc);
    }
    next();
  }

  /* 经纬度 → 球面坐标。y 轴朝北，经度 0 落在 -Z 方向（正对初始相机）。 */
  function llToVec3(lon, lat, r, out) {
    var phi = (90 - lat) * D2R;
    var theta = (lon + 180) * D2R;
    var sp = Math.sin(phi);
    out.set(-r * sp * Math.cos(theta), r * Math.cos(phi), r * sp * Math.sin(theta));
    return out;
  }

  /* 把一条边按 ≤2° 插值成折线，避免弦切进球体 */
  function pushEdge(a, b, r, arr) {
    var dLon = b[0] - a[0];
    if (dLon > 180) dLon -= 360;
    if (dLon < -180) dLon += 360;
    var dLat = b[1] - a[1];
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dLon), Math.abs(dLat)) / 2));
    var va = new THREE.Vector3();
    llToVec3(a[0], a[1], r, va);
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      var vb = new THREE.Vector3();
      llToVec3(a[0] + dLon * t, a[1] + dLat * t, r, vb);
      arr.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
      va = vb;
    }
  }

  /* rings（环数组，null 表示断点）→ LineSegments */
  function ringsToLines(rings, radius, material) {
    var pos = [];
    rings.forEach(function (ring) {
      var prev = null;
      for (var i = 0; i < ring.length; i++) {
        var pt = ring[i];
        if (!pt) { prev = null; continue; }
        if (prev) pushEdge(prev, pt, radius, pos);
        prev = pt;
      }
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, material);
  }

  /* 经纬网：等距圆柱贴图，不是线段。
     线段版画不了度数，也走不到极点。这里在 4096×2048 的画布上按等距圆柱画：
       * 经线在赤道处断开一小段，度数直接塞进断口 —— 数字压线最难读
       * 纬线在 ±90° 经线处各断一次，左右对称各标一个度数
       * 南北回归线（23.5°）与极圈（66.5°）画虚线，同样标注
     贴到球壳上跟着球转，任何角度都对得上。 */
  function buildGraticule(radius) {
    var W = 4096, H = 2048;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var LINE = 'rgba(226,190,120,0.58)';
    var MAJOR = 'rgba(240,206,140,0.92)';
    var TEXT = 'rgba(248,224,176,0.96)';
    var FONT = 'bold 30px system-ui,-apple-system,"Microsoft YaHei",sans-serif';
    var lon, lat, x, y;

    function X(l) { return (l + 180) / 360 * W; }
    function Y(t) { return (90 - t) / 180 * H; }

    g.lineCap = 'butt';
    g.font = FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    /* ---- 经线：在北纬 40° 处断开，度数写进断口 ----
       为什么不是赤道：赤道是一条连续实线，数字摆在那里会被它从中间穿过去。
       40° 这一带是空的 —— 30° 和 66.5° 之间没有任何纬线，
       南半球同理（用 40°N 统一，所有经线的数字连成一条横向的带，好认）。
       断口宽度按文字实测：固定 40px 塞不下 "120°W"（约 100px）。 */
    var LAB_LAT = 40;
    g.lineWidth = 2.2;
    g.strokeStyle = LINE;
    for (lon = -180; lon < 180; lon += 30) {
      x = X(lon);
      var lab = lon === 0 ? '0°' : Math.abs(lon) + '°' + (lon > 0 ? 'E' : 'W');
      var gap = g.measureText(lab).width / 2 + 12;
      var ly = Y(LAB_LAT);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ly - gap); g.stroke();
      g.beginPath(); g.moveTo(x, ly + gap); g.lineTo(x, H); g.stroke();
      g.fillStyle = TEXT;
      g.fillText(lab, x, ly);
    }

    /* ---- 纬线：在 ±90° 经线处断开，左右各标一个 ---- */
    function latLine(t, dashed, major) {
      y = Y(t);
      var lab = t === 0 ? '0°'
        : (Math.abs(t) % 1 === 0 ? Math.abs(t) : Math.abs(t).toFixed(1)) +
          '°' + (t > 0 ? 'N' : 'S');
      var gap = g.measureText(lab).width / 2 + 12;
      /* 断点放在 ±135° 而不是 ±90°。
         经线是在赤道处断开写度数的，如果纬线也在 ±90° 断，赤道和 90°W/90°E
         这两条经线的交点就会同时出现两个标注，糊成一团（"90°W" 里的 0 被
         "0°" 盖住，就是用户报的"西经 0 度的 0 被遮住"）。
         135 不是 30 的倍数，那里没有经线，两边仍然对称。 */
      var xs = [X(-135), X(135)];
      g.save();
      g.lineWidth = major ? 3.4 : (dashed ? 2.0 : 2.2);
      g.strokeStyle = major ? MAJOR : LINE;
      if (dashed) g.setLineDash([16, 13]);
      var from = 0;
      for (var i = 0; i < xs.length; i++) {
        g.beginPath(); g.moveTo(from, y); g.lineTo(xs[i] - gap, y); g.stroke();
        from = xs[i] + gap;
      }
      g.beginPath(); g.moveTo(from, y); g.lineTo(W, y); g.stroke();
      g.restore();

      g.fillStyle = TEXT;
      for (var k = 0; k < xs.length; k++) g.fillText(lab, xs[k], y);
    }

    // 常规纬线
    for (lat = -60; lat <= 60; lat += 30) latLine(lat, false, lat === 0);
    // 回归线与极圈：虚线
    [23.5, -23.5, 66.5, -66.5].forEach(function (t) { latLine(t, true, false); });

    var tex = new THREE.CanvasTexture(cv);
    /* 必须声明 sRGB。canvas 里的颜色本来就是按 sRGB 写的，
       不声明的话 three 当成线性值再转一次，整体被提亮 ——
       暖金 rgba(226,190,120) 就这么变成了接近白色，用户看到的"白线"就是它。 */
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    var mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    return new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 48), mat);
  }

  /* 世界坐标（球面）→ 经纬度 */
  function vec3ToLL(v) {
    var n = v.clone().normalize();
    var lat = Math.asin(Math.max(-1, Math.min(1, n.y))) * R2D;
    var lon = Math.atan2(n.z, -n.x) * R2D - 180;
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lon: lon, lat: lat };
  }

  /* 全量国界索引（223 国 / 1201 环，来自 geo/flat.json）。

     这里原来只在 geo/globe.json 的 **3 个国家**（CN/FR/US）里找 bbox，
     还放宽了 2°。于是点德国国土时，德国整块都落在法国那个大包围盒里，
     函数返回法国 —— 用户看到的就是"点德国跳出法国"。
     点国名反而是对的：那条路走标签自己的 iso，根本不经过这里。

     现在改成：bbox 粗筛 → 按面积升序 → 射线法。小国优先，
     大国包住小国时（南非/斯威士兰、法国/德国）不会再把邻国吞掉。 */
  var FLAT_BOXES = null, FLAT_TRIED = false;

  function loadFlatBoxes() {
    if (FLAT_BOXES || FLAT_TRIED) return;
    FLAT_TRIED = true;
    fetchAny('geo/flat.json')
      .catch(function () { return null; })
      .then(function (d) {
        if (!d || !d.countries) return;
        var sc = d.scale || 1, out = [];
        d.countries.forEach(function (c) {
          var box = { iso: c.iso, x0: 999, y0: 999, x1: -999, y1: -999, rings: [] };
          (c.rings || []).forEach(function (raw) {
            var ring = new Array(raw.length), i, p;
            for (i = 0; i < raw.length; i++) {
              p = [raw[i][0] / sc, raw[i][1] / sc];
              ring[i] = p;
              if (p[0] < box.x0) box.x0 = p[0];
              if (p[1] < box.y0) box.y0 = p[1];
              if (p[0] > box.x1) box.x1 = p[0];
              if (p[1] > box.y1) box.y1 = p[1];
            }
            if (ring.length > 2) box.rings.push(ring);
          });
          if (!box.rings.length) return;
          box.area = Math.max(0.01, (box.x1 - box.x0) * (box.y1 - box.y0));
          out.push(box);
        });
        FLAT_BOXES = out;
      });
  }

  function countryAt(lon, lat) {
    if (FLAT_BOXES && FLAT_BOXES.length) {
      var cand = [], k, c, r;
      for (k = 0; k < FLAT_BOXES.length; k++) {
        var f = FLAT_BOXES[k];
        // 粗筛也放宽一点：球面点击有像素级误差，但 0.6° 已经够
        if (lon >= f.x0 - 0.6 && lon <= f.x1 + 0.6 &&
            lat >= f.y0 - 0.6 && lat <= f.y1 + 0.6) cand.push(f);
      }
      cand.sort(function (a, b) { return a.area - b.area; });
      for (c = 0; c < cand.length; c++) {
        for (r = 0; r < cand[c].rings.length; r++) {
          if (pointInRing(lon, lat, cand[c].rings[r])) {
            return { iso: cand[c].iso, bbox: [cand[c].x0, cand[c].y0, cand[c].x1, cand[c].y1] };
          }
        }
      }
      return null;      // 确认落在海里，不再退回 bbox 乱猜
    }
    /* 索引还在路上时（这条链路 13 秒才到），不要退回三国的 bbox ——
       那正是"点德国跳法国"的来源。改成找最近的国名标签：
       标签位置本来就标在国土内部，误差远小于包围盒。 */
    var best = null, bd = 64;      // 64 平方度，约 8°
    var cosL = Math.cos(lat * Math.PI / 180);
    (globe.labels || []).forEach(function (L) {
      if (!L.iso || !L.lon) return;          // 洲名、洋名没有 iso，跳过
      var dx = (lon - L.lon) * cosL, dy = lat - L.lat;
      var d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = L; }
    });
    return best ? { iso: best.iso, bbox: null } : null;
  }

  /* 排查用：控制台里 __hitTest(10.5, 51) 直接看得某经纬度判给哪个国家。
     地球是三维的，"点屏幕中心"未必落在想点的地方，靠这个才能把
     判定逻辑和点击位置分开验证。 */
  window.__hitTest = function (lon, lat) {
    var c = countryAt(lon, lat);
    return { iso: c && c.iso, ready: !!(FLAT_BOXES && FLAT_BOXES.length) };
  };

  function setActive(iso) {
    globe.active = iso || null;
    /* 点开某国 = 拼上一块：轮廓亮金，且关面板后不熄（lightBorder 内部处理）。
       传 null 只表示"当前不再看谁"，把最亮那条降一档，仍然留着 —— 以前这里
       会 setActive(null) 顺手把金线一起撤掉，于是"退出后国境线还亮着"和
       "退出后全黑了"两种相反的现象在不同路径下都出现过。 */
    if (iso && globe.lightBorder) globe.lightBorder(iso);
    else if (globe.dimCurrent) globe.dimCurrent();
    Array.prototype.forEach.call(
      document.querySelectorAll('.dock-item'),
      function (n) { n.classList.toggle('active', n.dataset.iso === iso); }
    );
  }

  /* 把某国转到正对相机。
     spin 绕 Y：点 (lon,lat) 的方位角 θ=(lon+180)°，令 θ+ry=90° 即朝向 +Z，
     得 ry = -lon - 90。
     tilt 绕 X：正角度使北极转向相机，故北半球国家用正 lat。 */
  function focusCountry(iso, ms) {
    var c = null;
    (globe.data.countries || []).forEach(function (x) { if (x.iso === iso) c = x; });
    if (!c || !globe.spin) return;
    var toY = -c.center[0] * D2R - Math.PI / 2;
    var toX = c.center[1] * D2R;
    var fromY = globe.spin.rotation.y;
    var fromX = globe.tilt.rotation.x;
    var dY = toY - fromY;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    var dX = toX - fromX;
    var t0 = performance.now();
    var dur = ms || 760;
    globe.idleUntil = performance.now() + dur + 2600;
    globe.autoSpin = false;
    (function step() {
      var k = Math.min(1, (performance.now() - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      globe.spin.rotation.y = fromY + dY * e;
      globe.tilt.rotation.x = fromX + dX * e;
      if (k < 1) requestAnimationFrame(step);
      else globe.autoSpin = true;
    })();
  }

  /* ---------- 地球贴图与材质 ----------
     为什么需要 CORS：<img> 展示图片不受跨域限制，但 WebGL **纹理**必须有
     Access-Control-Allow-Origin，否则纹理会加载失败（画布被污染）。这是
     图片与纹理最容易踩的差别 —— 之前 assets 里的图片能显示，不代表贴图能用。

     加载策略（v2026-10-27-G 改）：
       4K 日面、夜面、8K 日面**一起下**，三张都推上显存之后才让球淡入。
     之前是"4K 先出球、8K 后台补"，但补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间（缩放、拖拽、点国家都撞上过）。
     现在把它挪到"球还完全透明"的阶段：屏幕上只有线框地球 + 加载环，
     卡也卡在用户预期之内；球一出现就是最终画质，之后不再有任何贴图切换。
     网络太慢（5.2 秒下不完 8K）才回退到"先出 4K"，迟到的 8K 等手停再挂。 */
  var TEX_BASES = [OBS_BASE + 'assets/tex/', 'assets/tex/'];

  /* 单文件多源尝试：OBS 失败退仓库同域 */
  function loadTex(loader, name, ok, fail) {
    var i = 0;
    (function next() {
      if (i >= TEX_BASES.length) { fail(); return; }
      var url = TEX_BASES[i++] + name;
      loader.load(url, function (t) { ok(t, url); }, undefined, next);
    })();
  }

  /* 8K 只在真有本钱的情况下加载：
     - GPU 最大纹理尺寸够 8192（老集显/手机常见上限 4096）
     - 不是移动端（移动端 8K 纹理 ~180MB 显存，容易直接掉帧）
     - 用户没开省流量 */
  function canUse8K() {
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return false;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
    if (navigator.connection && navigator.connection.saveData) return false;
    if ((window.innerWidth || 0) < 1024) return false;
    return true;
  }

  /* 三张图一起下：4K 日面、夜面、8K 日面（能上 8K 的机器才要）。
     等 4K 与夜面到齐、且 8K 有结论（成功 / 失败 / 超时）之后才出球。
     为什么不"4K 先出球、8K 后台补"：补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间 —— 缩放、拖拽、点国家都撞上过。
     现在把上传挪到"球还没出现"的阶段：屏幕上只有星空 + 加载环，
     卡也卡在用户预期之内。 */
  function loadEarthTextures(cb, renderer) {
    var loader = new THREE.TextureLoader();
    var day4 = null, night = null, day8 = null;
    var need = 2, settled8 = false, done = false, msgSent = false;
    /* 注意这里要用传进来的 renderer：globe.renderer 是在 buildGlobe 末尾才赋值的，
       这个函数在赋值之前就被调用了 —— 用 globe.renderer 会永远读到 4096，8K 永远不加载。 */
    var maxTex = (renderer && renderer.capabilities &&
                  renderer.capabilities.maxTextureSize) || 4096;
    var want8 = (maxTex >= 8192 && canUse8K());
    globe.can8k = want8;

    function finish() {
      if (done) return;
      done = true;
      cb(day4, night, day8);
    }
    function maybe() {
      if (done || need > 0) return;
      if (want8 && !settled8) {
        /* 4K 已经到手、还在等 8K：文字换成"准备高清贴图"，
           让用户知道这几秒不是白等（屏幕上已经有线框地球在转）。 */
        if (!msgSent) { msgSent = true; globeMsg('地表影像就位，正在准备高清贴图…'); }
        return;
      }
      finish();
    }

    loadTex(loader, 'earth-day.webp',
      function (t) { day4 = t; need--; maybe(); },
      function () { day4 = null; need--; maybe(); });
    loadTex(loader, 'earth-night.webp',
      function (t) { night = t; need--; maybe(); },
      function () { night = null; need--; maybe(); });

    if (want8) {
      loadTex(loader, 'earth-day-8k.webp', function (t) {
        t.anisotropy = 1;                 // 无 mipmap，各向异性过滤没意义
        t.generateMipmaps = false;        // 省掉最贵的一步（3300 万像素的 mip 链）
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.needsUpdate = true;
        day8 = t;
        globe.tex8k = t;
        settled8 = true;
        /* 超时之后才到的：球已经出来了，这时候上传会卡一下。
           标记成 ready，等用户手停下来（渲染循环里）再挂。 */
        if (done) globe.tex8kReady = true;
        maybe();
      }, function () {
        globe.can8k = false;
        settled8 = true;
        maybe();
      });
      /* 网络太慢就别耗着：5.2 秒还没下完就先用 4K 出球。
         迟到的 8K 仍然会被收下（tex8kReady），等手停下来再挂上去。 */
      setTimeout(function () {
        if (settled8) return;
        settled8 = true;
        maybe();
      }, 5200);
    }
  }

  /* ---------- 8K 的"迟到"路径 ----------
     正常情况 8K 和 4K 一起下、一起上传，球一出现就是高清，没有中途切换。
     只有网络太慢（5.2 秒没下完）时才会走这条路：球先出 4K，
     8K 到了先不挂，等用户手停下来（见渲染循环）再挂 —— 那一下的上传卡顿
     才不会落在拖拽/缩放中间。 */
  function bind8k() {
    if (!globe.tex8k || !globe.earthMat) return;
    globe.tex8kReady = false;
    globe.earthMat.uniforms.dayMapB.value = globe.tex8k;
    globe.mixBTarget = 1;
  }

  /* 星空：球面均匀分布的点云，带闪烁。
     用 PointsMaterial 出来的是"一堆死白点"；换成自定义 shader，每颗星带一个
     随机相位，亮度按 sin 缓慢呼吸（周期各不相同），才有真正夜空的感觉。
     半径 26~66 落在相机 far(100) 之内，不跟随地球自转，所以它是"背景"。 */
  var STAR_MAT = null;
  function addStars(scene) {
    /* 相机永远看着球心、fov 固定，所以视野其实是**一个固定的圆锥**。
       把星星撒满整个球面，只有 3% 会出现在画面里 —— 3200 颗看起来像 100 颗。
       所以直接在视野锥里撒（半角 44°，覆盖宽屏的水平视场），
       1400 颗就真的能看到 1400 颗，密度才像夜空。 */
    var N = 2000;
    var COSA = Math.cos(44 * Math.PI / 180);
    /* 一条"银河"：约三分之一星集中在一个大圆带附近（法向 n 的平面），
       实拍照片里银河就是一条斜贯画面的密集带，均匀撒是撒不出来的。 */
    var NW = [0.46, 0.78, 0.42];
    var pos = new Float32Array(N * 3);
    var col = new Float32Array(N * 3);
    var pha = new Float32Array(N);
    var siz = new Float32Array(N);
    var spk = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      var r = 26 + Math.pow(Math.random(), 0.65) * 40;
      var dx, dy, dz, tries = 0;
      do {
        var cosT = 1 - Math.random() * (1 - COSA);
        var sinT = Math.sqrt(Math.max(0, 1 - cosT * cosT));
        var ph = Math.random() * Math.PI * 2;
        dx = sinT * Math.cos(ph);
        dy = sinT * Math.sin(ph);
        dz = -cosT;                        // -Z 是相机朝向，星星在正前方
        // 前三分之一的星要求落在银河带附近（|与带法向的夹角| < 0.34）
        if (i % 2 !== 0) break;
      } while (Math.abs(dx * NW[0] + dy * NW[1] + dz * NW[2]) > 0.24 && ++tries < 14);
      pos[i * 3] = r * dx;
      pos[i * 3 + 1] = r * dy;
      pos[i * 3 + 2] = r * dz;
      // 星色微差：少量暖白、一部分冷蓝、其余纯白，避免一片死白
      var b = 0.46 + Math.random() * 0.54;
      var t = Math.random();
      if (t < 0.18) { col[i*3] = b; col[i*3+1] = b*0.86; col[i*3+2] = b*0.72; }
      else if (t < 0.50) { col[i*3] = b*0.78; col[i*3+1] = b*0.89; col[i*3+2] = b; }
      else { col[i*3] = b; col[i*3+1] = b; col[i*3+2] = b; }
      pha[i] = Math.random() * Math.PI * 2;
      // 幂次压低：多数是小星，少数几颗明显亮 —— 真实夜空就是这个分布
      siz[i] = 0.8 + Math.pow(Math.random(), 2.6) * 2.6;
      // 最亮的那 3% 给十字星芒（实拍里过曝的亮星都带衍射十字）
      spk[i] = (i % 2 === 0 && Math.random() < 0.07) ? 1 : 0;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(pha, 1));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
    g.setAttribute('aSpike', new THREE.Float32BufferAttribute(spk, 1));

    STAR_MAT = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) }
      },
      vertexShader: [
        'attribute vec3 aColor;',
        'attribute float aPhase;',
        'attribute float aSize;',
        'attribute float aSpike;',
        'uniform float uTime;',
        'uniform float uDpr;',
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vC = aColor;',
        '  vS = aSpike;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        // 每颗星的呼吸周期不同（0.9~2.3 倍速），相位也随机
        '  float tw = 0.5 + 0.5 * sin(uTime * (0.9 + fract(aPhase) * 2.4) + aPhase * 7.0);',
        '  vA = 0.5 + 0.5 * tw;',
        // 点的大小要给足：1 像素以下的点在浏览器里基本看不见，
         // 之前那版就是这样，整片夜空看起来"没有星星"
        '  gl_PointSize = clamp(aSize * uDpr * (52.0 / -mv.z) * (0.85 + 0.3 * tw)',
        '                       * (1.0 + aSpike * 1.6), 1.0, 9.0 * uDpr);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vec2 q = gl_PointCoord - vec2(0.5);',
        '  float d = length(q);',
        // 星核：软边圆点
        '  float core = smoothstep(0.5, 0.06, d);',
        // 十字星芒：两条极窄的亮带叠在核上，只有 vS=1 的亮星才有
        '  float sx = smoothstep(0.045, 0.0, abs(q.x)) * smoothstep(0.5, 0.02, d);',
        '  float sy = smoothstep(0.045, 0.0, abs(q.y)) * smoothstep(0.5, 0.02, d);',
        '  float a = max(core, max(sx, sy) * vS * 0.9);',
        '  gl_FragColor = vec4(vC * vA, a * vA);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Points(g, STAR_MAT));
  }

  function srgbToLin(c) { return Math.pow(c, 2.2); }

  function earthMaterial(dayTex, nightTex) {
    var hasNight = nightTex ? 1 : 0;
    var uniforms = {
      dayMap: { value: dayTex },
      dayMapB: { value: dayTex },   // 8K 到达前先指向同一张，mix 恒为 0
      uMixB: { value: 0 },          // 0 → 1 时从 dayMap 交叉淡化到 dayMapB
      nightMap: { value: nightTex || dayTex },
      hasNight: { value: hasNight },
      nightMix: { value: 0 },       // 0=白天，1=全夜（看城市灯光）
      uFade: { value: 0 },          // 整球淡入，避免"啪"一下贴上来
      /* 昼夜分界：按太阳方向决定这半边用白天贴图还是夜间贴图。
         uTermOn=0 时完全不参与计算，行为和以前一模一样。 */
      uSunDir: { value: new THREE.Vector3(1, 0, 0) },
      uTermOn: { value: 0 }
    };

    var vert = [
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'void main() {',
      '  vUv = uv;',
      // vNL 是没旋转过的法线：昼夜分界要"钉在地表上"，不能被自转/拖拽带跑
      '  vNL = normalize(normal);',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vV = normalize(cameraPosition - wp.xyz);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    /* 光照只跟「面朝相机」有关，不再跟世界坐标里的太阳位置有关。
       原因很直接：地球一转，固定光源就会把暗面转到正面，于是"白天模式"
       看起来总有半颗球是黑的。现在亮面永远朝着观察者，边缘做一点收暗
       保留球体的立体感，但不再出现晨昏线 —— 白天就是全球白天。 */
    var frag = [
      'uniform sampler2D dayMap;',
      'uniform sampler2D dayMapB;',
      'uniform sampler2D nightMap;',
      'uniform float uMixB;',
      'uniform float hasNight;',
      'uniform float nightMix;',
      'uniform float uFade;',
      'uniform vec3 uSunDir;',
      'uniform float uTermOn;',
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }',
      'vec3 l2s(vec3 c){ return pow(c, vec3(1.0/2.2)); }',
      'void main() {',
      '  vec3 n = normalize(vN);',
      '  vec3 v = normalize(vV);',
      '  float facing = max(dot(n, v), 0.0);',
      // 只在轮缘收暗到 80%，既有体积感又不出现"暗面"
      '  float limb = mix(0.80, 1.0, smoothstep(0.0, 0.66, facing));',
      '  vec3 dA = s2l(texture2D(dayMap, vUv).rgb);',
      '  vec3 dB = s2l(texture2D(dayMapB, vUv).rgb);',
      /* 一张像素覆盖几个 uv × 8192 = 每屏幕像素吃几个 8K 纹理像素。
         放大时（<1）才用 8K；缩小时 8K 会走 mip 缺失的最近邻采样而闪烁，
         所以缩小时退回带 mipmap 的 4K —— 两张图按这个比例软过渡，没有跳变。 */
      '  float tpp = max(fwidth(vUv.x), fwidth(vUv.y)) * 8192.0;',
      '  float k = smoothstep(1.5, 0.8, tpp) * uMixB;',
      '  vec3 day = mix(dA, dB, k) * limb;',
      '  vec3 col = day;',
      '  float nightK = nightMix;',   // 夜里用多少夜间贴图（0=全白天）
      '  if (hasNight > 0.5) {',
      '    vec3 lights = s2l(texture2D(nightMap, vUv).rgb);',
      /* 夜图自己的"深蓝海面"就是整片蓝雾的来源：直接乘 3.2 会把它一起提亮。
         先按亮度做软阈值，只留真正的灯光，底噪压掉；再补 0.6% 的地表亮度
         给陆地一点轮廓 —— 再多就又开始发蓝了。 */
      '    float ll = dot(lights, vec3(0.299, 0.587, 0.114));',
      '    lights *= smoothstep(0.014, 0.11, ll);',
      /* 夜半球保留 10% 的地表亮度（原来是 0.6%）。
         纯灯光的夜面是一块黑，看不出那边是什么大陆；留一点底色，
         轮廓认得出来，又不至于像加了层蓝雾。 */
      '    vec3 night = lights * 2.1 + day * 0.10;',
      /* 昼夜分界：世界坐标法线点太阳方向，>0 是白昼侧。
         ±0.05 的过渡带 ≈ 3°，一条柔和的过渡，不是一条硬线。 */
      '    if (uTermOn > 0.5) {',
      // 用局部法线：分界跟着地表走，转球/自转都不会让它跑掉
      '      float sd = dot(normalize(vNL), normalize(uSunDir));',
      '      float dayK = smoothstep(-0.05, 0.05, sd);',
      '      nightK = max(nightMix, (1.0 - dayK) * uTermOn);',
      '    }',
      '    col = mix(day, night, nightK);',
      '  }',
      // 边缘大气：Fresnel 越靠轮廓越亮，模拟散射
      '  float rim = pow(1.0 - facing, 3.8);',
      // 夜面把蓝色边缘光收掉大半，否则整个轮廓糊成一圈蓝雾
      '  col += vec3(0.12, 0.32, 0.66) * rim * 0.26 * (1.0 - 0.7 * nightK);',
      '  gl_FragColor = vec4(l2s(col) * uFade, 1.0);',
      '}'
    ].join('\n');

    return new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vert,
      fragmentShader: frag
    });
  }

  /* ---------- 球面地名标注 ----------
     "像谷歌地图"拆开就是两件事，都靠数据 + 一次贪心排布解决：

     ① 每个地名自带「从第几级缩放开始出现」的门槛。这个门槛不是我们拍的，
        是 Natural Earth 的 MIN_LABEL（制图师标好的）—— 世界视角只出现
        二十来个大国与洲名，拉近了小国才逐个浮出。
     ② 放不下的让位。按重要度从高到低试着放，和已放的矩形一撞就藏。
        242 个国家名同时铺上去必然糊成一团，避让才是"专业感"的来源。

     用 3D 点投影到屏幕坐标，而不是 CSS2DRenderer（那要多引一个模块）。 */
  var NE_FAR_ZOOM = 2.0;          // 世界视角 ≈ Natural Earth zoom 2.0
  var _lp = null;
  var _lc = null;                 // 复用的投影临时量，避免每帧分配

  function neZoomNow() {
    var z = globe.camTarget || CAM_FAR;
    return NE_FAR_ZOOM + (CAM_FAR - z) * 2.4;
  }

  var LABEL_POP = {};
  var LABEL_META = null;     // geo/meta.json：所有国家的名称/大洲/人口/中心点

  function buildLabels(pack) {
    var host = document.getElementById('labels');
    if (!host || !pack) return;
    host.innerHTML = '';
    globe.labels = [];
    if (!_lp) _lp = new THREE.Vector3();
    /* 各国人口（NE 的 POP_EST），卡片用它决定"要不要列地区语言"：
       小国只留官方语言。数据里没有人口时按 0 处理，等于不筛。 */
    LABEL_POP = pack.pops || {};

    /* 优先级的唯一含义是"抢位顺序"：数字小的先放，后来者撞上就让。
       国家要排在大洲前面 —— 大洲的锚点几乎一定压在大国领土上（南美洲的锚点
       就在巴西境内），大洲先放的话，巴西、阿根廷在全球视角永远显示不出来，
       屏幕上只剩"南美洲"。 */
    var list = [];
    (pack.countries || []).forEach(function (c) {
      /* 有完整档案的（cn/fr/us）排最前、样式更亮；
         其余国家也可点，但只是基础档案，按普通国名处理。 */
      list.push({ c: c, cls: c.d ? 'mk' : '', pri: c.d ? 0 : 1 });
    });
    (pack.oceans || []).forEach(function (c) { list.push({ c: c, cls: 'mo', pri: 2 }); });
    (pack.continents || []).forEach(function (c) { list.push({ c: c, cls: 'mc', pri: 3 }); });
    /* 岛 / 湖 / 海峡：都要放大到很后面才出现，优先级最低 —— 位置冲突时先让国家名 */
    (pack.features || []).forEach(function (c) {
      list.push({ c: c, cls: c.k === 'i' ? 'mi' : (c.k === 'l' ? 'ml' : 'ms'), pri: 4 });
    });

    // 只排一次。同优先级内保持数据本身的顺序（国家已按 LABELRANK 排好）
    list.sort(function (a, b) { return a.pri - b.pri; });

    list.forEach(function (it) {
      var c = it.c, d = el('div', 'mlabel' + (it.cls ? ' ' + it.cls : ''), c.n);
      var rec = {
        el: d, lon: c.lon, lat: c.lat, z: c.z || 0,
        kind: it.cls || 'kp', iso: c.iso || '',
        v: new THREE.Vector3(), w: 0, h: 0, on: false
      };
      var tgt = c.iso || c.parent || "";
      if (tgt) {
        d.dataset.iso = tgt;
        /* 按在字上也要能转球：把 pointerdown 交给同一套拖拽逻辑。
           松开时如果位移很小才算"点击"，否则一次拖拽会顺手打开一个档案。 */
        d.addEventListener('pointerdown', function (e) {
          if (globe.dragDown) globe.dragDown(e);
        });
        d.addEventListener('click', function (e) {
          e.stopPropagation();
          if (globe.moved > 6) return;
          openCountry(c);
        });
      }
      host.appendChild(d);
      globe.labels.push(rec);
    });

    // 量一遍尺寸（此时全部 opacity:0 但已布局，一次 reflow 拿全）
    globe.labels.forEach(function (L) {
      L.w = L.el.offsetWidth || 40;
      L.h = L.el.offsetHeight || 16;
    });
  }

  function hideLabel(L) {
    if (L.on || L._o !== '0') { L.on = false; L._o = '0'; L.el.style.opacity = '0'; }
    if (L._wc) { L._wc = 0; L.el.style.willChange = 'auto'; }
    if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
  }

  function updateLabels() {
    var arr = globe.labels;
    if (!arr || !arr.length) return;
    var stage = globeStage();
    if (!stage) return;
    if (!_lp) _lp = new THREE.Vector3();
    if (!_lc) _lc = new THREE.Vector3();
    var w = stage.clientWidth, h = stage.clientHeight;
    var nz = neZoomNow();
    var camPos = globe.camera.position;
    var camLen = camPos.length() || 1;
    var placed = [];               // 已占用矩形 [x0,y0,x1,y1]

    /* ---- 球体的屏幕投影圆 ----
       球在透视投影下仍是一个圆：视半角 asin(R/z)，投影到 NDC 的半径
       = tan(asin(R/z)) / tan(fov/2)，再乘半屏高就是像素半径。
       以前只按"法线朝向"过滤，但球缘的点投影压缩得很厉害，标签自己还有宽高，
       于是字会越过球的轮廓、飘在星空上。现在硬性要求整个标签框都落在圆内。 */
    var vHalf = (globe.camera.fov * 0.5) * Math.PI / 180;
    var silN = Math.tan(Math.asin(Math.min(0.995, 1 / camLen))) / Math.tan(vHalf);
    var rPx = silN * h * 0.5;
    _lc.set(0, 0, 0).project(globe.camera);
    var cx = (_lc.x * 0.5 + 0.5) * w;
    var cy = (-_lc.y * 0.5 + 0.5) * h;

    for (var i = 0; i < arr.length; i++) {
      var L = arr[i];
      // ① 缩放门槛：洲名远了才在、洋名中段、国名按 MIN_LABEL 逐个放开
      /* 国家名一律走 MIN_LABEL，中法美也不例外 ——
         "永远显示"会让缩小以后只剩三个名字挂在球上，看着像作弊。
         可点这件事不靠显示来保证：它们仍然排在最前面（避让时优先）。 */
      var show;
      if (L.kind === 'mc') show = nz < 3.5;          // 大洲：拉近就撤
      else if (L.kind === 'mo') show = nz >= (L.z || 0);  // 海域：按各自的门槛浮现
      /* 留 0.03 的容差：全球视角 nz 恰好算成 2.0，可相机阻尼永远差一点点
         到不了目标值，nz 就是 1.99x —— 于是 MIN_LABEL=2.0 的那批大国
         （巴西、阿根廷、中国）在全球视角全都不显示。 */
      else show = nz >= L.z - 0.03;
      if (!show) { hideLabel(L); continue; }

      llToVec3(L.lon, L.lat, 1.02, L.v);
      L.v.applyMatrix4(globe.spin.matrixWorld);
      // 背面判定：点与相机连线同球心法线的夹角
      var dot = (L.v.x * camPos.x + L.v.y * camPos.y + L.v.z * camPos.z) /
                (L.v.length() * camLen);
      /* 只留"正对镜头的那一面"。之前阈值 0.14 太松，球edge一圈的国家名
         全被投影到画面边界上挤成一圈 —— 现在 0.30 起步，再往上渐显。 */
      /* 国名要求正对镜头（球面 61° 以内），否则球边缘那一圈压缩得最厉害、
         文字挤成一排。大洲大洋例外：它们本来就稀疏、一个字管一大片，
         放宽到 75° 才能压住画面四周的空。 */
      /* 只留"真正正对镜头"的那一片：0.62 约等于球面 ±52°。
         再往外，投影压缩得厉害，字会飘到球外、压在星空上。 */
      /* 圆边界裁剪已经保证"字不会出球"，所以这里不必再用很高的角度门槛。
         门槛太高（0.62≈52°）时，巴西、阿根廷这种正好落在球缘附近的国家
         会整片消失 —— 那是"少了一半国家"而不是"更干净"。 */
      var dotMin = (L.kind === 'mc' || L.kind === 'mo') ? 0.26 : 0.34;
      if (dot < dotMin) { hideLabel(L); continue; }

      _lp.copy(L.v).project(globe.camera);
      var x = (_lp.x * 0.5 + 0.5) * w;
      var y = (-_lp.y * 0.5 + 0.5) * h;
      /* 岛屿标签抬到点上方：小岛本来就只有几个像素，字压在正中间等于把岛盖住。 */
      if (L.kind === 'mi') y -= L.h * 0.75;

      // 出画一半的地名直接藏：贴着边缘被切一半的字比没有还难看
      var rx = x - L.w / 2, ry = y - L.h / 2;
      if (rx < 2 || rx + L.w > w - 2 || ry < 2 || ry + L.h > h - 2) { hideLabel(L); continue; }

      /* 整个标签框必须落在球体投影圆内（用框的对角半径算，不是中心点）：
         中心在圆内、四个角探出去的，照样会飘在星空上。 */
      var qx = Math.abs(x - cx) + L.w * 0.5;
      var qy = Math.abs(y - cy) + L.h * 0.5;
      var far = Math.sqrt(qx * qx + qy * qy);
      var discA = (rPx * 0.99 - far) / Math.max(22, rPx * 0.13);
      if (discA <= 0) { hideLabel(L); continue; }
      discA = Math.min(1, discA);

      // ② 矩形避让
      var clash = false;
      for (var k = 0; k < placed.length; k++) {
        var q = placed[k];
        if (rx < q[2] && rx + L.w > q[0] && ry < q[3] && ry + L.h > q[1]) { clash = true; break; }
      }
      if (clash) { hideLabel(L); continue; }
      placed.push([rx, ry, rx + L.w, ry + L.h]);

      /* 两道渐隐：越靠近球轮廓越淡（转过去就不会突然消失），
         越靠近屏幕边缘越淡（不贴着边界堆成一圈）。 */
      // 距阈值 0.18 以内渐显，再往里满亮
      var limb = Math.min(1, Math.max(0, (dot - dotMin) / 0.16));
      var edge = Math.min(Math.min(rx, w - rx - L.w), Math.min(ry, h - ry - L.h));
      var edgeA = Math.min(1, Math.max(0, edge / 110));
      /* 以前是 limb*edgeA*discA 三连乘，越靠近球缘/屏幕边缘越淡，最后只剩一丁点不透明度。
         实测代价：加拿大、格陵兰这些正好落在雪原上的国名，本来就白字压白雪，
         再被乘到 0.1 就直接看不见了。改成给"贴边"留一条下限 —— 仍然会淡，
         但淡到 0.6 就打住，不会淡成不存在。 */
      var alpha = limb * (0.60 + 0.40 * edgeA * discA);
      if (alpha < 0.08) { hideLabel(L); continue; }

      /* 341 个标注每帧无脑写 style 是最贵的一笔开销（首屏卡顿的来源之一）。
         只在数值真的变了才写，静止时几乎零写入。 */
      /* translate3d 让浏览器把这一层交给合成器按小数像素平移，
         而不是每帧重新栅格化文字 —— 后者就是"自转时国名疯狂抖动"的原因。
         will-change 只给当前可见的那几十个，不然 341 个图层会把首屏拖死。 */
      /* 越靠球缘字越小（0.78→1.0）：这是"贴在球面上"的视觉线索之一，
         比单纯淡出更像球面透视。 */
      /* 0.78 的缩放在 13.5px 上只剩 10.5px，雪白底上真的认不出来；收到 0.88 起步 */
      var sc = (0.88 + 0.12 * dot).toFixed(3);
      var tr = 'translate(-50%,-50%) translate3d(' +
               x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) scale(' + sc + ')';
      if (L._t !== tr) { L._t = tr; L.el.style.transform = tr; }
      if (!L._wc) { L._wc = 1; L.el.style.willChange = 'transform'; }
      var op = alpha.toFixed(2);
      if (L._o !== op) { L._o = op; L.el.style.opacity = op; }
      /* 时间指示模式下所有标签都不接事件 —— 不只是国家，大洲/海洋/岛这些
         没 iso 的标签也在内。它们同样挂着 click（走 parent 分支），
         只关国家那几个的话，点"北美洲"照样会弹出一张卡片。
         这里写的是内联样式，优先级高于 CSS 的 .time-mode .mlabel 规则，
         所以必须在这拦一道。 */
      if (globe.timeMode) {
        if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
      } else if (L.iso && L.el.style.pointerEvents === 'none') {
        L.el.style.pointerEvents = 'auto';
      }
      L.on = true;
    }
  }

  /* ---------- 相机与飞行动画 ----------
     用"目标值 + 每帧阻尼逼近"而不是 tween 时间轴：这样飞行途中随时可以
     被拖拽打断，不会出现动画和手动操作互相抢控制权。 */
  /* 相机距离要保证「整颗球 + 大气层」都在画面里：
     fov=42° 时视口高 = 2*z*tan(21°)，要装下半径 R 的球，z ≥ R/tan(21°)。
     之前的 CAM_NEAR=2.60 是按半径 1.0 算出来的临界值，可大气层半径 1.095，
     于是点到某个国家、相机压到 2.60 时上下各被切掉一条 —— 这才是
     "点开之后上面一小部分被截断"的真凶。现在两个距离都由 fitZ() 按实际
     大气外缘反算，竖屏时还会把水平方向一起算进去。
     手动缩放下限单独给（比聚焦距离近得多），才能像以前一样贴到地表看细节。 */
  var CAM_FAR = 3.02;      // 全球视角（buildGlobe 里按视口重算）
  var CAM_NEAR = 2.81;     // 聚焦某国（整球入画）
  var CAM_MIN = 1.42;      // 手动缩放最近：球会超出画面，等于贴近看
  var CAM_MAX = 5.20;

  function flyTo(lon, lat, camZ) {
    if (!globe.spin) return;
    globe.rotTargetY = -lon * D2R - Math.PI / 2;
    globe.rotTargetX = Math.max(-1.15, Math.min(1.15, lat * D2R));
    globe.camTarget = camZ;
    globe.flying = true;
    globe.autoSpin = false;
  }

  function flyToCountry(iso) {
    var list = (globe.data && globe.data.countries) || [];
    var c = null;
    for (var i = 0; i < list.length; i++) if (list[i].iso === iso) c = list[i];
    /* 只有三国在球面有国界几何，但"飞过去"这件事对所有国家都成立 ——
       没有几何就从 meta 的中心点飞。以前这里直接 return，
       于是点日本、点埃及都停在原地，像没反应。 */
    var lon, lat;
    if (c) { lon = c.center[0]; lat = c.center[1]; }
    else {
      var m = LABEL_META && LABEL_META[String(iso).toUpperCase()];
      if (!m) return;
      lon = m.lon; lat = m.lat;
    }
    globe.camMode = 'near';
    flyTo(lon, lat, CAM_NEAR);
    globe.idleUntil = performance.now() + 1e9;   // 面板开着就不自转
  }

  /* 只退回"全球尺度"，**不动朝向**。
     点开中国 → 关面板，应该还是看着中国，只是镜头拉回；
     转球和挪镜头是两件事，混在一起就变成了"关闭 = 重置"。
     双击同理：只缩回去，不把球转回初始角度。 */
  function flyOut() {
    if (!globe.spin) return;
    globe.camMode = 'far';
    globe.camTarget = CAM_FAR;
    globe.autoSpin = true;
    globe.idleUntil = performance.now() + 1200;
  }

  function buildGlobe(data) {
    var stage = globeStage();

    var w = stage.clientWidth || 640;
    var h = stage.clientHeight || 480;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);

    /* 整球入画所需的相机距离。
       注意是 sin 不是 tan：球体的投影边界由切线锥决定，视半角 = asin(R/z)。
       用 tan（当平面圆盘算）会得到偏小的距离，球顶球底就差那一两条像素被切掉。
       竖屏时水平方向更紧，所以取竖直/水平中更小的那个半角。
       比例直接量 DOM，不用 camera.aspect —— 首帧那一刻的 aspect 有可能还没定。 */
    function stageAspect() {
      return (stage.clientHeight > 0) ? (stage.clientWidth / stage.clientHeight) : 1.78;
    }
    function fitZ(R) {
      var vHalf = 21 * D2R;
      var hHalf = Math.atan(Math.tan(vHalf) * stageAspect());
      return R / Math.sin(Math.min(vHalf, hHalf));
    }
    /* 竖屏时若严格按 1.14（含大气外缘）装下，球只能占屏高四成，太小。
       竖屏改按 1.02 —— 球体本身几乎满宽，大气在左右各裁掉一点点看不出。 */
    function farZ() { return fitZ(stageAspect() < 1.05 ? 1.02 : 1.14); }
    /* 聚焦就该真的拉近。上一版按"整球入画"取 1.07，只比全球视角近 6%，
       点完国家几乎看不出变化 —— 那不叫聚焦。现在按 0.74 取：
       球约放大到画面的 1.38 倍，国家明显变大，边缘自然溢出画面，
       读起来是"飞近去了"，而不是"被切掉一条"。 */
    function nearZ() { return fitZ(stageAspect() < 1.05 ? 0.80 : 0.74); }

    CAM_FAR = farZ();
    CAM_NEAR = nearZ();
    camera.position.set(0, 0, CAM_FAR);
    globe.camTarget = CAM_FAR;
    globe.camMode = 'far';

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    stage.appendChild(renderer.domElement);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        renderer.domElement.classList.add('ready');
      });
    });

    addStars(scene);

    var tilt = new THREE.Group();
    var spin = new THREE.Group();
    tilt.add(spin);
    scene.add(tilt);

    /* 先建素色球，贴图到位再换材质。这样即使纹理跨域失败，
       地球仍然是可见的实心球，而不是一片空白。 */
    /* 贴图到位前不显示球体。之前用深蓝色兜底球，在星空背景里看着像
       "一个透明的球"，比什么都不显示更差。现在加载期间只有星空 + 进度提示，
       贴图到了再把球显示出来。 */
    var fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0e2438 });
    /* 分段提到 160×100：贴到近处看时轮廓不再是折线。
       贴图 UV 不受影响，代价只有多几千个三角形。 */
    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 100), fallbackMat);
    sphere.visible = false;
    spin.add(sphere);

    /* ---------- 昼夜分界 ----------
       不做叠加层，直接让球体材质自己分两半：
       法线点太阳方向 > 0 的那半边用白天贴图，< 0 的那半边换成夜间贴图
       （城市灯光那套）。第一版做的是"整体压暗 + 画一条金色晨昏线"，
       方向错了 —— 要的是"一半白天模式、一半黑夜模式"，不是一条分界线。 */
    globe.term = { on: false };

    /* 太阳直射点：UTC 12:00 正对 0° 经线，每小时西移 15°；
       纬度用赤纬的近似公式（一年一轮，误差 < 0.5°，看昼夜够用）。
       这里给的是球体局部坐标，shader 里也改用局部法线比 ——
       分界线于是钉在地表上，转球或自转都不会把它带跑。 */
    var _sunTmp = new THREE.Vector3();
    function updateSunTerm() {
      var m = globe.earthMat;
      if (!m || !m.uniforms.uSunDir || !sphere) return;
      var now = new Date();
      var utcH = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
      var lon = -(utcH - 12) * 15;
      var doy = Math.floor((now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 86400000);
      var decl = 23.44 * Math.sin(2 * Math.PI * (284 + doy) / 365);
      llToVec3(lon, decl, 1, _sunTmp);
      m.uniforms.uSunDir.value.copy(_sunTmp);
    }
    globe.updateSunTerm = updateSunTerm;

    /* 大气：两层。内层贴着球面做轮廓辉光，外层再散开一点。
       外缘 1.055 和 fitZ(1.07) 配套 —— 聚焦时不会被上下切掉。
       opacity 初始为 0，跟着地球一起淡入；否则会先出现一圈光晕、球还没出来。 */
    globe.atmo = [
      { mat: new THREE.MeshBasicMaterial({
          color: 0x4a90d0, transparent: true, opacity: 0, side: THREE.BackSide }), base: 0.05 },
      { mat: new THREE.MeshBasicMaterial({
          color: 0x2a6096, transparent: true, opacity: 0, side: THREE.BackSide }), base: 0.026 }
    ];
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.006, 64, 48), globe.atmo[0].mat));
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.055, 48, 32), globe.atmo[1].mat));

    /* 经纬网与大陆轮廓：只在没有贴图时显示（兜底形态）。
       有贴图后它们会显得杂乱，所以贴图一到就隐藏。 */
    /* 大陆轮廓：贴图未到时的兜底骨架，球淡入后隐掉。
       经纬网不再放进 wire —— 它现在是 4096×2048 的贴图，画一次要几十毫秒，
       放进开机流程会拖慢首屏；改成点按钮时惰性生成。 */
    var landLine = ringsToLines(data.land || [], 1.0015, new THREE.LineBasicMaterial({
      color: 0x4a7ea8, transparent: true, opacity: 0.40
    }));
    spin.add(landLine);
    globe.wire = [
      { o: landLine, base: landLine.material.opacity }
    ];
    globe.grid = null;

    /* 国界线一共三档材质，颜色统一是同一支金（0xffd98a），只靠透明度分层：
       - matOn   当前正在看的这一国（最亮）
       - matLit  点过、留着没熄的（"拼图"已经拼上的那几块）
       - matAll  「显示全部国境线」铺满全屏的那一层（最淡）
       以前全量边界用的是米白 0xf3ead8，和选中的金线是两种颜色，
       屏幕上同时出现时看着像两套系统；现在统一一支金，只分浓淡。 */
    /* 半径：只比球面高一点点。
       以前点亮线用 1.008 —— 放大到省级时，那 0.008 的半径差会被透视放大成
       十几像素，"金线浮在地图上方"就是这么来的（用户原话"有一段不小的距离"）。
       球体是 160×100 细分，弦高只有 1.2e-4，所以 1.0012 已经稳稳压在地表之上、
       不会再被深度剔除；1.0018 / 1.0012 的差也远大于深度分辨率，不会打架。 */
    var BORDER_R_ON = 1.0018, BORDER_R_ALL = 1.0012;
    globe.matOn = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 1, depthWrite: false
    });
    globe.matLit = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 0.62, depthWrite: false
    });
    globe.matAll = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 0.40, depthWrite: false
    });
    /* 国界默认隐藏。满屏金线会把照片级的地球拉回"数据可视化"的观感，
       而且哪块是哪国并不需要常驻提示。点过的国家会把轮廓留在球上 —— 见 lightBorder。 */
    (data.countries || []).forEach(function (c) {
      var line = ringsToLines(c.rings, BORDER_R_ON, globe.matLit);
      line.visible = false;
      spin.add(line);
      globe.groups[c.iso] = line;
    });

    /* 经纬网在这里就先建、先渲染两帧。
       这是本页最贵的一次性开销（4096×2048 画布 + 32MB 纹理 + mip 链 + shader 编译，
       集显实测 300ms 上下）。放在"球还在加载、屏幕上只有加载环"的时候做，
       用户对这 300ms 的预期本来就是等待；等球出来再做，就是一次无来由的卡顿。 */
    setTimeout(function () { prepareGrid(true); }, 0);

    /* 贴图异步替换 */
    loadEarthTextures(function (dayTex, nightTex, day8) {
      if (!dayTex) {
        sphere.visible = true;      // 贴图失败才退回素色球
        grat.visible = true;
        landLine.visible = true;
        globeMsg('地表纹理未能加载，已回退为轮廓模式', true);
        return;
      }
      /* 各向异性过滤 —— 这是"糊"的主因。
         球面越靠近轮廓，贴图被压缩得越厉害（水平方向几乎压成一条线）。
         没有各向异性过滤时只能做各向同性的 mipmap 采样，边缘必然模糊。
         开到硬件上限后，同样的贴图会明显锐利。 */
      var maxAniso = renderer.capabilities.getMaxAnisotropy
        ? renderer.capabilities.getMaxAnisotropy() : 1;
      function tune(t) {
        if (!t) return;
        t.anisotropy = maxAniso;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true;
        t.needsUpdate = true;
      }
      tune(dayTex);
      tune(nightTex);

      sphere.material = earthMaterial(dayTex, nightTex);
      globe.earthMat = sphere.material;
      /* 8K 到位就直接挂上，uMixB 恒为 1：
         shader 里按 fwidth 算"每像素吃几个 8K 纹素"，缩放时自动在 4K/8K 之间软切换，
         所以这里不需要任何交叉淡化动画 —— 也就没有"淡化到一半卡一下"这回事。 */
      if (day8) {
        globe.earthMat.uniforms.dayMapB.value = day8;
        globe.earthMat.uniforms.uMixB.value = 1;
      }
      sphere.visible = true;
      globe.texReady = true;
      /* 线框不在这里隐藏 —— 见渲染循环里跟 uFade 反向淡出的那一段。
         直接隐藏会让"线框消失"和"球淡入"之间出现两帧空白。 */

      /* 趁球还完全透明（uFade = 0）把三张贴图都推上显存。
         renderer.initTexture 是同步的：这一步会卡住主线程（8K 那张在集显上
         可能几百毫秒），但此时画面上只有星空和加载环，卡在这一刻最不刺眼。 */
      try {
        renderer.initTexture(dayTex);
        if (nightTex) renderer.initTexture(nightTex);
        if (day8) renderer.initTexture(day8);
      } catch (e) { /* 老版本 three 没有 initTexture，交给首帧上传也一样 */ }

      /* 再等两帧才起淡入：让"上传 + 着色器编译"都落在球不可见的时候。 */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          globe.fadeStart = performance.now();
        });
      });
      if (typeof onGlobeReady === 'function') onGlobeReady();

      var subEl3 = document.getElementById('globe-sub');
      if (subEl3) subEl3.textContent = '拖动旋转 · 滚轮缩放 · 点击地名开档';
    }, renderer);

    /* 点亮一国国界 —— 这就是"拼图"的那一块。
       规则（用户定的玩法）：
         1. 点开哪国，就把那国轮廓留成金色，关掉面板也不熄 —— 拼上的块不撤；
         2. 当前正在看的那条更亮（matOn），其余已拼的略暗（matLit）；
         3. 只有"关闭全部国境线"会清盘：所有线一起熄灭。
       内置三家（中法美）的线在建球时就建好了，其余国家按需从 geo 分片里取，
       取到后缓存起来 —— 同一国第二次点不再走网络，也不再建几何。 */
    var borderCache = {};      // iso -> Line（含内置三国）
    var pendingLit = {};       // iso -> [cb]，正在加载的
    var curLit = null;         // 当前最亮的那条
    globe.wantLit = {};        // iso -> true，表示"用户点过、应该亮着"

    function applyLit(iso, line) {
      if (!line) return;
      line.visible = true;
      line.material = globe.matOn;
      if (curLit && curLit !== line) curLit.material = globe.matLit;
      curLit = line;
      globe.active = iso;
    }

    function lineFromGeo(gj) {
      var rings = [];
      (gj.features || []).forEach(function (f) {
        var g = f.geometry || {};
        var polys = g.type === 'Polygon' ? [g.coordinates]
          : (g.type === 'MultiPolygon' ? g.coordinates : []);
        polys.forEach(function (poly) {
          poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
        });
      });
      if (!rings.length) return null;
      /* 半径 1.008：必须比全量国境线（1.006）更靠外，否则两线重合时
         外层那条会盖住这条，"当前选中"就亮不起来了（深度缓冲按视线方向取近的）。 */
      return ringsToLines(rings, BORDER_R_ON, globe.matLit);
    }

    globe.lightBorder = function (iso, cb) {
      if (!iso) { if (cb) cb(); return; }
      iso = String(iso).toUpperCase();
      globe.wantLit[iso] = true;

      var cached = borderCache[iso] || globe.groups[iso];
      if (cached) { applyLit(iso, cached); if (cb) cb(); return; }
      if (pendingLit[iso]) { if (cb) pendingLit[iso].push(cb); return; }

      pendingLit[iso] = cb ? [cb] : [];
      loadGeo(iso).then(function (gj) {
        var waits = pendingLit[iso] || [];
        delete pendingLit[iso];
        /* 异步回来时用户可能已经关面板、或点了"关闭全部国境线"（清盘） */
        if (gj && globe.wantLit[iso]) {
          var line = lineFromGeo(gj);
          if (line) {
            borderCache[iso] = line;
            spin.add(line);
            applyLit(iso, line);
          }
        }
        waits.forEach(function (f) { try { f(); } catch (e) {} });
      });
    };

    /* 关面板：当前这条降成"已拼"，不熄灭。 */
    globe.dimCurrent = function () {
      if (curLit) curLit.material = globe.matLit;
      curLit = null;
      globe.active = null;
    };

    /* 清盘：全量国境线关掉时调用，连同已拼的块一起熄灭。 */
    globe.clearLit = function () {
      Object.keys(borderCache).forEach(function (k) { borderCache[k].visible = false; });
      Object.keys(globe.groups).forEach(function (k) { globe.groups[k].visible = false; });
      globe.wantLit = {};
      pendingLit = {};
      curLit = null;
      globe.active = null;
      Array.prototype.forEach.call(
        document.querySelectorAll('.dock-item'),
        function (n) { n.classList.remove('active'); }
      );
    };

    /* 空闲预热：这两样第一次使用都要现做（国境线合并 1201 个环、
       经纬网画 4096×2048 的贴图 + 编译 shader），用户点下去会僵一下。
       球稳定后趁空闲先把它们建好，之后开关只切 visible —— 秒开。
       建好先设 visible=false，不改变当前画面。

       注意：预热**不走** toggleAllBorders。开关语义里"关掉全量国境线"等于清盘，
       预热打开再关掉就会把用户已经拼上的金线一起清掉。 */
    function warmHeavyLayers() {
      if (!globe.spin) return;
      if (!globe.grid && typeof buildGraticule === 'function') prepareGrid(true);
      /* 全量国境线错开 700ms 再开始：8 个分片是网络请求，回来的建线那一下
         也有几十毫秒，不要和经纬网的绘制挤在同一帧。 */
      setTimeout(function () {
        if (!allBorders && !allBusy) buildAllBorders(false);   // 只建、不显示、不动按钮
      }, 700);
    }
    globe.warmHeavyLayers = warmHeavyLayers;

    /* 经纬网：建好 → 真正渲染两帧（上传纹理 + 编译 shader）→ 隐藏。
       只 initTexture / compile 是不够的 —— 实测 shader 编译能做掉，
       但 4096×2048 的 CanvasTexture 的 mip 链仍要等到第一次真实 draw call
       才生成，那一帧在软件渲染下能到 1 秒，在独显上也有几十毫秒。
       所以这里把网格缩到球心（0.001 倍，连一个像素都占不到），
       挂上去渲染两帧，等纹理和 program 都进了显存再还原、再隐藏。
       预热期掉这两帧，用户看到的是自转中的地球，不会注意到。 */
    function prepareGrid(silent) {
      if (globe.grid) return globe.grid;
      if (!globe.spin) return null;
      var g = buildGraticule(1.0018);
      if (silent) g.scale.setScalar(0.001);
      g.visible = true;
      globe.spin.add(g);
      globe.grid = g;
      try {
        if (globe.renderer) {
          if (g.material.map && globe.renderer.initTexture) {
            globe.renderer.initTexture(g.material.map);
          }
          if (globe.renderer.compile) globe.renderer.compile(scene, camera);
        }
      } catch (e) { /* 老版本 three：留给首次绘制，最多卡一次 */ }
      if (silent) {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (globe.grid !== g) return;      // 期间用户点了按钮
            g.scale.setScalar(1);
            g.visible = false;
          });
        });
      }
      return g;
    }

    /* 排查用：把某个经纬度转到正对相机，并指定相机距离。
       截图比对"金线贴不贴合"时必须能精确复现同一个视角，靠拖鼠标没法复现。 */
    window.__look = function (lon, lat, dist) {
      if (!globe.spin || !globe.tilt) return false;
      globe.camMode = 'manual';
      globe.flying = false;
      globe.autoSpin = false;
      if (dist) globe.camTarget = dist;
      globe.spin.rotation.y = -lon * D2R - Math.PI / 2;
      globe.tilt.rotation.x = lat * D2R;
      return true;
    };

    /* 排查用：看当前拼上了几块、全量线在不在。 */
    window.__sb = function () {
      return {
        active: globe.active || null,
        lit: Object.keys(borderCache).filter(function (k) { return borderCache[k].visible; }),
        litBuiltin: Object.keys(globe.groups).filter(function (k) { return globe.groups[k].visible; }),
        gridBuilt: !!globe.grid,
        gridVisible: !!(globe.grid && globe.grid.visible),
        bordersBuilt: !!allBorders,
        bordersVisible: !!(allBorders && allBorders.visible),
        bordersBusy: !!allBusy
      };
    };

    /* 全部国境线：一次把 8 个分片里所有国家的轮廓合并成一个 LineSegments。
       240 个国家各建一个对象会有 240 次 draw call，合成一条整线只有 1 次。
       分片总共 1.1MB，切开关时若已加载过就走浏览器缓存，不会重新解析。 */
    var allBorders = null, allBusy = false, allWant = false;
    /* 加载期间用户又点了：把回调排上，加载完一次性通知。
       以前是 `if (allBusy) return;` —— 直接返回、cb 不调、按钮的 busy 类
       永远摘不掉，之后所有点击都被 `if (classList.contains('busy')) return`
       挡在外面。用户点两下就变成"按钮没反应"，而屏幕上线的状态跟他以为的
       完全对不上 —— 这就是"偶发"的来源。 */
    var allWait = [];

    function flushAll(v) {
      allWait.splice(0).forEach(function (f) { try { f(v); } catch (e) {} });
    }

    function buildAllBorders(show) {
      allWant = !!show;
      if (allBusy) return;              // 在路上的那次会按最新 allWant 收尾
      allBusy = true;
      var jobs = [];
      for (var b = 0; b < 8; b++) {
        jobs.push(fetchAny('geo/c' + b + '.json')
          .catch(function () { return null; }));
      }
      Promise.all(jobs).then(function (list) {
        allBusy = false;
        var rings = [];
        list.forEach(function (all) {
          if (!all) return;
          Object.keys(all).forEach(function (iso) {
            (((all[iso] || {}).features) || []).forEach(function (f) {
              var g = f.geometry || {};
              var polys = g.type === 'Polygon' ? [g.coordinates]
                : (g.type === 'MultiPolygon' ? g.coordinates : []);
              polys.forEach(function (poly) {
                poly.forEach(function (ring) {
                  if (ring && ring.length > 2) rings.push(ring);
                });
              });
            });
          });
        });
        if (!rings.length) { flushAll(false); return; }
        if (!allBorders) {
          /* 半径 1.006：球半径是 1，差值必须比深度缓冲的精度大一档，
             否则线会陷进球面被剔掉（1.0045 实测就完全看不见）。
             颜色与选中的金线同一支（matAll = 0.40 透明度），只分浓淡。
             点亮的那几国画在 1.008，永远压在这层上面。 */
          allBorders = ringsToLines(rings, BORDER_R_ALL, globe.matAll);
          allBorders.visible = false;
          spin.add(allBorders);
        }
        allBorders.visible = allWant;
        flushAll(allWant);
      });
    }

    globe.toggleAllBorders = function (cb) {
      if (cb) allWait.push(cb);
      /* 建好一次就留着，开关只切 visible。
         以前关掉就 dispose，下次打开又得重新合并 1201 个环 —— 用户手感就是
         "第一次点卡一下、第二次又卡一下"。这个对象只有一条 draw call，
         留着占不了多少内存。 */
      if (allBorders) {
        allBorders.visible = !allBorders.visible;
        /* 关掉全量国境线 = 清盘：连已拼上的金线一起熄灭。
           这是用户定的玩法 —— 点过的国家会一直亮着，只有这里能一次抹掉。 */
        if (!allBorders.visible) globe.clearLit();
        flushAll(allBorders.visible);
        return;
      }
      buildAllBorders(true);
    };

    globe.scene = scene;
    globe.camera = camera;
    globe.renderer = renderer;
    globe.tilt = tilt;
    globe.spin = spin;
    globe.sphere = sphere;
    globe.data = data;
    globe.ready = true;

    // ---- 交互：拖拽 ----
    var cv = renderer.domElement;
    var downAt = { x: 0, y: 0 };

    /* 拖拽要能从"地名"上开始。
       现在 239 个国家的地名都可点，它们盖住了球面相当大一片；如果按住字就拖不动，
       手感会碎得厉害。所以：down 绑在 canvas 和每个地名上，move/up 统一挂 window
       （带 globe.dragging 守卫），这样从字上按下也能直接转球。 */
    function dragDown(e) {
      globe.dragging = true;
      globe.lastInput = performance.now();
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      downAt.x = e.clientX;
      downAt.y = e.clientY;
      globe.moved = 0;
      globe.vel.x = globe.vel.y = 0;
      cv.classList.add('dragging');
      globe.autoSpin = false;
      globe.flying = false;        // 手动接管，打断正在进行的飞行
    }
    function dragMove(e) {
      if (!globe.dragging) return;
      globe.lastInput = performance.now();
      var dx = e.clientX - globe.last.x;
      var dy = e.clientY - globe.last.y;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      globe.moved += Math.abs(dx) + Math.abs(dy);
      // 0.0016 弧度/像素：拖满 1200px 约转 110°，手一抖不会转到背面
      globe.vel.x = dx * 0.0016;
      globe.vel.y = dy * 0.0016;
      globe.spin.rotation.y += globe.vel.x;
      globe.tilt.rotation.x += globe.vel.y;
      var lim = 78 * D2R;
      globe.tilt.rotation.x = Math.max(-lim, Math.min(lim, globe.tilt.rotation.x));
    }
    function dragUp() {
      if (!globe.dragging) return;
      globe.dragging = false;
      cv.classList.remove('dragging');
      /* 只有真正拖动过才延时恢复自转。
         之前这里一律 +2.4 秒，于是"点一下画面"也会让地球停两秒半 ——
         单击本来只是看看，不该改变自转状态。
         顺带修了个老 bug：原来看的是"最后一小段位移"，慢慢拖松手时几乎总是 0，
         于是拖动之后自转立刻恢复，和"停 2.4 秒"的意图不符。现在累计整段位移。 */
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + (globe.moved > 6 ? 2400 : 0);
    }
    globe.dragDown = dragDown;
    cv.addEventListener('pointerdown', dragDown);

    /* ---------- 时间指示 ----------
       射线打到球面拿交点，再转回经纬度算当地时间。
       交点用的是世界坐标，必须先 worldToLocal 回球体坐标 ——
       直接拿世界坐标算经纬度，地球转过多少，时间就错多少。 */
    var _ray = new THREE.Raycaster();
    var _ndc = new THREE.Vector2();
    globe.pickLL = function (clientX, clientY) {
      var r = cv.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      _ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
      _ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
      _ray.setFromCamera(_ndc, camera);
      var hit = _ray.intersectObject(sphere, false);
      if (!hit || !hit.length) return null;
      var p = hit[0].point.clone();
      sphere.worldToLocal(p);
      return vec3ToLL(p);
    };

    var pin = document.getElementById('time-pin');
    function showTimePin(cx, cy, ll) {
      if (!pin) return;
      /* 时区按经度算：每 15° 一小时。真实时区有政治边界，
         这里要的是"这一点在太阳下的地方时"，按经度反而更自洽。 */
      var offMin = Math.round(ll.lon / 15 * 60);
      var now = new Date();
      var t = new Date(now.getTime() + offMin * 60000);
      var hh = t.getUTCHours(), mm = t.getUTCMinutes();
      var off = offMin / 60;
      var offStr = 'UTC' + (off >= 0 ? '+' : '−') +
        (Math.abs(off) % 1 === 0 ? Math.abs(off) : Math.abs(off).toFixed(1));
      var ns = ll.lat >= 0 ? 'N' : 'S';
      var ew = ll.lon >= 0 ? 'E' : 'W';
      pin.innerHTML = '<b>' + (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm +
        '</b>　' + (t.getUTCMonth() + 1) + '月' + t.getUTCDate() + '日 · ' + offStr +
        '<i>' + Math.abs(ll.lat).toFixed(1) + '°' + ns + '　' +
        Math.abs(ll.lon).toFixed(1) + '°' + ew + '</i>';
      pin.style.left = cx + 'px';
      pin.style.top = cy + 'px';
      pin.classList.add('on');
    }
    globe.hideTimePin = function () { if (pin) pin.classList.remove('on'); };

    cv.addEventListener('click', function (e) {
      if (!globe.timeMode) return;
      if (globe.moved > 6) return;            // 拖动过就不算"点了一下"
      var ll = globe.pickLL(e.clientX, e.clientY);
      if (!ll) return;
      rippleAt(e.clientX, e.clientY);
      chime(1320);
      showTimePin(e.clientX, e.clientY, ll);
    });
    window.addEventListener('pointermove', dragMove);
    window.addEventListener('pointerup', dragUp);
    window.addEventListener('pointercancel', dragUp);
    window.addEventListener('blur', dragUp);

    // ---- 交互：缩放 ----
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      // 触控板捏合会带 ctrlKey，deltaY 很小，得放大步长才跟手
      /* 0.0026 时一格滚轮只挪一点点，看一个国家要连滚七八下。
         调到 0.0042（一格约 1.6 倍步长）；触控板捏合同比例。 */
      var d = e.deltaY * (e.ctrlKey ? 0.014 : 0.0042);
      globe.camMode = 'manual';
      globe.lastInput = performance.now();
      globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget + d));
      /* 8K 在首屏就和 4K 一起下好、一起上传了，缩放时不再触发任何贴图操作。 */
      // 开始缩放就是想看地球了，搜索框该收回去（滚轮不会让 input 失焦）
      if (searchWrap && searchWrap.classList.contains('open')) setSearch(false);
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + 2600;
      globe.flying = false;         // 手动缩放接管，别再和飞行抢相机
    }, { passive: false });

    /* 双击复位：不再占一个按钮。双击同时会给两次 click，
       所以 click 里用 e.detail > 1 忽略掉第二次，避免顺手打开档案。 */
    cv.addEventListener('dblclick', function () {
      closePanel();
      setActive(null);
      flyOut();
    });

    // ---- 交互：点击拾取 ----
    var ray = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    cv.addEventListener('click', function (e) {
      // 拖拽结束时浏览器也会派发 click，位移超过 6px 视为拖动而非点击
      if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 6) return;
      if (e.detail > 1) return;        // 双击的第二次，交给 dblclick 复位
      /* 时间指示模式下这里什么都不做：点哪儿都只是"问时间"，
         不能顺手高亮国界、更不能弹档案。真正处理时间的是另一个监听器。 */
      if (globe.timeMode) return;
      var rect = cv.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      var hits = ray.intersectObject(sphere);
      if (!hits.length) return;
      // 关键：交点在世界坐标，必须转回 spin 的局部坐标才能反算经纬度
      var local = globe.spin.worldToLocal(hits[0].point.clone());
      var ll = vec3ToLL(local);
      var c = countryAt(ll.lon, ll.lat);
      if (!c) return;
      setActive(c.iso);
      openDetail(c.iso, cardOf(c.iso), false);
    });

    // ---- 渲染循环 ----
    function render() {
      globe.raf = requestAnimationFrame(render);
      if (document.hidden) return;          // 切到别的标签页就停，省电

      /* 帧间隔归一化。所有"每帧加一点"的动画都必须乘这个系数，
         否则 144Hz 屏上转得比 60Hz 快 2.4 倍 —— 之前自转就是"每帧固定加"。 */
      var nowMs = performance.now();
      var dtf = Math.min(3, (nowMs - (globe.lastMs || nowMs)) / 16.667) || 1;
      globe.lastMs = nowMs;

      // 飞行：朝目标角度阻尼逼近。用阻尼而不是时间轴 tween，
      // 是为了飞行途中被拖拽打断时不会两套动画抢控制权。
      if (globe.flying && !globe.dragging) {
        var dy = globe.rotTargetY - spin.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        spin.rotation.y += dy * 0.075;
        tilt.rotation.x += (globe.rotTargetX - tilt.rotation.x) * 0.075;
        if (Math.abs(dy) < 0.0015 &&
            Math.abs(globe.rotTargetX - tilt.rotation.x) < 0.0015) {
          globe.flying = false;
        }
      }

      /* 帧率无关的指数逼近：60fps 下系数 0.075，144fps 下自动变小，
         否则高刷屏上"飞近国家"会瞬间到位、看不到过程。 */
      camera.position.z += (globe.camTarget - camera.position.z) * (1 - Math.pow(0.925, dtf));
      if (STAR_MAT) STAR_MAT.uniforms.uTime.value = performance.now() / 1000;
      // 滚轮停下来了，才把 8K 传上 GPU
      /* 只在"手停下来"的时候才把 8K 传上 GPU。拖拽过程中 pointerdown 之后
         就没有新的输入事件了，所以必须同时看 dragging 标记 ——
         否则用户拖到一半正好命中上传，就是"拖拽途中卡一下"。 */
      if (globe.tex8kReady && !globe.dragging && !globe.flying &&
          nowMs - (globe.lastInput || 0) > 420) bind8k();

      if (globe.earthMat) {
        var U = globe.earthMat.uniforms;
        U.nightMix.value += (globe.nightTarget - U.nightMix.value) * 0.09;

        /* 整球淡入：0 → 1 用 1.1 秒、smoothstep 缓动。
           不是过渡动画炫技 —— 贴图从无到有如果硬切，观感就是"闪了一下"。
           两层大气一起淡，避免出现"光晕先到、球后到"。 */
        if (globe.fadeStart) {
          /* 2.8 秒淡入。既然 8K 在出球前就准备好了，这里可以把时间拉长：
             越长越像"从星空里浮出来"，也越不容易看出贴图是"贴"上去的。 */
          var kf = (performance.now() - globe.fadeStart) / 2800;
          kf = kf > 1 ? 1 : kf;
          var ef = kf * kf * (3 - 2 * kf);
          U.uFade.value = ef;
          globe.fadeVal = ef;
          /* 线框与大陆轮廓反向淡出：球 0→1 的同时它们 1→0，
             两者在中间交叠，观感是"骨架化成了实体"，而不是"线框没了、球才来"。 */
          if (globe.wire) {
            var wOp = 1 - ef;
            globe.wire.forEach(function (w) {
              w.o.material.opacity = w.base * wOp;
              w.o.visible = wOp > 0.02;
            });
            if (kf >= 1) globe.wire = null;
          }
          if (kf >= 1) globe.fadeStart = 0;
        }
        /* 大气壳的透明度每帧算一次：淡入值 × 夜面衰减。
           夜面时蓝色气壳几乎收掉，否则整颗球像蒙着蓝纱、城市灯光也糊。 */
        if (globe.atmo) {
          var atmoK = (globe.fadeVal == null ? 1 : globe.fadeVal) *
                      (1 - 0.93 * U.nightMix.value);
          globe.atmo.forEach(function (a) { a.mat.opacity = a.base * atmoK; });
        }

        /* 8K 淡入：只把 uMixB 推到 1，不接管 dayMap、也不释放 4K ——
           4K 还要负责缩小时的 mipmap 采样。 */
        if (U.uMixB.value < globe.mixBTarget) {
          U.uMixB.value = Math.min(globe.mixBTarget,
            U.uMixB.value + (globe.mixBTarget - U.uMixB.value) * 0.055 + 0.002);
        }
      }

      if (globe.autoSpin && !globe.dragging && !globe.flying &&
          nowMs > globe.idleUntil && !(globe.term && globe.term.on) &&
          !globe.timeMode) {
        /* 自转：0.0009 弧度/帧@60fps ≈ 116 秒一圈（原来 0.0013 = 80 秒，偏快）。
           再按相机距离减速：同样的角速度，凑近看时地表掠过屏幕的速度会快得多，
           乘 z/CAM_FAR 正好把这个放大抵消掉，远近看着一样从容。 */
        var spd = 0.0009 * Math.min(1.2, Math.max(0.35, camera.position.z / CAM_FAR));
        spin.rotation.y += spd * dtf;
      }
      if (!globe.dragging && Math.abs(globe.vel.x) + Math.abs(globe.vel.y) > 0.0002) {
        var decay = Math.pow(0.93, dtf);
        globe.vel.x *= decay;
        globe.vel.y *= decay;
        spin.rotation.y += globe.vel.x * dtf;
        tilt.rotation.x += globe.vel.y * dtf;
        var lim2 = 78 * D2R;
        tilt.rotation.x = Math.max(-lim2, Math.min(lim2, tilt.rotation.x));
      }
      renderer.render(scene, camera);
      updateLabels();
    }
    render();

    // ---- 尺寸变化 ----
    function resize() {
      var w2 = stage.clientWidth, h2 = stage.clientHeight;
      if (!w2 || !h2) return;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2, false);
      /* 视口一变，"整球入画"所需的距离也变（竖窗口时水平方向更紧）。
         处在这两个"贴合"状态时要把相机重新对到新值上，否则窗口一改
         球就被裁 —— 只在 buildGlobe 里算一次是不够的。 */
      CAM_FAR = farZ();
      CAM_NEAR = nearZ();
      if (globe.camMode === 'far') globe.camTarget = CAM_FAR;
      else if (globe.camMode === 'near') globe.camTarget = CAM_NEAR;
      else globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget));
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);

    /* 地名标注数据（242 个国家/地区 + 洲名洋名），和逐国档案分开取，
       标注加载失败不影响地球本体 */
    fetchAny('geo/labels.json')
      .then(buildLabels)
      .catch(function () { /* 静默降级：没有地名，球还在 */ });

    setActive(null);        // 初始不点亮任何国界
  }

  function startGlobe() {
    if (globe.state !== 'idle') return;
    /* 全量国界索引立刻开始下：这条链路只有 18KB/s，143KB 要八秒。
       放在 labels.json 之后才开始的话，白白晚五秒才拿到。 */
    loadFlatBoxes();
    if (!window.WebGLRenderingContext) {
      globeMsg('当前浏览器不支持 WebGL，3D 地球无法显示。国界轮廓在各国详情页内仍可查看。', true);
      globe.state = 'failed';
      return;
    }
    globe.state = 'loading';
    globeMsg('正在加载地球模型…');
    loadScriptOnce(GLOBE_SRC, function (err) {
      if (err || !window.THREE) {
        globe.state = 'failed';
        globeMsg('3D 模型未能加载（three.js 不可达）。国界轮廓在各国详情页内仍可查看。', true);
        return;
      }
      fetchAny('geo/globe.json')
        .then(function (data) {
          try {
            buildGlobe(data);
            globe.state = 'ok';
          } catch (e2) {
            globe.state = 'failed';
            globeMsg('3D 初始化失败：' + e2.message, true);
          }
        })
        .catch(function (e3) {
          globe.state = 'failed';
          globeMsg('地球数据未能加载（' + e3.message + '）', true);
        });
    });
  }

  /* ---------- 左下角工具 ----------
     国名不再是开关（改成按缩放自动分级），复位也不再是按钮（双击画面）。
     这里只剩"白天/夜晚"一个真开关。 */
  (function bindTools() {
    var bni = document.getElementById('btn-night');
    if (bni) {

       点一下还是贴在街道上。 */
    /* 工具栏收纳：收起后只留一颗按钮，右下角那片球面就露出来了 */
    var toolsWrap = document.getElementById('tools');

        globe.camTarget = 3.02;

    /* 全部国境线：切换。加载 8 个分片期间按钮置 busy，避免连点重复请求。 */
    var bbd = document.getElementById('btn-borders');

    if (bgd) {
      bgd.addEventListener('click', function () {
        var built = !!globe.grid;
        if (!built) {
          // 预热还没跑到（用户点得太快）才会走到这里。不置 busy：
          // 建线本来就是同步的，加了 loading 态反而多一次多余的样式切换。
          if (!globe.spin) return;

        var on = built ? !globe.grid.visible : true;
        globe.grid.visible = on;

       每帧算纯属浪费）。 */
    var btm = document.getElementById('btn-term');

    if (btm) {

        if (window.__tipHide) window.__tipHide();

       同时把国名标签的事件关掉（CSS 里 .time-mode .mlabel），
       免得"问个时间"顺手弹出档案。 */
    var bti = document.getElementById('btn-time');
    if (bti) {
      bti.addEventListener('click', function () {
        globe.timeMode = !globe.timeMode;
        var st = globeStage();
        if (st) st.classList.toggle('time-mode', globe.timeMode);
        bti.classList.toggle('on', globe.timeMode);
        bti.setAttribute('data-tip', globe.timeMode
          ? '退出时间指示' : '点地球任意位置看当地时间');
        /* 立刻把所有标签的点击态刷一遍：光靠下一帧的 updateLabels 也行，

        (globe.labels || []).forEach(function (L) {
          L.el.style.pointerEvents = globe.timeMode ? 'none' : (L.iso ? 'auto' : '');
        });
        if (!globe.timeMode && globe.hideTimePin) globe.hideTimePin();
        if (window.__tipHide) window.__tipHide();
      });
    }
  })();

  /* 射线法：点是否在多边形内。
     跨换日线的环（俄罗斯、斐济）经度从 -180 跳到 180，判定会失效 ——
     所以对同一个点，把经度平移 ±360 再试一次。 */
  function pointInRing(lon, lat, ring) {
    for (var shift = -360; shift <= 360; shift += 360) {
      var x = lon + shift, inside = false;
      for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        var xi = ring[i] && ring[i][0], yi = ring[i] && ring[i][1];
        var xj = ring[j] && ring[j][0], yj = ring[j] && ring[j][1];
        if (xi == null || xj == null) continue;
        if (((yi > lat) !== (yj > lat)) &&
            (x < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
      }
      if (inside) return true;
    }
    return false;
  }

  /* ---------- 2D 平面地图 ----------
     一张 6144×1024 的画布，横向首尾相接三份等距圆柱世界图。
     为什么是三份：单张 2:1 的世界图放到 16:9 屏幕上，要么上下留两条黑边，
     要么横向拉宽到失真。三份循环之后可以"铺满高度 + 左右无限延伸"，
     默认把 -100°（美洲）对到屏幕正中，左右两侧自然就是亚洲。

     画布本身不随缩放重绘 —— 平移缩放只改 CSS transform。 */
  (function bindMap2D() {
    var wrap = document.getElementById('map2d');
    var cv = wrap && wrap.querySelector('.map2d-canvas');
    var btnView = document.getElementById('btn-view');
    var btnPaper = document.getElementById('btn-paper');
    var stage = document.getElementById('globe-stage');
    var labelsEl = document.getElementById('labels');
    if (!wrap || !cv || !btnView) return;

    var W = cv.width, H = cv.height;   // 6144 × 1024（三份）
    var ONE = W / 3;                   // 一份的宽度
    var ringsAll = null, boxes = [], baseImg = null;
    var loading = null, painted = false, boundsDone = false;
    var imgReady = false, imgLoading = false, hiDone = false;
    var is2D = false, paper = false;
    var loadMsg = wrap.querySelector('.map2d-loading');

    // 视口参数：baseH = 铺满屏幕的高度；zoom = 缩放倍数；offX = 横向平移
    var baseH = 0, zoom = 1, offX = 0;

    /* 两份资源分开加载，谁先到先画谁。
       之前是 Promise.all 等 8 个分片 + 1.25MB 底图一起回来才画第一笔，
       线上实测要 20 秒以上，这 20 秒里整个屏幕是纯黑的 —— 用户以为坏了。
       现在底图（431KB）先出，国界线（gzip 后 143KB）随后叠上。 */
    /* 底图分两级加载：
       低清 512×256 只有 14KB，境外链路上一两秒就到，先铺上去让用户立刻看到
       "这是张世界地图"；高清 3072×1536 到了再无缝换掉。
       直接等高清的话，慢网上是十几秒的纯黑 —— 用户只会觉得坏了。 */
    function loadBase() {
      if (imgReady || imgLoading) return;
      imgLoading = true;
      var low = new Image();
      low.onload = function () {
        baseImg = low; imgReady = true;      // 先当正式底图用，后面会被顶掉
        if (is2D) paint();
        var hi = new Image();
        hi.onload = function () {
          baseImg = hi; hiDone = true;
          if (is2D) paint();
        };
        hi.onerror = function () { hiDone = true; };
        hi.src = 'assets/tex/world-2d.webp';
      };
      low.onerror = function () {
        // 低清都失败就直接上高清，别卡在这一步
        var hi = new Image();
        hi.onload = function () { baseImg = hi; imgReady = true; hiDone = true; if (is2D) paint(); };
        hi.onerror = function () { imgReady = true; hiDone = true; paint(); };
        hi.src = 'assets/tex/world-2d.webp';
      };
      low.src = 'assets/tex/world-2d-low.webp';
    }

    function loadBounds() {
      if (boundsDone) return;
      boundsDone = true;              // 只请求一次，失败也不重试
      fetchAny('geo/flat.json')
        .catch(function () { return null; })
        .then(function (data) {
          ringsAll = [];
          if (!data || !data.countries) { if (is2D) paint(); return; }
          var sc = data.scale || 1;
          var bx = {};
          data.countries.forEach(function (c) {
            var box = { x0: 999, y0: 999, x1: -999, y1: -999, rings: [] };
            c.rings.forEach(function (raw) {
              // 存的是 0.1° 单位的整数，这里一次性还原成浮点，
              // 后面绘制和命中判定都不用再除
              var ring = new Array(raw.length);
              for (var i = 0; i < raw.length; i++) {
                ring[i] = [raw[i][0] / sc, raw[i][1] / sc];
                var p = ring[i];
                if (p[0] < box.x0) box.x0 = p[0];
                if (p[1] < box.y0) box.y0 = p[1];
                if (p[0] > box.x1) box.x1 = p[0];
                if (p[1] > box.y1) box.y1 = p[1];
              }
              ringsAll.push({ iso: c.iso, ring: ring });
              box.rings.push(ring);
            });
            bx[c.iso] = box;
          });
          boxes = Object.keys(bx).map(function (iso) {
            var b0 = bx[iso];
            b0.iso = iso;
            b0.area = Math.max(0.01, (b0.x1 - b0.x0) * (b0.y1 - b0.y0));
            return b0;
          });
          if (is2D) paint();
        });
    }

    function drawOne(g, dx) {
      var i;
      // 国界：白底色稿用蓝线，卫星底图上用暖白
      if (paper) {
        g.strokeStyle = 'rgba(38,86,148,.85)';
        g.lineWidth = 2.4;
        g.shadowColor = 'rgba(40,70,110,.55)';   // 海岸线一点的投影，让陆地"浮"起来
        g.shadowBlur = 5;
        g.shadowOffsetY = 1;
      } else {
        g.strokeStyle = 'rgba(244,232,210,.72)';
        g.lineWidth = 1.6;
        g.shadowColor = 'transparent';
        g.shadowBlur = 0;
      }
      g.lineJoin = 'round';
      var prevX = null;
      var rings = ringsAll || [];
      for (var k = 0; k < rings.length; k++) {
        var ring = rings[k].ring;
        g.beginPath();
        prevX = null;
        for (i = 0; i < ring.length; i++) {
          var pt = ring[i];
          if (!pt) continue;
          var x = dx + (pt[0] + 180) / 360 * ONE;
          var y = (90 - pt[1]) / 180 * H;
          // 跨换日线的多边形断开重起笔，否则会横穿整张图
          if (prevX !== null && Math.abs(x - prevX) > ONE * 0.5) g.moveTo(x, y);
          else if (prevX === null) g.moveTo(x, y);
          else g.lineTo(x, y);
          prevX = x;
        }
        g.stroke();
      }
      g.shadowColor = 'transparent';
      g.shadowBlur = 0;
    }

    /* 重绘。底图和国界谁到了就画谁 —— 不再等两份都齐。
       paper 模式下底图不画，但米白底可以先铺上，用户至少看到一张空白地图
       而不是黑洞。 */
    function paint() {
      if (!ringsAll && !baseImg && !paper) return;
      var g = cv.getContext('2d');
      g.clearRect(0, 0, W, H);
      if (paper) {
        g.fillStyle = '#f6f2e9';
        g.fillRect(0, 0, W, H);
      } else if (baseImg) {
        for (var i = 0; i < 3; i++) g.drawImage(baseImg, i * ONE, 0, ONE, H);
      }
      for (var j = 0; j < 3; j++) drawOne(g, j * ONE);
      painted = true;
      // 留个时间戳：canvas 很大，外部靠读像素计时会被 getImageData 本身拖慢，
      // 排查"到底几秒才画出来"只能靠它
      window.__map2dPaintedAt = performance.now();
      window.__map2dHasBase = !!baseImg;
      window.__map2dHasBounds = !!(ringsAll && ringsAll.length);
      if (loadMsg) {
        loadMsg.classList.toggle('on', !(ringsAll && (paper || imgReady)));
      }
    }

    /* 布局：画布高度铺满视口，宽度随之 ×2；offX 决定横向位置。
       初始让 -100° 落在屏幕中央 —— 那是美洲，左右两边就是亚洲。 */
    function layout(reset) {
      baseH = window.innerHeight;
      var cssW = baseH * 2 * 3 * zoom;
      var cssH = baseH * zoom;
      cv.style.width = cssW + 'px';
      cv.style.height = cssH + 'px';
      cv.style.top = Math.round((window.innerHeight - cssH) / 2) + 'px';
      if (reset) offX = window.innerWidth / 2 - (baseH * 2) * (1 + (80 / 360)) * zoom;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    }

    /* 平移边界：循环折返，而不是硬夹住。
       画布里是同一张世界图首尾相接的三份，所以把 offX 整体挪一整份，
       屏幕上的内容**一模一样** —— 挪的时候用户看不出来，也就不会有
       "拖到头撞墙/露黑边"这回事。
       允许区间：offX ∈ [VW - 3·ONE, 0]，保证三份里总有一份能盖满视口。 */
    function clampOff() {
      var ONEcss = baseH * 2 * zoom;
      var min = window.innerWidth - ONEcss * 3;
      var guard = 0;
      while (offX > 0 && guard++ < 8) offX -= ONEcss;
      while (offX < min && guard++ < 8) offX += ONEcss;
      if (offX > 0) offX = 0;
      if (offX < min) offX = min;
    }

    function set2D(on) {
      is2D = on;
      btnView.classList.toggle('on', on);
      btnView.setAttribute('data-tip', on ? '切换回三维地球' : '切换到平面地图');
      var svg = btnView.querySelector('svg');
      if (svg) {
        svg.innerHTML = on
          ? '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.9" ry="8.6"/>'
          : '<rect x="2.6" y="5.4" width="18.8" height="13.2" rx="2"/>' +
            '<path d="M2.6 12h18.8M9 5.4v13.2M15 5.4v13.2"/>';
      }
      if (on) {
        wrap.classList.add('on');
        wrap.setAttribute('aria-hidden', 'false');
        if (stage) stage.style.opacity = '0';
        if (labelsEl) labelsEl.style.opacity = '0';
        btnPaper.hidden = false;
        layout(true);
        loadBase();
        loadBounds();
        paint();
      } else {
        wrap.classList.remove('on');
        wrap.setAttribute('aria-hidden', 'true');
        if (stage) stage.style.opacity = '1';
        if (labelsEl) labelsEl.style.opacity = '1';
        btnPaper.hidden = true;
        paper = false;
        wrap.classList.remove('paper');
        btnPaper.classList.remove('on');
        btnPaper.setAttribute('data-tip', '白底线稿');
      }
    }

    btnView.addEventListener('click', function () {
      set2D(!is2D);
      if (window.__tipHide) window.__tipHide();
    });

    btnPaper.addEventListener('click', function () {
      if (!is2D) return;
      paper = !paper;
      wrap.classList.toggle('paper', paper);
      btnPaper.classList.toggle('on', paper);
      btnPaper.setAttribute('data-tip', paper ? '回到卫星底图' : '白底线稿');
      painted = false;
      if (ringsAll) paint();
      if (window.__tipHide) window.__tipHide();
    });

    /* ---- 拖拽平移 ---- */
    var drag = null;
    wrap.addEventListener('pointerdown', function (e) {
      if (!is2D) return;
      drag = { x: e.clientX, off: offX };
      wrap.classList.add('dragging');
      wrap.setPointerCapture && wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', function (e) {
      if (!drag) return;
      offX = drag.off + (e.clientX - drag.x);
      if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    });
    var justDragged = false;
    function endDrag() {
      justDragged = !!(drag && drag.moved);
      drag = null;
      wrap.classList.remove('dragging');
    }
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);

    /* ---- 滚轮缩放（以屏幕中心为锚） ---- */
    wrap.addEventListener('wheel', function (e) {
      if (!is2D) return;
      e.preventDefault();
      var k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      var nz = Math.max(0.85, Math.min(6, zoom * k));
      if (nz === zoom) return;
      // 让缩放围绕屏幕中心：先算出中心点在画布上的比例，缩放后校正 offX
      var cx = window.innerWidth / 2;
      var ratio = (cx - offX) / (baseH * 2 * 3 * zoom);
      zoom = nz;
      layout(false);
      offX = cx - ratio * baseH * 2 * 3 * zoom;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    }, { passive: false });

    /* ---- 点击开档案 ---- */
    wrap.addEventListener('click', function (e) {
      if (!is2D || !ringsAll) return;
      if (justDragged) { justDragged = false; return; }
      var cssW = baseH * 2 * 3 * zoom;
      var px = (e.clientX - offX) / cssW * W;         // 画布像素
      var py = (e.clientY - parseFloat(cv.style.top || 0)) / (baseH * zoom) * H;
      var lon = ((px % ONE) / ONE) * 360 - 180;
      var lat = 90 - py / H * 180;
      if (lat > 90 || lat < -90) return;
      /* 先用 bbox 粗筛，再做射线法判定。
         只靠 bbox 会错得离谱：西班牙的矩形包围盒把整个摩洛哥和阿尔及利亚北部
         都盖住了，点阿尔及利亚会开出西班牙。
         粗筛命中后按面积从小到大试（小国优先），第一个真正包含该点的就是答案。 */
      var cand = [];
      for (var i = 0; i < boxes.length; i++) {
        var b = boxes[i];
        if (lon >= b.x0 - 0.4 && lon <= b.x1 + 0.4 &&
            lat >= b.y0 - 0.4 && lat <= b.y1 + 0.4) cand.push(b);
      }
      cand.sort(function (a, b) { return a.area - b.area; });
      var best = null;
      for (var c = 0; c < cand.length && !best; c++) {
        for (var r = 0; r < cand[c].rings.length; r++) {
          if (pointInRing(lon, lat, cand[c].rings[r])) { best = cand[c]; break; }
        }
      }
      if (!best) return;
      setActive(best.iso);
      openDetail(best.iso, cardOf(best.iso), false);
    });

    window.addEventListener('resize', function () {
      if (is2D) layout(false);
    });
  })();

  /* ---------- 首屏就是地球，直接启动。之前那套"滚到区块才加载"已经不适用 ——
     现在地球是页面主体，拖到后面才出现是不可接受的。 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGlobe);
  } else {
    startGlobe();
  }

  /* ---------- 启动 ---------- */
  fetchAny('data/index.json')
    .then(function (idx) {
      (idx.countries || []).forEach(function (c) {
        if (c.status !== 'placeholder') {
          HAS_DOC[String(c.iso_a2 || '').toUpperCase()] = 1;
        }
      });
      renderCards(idx.countries || []);
      var total = (idx.countries || []).length;
      var ready = (idx.countries || []).filter(function (c) { return c.status !== 'placeholder'; }).length;
      subEl.textContent = total + ' 个国家/地区 · ' + ready + ' 条已接入 · schema v' + idx.schema_version;
      hintEl.textContent = '';
      // 注意：这里**不**自动打开任何档案。首屏应该是完整的地球，
      // 由用户点击国土或底部胶囊再展开面板。
      loadSearchIndex();
      loadCountryMeta();
      /* 三个国家的 data/*.json 与 geo/*.geojson 都很小（十几 KB），
         空闲时先抓下来放进 HTTP 缓存 —— 否则"第一次点某个国家"要现取现解析，
         就是那种"有时卡有时不卡"的玄学。 */
      setTimeout(function () {
        /* 两个细节都是实测出来的：
           * geo/{iso}.geojson 只有中法美三国有独立文件，其余国家一律 404。
             那十几个无效请求既占连接，又会和用户此刻正在点的那张图抢同一条跨境链路。
             国界走的是 geo/c0..c7.json 分片，这里不该预取。
           * forEach 里直接 fetch 会在同一瞬间并发十几条。改成每 140ms 一条，
             温和铺满 HTTP 缓存，不打断用户操作。 */
        var list = (idx.countries || []).filter(function (c) {
          return c.status !== 'placeholder';
        });
        /* 平面地图下线后，它那三份资源（14KB + 143KB + 431KB）不再预取 ——
           这条链路只有 18KB/s，白下 600KB 会直接拖慢用户此刻真正要看的东西。 */

        var i = 0;
        var step = function () {
          if (i >= list.length) return;
          var iso = String(list[i++].iso_a2 || '').toLowerCase();
          if (iso) fetchAny('data/' + iso + '.json').catch(function () {});
          setTimeout(step, 140);
        };
        setTimeout(function () {
          if (window.requestIdleCallback) requestIdleCallback(step, { timeout: 3000 });
          else step();
        }, 900);
      }, 4200);
    })
    .catch(function (e) {
      subEl.textContent = '数据未加载';
      fail('读取 data/index.json 失败：' + e.message +
           '。若你是直接双击打开本地文件（file:// 协议），浏览器会禁止 fetch —— 请用公网地址或起一个本地服务器。');
    });
})();
</script>

</body>
</html>
