<style>
  :root{

<style>
  /* --- 卡片：图文头 + 正文 --- */
  .card{padding:0}
  .card .cbody{padding:18px 20px 20px}

  /* 图片一律套在 .*-wrap 里：<img> 是替换元素，伪元素在它身上不渲染，
     骨架必须由父容器画。loaded 之前图片 opacity:0，不出现半张图抖一下。 */
  .thumb-wrap{
    position:relative;height:132px;overflow:hidden;
    border-bottom:1px solid var(--line);background:#0b1020;
  }
  .thumb-wrap .thumb{
    display:block;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .45s ease;
  }
  .thumb-wrap.loaded .thumb{opacity:1}
  .thumb-wrap.blank{
    display:flex;align-items:center;justify-content:center;
    font-size:12px;letter-spacing:.1em;color:var(--ink-faint);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px),
      linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .card.is-placeholder{opacity:.62}
  .card.is-placeholder:hover{opacity:.85}
  .card.active{border-color:rgba(148,182,224,.5);background:rgba(148,182,224,.05)}
  .mods em.off{opacity:.36}

  /* --- 详情 --- */
  .dwrap{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:26px;align-items:start}
  /* 高度写死，不跟着图片自身比例变。
     之前竖图（埃菲尔铁塔 760×1406）触发 .fit 把框改成 3/4，横图又是 16:10，
     于是"切一张图，下面的文字整体上移一截"。现在框高固定，
     竖图 contain 装整张、横图 cover 铺满，版式不动。 */
  .dimg-wrap{
    position:relative;width:100%;height:clamp(230px,34vh,372px);overflow:hidden;
    border:1px solid var(--line);border-radius:12px;background:#070b14;
  }

  .dimg-wrap .dimg{
    display:block;width:100%;height:100%;object-fit:cover;position:relative;z-index:1;
    /* 0.45s 太长：图在 ~300ms 就位，再淡入半秒，观感就是"切一张卡一下"。
       0.26s 在深色面板上仍然柔和，但不会拖。 */
    opacity:0;transition:opacity .26s ease;
  }
  .dimg-wrap.loaded .dimg{opacity:1}
  /* 已在内存里的图（预取过）直接显示，不做淡入 ——
     深色底上那 0.26s 的淡入，观感就是"点一下闪一下"。 */
  .dimg-wrap .dimg.now{transition:none}
  /* 竖构图（埃菲尔铁塔 760×1406、长城烽燧之类）：框改成竖的、整张装进去，
     不再拿 16:10 的死框去裁 —— 那正是"塔被拉平看不到全貌"的来源。 */
  .dimg-wrap.fit{background:rgba(0,0,0,.28)}
  .dimg-wrap.fit .dimg{object-fit:contain}
  .dimg-wrap.blank{
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;color:var(--ink-faint);text-align:center;padding:12px;
    background:linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .dimg-wrap.blank .dimg{display:none}
  /* 点击看大图：图能装下的框才有意义（blank/加载中不给手型，免得点了没反应） */
  .dimg-wrap.loaded{cursor:zoom-in}
  .dimg-wrap .zoomhint{
    position:absolute;right:9px;bottom:9px;width:26px;height:26px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    color:#e2ebfa;background:rgba(8,12,22,.55);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16);
    opacity:0;transition:opacity .16s ease;pointer-events:none;
  }
  .dimg-wrap.loaded .zoomhint{opacity:0}
  .dimg-wrap.loaded:hover .zoomhint{opacity:1}
  /* 大图查看层。和详情面板同一套深色底，不做纯黑，避免跳出视觉体系 */
  #lightbox{
    position:fixed;inset:0;z-index:96;display:flex;align-items:center;justify-content:center;
    padding:4vh 4vw;background:rgba(4,7,14,.9);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #lightbox.on{opacity:1;pointer-events:auto}
  #lightbox .lb-img{
    max-width:92vw;max-height:80vh;border-radius:10px;display:block;
    box-shadow:0 28px 90px rgba(0,0,0,.62);
    transform:scale(.985);transition:transform .22s cubic-bezier(.2,.9,.25,1);
  }
  #lightbox.on .lb-img{transform:scale(1)}
  #lightbox .lb-cap{
    position:absolute;left:0;right:0;bottom:18px;text-align:center;
    font-size:12.5px;line-height:1.6;color:#c6d3e8;padding:0 9vw;
  }
  #lightbox .lb-cap i{color:#8595ad;font-style:normal}
  #lightbox .lb-x{
    position:absolute;top:16px;right:18px;width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#e8eefb;font-size:19px;line-height:1;
    background:rgba(12,18,30,.62);border:1px solid rgba(255,255,255,.18);
  }
  #lightbox .lb-x:hover{background:rgba(24,34,52,.8)}
  .cap{font-size:12px;color:var(--ink-dim);margin-top:9px;line-height:1.65}
  .cap.dim{
    color:var(--ink-faint);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .dmeta{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;margin-bottom:20px}
  .dmeta dt{color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap}
  .dmeta dd{color:var(--ink);font-variant-numeric:tabular-nums}
 /* 命中词高亮：一段里常常只有半句话跟点的词有关，标出来才知道落点。 */
 .hit-word{
   background:rgba(216,178,106,.30);
   border-radius:2px;
   box-shadow:0 0 0 2px rgba(216,178,106,.24);
 }

  /* 正文提一档字重：中文黑体在深底上 400 偏细 */
  .dtext p{font-size:14.5px;line-height:2;color:#dde5f3;margin-bottom:12px;font-weight:500;
    text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .dtext p .kw,.dtext p .kn{text-shadow:none}
  .dplayer{width:100%;margin-top:16px;border-radius:10px}
  .pending{
    margin-top:16px;padding:11px 14px;border-radius:10px;
    border:1px dashed rgba(148,182,224,.3);
    background:rgba(148,182,224,.05);
    font-size:12.5px;color:#c9b58c;line-height:1.75;
  }
  .todo-list{list-style:none;margin-top:4px}
  .todo-list li{
    position:relative;padding:5px 0 5px 15px;
    font-size:12.5px;color:var(--ink-faint);line-height:1.7;
  }
  .todo-list li::before{
    content:"";position:absolute;left:3px;top:13px;
    width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.6;
  }
  /* 数据待补：一行短标签，不写构建日志 */
  .dq{
    margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;gap:9px;align-items:baseline;
    font-size:11.5px;line-height:1.65;
  }
  .dq-k{flex:0 0 auto;letter-spacing:.08em;color:rgba(148,182,224,.7)}
  .dq-v{color:var(--ink-faint);min-width:0}

  /* 加载中骨架：避免录屏时出现纯白或灰块跳动 */
  .thumb-wrap.loading,.dimg-wrap.loading{
    background:linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .thumb-wrap.loading::after,.dimg-wrap.loading::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(100deg,transparent 20%,rgba(140,165,220,.13) 50%,transparent 80%);
    background-size:220% 100%;
    animation:shimmer 1.35s linear infinite;
  }
  /* 占位文字（无图时的灰底卡）不参与骨架动画 */
  .thumb-wrap.blank::after,.dimg-wrap.blank::after{content:none}
  @keyframes shimmer{
    from{background-position:180% 0}
    to{background-position:-80% 0}
  }
  /* 面板骨架：JSON 还没到时，先把"左图 + 右文"的框架撑起来，
     别只留一句"读取中…"。图用和缩略图同款微光，文字用灰条。 */
  .sk-line{
    position:relative;overflow:hidden;height:12px;border-radius:6px;
    margin:0 0 13px;background:linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .sk-line::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(140,165,220,.13) 50%,transparent 80%);
    background-size:220% 100%;animation:shimmer 1.35s linear infinite;
  }
  .sk-line.h1{height:22px;width:46%;margin-bottom:20px}

  /* 3D 地球 */
  .globe-wrap{
    display:grid;grid-template-columns:1fr 232px;gap:22px;align-items:start;
  }
  .globe-stage{
    position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
    background:radial-gradient(circle at 42% 36%,#0e1b2e 0%,#070d16 55%,#03060b 100%);
    touch-action:none;               /* 拖拽时不触发页面滚动 */
  }
  .globe-stage canvas{display:block;width:100%;height:100%;cursor:grab}
  .globe-stage canvas.dragging{cursor:grabbing}
  .globe-msg{
    /* 原样：屏幕正中一行字，不加底板。
       之前读不出来只是因为字色太淡（--ink-faint）+ 压在球心最亮的贴图上，
       所以这里只做两件事：文字提亮，加三层黑色投影当"描边"。
       投影比底板好在哪 —— 它只跟着笔画走，不占画面，也不改变原来的观感。 */
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;gap:10px;
    max-width:min(560px,calc(100% - 48px));
    font-size:13px;font-weight:500;letter-spacing:.06em;
    color:#eaf2fd;
    text-align:center;line-height:1.7;
    text-shadow:
      0 0 2px rgba(0,0,0,.95),
      0 1px 3px rgba(0,0,0,.95),
      0 2px 10px rgba(0,0,0,.9),
      0 0 24px rgba(0,0,0,.8);
    /* 再贴一圈极细的描边：投影在沙漠、雪原这种大片亮色上会"发灰"，
       描边能把笔画的边界钉住，看着还是一行字，不是一块板。 */
    -webkit-text-stroke:.45px rgba(0,0,0,.5);
    paint-order:stroke fill;
    z-index:5;
    /* 这层不接收事件，提示期间地球照常能拖 */
    pointer-events:none;
    transition:opacity .45s ease,transform .45s ease;
  }
  /* 加载环用 CSS 动画（合成器线程）而不是 JS 驱动。
     关键点：上传 8K 贴图那一下主线程会停住 100~800ms，JS 驱动的进度条会跟着定住，
     看着像死机；CSS transform 动画不受影响，照样转，观感就是"在加载"而不是"卡住"。 */
  .globe-spin{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    border:1.5px solid rgba(150,185,230,.16);
    border-top-color:rgba(180,210,246,.92);
    border-right-color:rgba(140,180,230,.5);
    animation:gspin 1.05s linear infinite;
  }
  @keyframes gspin{to{transform:rotate(360deg)}}
  .gm-txt{transition:opacity .26s ease}
  .globe-msg.gone{opacity:0;transform:translate(-50%,-50%) scale(.97);pointer-events:none}
  /* 错误提示是一整段话，换行正常，颜色偏暖 */
  .globe-msg.err{color:#f0b795}
  .globe-spin{
    /* 无底板之后，转圈也得自带黑边才看得见 */
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.95)) drop-shadow(0 0 8px rgba(0,0,0,.8));
  }

  .globe-side .sub-label{margin-top:0}
  .globe-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;margin-top:6px;border-radius:8px;
    border:1px solid var(--line);cursor:pointer;
    transition:border-color .2s ease,background .2s ease;
  }
  .globe-item:hover{border-color:rgba(148,182,224,.45);background:rgba(148,182,224,.05)}
  .globe-item.active{border-color:rgba(148,182,224,.7);background:rgba(148,182,224,.08)}
  .gi-flag{
    font-size:9.5px;letter-spacing:.08em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:4px;padding:1px 4px;flex:0 0 auto;
  }
  .gi-name{font-size:13px;color:var(--ink)}
  .gi-coord{
    margin-left:auto;font-size:10.5px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .globe-tip{font-size:11.5px;line-height:1.75}

  @media (max-width:900px){
    .globe-wrap{grid-template-columns:1fr}
    .globe-stage{aspect-ratio:1/1}
  }

  /* 知识库检索 */
  .search-box{margin-top:2px}
  #q{
    width:100%;box-sizing:border-box;
    padding:13px 16px;font-size:14px;font-family:inherit;
    color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:10px;outline:none;
    transition:border-color .2s ease,background .2s ease;
    -webkit-appearance:none;appearance:none;
  }
  #q::placeholder{color:var(--ink-faint)}
  /* 聚焦只改描边，不铺底色。之前这里有一层 rgba(255,255,255,.05)，
     在近黑面板上就是一块米白蒙版盖住整个搜索框 —— 反馈给多了。 */
  #q:focus{border-color:rgba(148,182,224,.5);background:transparent}
  #q::-webkit-search-cancel-button{filter:invert(.5)}

  .sr-examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .sr-ex{
    font-size:12px;padding:4px 11px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:transparent;font-family:inherit;cursor:pointer;
    transition:border-color .2s ease,color .2s ease;
  }
  .sr-ex:hover{border-color:rgba(148,182,224,.45);color:var(--ink)}

  /* 结果区：卡片的下半截（形状见下面 #q-res，样式集中在一处免得两套规则打架） */
  .search-res{margin-top:0}

  /* ---- 结果行：仿 Google 地图的形状 ----
     左边一枚圆形图标底（国家=地图针，知识条目=文档），中间两行字
     （主标题 + 灰色小字说明），右边可选动作。行与行之间不画分隔线 ——
     Google 那里是靠留白分行的，画上线就变回"表格"了。 */
  .sr-item{
    display:flex;align-items:center;gap:13px;
    padding:10px 15px;cursor:pointer;
    transition:background .16s ease;
  }
  .sr-item:hover{background:rgba(148,182,224,.07)}
  .sr-ico{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(148,182,224,.11);
    color:rgba(186,212,244,.9);
    transition:background .16s ease,color .16s ease;
  }
  .sr-item:hover .sr-ico{background:rgba(148,182,224,.18);color:rgba(214,232,252,.98)}
  .sr-ico svg{
    width:17px;height:17px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  }
  .sr-txt{flex:1 1 auto;min-width:0}
  .sr-name{
    font-size:14px;line-height:1.35;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sr-sub{
    margin-top:2px;font-size:12px;line-height:1.4;
    color:rgba(168,190,218,.62);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sr-foot{
    padding:11px 15px 13px;text-align:center;
    font-size:11.5px;letter-spacing:.03em;
    color:rgba(160,184,214,.5);
    border-top:1px solid rgba(120,150,190,.13);
  }
  /* 兼容旧的居中行（其余地方还在用 sr-country-row） */
  .sr-country-row{display:flex;align-items:center;gap:13px;padding:9px 15px}
  .sr-empty{padding:16px;font-size:12.5px;color:var(--ink-faint);line-height:1.6}
  /* "基础"标签：表示这个国家只有几何/地名/人口，多模态在队列里。
     现在它跟在主标题后面（行内），所以要 inline-block 才能吃 padding。 */
  .sr-tag{
    display:inline-block;vertical-align:middle;
    margin-left:7px;padding:0 5px;border-radius:4px;
    font-size:10.5px;line-height:1.6;letter-spacing:.04em;font-weight:400;
    color:rgba(174,206,240,.86);
    border:1px solid rgba(150,190,235,.26);
  }
  .sr-arrow{
    margin-left:auto;font-size:15px;line-height:1;color:rgba(148,182,224,.45);
    transition:color .18s ease,transform .18s ease;
  }
  .sr-country-row:hover .sr-arrow{color:rgba(200,222,250,.9);transform:translateX(2px)}

  /* 文化特征：左列窄标签 + 右侧色块。
     原来是 11px 灰字 + 12px 半透明 chip，在深色面板里几乎看不见；
     现在键名 13px 提亮、chip 13px 实色、行间加细分隔线，
     整体像一张"规格表"而不是一堆散落的灰点。 */
  .facets{margin-top:2px}
  .frow{
    display:grid;grid-template-columns:56px minmax(0,1fr);
    gap:4px 12px;align-items:start;
    padding:8px 0;
    border-bottom:1px solid rgba(140,165,220,.10);
  }
  .frow:last-child{border-bottom:0;padding-bottom:2px}
  .fkey{
    font-size:13px;line-height:1.5;letter-spacing:.02em;
    color:rgba(184,202,230,.92);padding-top:3px;white-space:nowrap;
  }
  .fval{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:13px;line-height:1.5;padding:3px 10px;border-radius:7px;
    border:1px solid rgba(140,170,215,.24);
    color:#d7e0ef;background:rgba(255,255,255,.04);
    cursor:default;
    transition:border-color .18s ease,color .18s ease,background .18s ease;
  }
  .chip:hover{
    border-color:rgba(160,192,236,.6);color:#fff;
    background:rgba(150,185,230,.12);
  }
  /* 关键词是"从正文里抽出来的词"，比人工归类的其它项亮一档 */
  .chip-kw{
    border-color:rgba(140,180,240,.38);
    color:#d3e6ff;background:rgba(120,165,235,.10);
  }

  /* 国界轮廓 */
  .geo-box{margin-top:4px}
  /* 高度必须固定。轮廓是 220ms 后异步画进来的，它的高度取决于国土长宽比
     （智利 4:1 竖长、俄罗斯 2:1 横长）；不占位的话，等它出现时
     会把下面「历史 / 民俗」正文整体往下顶一截 —— 用户看到的就是
     "文字先冒出来，然后被挤下去"。先占好位置，里面居中骨架，来了就地替换。 */
  .geo-svg{
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#0c1220,#090e1a);
    padding:6px;font-size:12px;color:var(--ink-faint);
    height:clamp(150px,21vh,196px);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .geo-svg svg{display:block;width:100%;height:100%;max-height:100%}

  /* 多图切换 */
  .thumbstrip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ts-item{
    width:64px;height:46px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:pointer;opacity:.55;
    /* 图没到之前是一块同款灰骨架：底色和微光都照抄主图 .dimg-wrap.loading
       （#0d1322 → #0a0f1c，加一道 rgba(140,165,220,.13) 扫光），
       图片一加载就整个盖住它 —— 不再露出浏览器那个"破图"小图标。
       以前会闪一下 alt 文字（"某某 图片 1"），alt 已置空，见 JS。

       background-clip:padding-box 是必须的：img 的默认值是 border-box，
       渐变会一路画到 1px 描边下面，边框是半透明的 rgba(140,165,220,.16)，
       透出来就是一圈亮线 —— 用户看到的"右边一条白线"就是扫光刚好走到那儿。 */
    background-image:
      linear-gradient(100deg,transparent 20%,rgba(140,165,220,.13) 50%,transparent 80%),
      linear-gradient(160deg,#0d1322,#0a0f1c);
    background-size:220% 100%,100% 100%;
    background-position:180% 0,0 0;
    background-repeat:no-repeat,no-repeat;
    background-clip:padding-box;
    animation:tsShimmer 1.35s linear infinite;
    transition:opacity .2s ease,border-color .2s ease;
  }
  /* 加载完成后 JS 会往 style 里塞一层 url()，把骨架两整层盖掉。 */
  .ts-item.loaded{
    animation:none;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  @keyframes tsShimmer{
    from{background-position:180% 0,0 0}
    to{background-position:-60% 0,0 0}
  }
  .ts-item:hover{opacity:.85}
  .ts-item.active{opacity:1;border-color:rgba(148,182,224,.65)}

  /* 语言音频行 */
  .lang-block{padding:10px 0;border-bottom:1px solid rgba(140,165,220,.12)}
  .lang-block:last-child{border-bottom:0;padding-bottom:2px}
  /* 三列网格：语言名固定 96px，播放器永远从同一条竖线开始。
     flex 时代名字长短不同，播放器位置就跟着飘，"英语"和"现代标准汉语"看着像两张表。 */
  /* 列宽由内容决定：名字多长，角色和播放器就跟到多后，永远紧挨着名字。
     固定 104px 时"英语"两个字和播放器之间会空出一大段。 */
  .lang-audio{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:10px;justify-content:start}
  /* 原文一行 + 中文一行。原文淡、译文亮，读的时候先看译文。 */
  .lang-trans{margin:6px 0 0 0;display:flex;flex-direction:column;gap:3px}
  .lt-src{
    font-size:12px;line-height:1.6;color:rgba(150,170,198,.72);
    font-style:italic;letter-spacing:.01em;
  }
  .lt-zh{font-size:12px;line-height:1.7;color:#bcd4ee}
  /* 名字列给足 104px（"现代标准汉语"六个字要 84px），单行不折；
     角色列 44px 且不折 —— 否则两个字的"官方"会竖着排。 */
  .la-name{
    font-size:14px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .la-role{
    justify-self:start;white-space:nowrap;
    font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;
  }
  .la-player{flex:1;height:32px;min-width:0}

  @media (max-width:760px){
    .dwrap{grid-template-columns:1fr}
  }

/* ============ 全屏地球布局 ============ */
/* 这一层覆盖旧的"长页面"排版：不再有文档流滚动，一切浮在 3D 舞台之上。 */
html,body{
  height:100%;overflow:hidden;
  /* 手机上拖到顶部时别触发"下拉刷新"（Android Chrome），
     也别让整页有橡皮筋回弹 —— 那是浏览器在跟手势抢。 */
  overscroll-behavior:none;
}
body{
  margin:0;padding:0;
  background:#02040a;
}

#globe-stage{
  /* 全屏。顶栏是浮层、不吃布局，地球可以顶到屏幕最上边 ——
     之前留了 62px 给顶栏，等于在画面上方盖了一条遮罩，球一大就被切。
     品牌字压在上面也没关系，加一点投影就够读。 */
  position:fixed;inset:0;z-index:0;
  transform-origin:50% 50%;
  will-change:transform;
  transition:transform 1.05s cubic-bezier(.22,.61,.36,1),opacity .42s ease;
  /* 手机上必须写这句。没有它，手指在球上滑动会被浏览器当成"滚动页面/缩放页面"，
     pointermove 中途还会收到一个 pointercancel —— 表现就是"拖两下就断"。
     有了它，触摸事件全归我们处理，页面不会跟着滚、也不会跟着捏。
     注意：面板 #detail 不在这里，它自己的滚动不受影响。 */
  touch-action:none;
  /* iOS 长按国名会弹"拷贝/查询"菜单，压着球拖到一半弹出来很出戏 */
  -webkit-touch-callout:none;
}
#globe-stage canvas{
  display:block;width:100%;height:100%;cursor:grab;
  /* WebGL 首帧合成偶尔会白一帧。canvas 自己淡进来，这点白就被吃掉了。 */
  opacity:0;transition:opacity .9s ease;
}
#globe-stage canvas.ready{opacity:1}

/* 档案面板打开时，地球整体左移并缩小 —— 比改相机更稳，
   不会触发 canvas 反复 resize，也不会有一次性的抖动。 */
body.panel-open #globe-stage{
  /* 只平移，不缩放。缩放在视觉上会同时"变小 + 被裁"，
     而用户接受面板压住一点地球，所以让球保持原尺寸左移即可。 */
  transform:translateX(-14%);
}

/* --- 顶部栏 --- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  pointer-events:none;              /* 只有子元素可点，不挡地球拖拽 */
}
#topbar > *{pointer-events:auto}

.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand-logo{
  width:28px;height:28px;flex:0 0 auto;display:block;
  /* 地球是白点阵，压在深空背景上不加滤镜也够亮；这里只补一点极淡的外发光，
     让它和右侧文字在视觉重量上配平。 */
  filter:drop-shadow(0 0 6px rgba(150,190,240,.22));
}
.brand-cn{
  font-family:var(--serif,"Songti SC",serif);
  font-size:26px;letter-spacing:.18em;color:var(--ink);
  /* 品牌字压在球上也读得清：投影而不是底衬，不遮挡画面 */
  text-shadow:0 2px 10px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6);
}
.brand-en{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* ============ 搜索：默认就是一只短输入框，点一下展开 ============
   之前做成"圆钮 → 点开才变输入框"，看着不像搜索，倒像工具菜单。
   现在常驻一个短框（150px），聚焦或点击时展开到 360px。
   宽度过渡直接放在 .search-wrap 上：topbar 里它后面已经没有别的元素了，
   不会把谁挤得跳来跳去。
   金色只留给地球上的国界，控件一律冷色。 */
.search-wrap{
  position:relative;height:44px;flex:0 0 auto;
  width:168px;
  z-index:6;
  transition:width .46s cubic-bezier(.2,.9,.25,1);
}
.search-wrap.open{width:min(384px, 46vw)}

.search-panel{
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;
  height:44px;
  /* 22px = 半高，收起时就是一枚完整的胶囊（原来 999px 的等价写法）。
     之前跟着卡片一起改成 10px，44px 高的短框上 10px 只圆了个角，
     看着还是块方板子 —— 圆角要圆到接近半高，短框才显得是"胶囊"。 */
  border-radius:22px;overflow:hidden;
  /* 温润，但必须留在站点的冷色系里：
     上一版改用灰褐（暖）确实不刺眼了，可整站是"深空蓝 + 冷青高亮 + 金色国界"，
     一块暖灰胶囊贴上去像外来的控件。真正要改的是**对比**，不是色相。
     所以：底仍是深海军蓝（比 --bg-2 提一档），描边用同一族的 rgba(126,158,198)
     但压到 20%（上一版 34% 才是那道硬线），竖向渐变只差 9 个亮度。 */
  background:linear-gradient(180deg,rgba(9,13,22,.94) 0%,rgba(4,7,12,.96) 100%);
  border:1px solid rgba(126,158,198,.13);
  /* 这里原来有 backdrop-filter:blur(10px)。它会在首次合成时新建一个
     带模糊的图层，Chrome 上表现为刷新瞬间这块区域亮一下（就是"闪白"）。
     框里本来就没有需要虚化的内容，去掉最省事。 */
  cursor:text;
  /* 只有两层外阴影（近距接地 + 远距氛围）和一道极淡的内高光。
     上一版为了"立体"叠了五层，其中两道是纯黑硬环 —— 那就是刺眼的来源。 */
  box-shadow:
    0 1px 2px rgba(0,0,0,.32),
    0 9px 26px rgba(0,0,0,.44),
    0 22px 52px rgba(0,0,0,.18);
  /* 没有任何 inset 亮线：近黑底面上那 1px 的内高光看着就像一道划痕。 */
  /* 圆角用和结果区展开同一条曲线、同样时长（0.24s）：
     之前它自己 0.13s 就把 22px 收到 12px，而结果区是"啪"一下贴上来 ——
     两个变化各走各的节奏，看到的就是"圆角在变方，面板突然砸下来"。 */
  transition:border-color .26s ease,background .26s ease,box-shadow .26s ease,
             border-radius .22s cubic-bezier(.2,.9,.25,1);
}
/* 结果区一展开，输入行就变成卡片的上半截：只留上圆角。
   注意**下方那根线一定要留着**（不能像上一版那样改成 transparent）：
   一旦改透明，搜索框底下那条边就"啪"地消失，眼睛会立刻看到框破了个口；
   结果区的 border-top 本来就是 0，两根线不会叠成双线。 */
.search-wrap.card-open .search-panel{
  border-radius:12px 12px 0 0;
  /* 上半截也换成实色：卡片是一张纸，不能一半实一半透 */
  background:linear-gradient(180deg,#0b1119 0%,#070b12 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.32),
    0 9px 26px rgba(0,0,0,.30),
    0 26px 60px rgba(0,0,0,.22);
}
.search-wrap.open .search-panel{
  background:linear-gradient(180deg,rgba(11,16,26,.95) 0%,rgba(5,9,16,.97) 100%);
}
/* hover 必须有反应：之前只有聚焦才变，鼠标扫过去毫无反馈，像块死板子 */
.search-panel:hover{
  border-color:rgba(150,185,230,.24);
  background:linear-gradient(180deg,rgba(13,19,31,.95) 0%,rgba(6,11,19,.97) 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.34),
    0 10px 28px rgba(0,0,0,.46),
    0 24px 56px rgba(0,0,0,.20);
}
.search-panel:hover .search-icon{stroke:rgba(196,222,252,.88)}
.search-panel:focus-within{
  border-color:rgba(160,196,240,.30);
  box-shadow:
    0 0 0 2px rgba(120,165,235,.07),
    0 1px 2px rgba(0,0,0,.36),
    0 12px 32px rgba(0,0,0,.48),
    0 28px 64px rgba(0,0,0,.22);
}

.search-panel .search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;pointer-events:none;
  fill:none;stroke:rgba(158,190,228,.52);stroke-width:1.8;
  transition:stroke .26s ease;
  stroke-linecap:round;stroke-linejoin:round;
}

#q{
  flex:1 1 auto;min-width:0;height:100%;box-sizing:border-box;
  padding:0 6px 0 42px;
  font-size:14.5px;font-family:inherit;
  color:#dfe9f7;caret-color:#a9cbee;
  background:transparent;border:0;outline:none;
  -webkit-appearance:none;appearance:none;
}
#q::placeholder{color:rgba(180,200,222,.46)}
/* 自动填充会强行给输入框铺白底（深色页面上的大忌）。这行把它压回去。 */
#q:-webkit-autofill,
#q:-webkit-autofill:hover,
#q:-webkit-autofill:focus{
  -webkit-text-fill-color:#dfe9f7;
  -webkit-box-shadow:0 0 0 1000px rgba(20,32,50,.9) inset;
  transition:background-color 99999s ease-in-out 0s;
}
#q::-webkit-search-cancel-button{filter:invert(.42)}

/* 清空按钮：只在有字时出现。原生 ::-webkit-search-cancel-button 只在聚焦时冒出来，
   点它还要先抢一次焦点，用起来是"点两下才删"的感觉，所以自己画一个。 */
.search-clear{
  flex:0 0 auto;width:0;height:20px;margin-right:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;overflow:hidden;
  background:transparent;border:0;opacity:0;pointer-events:none;
  transition:width .18s ease,opacity .18s ease,margin .18s ease;
}
.search-wrap.has-text .search-clear{
  width:20px;margin-right:2px;opacity:.7;pointer-events:auto;
}
.search-clear:hover{opacity:1;background:rgba(150,185,230,.16)}
.search-clear svg{
  width:10px;height:10px;
  fill:none;stroke:rgba(190,214,244,.95);
  stroke-width:2.2;stroke-linecap:round;
}
/* 原生那个去掉，免得两个叉并排 */
#q::-webkit-search-cancel-button,
#q::-webkit-search-decoration{-webkit-appearance:none;display:none}

/* 下拉按钮已移除：点搜索框直接列出全部国家。 */

/* 结果区 = 卡片的下半截。紧贴输入行（top:100%，不再留缝），
   只保留下半圆角，上沿靠一道 1px 内线当分隔 —— 拼起来是同一张卡片。
   内部拆成"可滚动的列表 + 钉在底部的说明行"：Google 那块面板底下
   永远挂着一条"更多近期搜索记录"，而不是要滚到第 235 行才看见。 */
#q-res{
  position:absolute;top:100%;left:0;
  width:100%;box-sizing:border-box;
  max-height:52vh;
  display:flex;flex-direction:column;
  border-radius:0 0 12px 12px;
  border:1px solid rgba(126,158,198,.13);
  /* 上边不画：搜索行的底边框（同一颜色、同一淡度）就是这张卡片的分隔线。
     之前这里的做法是把搜索行底边框改透明、再给结果区加一道 inset 内阴影 ——
     结果那条线在开合瞬间亮度会跳一下，看起来像"框底下的白线突然没了"。 */
  border-top:0;
  /* 实色，不能留 alpha：97% 不透明时，地球上那几条金色经纬线和地名标签
     仍然会隐隐透出来（它们对比度太高），读列表像隔着一层毛玻璃。
     卡片本来就是"盖在地球上的纸"，不透明反而更像 Google 那块面板。 */
  background:#070b12;
  box-shadow:
    0 22px 52px rgba(0,0,0,.5),
    0 8px 20px rgba(0,0,0,.34);
}
.sr-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
/* 结果区出现时淡入，时长和缓动跟搜索行的圆角收缩完全一致（0.22s）——
   两件事同时开始、同时结束，看上去就是"胶囊被压成了卡片的上半截"，
   而不是圆角自己在变、面板"啪"地砸下来。
   这里用 animation 不用 transition：结果区是同一帧内先 innerHTML='' 重建、
   再把 hidden 摘掉的，Chrome 在这种"内容与可见性同帧变化"下不给 opacity 插值
   （rAF 采样实测：0→1 是在 220ms 后直接跳过去的）。animation 由 display 切换
   触发重放，没这个问题。收起方向仍是瞬消 —— 收起时视线已经离开，够用。
   不加位移：translateY 会让首行在最初几十毫秒钻到搜索行底下被压掉一截。 */
#q-res{animation:cardDrop .22s cubic-bezier(.2,.9,.25,1) both}
@keyframes cardDrop{
  from{opacity:0}
  to{opacity:1}
}
#q-res[hidden]{display:none}
/* 滚动条：默认那条灰白长条在深色卡片上很扎眼 */
.sr-list::-webkit-scrollbar{width:8px}
.sr-list::-webkit-scrollbar-thumb{background:rgba(120,150,190,.22);border-radius:4px}
.sr-list::-webkit-scrollbar-thumb:hover{background:rgba(120,150,190,.36)}
.sr-list::-webkit-scrollbar-track{background:transparent}

/* --- 底部国家导航 --- */
#dock{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  z-index:30;pointer-events:none;
}
#dock #cards{
  display:flex;gap:10px;pointer-events:auto;
}
.dock-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 16px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--ink-dim);
  background:rgba(10,16,28,.72);
  border:1px solid rgba(120,150,190,.26);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .22s ease;
}
.dock-item:hover{
  border-color:rgba(148,182,224,.55);color:var(--ink);
  transform:translateY(-2px);
}
.dock-item.active{
  border-color:rgba(148,182,224,.85);
  background:rgba(148,182,224,.14);
  color:#f2d9a4;
}
.di-iso{
  font-size:9.5px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dock-item.active .di-iso{color:rgba(242,217,164,.75)}

/* --- 右侧档案面板 --- */
/* 档案面板：一张浮起来的卡片，四边留白、圆角、带偏移的柔和阴影。
   之前是贴边的侧栏，像浏览器自带的抽屉；浮卡才有"弹出来"的感觉。 */
#detail{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",
              "Segoe UI",system-ui,sans-serif;
  position:fixed;top:16px;right:16px;bottom:16px;z-index:40;
  width:min(500px, calc(100vw - 32px));
  display:flex;flex-direction:column;
  /* 三段色 #303d67 → #79799a → #fddfdc 从左到右。
     直接铺满会有一个绕不开的矛盾：右端 #fddfdc 太亮，白字读不出；
     左端太暗，黑字也读不出 —— 而正文只有一种颜色。
     所以改成"深底 + 三段色的半透明罩染"：色相和走向都保留，
     但整条都被压到同一明度区间（右端合成后约 rgb(107,94,92)，
     白字对比度 5.6:1），文字终于能读了。
     边框用同组色全强度渐变（双背景 padding-box/border-box，
     border-image 会破坏圆角）。 */
  background:
    linear-gradient(100deg,
      rgba(48,61,103,.80) 0%,
      rgba(84,88,122,.66) 38%,
      rgba(121,121,154,.56) 66%,
      rgba(253,223,220,.40) 100%) padding-box,
    linear-gradient(180deg,#0b0f19 0%,#080b12 100%) padding-box,
    linear-gradient(100deg,#303d67 0%,#79799a 56%,#fddfdc 100%) border-box;
  border:1px solid transparent;
  border-radius:20px;
  box-shadow:0 28px 70px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.42);
  transform:translateX(calc(100% + 28px));
  /* visibility 不能过渡，但它会**立刻**生效 —— 移除 .open 的瞬间面板就被藏了，
     滑出动画根本没机会跑，看起来就是"啪"地消失。
     把 visibility 的切换延迟到 0.56 秒（正好是滑完的时间），动画才看得见。 */
  transition:transform .56s cubic-bezier(.22,.61,.36,1),
             visibility 0s linear .56s;
  visibility:hidden;
  overflow:hidden;                 /* 圆角要裁掉内部滚动区的直角 */
}
#detail.open{
  transform:none;visibility:visible;
  transition:transform .56s cubic-bezier(.22,.61,.36,1),visibility 0s;
}
#detail[hidden]{display:none}

.dhead{
  padding:22px 26px 16px;border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.dhead h2{
  /* 面板一律走无衬线粗体：中文用黑体（苹方/微软雅黑/思源黑），
     西文用同族无衬线粗体。之前用宋体，压在这个深色面板上显得又细又飘。 */
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",
              "Segoe UI",system-ui,sans-serif;
  font-size:26px;font-weight:700;letter-spacing:.02em;color:#fff;
}
#d-sub{
  margin-top:6px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dscroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding:18px 24px 28px;
}
/* 内部任何元素都不许撑破面板产生横向滚动条 */
#detail *{max-width:100%}
/* 只在正文流里限制媒体宽度。这里必须排除 .dimg / .ts-item：
   一条 `#detail img{height:auto}` 的优先级高于 `.dimg-wrap .dimg{height:100%}`，
   会把主图的高度改成图片自身比例，于是 4:3 的框只露出竖图顶部一截 ——
   埃菲尔铁塔那张（760×1406）看起来就是"被拉平、看不到全貌"。 */
#detail .prose img,#detail .prose video,
#detail .dimg-wrap .dimg,#detail .thumbstrip .ts-item{max-width:100%}
#detail video,#detail canvas{max-width:100%;height:auto}
#detail .dwrap,#detail .dblock,#detail .meta,#detail .facets{min-width:0}
#detail pre,#detail code{white-space:pre-wrap;word-break:break-word}
.dclose{
  position:absolute;top:15px;right:15px;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;line-height:1;cursor:pointer;
  color:var(--ink-dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-family:inherit;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.dclose:hover{color:var(--ink);border-color:rgba(148,182,224,.5);background:rgba(148,182,224,.10)}

/* 面板里空间窄，详情原本的两列网格改为单列。
   列宽必须是 minmax(0,1fr) 而不是 1fr —— `1fr` 的最小值是 auto，
   会被内容（.dimg-wrap 的 aspect-ratio × 固定高度 = 489px）撑开，
   于是整栏比面板还宽，正文右侧被切掉一截。 */
#detail .dwrap{grid-template-columns:minmax(0,1fr);gap:16px}
#detail .dimg-wrap{aspect-ratio:16/10}
/* 竖图在面板里单独给一个更高的框（这条必须带 #detail，否则被上面那条盖掉） */
#detail .dimg-wrap.fit{aspect-ratio:4/5}

/* --- 左下角提示 --- */
#footline{
  position:fixed;left:26px;bottom:30px;z-index:20;
  display:flex;flex-direction:column;gap:4px;
  font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint);
  pointer-events:none;
  opacity:.8;
}
.fl-src{font-size:9.5px;opacity:.7}

/* ============ 浏览器表面 ============
   这些部件不是画出来的，但一样带设计：选区颜色、滚动条、焦点环。
   它们是最便宜的"这页是被建造的"信号，也是最常被漏掉的一层。 */
::selection{
  /* 原来是无彩的淡蓝底 + 米白字，在近黑的搜索框里读起来就是"一块白斑"。
     换成和国界金线同源的暖金，文字保持原来的冷白，不跳。 */
  background:rgba(198,160,88,.32);
  color:#f2f7ff;
}
::-moz-selection{background:rgba(198,160,88,.32);color:#f2f7ff}

.dscroll::-webkit-scrollbar,
#q-res::-webkit-scrollbar{width:10px}
.dscroll::-webkit-scrollbar-track,
#q-res::-webkit-scrollbar-track{background:transparent}
.dscroll::-webkit-scrollbar-thumb,
#q-res::-webkit-scrollbar-thumb{
  background:rgba(140,168,208,.24);
  border:3px solid transparent;
  background-clip:padding-box;
  border-radius:10px;
}
.dscroll::-webkit-scrollbar-thumb:hover,
#q-res::-webkit-scrollbar-thumb:hover{
  background:rgba(148,182,224,.42);
  background-clip:padding-box;
}
.dscroll{scrollbar-width:thin;scrollbar-color:rgba(140,168,208,.28) transparent}

:focus-visible{
  outline:2px solid rgba(148,182,224,.78);
  outline-offset:3px;
  border-radius:6px;
}
#q:focus-visible{outline-offset:0;border-radius:999px}

/* ============ 正文段落 ============
   中文长段落首行缩进两字，段间留白；不缩进会连成一片很难读。 */
.prose p{
  margin:0 0 .82em;
  text-indent:2em;
  line-height:1.95;
  color:var(--ink-dim);
  font-size:14.5px;
  letter-spacing:.01em;
}
.prose p:last-child{margin-bottom:0}
.prose{padding:0}

/* 面板里的标题层级。
   这里曾经是 11.5px —— 比正文 14.5px 还小，属于排版错误而不是风格选择：
   标题必须比正文大、比正文粗。而且早先那条 `.dtext p.sub-label` 的选择器
   要求 p 标签，实际元素是 div，所以从来没生效过，改了三轮都没改对。
   现在只有这一处定义，17.5px / 700。 */
.sub-label{
  font-size:17px;font-weight:700;letter-spacing:.02em;
  line-height:1.4;color:#eef4ff;
  margin:26px 0 12px;
}
/* 只在"文本流的第一块"才清零上边距。
   之前这条是通用的 :first-child，而「文化特征」正好是 .facets 的第一个子元素，
   于是它的 26px 上边距被吃掉了，标题直接贴在「历史与民俗」正文下面。 */
#d-body > .sub-label:first-child{margin-top:0}
.facets > .sub-label:first-child{margin-top:22px}

/* ============ 球面地名标注 ============
   像地图那样：纯文字、无胶囊底、带投影保证在浅色地表上也读得清。
   每帧由 JS 投影定位，转到背面淡出，互相重叠的按重要度让位。
   尺寸分三级：大洲最轻、大洋斜体、国家名最实。 */
#labels{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;
  /* 让整个地名层自成一个合成层。
     没有这一行的时候，飞行中每帧有几十个 .mlabel 改 transform，浏览器要逐个
     把它们的变化提交到合成树、再逐层重传纹理 —— 实测"点击国家镜头一顿一顿"
     就是它：同一段飞行，去掉这行 12 次掉帧，加上这行 2 次（满帧 60）。
     它只影响合成方式，不改布局与绘制，标签的避让、裁剪、点击都照旧。 */
  will-change:transform;
}
/* ---------- 地形标签（气候 / 地形图层专用） ----------
   和国名共用同一套投影 + 避让，只换数据源和样式。
   图层打开时国名整层藏起来（visibility，不是 display —— 还要靠它量宽高）。 */
#tlabels{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;
  visibility:hidden;will-change:transform;
}
.tlabel{
  position:absolute;left:0;top:0;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  white-space:nowrap;opacity:0;
  font-size:11.5px;letter-spacing:.03em;
  color:rgba(236,244,255,.9);
  -webkit-text-stroke:.4px rgba(0,0,0,.55);
  paint-order:stroke fill;
  text-shadow:0 0 1px rgba(0,0,0,.88),0 0 4px rgba(0,0,0,.58),0 1px 2px rgba(0,0,0,.45);
  transition:none;
}
.tlabel.k-mtn{color:rgba(246,238,222,.94);font-weight:600}
.tlabel.k-peak{color:#fff3d6;font-weight:600;letter-spacing:.06em}
.tlabel.k-plateau{color:rgba(238,224,196,.9)}
.tlabel.k-basin{color:rgba(214,232,206,.86)}
.tlabel.k-plain{color:rgba(206,232,204,.86)}
.tlabel.k-desert{color:rgba(240,212,158,.9)}
.tlabel.k-river{color:rgba(150,208,255,.92);font-style:italic}
/* 地形名可以点：点开画出这块地貌的边界。悬停给一点青色的呼应，
   选中后整条变青 —— 和球上那条青线对得上。 */
.tlabel.tap{cursor:pointer;pointer-events:auto}
.tlabel.tap:hover{color:#d6f6ff}
.tlabel.picked{
  color:#a9eeff;font-weight:600;
  text-shadow:0 0 2px rgba(0,0,0,.9),0 0 9px rgba(110,220,255,.75),0 1px 3px rgba(0,0,0,.6);
}
.mlabel{
  position:absolute;left:0;top:0;
  /* 拖地球的时候鼠标会从地名上划过去。地名是 DOM 文本，浏览器默认会当成
     文本选择来处理：划一下就整片反白，松手还变成可复制的选区，
     连"双击重置"都被打断。地图上的文字不该是可选中文本。 */
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  white-space:nowrap;opacity:0;
  font-size:13px;letter-spacing:.04em;
  color:#fff;
  /* 白字压白雪（亚洲正好落在西伯利亚雪原上）的解法：
     用"深色描边 + 浅色填充"，先描边后填充（paint-order），白底黑底都分得开。
     注意描边宽度是**相对字号**的：13px 的中文笔画只有 1px 出头，
     描边一旦到 0.8px 就会从里外两侧把笔画吃光，字变成一块灰饼 ——
     所以字号提到 14px，描边压到 0.5px。 */
  /* 0.5px 的硬描边在雪原上还是太细：西伯利亚、格陵兰那一带白底白字，
     描边一淡就糊成一片。改用"细描边 + 三层渐隐暗晕" —— 硬描边负责紧贴笔画
     的那一圈，暗晕负责向外扩出 3px 的过渡，白底和深色海面都能压住。
     别再加大描边：14px 的中文笔画只有 1px 出头，描边一粗就从里外把字吃成灰饼。 */
  -webkit-text-stroke:.45px rgba(0,0,0,.62);
  paint-order:stroke fill;
  text-shadow:0 0 1px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.62),0 0 6px rgba(0,0,0,.38),0 1px 2px rgba(0,0,0,.5);
  /* 这里原来有 transition:opacity .26s。它和"每帧按距离写透明度"打架：
     快速缩放时 300 多个标签各自延迟 0.26 秒才收掉，屏幕上就是一层残影。
     现在每帧直接给值，隐藏即刻生效。 */
  transition:none;
  cursor:pointer;          /* 只有 pointer-events:auto 的（有 iso 的）才会显示手型 */
}
.mlabel.mc{
  /* 大洲名之前 58% 透明度、字距 0.42em，压在雪山白底上根本看不见。
     现在提亮到 0.84、字距收到 0.3em（拉太开会显得更细更虚）。 */
  font-size:14.5px;letter-spacing:.26em;font-weight:600;
  color:rgba(232,241,254,.92);
}
.mlabel.mo{
  font-size:13px;letter-spacing:.24em;font-style:italic;
  color:rgba(180,212,246,.78);
}
/* 岛 / 湖 / 海峡：只在放得很大时才出现，比国名轻一档，但各自有颜色语义 */
.mlabel.mi{font-size:12.5px;color:rgba(214,232,252,.82)}
.mlabel.ml{font-size:12px;font-style:italic;color:rgba(148,206,238,.82)}
.mlabel.ms{
  font-size:11.5px;letter-spacing:.14em;font-style:italic;
  color:rgba(162,202,240,.76);
}
/* 已收录、可点开档案的国家：比普通国名亮一档，hover 变白 */
.mlabel.mk{
  pointer-events:auto;cursor:pointer;
  font-size:13.5px;font-weight:500;
  color:#ffffff;
  /* 这里原来只有一层"向下的投影"。投影只压字的下方，字的上半部分贴着雪原就没了 ——
     补上环形暗晕，最后那层淡蓝光晕是原本的设计，留着。 */
  text-shadow:0 0 1px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.62),
              0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(120,170,235,.5);
}
.mlabel.mk:hover{color:#cfe6ff}

/* ===== Canvas 标签模式 =====
   DOM 标签只负责三件事：提供文字宽度（避让算矩形用）、接收点击、被命中测试。
   文字本身不再由浏览器渲染，改成统一画到一张 canvas 上 ——
   逐字做 DOM 合成时，文字纹理在亚像素位置被反复插值采样，144Hz 下看起来就是
   地名在闪；改成 canvas 每帧直接光栅化到屏幕，没有这层插值。
   文字隐藏用 color:transparent 而不是 display:none —— 后者会让宽度变 0，
   避让和点击区域一起失效。
   挂在 body.labels-canvas 下而不是直接写死：canvas 拿不到 2d 上下文时
   会自动摘掉这个 class，回退成原来的 DOM 文字，不至于整个地名层消失。

   选择器必须写成 #globe-stage #labels-canvas（两个 id）：原站有一条
   #globe-stage canvas{ opacity:0; ... }（给 three.js 的 WebGL canvas 做淡入用，
   加 .ready 才显形），它用的是**元素选择器**，会把这张标签画布一起匹配 ——
   结果是 canvas 建好了、内容也画了，但 opacity 恒为 0，什么都看不见。
   #globe-stage canvas 的优先级是 (1,0,1)，单写 #labels-canvas 只有 (1,0,0)，
   压不过它；写成 #globe-stage #labels-canvas 是 (2,0,0)，才盖得住。 */
body.labels-canvas .mlabel{color:transparent!important;-webkit-text-stroke:0!important;text-shadow:none!important;}
#globe-stage #labels-canvas{
  position:absolute;left:0;top:0;z-index:10;
  pointer-events:none;
  opacity:1!important;
  transition:none!important;
  width:auto;height:auto;
}

/* ============ 左下角工具条 ============
   原来每个按钮各是一个 42px 的圆环，描边 rgba(126,158,198,.18) 实测对比度只有
   1.22:1 —— 形状几乎靠"背后正好是什么"决定：在星空上剩六个虚浮的圈，在雪原上
   变成六个暗饼。这是"看着不精致"的根源，不是图标画得不好。

   现在是一条竖直的工具条：底色与描边都是实的一层，边界在任何背景上都成立；
   开关之间只有 1px 冷色分隔，动作与开关之间是一段 9px 留白。
   曾经在上下两端和动作/开关之间各画过一条金线，三道横线一起看很扎眼，已全部去掉 ——
   线在球面这种明暗大变的背景上本来就不稳定。现在六颗都是同一类开关，等距、同一条分隔线。
   点亮态同样不发光：左侧 3px 金条 + 图标转金 —— 和全站"细线低饱和"同一路。

   中途试过把它做成 184px 的罗盘（环形六按钮 + 方位标注），已撤回：
   六个标注绕一圈会互相压、还会顶出盘边，整盘占地也比一条 46px 更容易挡球。 */
#tools{
  position:fixed;left:22px;bottom:22px;z-index:25;
}
/* 入口：一颗图标。工具从"一条竖列"改成"抽屉"——8 颗按钮竖排以后越加越长，
   手机上直接吃掉三分之一屏高。 */
#tools-toggle{
  width:46px;height:46px;padding:0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,21,.78);
  border:1px solid rgba(140,170,210,.24);
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);
  color:rgba(202,222,248,.9);cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
  -webkit-tap-highlight-color:transparent;
}
#tools-toggle svg{
  width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .4s cubic-bezier(.2,.8,.3,1);
}
#tools-toggle:hover{background:rgba(20,32,50,.9);color:#f0f7ff}
#tools.open #tools-toggle{color:rgba(255,224,152,.98);border-color:rgba(255,206,112,.42)}

/* 抽屉：五组，每组一行小标题 + 一行图标按钮 */
#tools-body{
  position:absolute;left:0;bottom:calc(100% + 10px);
  /* 两列网格：五组排成三行（定位那组跨两列），面板从 450px 高降到 210px 左右，
     展开时只占左下角一小块，挡不住球。 */
  display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;
  width:222px;padding:11px 11px 10px;border-radius:15px;
  background:rgba(8,13,22,.90);
  border:1px solid rgba(140,175,220,.22);
  box-shadow:0 20px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;transform:translateY(9px) scale(.97);
  transform-origin:0 100%;pointer-events:none;
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.3,1);
}
#tools.open #tools-body{opacity:1;transform:none;pointer-events:auto}

.tg{min-width:0}
.tg:last-child{grid-column:1/-1}
.tg h3{
  margin:0 0 6px;font-size:11px;font-weight:600;
  letter-spacing:.08em;color:rgba(198,218,242,.92);
}
.tg-r{display:flex;gap:6px}
/* 定位组三个按钮跨两列，按正常尺寸排开、居中 */
.tg:last-child .tg-r{justify-content:center}

/* 按钮：竖排图标 + 名字。名字常显 —— 抽屉里空间够，不用再靠 hover 才发现。 */
.tool-btn{
  /* 图标色只在这一处定义，靠变量分状态：
     原来 `.tool-btn.on svg{stroke:金}` 被 `#tools-body .tool-btn svg` 的
     权重压掉，点亮时图标一直是冷蓝的。 */
  --ico:rgba(200,220,246,.86);
  position:relative;
  width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(140,175,220,.14);
  border-radius:10px;
  cursor:pointer;color:var(--ico);
  transition:background .16s ease,border-color .16s ease,color .16s ease;
  -webkit-tap-highlight-color:transparent;
}
.tool-btn svg{
  width:16px;height:16px;
  fill:none;stroke:var(--ico);
  stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .16s ease;
}
.tool-btn:hover{background:rgba(150,185,230,.12);border-color:rgba(150,185,230,.3);--ico:#eef6ff}
.tool-btn:active{background:rgba(150,185,230,.2)}
.tool-btn.on{
  --ico:rgba(255,224,152,.98);
  background:linear-gradient(180deg,rgba(255,205,110,.15),rgba(255,205,110,.04));
  border-color:rgba(255,206,112,.42);
}
.tool-btn.busy{opacity:.55;pointer-events:none}
/* 名字做成 hover 浮出的提示框（和之前一样）：按钮里只放图标，
   面板才不会被一行行小字塞满。 */
/* 提示框：统一浮在按钮正上方，文字写完整（"常驻中国上空"而不是"中国"）。
   会短暂盖住分组标题 —— 那比压住隔壁按钮好接受得多。 */
.tl{
  position:absolute;left:50%;bottom:calc(100% + 6px);
  transform:translate(-50%,4px);
  padding:5px 10px;border-radius:7px;
  font-size:11.5px;line-height:1.25;letter-spacing:.01em;white-space:nowrap;
  color:#eaf3ff;background:rgba(6,10,17,.96);
  border:1px solid rgba(145,175,215,.3);
  box-shadow:0 10px 26px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;z-index:6;
  transition:opacity .13s ease,transform .17s cubic-bezier(.2,.8,.3,1);
}
.tool-btn:hover .tl,.tool-btn:focus-visible .tl{opacity:1;transform:translate(-50%,0)}



/* 时间指示模式：光标换成一面小旗子，热点在旗杆脚下 */
#globe-stage.time-mode{cursor:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0' y1='0' x2='.9' y2='1'%3E%3Cstop offset='0' stop-color='%23ffeec2'/%3E%3Cstop offset='.55' stop-color='%23f6c85c'/%3E%3Cstop offset='1' stop-color='%23cd9a2e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M9 31.4V5' stroke='%23e9c987' stroke-width='1.9' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='4.2' r='1.9' fill='%23ffe9b3'/%3E%3Ccircle cx='8.4' cy='3.7' r='.7' fill='%23fffdf2' opacity='.9'/%3E%3Cpath d='M10.2 5.6c5.4-1.7 8.6 1.5 13.6.1.5 2.9.4 5.8-.3 8.7-5 1.3-8.6-1.5-13.3.2z' fill='url(%23f)' stroke='%23a97a1f' stroke-width='.9'/%3E%3Cpath d='M10.2 5.6c5.4-1.7 8.6 1.5 13.6.1' stroke='%23fff6da' stroke-width='1' fill='none' opacity='.85'/%3E%3Cpath d='M12.6 7.2c-.7 2.2-.9 4.4-.6 6.6M16.4 6.7c-.6 2.3-.7 4.6-.4 6.9' stroke='%23b98a24' stroke-width='.7' fill='none' opacity='.55'/%3E%3C/svg%3E") 9 32, crosshair}
#globe-stage.time-mode canvas{cursor:inherit}
/* 时间模式下国名标签不接事件：点哪儿都是"问时间"，不能顺手打开档案 */
#globe-stage.time-mode .mlabel{pointer-events:none!important}

/* 点击波纹：三圈金色，错开 90ms 扩散出去 */
.ripple{
  position:fixed;z-index:31;pointer-events:none;
  width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  border:1.4px solid rgba(255,216,140,.95);
  box-shadow:0 0 10px rgba(255,196,96,.45);
  opacity:0;animation:rippleOut .72s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes rippleOut{
  0%{opacity:.95;transform:scale(.35)}
  70%{opacity:.35}
  100%{opacity:0;transform:scale(4.2)}
}

/* ===== 时间标记 =====
   在哪儿点，就在那儿"钉"一个标记：一根金色竖线从落点往上，挑住时间气泡。
   旗子模式下可以连点好几处，每个各钉一根、互不影响，也不跟着鼠标动；
   退出旗子模式时一起收掉。 */
#time-pins{position:fixed;inset:0;z-index:32;pointer-events:none}
/* 时间钉的锚点：零尺寸，每帧用 translate3d 挪到"那个地理位置"投影到屏幕的位置。
   用 transform 而不是 left/top —— 拖拽和缩放时每帧都在动，走合成层才不抖。 */
.tpin-anchor{
  position:absolute;left:0;top:0;width:0;height:0;
  will-change:transform,opacity;
  transition:opacity .18s ease;
}
.tpin{
  position:absolute;display:flex;flex-direction:column;align-items:center;
  transform:translate(-50%,-100%);
  opacity:0;animation:tpIn .18s ease forwards;
}
/* 点得太靠屏幕顶：气泡翻到线下面去，线改朝下 */
.tpin.below{transform:translate(-50%,0);flex-direction:column-reverse}
.tpin.out{opacity:0!important;transition:opacity .16s ease}
@keyframes tpIn{to{opacity:1}}
.tp-stem{
  width:2px;height:32px;border-radius:1px;
  background:linear-gradient(to top,rgba(255,216,140,.95),rgba(255,216,140,.28));
  box-shadow:0 0 7px rgba(255,196,96,.45);
}
.tpin.below .tp-stem{
  background:linear-gradient(to bottom,rgba(255,216,140,.95),rgba(255,216,140,.28));
}
.tp-bubble{
  position:relative;
  padding:7px 12px 8px;border-radius:10px;margin-bottom:0;   /* 无缝：竖线直接顶到气泡底边 */
  background:rgba(10,16,26,.94);
  border:1px solid rgba(255,215,138,.45);
  box-shadow:0 12px 30px rgba(0,0,0,.55);
  color:#f4e7cd;font-size:12.5px;line-height:1.5;white-space:nowrap;
  /* 点一下就关：不再单独做那颗 × */
  pointer-events:auto;cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.tp-bubble:hover{border-color:rgba(255,228,168,.8)}
/* 气候 / 高度定位的气泡：只换颜色，尺寸、动效、音效和时间定位完全一样 */
.tpin.k-clim .tp-bubble{
  background:rgba(8,16,28,.95);
  border-color:rgba(150,215,255,.5);
  box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 1px rgba(120,200,255,.08);
  color:#dcecfb;
}
.tpin.k-clim .tp-bubble:hover{border-color:rgba(185,232,255,.85);background:rgba(12,24,40,.96)}
.tpin.k-clim .tp-bubble b{color:#a8e2ff}
.tpin.k-clim .tp-bubble i{color:rgba(168,198,224,.72)}
.tpin.k-clim .tp-stem{
  background:linear-gradient(to top,rgba(160,225,255,.95),rgba(160,225,255,.26));
  box-shadow:0 0 7px rgba(110,200,255,.45);
}
.tpin.k-clim.below .tp-stem{
  background:linear-gradient(to bottom,rgba(160,225,255,.95),rgba(160,225,255,.26));
}
.tpin.k-clim::after{background:#c4ecff;box-shadow:0 0 10px rgba(120,210,255,.9),0 0 0 2px rgba(120,210,255,.16)}
.tpin.below .tp-bubble{margin-bottom:0;margin-top:0}

.tp-bubble b{color:#ffdb8a;font-weight:600;font-variant-numeric:tabular-nums}
.tp-bubble i{display:block;font-style:normal;font-size:11px;color:rgba(214,206,186,.72);
  letter-spacing:.04em;margin-top:2px;font-variant-numeric:tabular-nums}
/* 落点上的一点亮：竖线就扎在这儿 */
.tpin::after{
  content:"";position:absolute;left:50%;bottom:-3.5px;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:#ffdf9e;
  box-shadow:0 0 10px rgba(255,196,96,.9),0 0 0 2px rgba(255,196,96,.16);
}
.tpin.below::after{bottom:auto;top:-3.5px}

/* ============ 2D 平面地图 ============
   横向循环平铺的世界地图：画布本身是 3 份等距圆柱首尾相接，
   默认把 -100°（美洲）放在屏幕正中，于是左右两侧都是亚洲 —— 不会像
   单张 2:1 那样在 16:9 屏幕上被上下留黑、看起来"压扁"。
   画布尺寸固定，平移和缩放只改 CSS transform，不重绘。 */
#map2d{
  position:fixed;inset:0;z-index:6;background:#05070c;
  opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity .42s ease;cursor:grab;
}
#map2d.on{opacity:1;pointer-events:auto}
.map2d-loading{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:rgba(200,220,242,.72);font-size:13px;letter-spacing:.08em;
  padding:10px 18px;border-radius:20px;
  background:rgba(8,14,24,.72);border:1px solid rgba(126,158,198,.22);
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.map2d-loading.on{opacity:1}
#map2d.dragging{cursor:grabbing}
.map2d-canvas{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  image-rendering:auto;
}

/* 白底线稿：画布自己铺米白底，卫星图不画 */
#map2d.paper{background:#efe9dd}

/* 进了 2D，左下那排工具（中国 / 国境线 / 经纬线 / 昼夜）全是 3D 概念，
   留着只会点出错觉。整排淡出。 */
#tools{transition:opacity .3s ease}
#map2d.on ~ #tools{opacity:0;pointer-events:none}

/* 点选查询模式的光标：金色准星，和时间指示的旗子同一套视觉语言。
   中间的 18 18 是热区，正好落在十字交点上。 */
#globe-stage.probe-mode{cursor:url("data:image/svg+xml;charset=utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='36'%20height='36'%20viewBox='0%200%2036%2036'%3E%3Cdefs%3E%3ClinearGradient%20id='f'%20x1='0'%20y1='0'%20x2='.9'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='#d8f0ff'/%3E%3Cstop%20offset='.55'%20stop-color='#7cc4ee'/%3E%3Cstop%20offset='1'%20stop-color='#3f86b4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M9%2031.4V5'%20stroke='#9fd4f0'%20stroke-width='1.9'%20stroke-linecap='round'/%3E%3Ccircle%20cx='9'%20cy='4.2'%20r='1.9'%20fill='#e6f7ff'/%3E%3Ccircle%20cx='8.4'%20cy='3.7'%20r='.7'%20fill='#ffffff'%20opacity='.9'/%3E%3Cpath%20d='M10.2%205.6c5.4-1.7%208.6%201.5%2013.6.1.5%202.9.4%205.8-.3%208.7-5%201.3-8.6-1.5-13.3.2z'%20fill='url%28#f%29'%20stroke='#2f6f96'%20stroke-width='.9'/%3E%3Cpath%20d='M10.2%205.6c5.4-1.7%208.6%201.5%2013.6.1'%20stroke='#eaf8ff'%20stroke-width='1'%20fill='none'%20opacity='.85'/%3E%3Cpath%20d='M12.6%207.2c-.7%202.2-.9%204.4-.6%206.6M16.4%206.7c-.6%202.3-.7%204.6-.4%206.9'%20stroke='#6fb2d6'%20stroke-width='.7'%20fill='none'%20opacity='.55'/%3E%3C/svg%3E") 9 32, crosshair}

/* ---------- 专题图层图例（右下角） ----------
   和左下角工具栏一左一右，只在开了气候/地形时出现。
   半透明玻璃底，压在地球上但不抢画面。 */
#layer-legend{
  position:fixed;right:18px;bottom:34px;z-index:36;
  width:268px;padding:12px 14px 11px;border-radius:13px;
  background:rgba(7,15,27,.86);
  border:1px solid rgba(150,185,230,.26);
  box-shadow:0 14px 34px rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  color:rgba(226,240,255,.94);font-size:12px;line-height:1.5;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .28s ease,transform .28s ease;
}
#layer-legend.on{opacity:1;transform:none;pointer-events:auto}
#layer-legend .lg-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
#layer-legend .lg-title{
  font-size:13.5px;font-weight:600;letter-spacing:.04em;color:#f2f8ff;
}
#layer-legend .lg-close{
  margin-left:auto;width:20px;height:20px;padding:0;border:0;border-radius:50%;
  background:transparent;color:rgba(180,208,236,.7);cursor:pointer;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;
}
#layer-legend .lg-close:hover{background:rgba(150,190,235,.16);color:#fff}
/* 一行 = 组名 + 该组所有色块（每个色块后面直接跟名字，扫一眼就能对上） */
#layer-legend .lg-line{display:flex;align-items:flex-start;gap:8px;margin:5px 0}
#layer-legend .lg-key{
  flex:0 0 40px;padding-top:1px;text-align:right;
  color:rgba(196,220,246,.8);font-size:11.5px;letter-spacing:.02em;
}
#layer-legend .lg-grid{flex:1;display:flex;flex-wrap:wrap;gap:3px 9px}
#layer-legend .lg-item{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;color:rgba(232,244,255,.92);white-space:nowrap;
}
#layer-legend .lg-item i{
  display:block;width:12px;height:12px;border-radius:2.5px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.06);
}
#layer-legend .lg-band{
  height:12px;margin:5px 0 6px;border-radius:3px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);
}
#layer-legend .lg-ticks{
  display:flex;justify-content:space-between;
  color:rgba(190,214,240,.78);font-size:10.5px;letter-spacing:.02em;
}
#layer-legend .lg-src{
  margin-top:9px;padding-top:8px;border-top:1px solid rgba(150,185,230,.16);
  color:rgba(164,192,220,.62);font-size:10px;line-height:1.5;
}
@media (max-width:760px){
  #layer-legend{right:10px;bottom:24px;width:232px;padding:10px 11px 9px;font-size:11.5px}
  #layer-legend .lg-key{flex-basis:34px;font-size:11px}
  #layer-legend .lg-item{font-size:11px}
  #layer-legend .lg-item i{width:11px;height:11px}
}

/* 点选气泡里的色块：跟图例同款，直接把"这一点的颜色"和名字对上 */
.tp-sw{
  display:inline-block;width:11px;height:11px;border-radius:2.5px;
  margin-left:5px;vertical-align:-1px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);
}

/* 浅底上的顶栏文字要转深色，否则品牌名是一块白字浮在米白上 */
#map2d.paper ~ #topbar .brand-cn{color:#26313f;text-shadow:0 1px 0 rgba(255,255,255,.6)}
/* 白点阵在米白底上直接消失。试过 invert(1) 反相成黑点 —— 不行：
   原图 128px、真正的点只有 1573 个像素，缩到 26px 后每个点都落在
   抗锯齿的半透明边缘上，反相完是一坨灰雾。
   改成给圆点阵垫一个深色圆底，白点保持原样，读起来像一枚图章。 */
#map2d.paper ~ #topbar .brand-logo{
  filter:none;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#2b3746 0 46%,rgba(43,55,70,0) 47%);
}
#map2d.paper ~ #topbar #search-panel{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,240,232,.95));
  border-color:rgba(60,78,100,.22);
  box-shadow:0 1px 2px rgba(40,50,70,.10),0 8px 22px rgba(40,50,70,.10);
}
#map2d.paper ~ #topbar #q{color:#1f2b3a}
#map2d.paper ~ #topbar #q::placeholder{color:rgba(60,78,100,.42)}
#map2d.paper ~ #topbar .search-icon{stroke:rgba(60,78,100,.6)}

/* 视图切换按钮：左侧垂直居中，比左下角的工具按钮大一号、圆角方形，
   和那排圆形开关刻意不同，因为它不是"图层开关"而是"换一种看法"。 */
.view-btn{
  position:fixed;left:20px;top:50%;z-index:26;
  width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:13px;cursor:pointer;
  background:linear-gradient(160deg,rgba(16,25,40,.94),rgba(6,10,18,.96));
  border:1px solid rgba(126,158,198,.30);
  box-shadow:0 6px 22px rgba(0,0,0,.45);
  transform:translateY(-50%);
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}
.view-btn svg{
  width:19px;height:19px;fill:none;stroke:rgba(178,206,238,.82);
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .2s ease;
}
.view-btn:hover{
  border-color:rgba(170,204,244,.62);
  background:linear-gradient(160deg,rgba(26,40,62,.96),rgba(10,16,28,.97));
}
.view-btn:hover svg{stroke:rgba(222,238,255,.98)}
.view-btn.on{border-color:rgba(214,178,110,.72);background:linear-gradient(160deg,rgba(44,38,24,.95),rgba(16,14,10,.97))}
.view-btn.on svg{stroke:rgba(244,214,150,.98)}
/* 白底线稿按钮：排在视图按钮下面一档，只在 2D 状态出现 */
.view-btn.paper{top:calc(50% + 54px);width:38px;height:38px;border-radius:11px}
.view-btn.paper svg{width:16px;height:16px}

/* ============ 正文里的关键词高亮 ============
   用下划线式的高亮条而不是背景块：一整段里出现十几次背景块会像荧光笔乱涂。 */
/* 概念关键词与数字/年代共用一套"细下划线"样式，只靠颜色区分。
   之前关键词是渐变粗条（视觉上像荧光笔），数字是 1px 下划线，
   两种样式混在一段里很乱。 */
.kw{
  color:#9fdcf2;font-weight:700;
  border-bottom:1px solid rgba(130,205,235,.55);
}
.kn{
  color:#ffd9a8;font-weight:700;
  font-variant-numeric:tabular-nums;
  border-bottom:1px solid rgba(255,196,140,.55);
}
/* 高亮词左右要留气口：inline 元素的 padding 不占位，会直接盖到相邻汉字上，
   所以间距必须用 margin（inline 的水平 margin 是参与排版的）。 */
.kw,.kn{margin:0 2px}
/* 从搜索结果定位过来的段落，闪一下让人看到落点 */
.hit-flash{
  animation:hitFlash 1.6s ease-out 1;
  border-radius:6px;
}
@keyframes hitFlash{
  0%{background:rgba(150,200,235,.26);box-shadow:0 0 0 6px rgba(150,200,235,.22)}
  100%{background:transparent;box-shadow:0 0 0 6px transparent}
}

/* ============ 自绘提示气泡 ============
   原生 title 要悬停一秒才出、样式不可控、移动端还没有。 */
.tip{
  position:fixed;z-index:60;left:0;top:0;
  max-width:260px;padding:6px 10px;border-radius:8px;
  font-size:12px;line-height:1.55;color:#e8f0fb;
  background:rgba(10,16,26,.96);
  border:1px solid rgba(120,160,210,.32);
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  pointer-events:none;opacity:0;
  transform:translate(-50%,0) scale(.96);
  transform-origin:50% 0;
  transition:opacity .14s ease,transform .14s ease;
}
.tip.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* 右侧对齐：横向从右边缘长出来，纵向垂直居中 */
.tip.side-right{transform:translate(0,-50%) scale(.96);transform-origin:0 50%}
.tip.side-right.on{transform:translate(0,-50%) scale(1)}

/* ============ 提示（加载完成后短暂出现） ============ */
.toast{
  position:fixed;left:50%;bottom:58px;z-index:28;
  transform:translateX(-50%);
  padding:8px 18px;border-radius:999px;
  font-size:11.5px;letter-spacing:.08em;color:rgba(206,224,246,.9);
  background:rgba(10,17,29,.78);
  border:1px solid rgba(126,158,198,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:1;transition:opacity .9s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.out{opacity:0}

/* ============ 语言音频：自绘控件 ============
   浏览器原生 <audio controls> 是一整块浅色系统控件，在深色面板里非常扎眼。 */
.aud{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
.aud-btn{
  width:28px;height:28px;flex:0 0 auto;padding:0;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(126,158,198,.3);
  transition:border-color .2s ease,background .2s ease;
}
.aud-btn svg{width:10px;height:10px;fill:rgba(178,203,232,.9)}
.aud-btn:hover{border-color:rgba(150,185,230,.6);background:rgba(150,185,230,.12)}
/* 播放中只提亮，不用金色 —— 金色是地球国界的专属 */
.aud.playing .aud-btn{border-color:rgba(178,208,244,.8);background:rgba(150,185,230,.16)}
.aud.playing .aud-btn svg{fill:#e8f2ff}

/* 进度条给足高度：之前只有 3px，在深色面板里几乎看不见，
   看起来就像"只剩按钮和计时器"。 */
.aud-bar{
  flex:1 1 auto;min-width:56px;height:18px;
  display:flex;align-items:center;position:relative;cursor:pointer;
}
.aud-track{
  position:relative;width:100%;height:4px;border-radius:3px;
  background:rgba(160,190,225,.22);
  transition:height .16s ease;
}
.aud-bar:hover .aud-track{height:6px}
.aud-fill{
  position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;
  background:rgba(190,216,248,.85);
  transition:none;   /* 由 rAF 每帧写，交给 transition 反而会卡成 4Hz */
}
.aud.playing .aud-fill{background:rgba(214,232,255,.95)}
.aud-fill::after{
  content:"";position:absolute;right:-4px;top:50%;
  width:8px;height:8px;border-radius:50%;
  transform:translateY(-50%) scale(.001);
  background:#eaf3ff;
  transition:transform .16s ease;
}
.aud-bar:hover .aud-fill::after,
.aud.playing .aud-fill::after{transform:translateY(-50%) scale(1)}
.aud-time{
  flex:0 0 auto;min-width:62px;text-align:right;
  font-size:10.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}

/* --- 移动端 --- */
@media (max-width:760px){
  #topbar{padding:12px 14px;gap:10px;flex-wrap:nowrap}
  .brand-en{display:none}
  .brand-cn{font-size:17px}
  .topbar-meta{display:none}
  .search-wrap{width:128px;height:42px;flex:0 0 auto}
  .search-panel{height:42px}
  /* 展开后交给 flex 撑满剩余宽度，别再写 calc(100vw - 126px)：
     那个 126 是按品牌宽度估的，logo/字号一变就会算多，卡片右缘直接顶出屏幕
     （实测 390 宽的手机上超出 19px，最右边的箭头被切掉）。 */
  .search-wrap.open{width:auto;flex:1 1 auto}
  #globe-stage{inset:0}
  /* 小屏：胶囊窄一点，位置仍在正中 */
  .globe-msg{font-size:11.5px;padding:8px 15px;gap:8px;max-width:calc(100% - 28px)}
  .globe-spin{width:16px;height:16px}
  #detail{
    top:auto;left:10px;right:10px;
    /* 手势条（iPhone 底部那条）+ 圆角：贴到底会被系统横条压住 */
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    width:auto;height:82vh;height:82dvh;
    border-radius:18px;
    transform:translateY(calc(100% + 20px));
  }
  #detail.open{transform:none}
  body.panel-open #globe-stage{transform:translateY(-11%)}
  #footline{display:none}

  /* 刘海屏 / 手势条。viewport-fit=cover 之后浮层会顶到物理边缘，
     状态栏和 Home 指示条会直接压在上面。 */
  #topbar{
    padding:calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px))
            12px calc(14px + env(safe-area-inset-left, 0px));
  }
  #tools{
    left:calc(20px + env(safe-area-inset-left, 0px));
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  }
  /* 手机上手指粗，按钮比桌面大一点（44 是触控下限），面板仍走两列 */
  #tools-body{width:214px;padding:10px 10px 9px;gap:8px 8px}
  .tool-btn{width:44px;height:46px}
  #dock{bottom:calc(30px + env(safe-area-inset-bottom, 0px))}

  /* iOS 上输入框字号小于 16px，聚焦时浏览器会自动把整页放大，而且不缩回来。
     搜索框在手机上"点一下就跳"就是这个原因。16px 是那条线。 */
  #q{font-size:16px}

  /* 缩略图条：手机上 5 张图会折成两行（4+1），很难看。
     改成单行横滑，最后一行的空间省下来给正文。 */
  .thumbstrip{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
              -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .thumbstrip::-webkit-scrollbar{display:none}
  .ts-item{flex:0 0 auto}
}

/* --- 横屏手机（高度很矮）---
   竖屏那套"从底下抽上来"的抽屉在横屏会把地球整个盖住；
   这里仍用右侧栏，但要收窄、留白压到 8px，并给主图限高 ——
   否则一张 16:10 的照片就吃掉整屏，正文要一直往下滑。 */
@media (max-height:520px) and (orientation:landscape){
  #detail{
    top:8px;right:8px;bottom:8px;
    width:min(56vw, 440px);
  }
  #detail .dimg-wrap{aspect-ratio:16/9;max-height:38vh}
  #topbar{padding:calc(8px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px))
                  8px calc(12px + env(safe-area-inset-left, 0px))}
  .brand-cn{font-size:16px}
  #tools{left:calc(14px + env(safe-area-inset-left, 0px));
         bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  /* 横屏高度只有 390：两列网格本来就矮，再压一点就行 */
  #tools-body{width:200px;padding:9px 9px 8px;gap:7px 8px}
  .tool-btn{width:40px;height:42px}
  .tg h3{margin-bottom:5px;font-size:9px}
}

</style>
</head>
<body>
<!-- 全屏 3D 舞台。地球是页面主体，不是"页面里的一个区块" ——
     所以这里用 fixed 铺满视口，其余 UI 全部浮在它上面。 -->
<div id="globe-stage" style="user-select:none;-webkit-user-select:none">
  <div id="labels"></div>
  <div id="tlabels"></div>
  <div class="globe-msg" id="globe-msg">正在加载地表数据…</div>
</div>

<!-- 平面地图（2D）暂时下线。代码和样式都留着，只要把下面这段 HTML 加回来、
     再让 bindMap2D 正常初始化，就能原样恢复 —— 见 index.html 里的 bindMap2D。
     撤下来的原因：问题还没收敛（拖拽手感、分片资源、白底线稿的边界），
     与其留一个半成品入口，不如先回到只有地球的状态。 -->

<!-- 顶部悬浮栏：品牌 + 搜索 -->
<header id="topbar">
  <div class="brand">
    <!-- 点阵球：球面均匀采点正交投影，边缘自然密成一圈。见 scripts/make_logo.py -->
    <img class="brand-logo" src="assets/logo.png" alt="" width="28" height="28">
    <span class="brand-cn">寰宇图志</span>
  </div>
  <!-- 搜索：默认是一个短输入框，点一下（或键盘聚焦）展开变长，同时直接列出全部国家。
       不设下拉按钮：点框即出列表，要搜索直接在展开的框里打字。 -->
  <div class="search-wrap" id="search-wrap">
    <div class="search-panel" id="search-panel">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <line x1="16" y1="16" x2="21" y2="21"></line>
      </svg>
      <input type="search" id="q" autocomplete="off" spellcheck="false"
             placeholder=""
             aria-label="搜索国家、地标，或直接提问（如：法国人吃什么、埃及有什么宗教）">
      <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="7" y1="7" x2="17" y2="17"></line>
          <line x1="17" y1="7" x2="7" y2="17"></line>
        </svg>
      </button>

    </div>
    <div class="search-res" id="q-res" hidden></div>
  </div>
</header>

<!-- 国家入口已并入搜索框：空输入聚焦时列出已收录国家，
     不再用底部胶囊 —— 那排按钮和搜索框一起把地球压掉一条。 -->
<div id="cards" hidden></div>

<!-- 右侧档案面板 -->
<aside id="detail" aria-hidden="true">
  <button class="dclose" id="d-close" aria-label="关闭档案">×</button>
  <div class="dhead">
    <h2 id="d-title">国家档案</h2>
    <div id="d-sub"></div>
  </div>
  <div class="dscroll"><div id="d-body"></div></div>
</aside>

<!-- 工具栏：左下角一颗图标，点开是一个分类面板。
     原来是 8 颗图标竖着排成一条 —— 手机上占掉三分之一屏高，而且越加越长。
     改成抽屉：一颗入口 + 五组分类，桌面和手机同一套交互。 -->
<div id="tools">
  <button id="tools-toggle" type="button" aria-label="打开工具" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h7M15 7h5M4 12h3M11 12h9M4 17h10M18 17h2"/>
      <circle cx="13" cy="7" r="1.9"/><circle cx="9" cy="12" r="1.9"/><circle cx="16" cy="17" r="1.9"/>
    </svg>
  </button>
  <div id="tools-body" role="dialog" aria-label="工具面板" aria-modal="false">

    <section class="tg">
      <h3>视图</h3>
      <div class="tg-r">
        <button class="tool-btn" id="btn-china" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.3"/>
            <circle cx="12" cy="12" r="2.2"/>
            <path d="M12 1.9v2.2M12 19.9v2.2M1.9 12h2.2M19.9 12h2.2"/>
          </svg>
          <span class="tl">常驻中国上空</span>
        </button>
        <button class="tool-btn" id="btn-spin" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5.1"/>
            <path d="M4.7 9.1a8.4 8.4 0 0 1 14.1-2.6"/>
            <path d="M19.2 2.9l-.5 3.9-3.9-.5"/>
            <path d="M19.3 14.9a8.4 8.4 0 0 1-14.1 2.6"/>
            <path d="M4.8 21.1l.5-3.9 3.9.5"/>
          </svg>
          <span class="tl">暂停自转</span>
        </button>
      </div>
    </section>

    <section class="tg">
      <h3>界线</h3>
      <div class="tg-r">
        <button class="tool-btn" id="btn-borders" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.3"/>
            <path d="M9.7 4.3c2.1 2.3 2.9 5 2.3 7.7-.5 2.2-1.8 4.1-3.3 5.6"
                  stroke-width="1.9" stroke-dasharray="2.4 2.1"/>
          </svg>
          <span class="tl">显示全部国境线</span>
        </button>
        <button class="tool-btn" id="btn-grid" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.3"/>
            <ellipse cx="12" cy="12" rx="8.3" ry="3.5"/>
            <ellipse cx="12" cy="12" rx="3.6" ry="8.3"/>
          </svg>
          <span class="tl">显示经纬线</span>
        </button>
      </div>
    </section>

    <section class="tg">
      <h3>光照</h3>
      <div class="tg-r">
        <button class="tool-btn" id="btn-term" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.3"/>
            <path d="M12 3.7a8.3 8.3 0 0 1 0 16.6z" fill="currentColor" fill-opacity=".42" stroke="none"/>
          </svg>
          <span class="tl">按太阳位置分出昼夜</span>
        </button>
        <button class="tool-btn" id="btn-night" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">

<!-- 旧版遗留的状态位，保留 id 以免脚本取空 -->
<span id="globe-sub" hidden></span>
<span id="cards-sub" hidden></span>

<script>
(function () {
  var cardsEl = document.getElementById('cards');
  var hintEl = document.getElementById('cards-hint');
  var subEl = document.getElementById('cards-sub');
  var detail = document.getElementById('detail');
  var dTitle = document.getElementById('d-title');
  var dSub = document.getElementById('d-sub');
  var dBody = document.getElementById('d-body');

  var MOD_LABEL = { image: '地标', audio: '语音', text: '文本', coords: '坐标', geometry: '边界' };
  var CUR = null;

  /* ---------- 素材双源 ----------
     优先从华为云 OBS（上海节点）取图片与音频，实测 0.17 秒；失败自动回退到
     仓库相对路径（GitHub Pages）。回退不是为了好看 —— OBS 欠费、桶策略变更、
     某地节点不通时，页面不至于整片破图。

     注意：OBS 对静态站默认域名强制 Content-Disposition: attachment（平台策略，
     2022 年起上海一等区域生效），所以 OBS 只能做素材源，不能做站点。
     但 <img> 与 <audio> 作为子资源不受该头影响 —— 这点是实测过的，不是推断。 */
  var OBS_BASE = 'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/';

  /* OBS 是镜像，只放了早期几个国家的素材。新采的国家在 OBS 上是 404，
     每张图都要先 404 一次再回退，白等一轮 RTT。所以按目录记一笔：
     某个目录第一次 404 之后，这个目录后面就直连相对路径。 */
  var OBS_MISS = {};

  function assetDir(rel) {
    var p = String(rel || '').split('/');
    return p.length > 2 ? p[1] : '';
  }

  /* 构建号：OBS 上的对象带 7 天 Cache-Control，图换了以后浏览器还认旧的，
     表现就是"数据改了、页面没变"。给每个素材 URL 挂上构建号，
     换一版就换一个 URL，缓存自然失效。只在页面层加，不改 OBS 对象。 */
  var BUILD_TAG = (function () {
    var m = document.querySelector('meta[name="build"]');
    return m ? (m.getAttribute('content') || '') : '';
  })();

  function assetSrc(rel, ver) {
    if (!rel) return '';
    if (/^https?:\/\//i.test(rel)) return rel;
    /* ver 是「这张图自己的版本号」（build_cards 按文件大小+修改时间算的）。
       有它就用它 —— 这样改 CSS / 改文案只让 data 失效，不会把 2000 多张图
       全部打成过期缓存。没有才退回全局 BUILD_TAG。 */
    var tag = ver || BUILD_TAG;
    var q = tag ? ('?v=' + encodeURIComponent(tag)) : '';
    if (OBS_MISS[assetDir(rel)]) return rel + q;
    return OBS_BASE + rel.replace(/^\/+/, '') + q;
  }

  /* ---------- 数据镜像 ----------
     GitHub Pages 在国内对小文件还行（20~30KB 约 1 秒），但大文件慢到没法用：
     实测 geo/c0.json（592KB）28 秒、geo/flat.json（770KB）40 秒还没下完。
     而同一份文件走 jsDelivr 只要 2~3 秒 —— 它就是 GitHub 仓库的 CDN 镜像，
     国内直连、支持 CORS，且内容与仓库完全一致（按 @main 分支取）。

     所以数据请求一律「CDN 优先、同源兜底」：CDN 挂了或超时，退回 GitHub Pages，
     站点仍然能开，只是慢。本地开发只用同源 —— 否则改完看的是线上旧版本，
     排查半天"怎么没生效"。 */
  var LOCAL_DEV = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|::1)$/.test(location.hostname);
  var MIRRORS = LOCAL_DEV ? [''] : [
    'https://cdn.jsdelivr.net/gh/zzq1419/atlas-mundi@main/',
    'https://fastly.jsdelivr.net/gh/zzq1419/atlas-mundi@main/',
    ''
  ];

  /* 依次试镜像。opt.signal 透传给 fetch —— 详情面板靠它丢弃"点慢了的上一国"。
     data/ 下的档案**不走 jsDelivr**：那边 @main 分支有 12 小时缓存，而且 query
     参数不进缓存键 —— 数据改了页面要等半天才变，这正是"图片永远不更新"的真凶。
     档案只有 20~30KB，走同源也就一秒多，值这个钱。
     geo/n/ 同样只走同源：它现在退到后台了（点开国家时先用档案里的 outline
     立刻画线，精细几何随后覆盖），慢一档没人感觉得到；而它一旦被 jsDelivr
     缓存住，就会出现"粗轮廓是对的、升级一下反而缺了一块"这种倒退
     —— 索马里兰并入索马里那次实测踩过。
     geo/c*.json 的大分片继续用 CDN：那些只在开"全部国境线"时才拉，4MB 走
     同源要几十秒。 */
  function fetchAny(rel, opt) {
    opt = opt || {};
    var bases = /^(data\/|geo\/n\/)/.test(rel) ? [''] : MIRRORS;
    var i = 0;
    return new Promise(function (resolve, reject) {
      (function next() {
        if (i >= bases.length) { reject(new Error('数据源均不可用')); return; }
        /* 数据 URL 也挂构建号。只给图片加没用：
           浏览器/jsDelivr 缓存的是 data/tl.json 本身，拿到旧数据就会去取旧图，
           表现就是"页面换了、图片永远不换"。 */
        var url = bases[i++] + rel +
          (BUILD_TAG ? ((rel.indexOf('?') < 0 ? '?' : '&') + 'v=' + encodeURIComponent(BUILD_TAG)) : '');
        var init = opt.signal ? { signal: opt.signal } : undefined;
        fetch(url, init)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return opt.text ? r.text() : r.json();
          })
          .then(resolve)
          .catch(function (e) {
            if (e && e.name === 'AbortError') { reject(e); return; }   // 用户切图了，不必再试
            next();
          });
      })();
    });
  }

  /* 同一个 <img> 会被反复换图（缩略图点选）。以前的写法每换一次就挂一个
     error 监听，监听里各带一份 fellBack —— 换到第二张时，第一个监听看到自己
     的 fellBack 已为 true，直接判"彻底失败"，把容器打上 blank（CSS 里是
     display:none），于是从第二张开始整块图永久消失。
     现在改成每个节点只挂一次监听，回退状态记在节点上按当前图算。 */
  function setAsset(node, rel, ver) {
    if (!node.__assetBound) {
      node.__assetBound = true;
      node.addEventListener('error', function () {
        var cur = node.__assetRel;
        if (cur && node.getAttribute('src') !== cur) {
          OBS_MISS[assetDir(cur)] = true;
          node.src = cur;                    // 回退到仓库相对路径
          return;
        }
        if (typeof node.__onfail === 'function') node.__onfail();
      });
    }
    node.__assetRel = rel;
    if (!rel) { node.removeAttribute('src'); return; }
    node.src = assetSrc(rel, ver);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* 按句切分。中文长段落不缩进、不分段会连成一片，读起来非常吃力；
     每句都单独成段又太碎，所以调用方按两句一段拼回去。 */
  function splitSent(text) {
    var src = String(text || '').trim();
    var out = [], buf = '', marks = '。！？；';
    for (var i = 0; i < src.length; i++) {
      buf += src.charAt(i);
      if (marks.indexOf(src.charAt(i)) >= 0) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  function fmtTime(x) {
    x = Math.max(0, Math.floor(x || 0));
    return Math.floor(x / 60) + ':' + ('0' + (x % 60)).slice(-2);
  }

  /* 摘要的末尾本来就含着一份"历史与民俗"（采集时为凑字数拼进去的），
     再单列一次就是把同样两段念两遍 —— 面板里最扎眼的废话就是它。
     拿 custom 的前 5 个字去摘要里找落点，找到就从那句起截断。 */
  function trimDup(sum, cus) {
    if (!sum || !cus) return sum;
    var probe = cus.replace(/\s/g, '').slice(0, 5);
    if (probe.length < 4) return sum;
    var ss = splitSent(sum);
    for (var i = 0; i < ss.length; i++) {
      if (ss[i].replace(/\s/g, '').indexOf(probe) >= 0) return ss.slice(0, i).join('');
    }
    return sum;
  }

  /* 自绘播放器。浏览器原生 <audio controls> 是一整块浅色系统控件，
     在深色面板里像贴了一张白纸 —— 所以自己画。 */
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1"/>'
                 + '<rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';

  function makePlayer(src) {
    var wrap = el('div', 'aud');
    var btn = el('button', 'aud-btn');
    btn.type = 'button';
    btn.setAttribute('aria-label', '播放');
    btn.innerHTML = ICON_PLAY;
    var bar = el('div', 'aud-bar');
    var track = el('div', 'aud-track');
    var fill = el('div', 'aud-fill');
    track.appendChild(fill);
    bar.appendChild(track);
    var time = el('span', 'aud-time', '0:00');
    wrap.appendChild(btn);
    wrap.appendChild(bar);
    wrap.appendChild(time);

    var au = new Audio();
    au.preload = 'metadata';
    setAsset(au, src);

    /* 计时显示「已播 / 总长」：总长也直接说明这段语音有多长，
       3 秒的国名读音和 40 秒的介绍，一眼能分出来。 */
    function paint(now) {
      var d = au.duration || 0;
      var cur = (now == null ? au.currentTime : now) || 0;
      time.textContent = fmtTime(cur) + ' / ' + fmtTime(d);
      fill.style.width = d ? Math.min(100, (cur / d) * 100).toFixed(1) + '%' : '0%';
    }
    function reset() {
      wrap.classList.remove('playing');
      btn.innerHTML = ICON_PLAY;
      btn.setAttribute('aria-label', '播放');
    }
    btn.addEventListener('click', function () {
      if (au.paused) {
        var p = au.play();
        if (p && p.catch) p.catch(function () { reset(); });
      } else {
        au.pause();
      }
    });
    /* 进度用 rAF 逐帧写。靠 timeupdate 只有 4Hz，再叠一个 CSS transition
       就变成"一格一格挪"；这里直接按 currentTime 每帧算，60fps 丝滑。 */
    var rafId = 0;
    function tick() {
      if (au.paused || au.ended) { rafId = 0; return; }
      paint();
      rafId = requestAnimationFrame(tick);
    }
    au.addEventListener('play', function () {
      wrap.classList.add('playing');
      btn.innerHTML = ICON_PAUSE;
      btn.setAttribute('aria-label', '暂停');
      if (!rafId) rafId = requestAnimationFrame(tick);
    });
    au.addEventListener('pause', function () {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      reset();
    });
    au.addEventListener('ended', function () {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      reset(); paint(0);
    });
    au.addEventListener('loadedmetadata', function () { paint(); });
    bar.addEventListener('click', function (e) {
      var d = au.duration || 0;
      if (!d) return;
      var r = track.getBoundingClientRect();
      if (!r.width) return;
      au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d;
      paint();
    });
    return wrap;
  }

  /* ---------- 正文关键词高亮 ----------
     关键词来自 custom_facets.keywords（模型从原文里抽的词），
     在摘要与历史民俗里把它们标出来，读的时候能一眼看到落点。
     用纯字符串扫描而不是正则：关键词里可能带括号、斜杠。 */
  var KW_LIST = [];

  function escHtml(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* 数字与年代（14.1亿 / 960万平方千米 / 1776年 / 2020年第七次…）
     也算"要点"：读国家档案时最有信息量的其实就是这些数字。
     用另一种颜色标，和概念关键词区分开。 */
  /* 只抓"有量级"的数字：把"23 个省、5 个自治区"这种计数也标出来，
     一段里会冒出十来个色块，等于什么都没标。 */
  /* 千分位逗号必须算进数字里：日本摘要里"其中逾3,300万人居"，
     旧写法 \d+ 从 "3" 起匹配，下一个字符是逗号、对不上单位，于是整条失败；
     正则引擎往后挪一位从 "300" 起才匹配上，结果标的是 "300万"，前面的 "3," 漏成普通文字。
     加上 (?:[,，]\d{3})* 之后 "3,300万" 才是一个整体。 */
  var NUM_RE = /\d+(?:[,，]\d{3})*(?:\.\d+)?\s*(?:亿|万|%|平方千米|平方公里|千米|公里|年|世纪)/;

  function markKeywords(text) {
    var src = String(text || '');
    if (!KW_LIST.length && !NUM_RE.test(src)) return escHtml(src);
    /* 同一个词在一段里只标第一次。
       "历史与民俗"这类段落里"长城""春节"会反复出现，每个都标就成了满屏下划线，
       反而看不出重点；第一处标出来，后面当普通文字读。 */
    var used = {};
    var out = '', i = 0, guard = 0;
    while (i < src.length && guard++ < 3000) {
      var hit = null, hitAt = -1, isNum = false;
      for (var k = 0; k < KW_LIST.length; k++) {
        var kw = KW_LIST[k];
        if (used[kw]) continue;
        var at = src.indexOf(kw, i);
        if (at < 0) continue;
        if (hitAt < 0 || at < hitAt || (at === hitAt && kw.length > hit.length)) {
          hitAt = at; hit = kw;
        }
      }
      var m = src.slice(i).match(NUM_RE);
      if (m && !used[m[0]]) {
        var nat = i + m.index;
        if (hitAt < 0 || nat < hitAt) { hitAt = nat; hit = m[0]; isNum = true; }
      }
      if (hitAt < 0) { out += escHtml(src.slice(i)); break; }
      used[hit] = 1;
      out += escHtml(src.slice(i, hitAt)) +
             '<em class="' + (isNum ? 'kn' : 'kw') + '">' + escHtml(hit) + '</em>';
      i = hitAt + hit.length;
    }
    return out;
  }

  function paraText(text, perPara) {
    var host = el('div', 'prose');
    var parts = splitSent(text);
    if (!parts.length) return host;
    var per = perPara || 2;
    for (var k = 0; k < parts.length; k += per) {
      var seg = parts.slice(k, k + per).join('');
      if (seg.replace(/\s/g, '').length < 6) continue;
      var p = el('p');
      p.innerHTML = markKeywords(seg);
      host.appendChild(p);
    }
    return host;
  }

  function onGlobeReady() {
    /* 提示文字和地球一起淡出，不要"啪"一下子消失 —— 那一下也算一次闪。 */
    var m = document.getElementById('globe-msg');
    if (m) {
      m.classList.add('gone');
      setTimeout(function () { if (m.parentNode) m.remove(); }, 700);
    }
    /* 球稳定后就预热重资源（经纬网、全量国境线）。
       以前是「3 秒后 + requestIdleCallback(timeout 6s)」—— 这两条都太慢：
       用户在 3~9 秒之间点按钮，等于每次都现建一次，卡顿就"偶发"。
       现在改为两个固定时间点，各自只做一件事，不依赖浏览器愿不愿意给空闲帧。 */
    setTimeout(function () {
      if (globe.warmHeavyLayers) globe.warmHeavyLayers();
    }, 1500);
  }

  function fail(msg) {
    hintEl.innerHTML = '';
    hintEl.appendChild(el('span', '', msg));
    cardsEl.innerHTML = '';
  }

  /* ---------- 国家入口 ----------
     底部胶囊已删除：它和搜索框一起把地球压掉一条。
     现在入口并入搜索框 —— 空输入聚焦时列出已收录国家（见 showCountryList）。 */
  function renderCards(list) {
    cardsEl.innerHTML = '';
    // 右上角那行"3 国 · 3 完整"已去掉：它是构建期统计，压在画面上没用还碍眼。
  }

  /* ---------- 详情 ---------- */
  function openPanel() {
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  function closePanel() {
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.remove('active');
    });
    /* 关掉档案就把金色国界一起撤掉 —— 之前它还亮着，等于"退出了但还选着"。 */
    if (typeof setActive === 'function') setActive(null);
    if (typeof flyOut === 'function') flyOut();
  }

  /* 点国家是异步取 json。之前没有序号也没有 abort：先点俄罗斯（慢，还在路上），
     再点印度，印度的图先回来渲染好了，几秒后俄罗斯的响应到站，直接把面板覆盖成俄罗斯 ——
     用户看到的就是"点了印度，显示的却是上一次点的俄罗斯"。
     现在每次打开自增序号 + abort 上一个请求，晚到的响应一律丢弃。 */
  var DETAIL_SEQ = 0;
  var DETAIL_ABORT = null;

  /* 面板骨架：左边图片微光 + 右边先用 data/index.json 的轻量元数据
     （首都/大洲/坐标）把版面填上 —— 这份索引首屏就有，不用等档案 JSON。
     语言/边界/正文等完整档案到了再补。 */
  /* 兜底骨架：只在 cards.json 还没到手、又确实要开面板时用。
     只留左边图片的微光，右边什么都不放 —— 拼一半的信息（比如只有首都大洲）
     和正式版面位置不一致，看起来像"先错一次再改对"，比空着更难受。 */
  function buildSkeleton(iso) {
    var wrap = el('div', 'dwrap');
    var left = el('div', 'dimg-wrap loading');   // 图片微光骨架
    var right = el('div');
    wrap.appendChild(left);
    wrap.appendChild(right);
    return wrap;
  }

  function openDetail(iso, item, quiet) {
    /* 点击音挂在这里而不是 openCountry：打开档案有三条路（搜索框、球面标签、
       下方卡片），只有"标签"那条经过 openCountry，挂在上面另外两条就没声了。 */
    if (!quiet && !globe.timeMode) keyClick();
    var seq = ++DETAIL_SEQ;
    if (DETAIL_ABORT) { try { DETAIL_ABORT.abort(); } catch (e) {} }
    DETAIL_ABORT = (typeof AbortController === 'function') ? new AbortController() : null;
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.toggle('active', n === item);
    });
    if (typeof setActive === 'function') setActive(iso);

    var key = String(iso).toUpperCase();

    /* ---------- 主路径：全部档案已经在内存里 ----------
       cards.json 把 236 国的面板文字合成一份（走 OBS，约 0.5 秒下完，首屏之后
       空闲时加载）。点开时直接拿对象渲染，标题、首都、大洲、坐标、正文、
       文化特征、语音、图片清单一上进位 —— 版面一次到位，不存在"先摆一半
       再改"的位置跳动。
       以前是逐份 fetch data/xx.json：同源一个请求固定 1.2 秒延迟，所以点过
       的国家（有缓存）秒出、没点过的空白大半个回合，用户看到的就是
       "有的国家快、有的国家慢"。 */
    var card = CARDS[key];
    if (card) {
      renderDetail(card, true);          // 里面会设 panelT0、标题、建好整棵树
      openPanel();
      if (typeof flyToCountry === 'function') flyToCountry(iso);
      /* 卡片里不带 outline（236 份合计 446KB，不值当）。它只用来在球面上
         先画一条粗线，等精细几何到了再覆盖 —— 静默补一次，不碰面板 DOM。 */
      fetchAny('data/' + iso.toLowerCase() + '.json',
               DETAIL_ABORT ? { signal: DETAIL_ABORT.signal } : undefined)
        .then(function (d) {
          if (seq !== DETAIL_SEQ || !d || !d.outline) return;
          CARD_OUTLINE[key] = d.outline;
          if (globe && globe.maybePreempt) globe.maybePreempt(key, d.outline);
        })
        .catch(function () { /* 补不到就算了，面板已经是完整的 */ });
      return;
    }

    /* ---------- 兜底：卡片还没到，或者这个地区本来就没有档案 ---------- */
    var lm = LABEL_META && LABEL_META[key];
    dTitle.textContent = (lm && lm.n) || iso;
    dSub.textContent = iso;
    dBody.innerHTML = '';
    dBody.appendChild(buildSkeleton(iso));
    openPanel();
    if (typeof flyToCountry === 'function') flyToCountry(iso);

    fetchAny('data/' + iso.toLowerCase() + '.json',
