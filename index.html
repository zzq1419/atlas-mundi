<script>
(function () {
  var cardsEl = document.getElementById('cards');
  var hintEl = document.getElementById('cards-hint');
  var subEl = document.getElementById('cards-sub');
  var detail = document.getElementById('detail');
  var dTitle = document.getElementById('d-title');
  var dSub = document.getElementById('d-sub');
  var dBody = document.getElementById('d-body');

  var MOD_LABEL = { image: '地标', audio: '语音', text: '文本', coords: '坐标', geometry: '边界' };
  var CUR = null;

  /* ---------- 素材双源 ----------
     优先从华为云 OBS（上海节点）取图片与音频，实测 0.17 秒；失败自动回退到
     仓库相对路径（GitHub Pages）。回退不是为了好看 —— OBS 欠费、桶策略变更、
     某地节点不通时，页面不至于整片破图。

     注意：OBS 对静态站默认域名强制 Content-Disposition: attachment（平台策略，
     2022 年起上海一等区域生效），所以 OBS 只能做素材源，不能做站点。
     但 <img> 与 <audio> 作为子资源不受该头影响 —— 这点是实测过的，不是推断。 */
  var OBS_BASE = 'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/';

  /* OBS 是镜像，只放了早期几个国家的素材。新采的国家在 OBS 上是 404，
     每张图都要先 404 一次再回退，白等一轮 RTT。所以按目录记一笔：
     某个目录第一次 404 之后，这个目录后面就直连相对路径。 */
  var OBS_MISS = {};

  function assetDir(rel) {
    var p = String(rel || '').split('/');
    return p.length > 2 ? p[1] : '';
  }

  /* 构建号：OBS 上的对象带 7 天 Cache-Control，图换了以后浏览器还认旧的，
     表现就是"数据改了、页面没变"。给每个素材 URL 挂上构建号，
     换一版就换一个 URL，缓存自然失效。只在页面层加，不改 OBS 对象。 */
  var BUILD_TAG = (function () {
    var m = document.querySelector('meta[name="build"]');
    return m ? (m.getAttribute('content') || '') : '';
  })();

  function assetSrc(rel) {
    if (!rel) return '';
    if (/^https?:\/\//i.test(rel)) return rel;
    var q = BUILD_TAG ? ('?v=' + encodeURIComponent(BUILD_TAG)) : '';
    if (OBS_MISS[assetDir(rel)]) return rel + q;
    return OBS_BASE + rel.replace(/^\/+/, '') + q;
  }

  /* ---------- 数据镜像 ----------
     GitHub Pages 在国内对小文件还行（20~30KB 约 1 秒），但大文件慢到没法用：
     实测 geo/c0.json（592KB）28 秒、geo/flat.json（770KB）40 秒还没下完。
     而同一份文件走 jsDelivr 只要 2~3 秒 —— 它就是 GitHub 仓库的 CDN 镜像，
     国内直连、支持 CORS，且内容与仓库完全一致（按 @main 分支取）。

     所以数据请求一律「CDN 优先、同源兜底」：CDN 挂了或超时，退回 GitHub Pages，
     站点仍然能开，只是慢。本地开发只用同源 —— 否则改完看的是线上旧版本，
     排查半天"怎么没生效"。 */
  var LOCAL_DEV = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|::1)$/.test(location.hostname);
  var MIRRORS = LOCAL_DEV ? [''] : [
    'https://cdn.jsdelivr.net/gh/zzq1419/atlas-mundi@main/',
    'https://fastly.jsdelivr.net/gh/zzq1419/atlas-mundi@main/',
    ''
  ];

  /* 依次试镜像。opt.signal 透传给 fetch —— 详情面板靠它丢弃"点慢了的上一国"。
     data/ 下的档案**不走 jsDelivr**：那边 @main 分支有 12 小时缓存，而且 query
     参数不进缓存键 —— 数据改了页面要等半天才变，这正是"图片永远不更新"的真凶。
     档案只有 20~30KB，走同源也就一秒多，值这个钱。geo/ 的大分片才继续用 CDN。 */
  function fetchAny(rel, opt) {
    opt = opt || {};
    var bases = /^data\//.test(rel) ? [''] : MIRRORS;
    var i = 0;
    return new Promise(function (resolve, reject) {
      (function next() {
        if (i >= bases.length) { reject(new Error('数据源均不可用')); return; }
        /* 数据 URL 也挂构建号。只给图片加没用：
           浏览器/jsDelivr 缓存的是 data/tl.json 本身，拿到旧数据就会去取旧图，
           表现就是"页面换了、图片永远不换"。 */
        var url = bases[i++] + rel +
          (BUILD_TAG ? ((rel.indexOf('?') < 0 ? '?' : '&') + 'v=' + encodeURIComponent(BUILD_TAG)) : '');
        var init = opt.signal ? { signal: opt.signal } : undefined;
        fetch(url, init)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return opt.text ? r.text() : r.json();
          })
          .then(resolve)
          .catch(function (e) {
            if (e && e.name === 'AbortError') { reject(e); return; }   // 用户切图了，不必再试
            next();
          });
      })();
    });
  }

  /* 同一个 <img> 会被反复换图（缩略图点选）。以前的写法每换一次就挂一个
     error 监听，监听里各带一份 fellBack —— 换到第二张时，第一个监听看到自己
     的 fellBack 已为 true，直接判"彻底失败"，把容器打上 blank（CSS 里是
     display:none），于是从第二张开始整块图永久消失。
     现在改成每个节点只挂一次监听，回退状态记在节点上按当前图算。 */
  function setAsset(node, rel) {
    if (!node.__assetBound) {
      node.__assetBound = true;
      node.addEventListener('error', function () {
        var cur = node.__assetRel;
        if (cur && node.getAttribute('src') !== cur) {
          OBS_MISS[assetDir(cur)] = true;
          node.src = cur;                    // 回退到仓库相对路径
          return;
        }
        if (typeof node.__onfail === 'function') node.__onfail();
      });
    }
    node.__assetRel = rel;
    if (!rel) { node.removeAttribute('src'); return; }
    node.src = assetSrc(rel);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* 按句切分。中文长段落不缩进、不分段会连成一片，读起来非常吃力；
     每句都单独成段又太碎，所以调用方按两句一段拼回去。 */
  function splitSent(text) {
    var src = String(text || '').trim();
    var out = [], buf = '', marks = '。！？；';
    for (var i = 0; i < src.length; i++) {
      buf += src.charAt(i);
      if (marks.indexOf(src.charAt(i)) >= 0) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  function fmtTime(x) {
    x = Math.max(0, Math.floor(x || 0));
    return Math.floor(x / 60) + ':' + ('0' + (x % 60)).slice(-2);
  }

  /* 摘要的末尾本来就含着一份"历史与民俗"（采集时为凑字数拼进去的），
     再单列一次就是把同样两段念两遍 —— 面板里最扎眼的废话就是它。
     拿 custom 的前 5 个字去摘要里找落点，找到就从那句起截断。 */
  function trimDup(sum, cus) {
    if (!sum || !cus) return sum;
    var probe = cus.replace(/\s/g, '').slice(0, 5);
    if (probe.length < 4) return sum;
    var ss = splitSent(sum);
    for (var i = 0; i < ss.length; i++) {
      if (ss[i].replace(/\s/g, '').indexOf(probe) >= 0) return ss.slice(0, i).join('');
    }
    return sum;
  }

  /* 自绘播放器。浏览器原生 <audio controls> 是一整块浅色系统控件，
     在深色面板里像贴了一张白纸 —— 所以自己画。 */
  var ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="7" y="5" width="3.4" height="14" rx="1"/>'
                 + '<rect x="13.6" y="5" width="3.4" height="14" rx="1"/></svg>';

  function makePlayer(src) {
    var wrap = el('div', 'aud');
    var btn = el('button', 'aud-btn');
    btn.type = 'button';
    btn.setAttribute('aria-label', '播放');
    btn.innerHTML = ICON_PLAY;
    var bar = el('div', 'aud-bar');
    var track = el('div', 'aud-track');
    var fill = el('div', 'aud-fill');
    track.appendChild(fill);
    bar.appendChild(track);
    var time = el('span', 'aud-time', '0:00');
    wrap.appendChild(btn);
    wrap.appendChild(bar);
    wrap.appendChild(time);

    var au = new Audio();
    au.preload = 'metadata';
    setAsset(au, src);

    /* 计时显示「已播 / 总长」：总长也直接说明这段语音有多长，
       3 秒的国名读音和 40 秒的介绍，一眼能分出来。 */
    function paint(now) {
      var d = au.duration || 0;
      var cur = (now == null ? au.currentTime : now) || 0;
      time.textContent = fmtTime(cur) + ' / ' + fmtTime(d);
      fill.style.width = d ? Math.min(100, (cur / d) * 100).toFixed(1) + '%' : '0%';
    }
    function reset() {
      wrap.classList.remove('playing');
      btn.innerHTML = ICON_PLAY;
      btn.setAttribute('aria-label', '播放');
    }
    btn.addEventListener('click', function () {
      if (au.paused) {
        var p = au.play();
        if (p && p.catch) p.catch(function () { reset(); });
      } else {
        au.pause();
      }
    });
    /* 进度用 rAF 逐帧写。靠 timeupdate 只有 4Hz，再叠一个 CSS transition
       就变成"一格一格挪"；这里直接按 currentTime 每帧算，60fps 丝滑。 */
    var rafId = 0;
    function tick() {
      if (au.paused || au.ended) { rafId = 0; return; }
      paint();
      rafId = requestAnimationFrame(tick);
    }
    au.addEventListener('play', function () {
      wrap.classList.add('playing');
      btn.innerHTML = ICON_PAUSE;
      btn.setAttribute('aria-label', '暂停');
      if (!rafId) rafId = requestAnimationFrame(tick);
    });
    au.addEventListener('pause', function () {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      reset();
    });
    au.addEventListener('ended', function () {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      reset(); paint(0);
    });
    au.addEventListener('loadedmetadata', function () { paint(); });
    bar.addEventListener('click', function (e) {
      var d = au.duration || 0;
      if (!d) return;
      var r = track.getBoundingClientRect();
      if (!r.width) return;
      au.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d;
      paint();
    });
    return wrap;
  }

  /* ---------- 正文关键词高亮 ----------
     关键词来自 custom_facets.keywords（模型从原文里抽的词），
     在摘要与历史民俗里把它们标出来，读的时候能一眼看到落点。
     用纯字符串扫描而不是正则：关键词里可能带括号、斜杠。 */
  var KW_LIST = [];

  function escHtml(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* 数字与年代（14.1亿 / 960万平方千米 / 1776年 / 2020年第七次…）
     也算"要点"：读国家档案时最有信息量的其实就是这些数字。
     用另一种颜色标，和概念关键词区分开。 */
  /* 只抓"有量级"的数字：把"23 个省、5 个自治区"这种计数也标出来，
     一段里会冒出十来个色块，等于什么都没标。 */
  /* 千分位逗号必须算进数字里：日本摘要里"其中逾3,300万人居"，
     旧写法 \d+ 从 "3" 起匹配，下一个字符是逗号、对不上单位，于是整条失败；
     正则引擎往后挪一位从 "300" 起才匹配上，结果标的是 "300万"，前面的 "3," 漏成普通文字。
     加上 (?:[,，]\d{3})* 之后 "3,300万" 才是一个整体。 */
  var NUM_RE = /\d+(?:[,，]\d{3})*(?:\.\d+)?\s*(?:亿|万|%|平方千米|平方公里|千米|公里|年|世纪)/;

  function markKeywords(text) {
    var src = String(text || '');
    if (!KW_LIST.length && !NUM_RE.test(src)) return escHtml(src);
    /* 同一个词在一段里只标第一次。
       "历史与民俗"这类段落里"长城""春节"会反复出现，每个都标就成了满屏下划线，
       反而看不出重点；第一处标出来，后面当普通文字读。 */
    var used = {};
    var out = '', i = 0, guard = 0;
    while (i < src.length && guard++ < 3000) {
      var hit = null, hitAt = -1, isNum = false;
      for (var k = 0; k < KW_LIST.length; k++) {
        var kw = KW_LIST[k];
        if (used[kw]) continue;
        var at = src.indexOf(kw, i);
        if (at < 0) continue;
        if (hitAt < 0 || at < hitAt || (at === hitAt && kw.length > hit.length)) {
          hitAt = at; hit = kw;
        }
      }
      var m = src.slice(i).match(NUM_RE);
      if (m && !used[m[0]]) {
        var nat = i + m.index;
        if (hitAt < 0 || nat < hitAt) { hitAt = nat; hit = m[0]; isNum = true; }
      }
      if (hitAt < 0) { out += escHtml(src.slice(i)); break; }
      used[hit] = 1;
      out += escHtml(src.slice(i, hitAt)) +
             '<em class="' + (isNum ? 'kn' : 'kw') + '">' + escHtml(hit) + '</em>';
      i = hitAt + hit.length;
    }
    return out;
  }

  function paraText(text, perPara) {
    var host = el('div', 'prose');
    var parts = splitSent(text);
    if (!parts.length) return host;
    var per = perPara || 2;
    for (var k = 0; k < parts.length; k += per) {
      var seg = parts.slice(k, k + per).join('');
      if (seg.replace(/\s/g, '').length < 6) continue;
      var p = el('p');
      p.innerHTML = markKeywords(seg);
      host.appendChild(p);
    }
    return host;
  }

  function onGlobeReady() {
    /* 提示文字和地球一起淡出，不要"啪"一下子消失 —— 那一下也算一次闪。 */
    var m = document.getElementById('globe-msg');
    if (m) {
      m.classList.add('gone');
      setTimeout(function () { if (m.parentNode) m.remove(); }, 700);
    }
    /* 球稳定后就预热重资源（经纬网、全量国境线）。
       以前是「3 秒后 + requestIdleCallback(timeout 6s)」—— 这两条都太慢：
       用户在 3~9 秒之间点按钮，等于每次都现建一次，卡顿就"偶发"。
       现在改为两个固定时间点，各自只做一件事，不依赖浏览器愿不愿意给空闲帧。 */
    setTimeout(function () {
      if (globe.warmHeavyLayers) globe.warmHeavyLayers();
    }, 1500);
  }

  function fail(msg) {
    hintEl.innerHTML = '';
    hintEl.appendChild(el('span', '', msg));
    cardsEl.innerHTML = '';
  }

  /* ---------- 国家入口 ----------
     底部胶囊已删除：它和搜索框一起把地球压掉一条。
     现在入口并入搜索框 —— 空输入聚焦时列出已收录国家（见 showCountryList）。 */
  function renderCards(list) {
    cardsEl.innerHTML = '';
    // 右上角那行"3 国 · 3 完整"已去掉：它是构建期统计，压在画面上没用还碍眼。
  }

  /* ---------- 详情 ---------- */
  function openPanel() {
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  function closePanel() {
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.remove('active');
    });
    /* 关掉档案就把金色国界一起撤掉 —— 之前它还亮着，等于"退出了但还选着"。 */
    if (typeof setActive === 'function') setActive(null);
    if (typeof flyOut === 'function') flyOut();
  }

  /* 点国家是异步取 json。之前没有序号也没有 abort：先点俄罗斯（慢，还在路上），
     再点印度，印度的图先回来渲染好了，几秒后俄罗斯的响应到站，直接把面板覆盖成俄罗斯 ——
     用户看到的就是"点了印度，显示的却是上一次点的俄罗斯"。
     现在每次打开自增序号 + abort 上一个请求，晚到的响应一律丢弃。 */
  var DETAIL_SEQ = 0;
  var DETAIL_ABORT = null;

  function openDetail(iso, item, quiet) {
    var seq = ++DETAIL_SEQ;
    if (DETAIL_ABORT) { try { DETAIL_ABORT.abort(); } catch (e) {} }
    DETAIL_ABORT = (typeof AbortController === 'function') ? new AbortController() : null;
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.toggle('active', n === item);
    });
    if (typeof setActive === 'function') setActive(iso);

    dTitle.textContent = '读取中…';
    dSub.textContent = iso;
    dBody.innerHTML = '';
    openPanel();
    if (typeof flyToCountry === 'function') flyToCountry(iso);

    fetchAny('data/' + iso.toLowerCase() + '.json',
             DETAIL_ABORT ? { signal: DETAIL_ABORT.signal } : undefined)
      .then(function (d) {
        if (seq !== DETAIL_SEQ) return;      // 已经切到别的国家了，丢掉
        renderDetail(d, true);
      })
      .catch(function (e) {
        if (seq !== DETAIL_SEQ || (e && e.name === 'AbortError')) return;
        /* 没有完整档案不等于"没有这个国家"。只要 meta 里有它，
           就给一张基础档案（几何 + 地名 + 人口），而不是一句读取失败。 */
        if (LABEL_META && LABEL_META[String(iso).toUpperCase()]) {
          if (window.console) console.info('[atlas] ' + iso + ' 无完整档案，使用基础档案：' + e.message);
          renderBasic(iso);
          return;
        }
        dTitle.textContent = '档案未就绪';
        dSub.textContent = iso;
        dBody.appendChild(el('p', 'hint',
          '读取 data/' + iso.toLowerCase() + '.json 失败（' + e.message + '），' +
          '基础元数据里也没有这个代码。'));
      });
  }

  /* 有完整档案的国家（data/index.json 里 status 不是 placeholder）。
     点地名时用它决定"开自己的，还是开归属国的"。 */
  var HAS_DOC = {};

  /* 点一个地名之后到底开谁的档案：
     1. 自己有完整档案 → 开自己的
     2. 没有，但归某个主权国管 → 开主权国的
        （格陵兰→丹麦、关岛→美国、法属波利尼西亚→法国、索马里兰→索马里）
     3. 都没有 → 交给 openDetail 走基础档案
     以前格陵兰、关岛这类有 ISO 码但从来没采过档案的条目，点开只有一句
     "档案未就绪" —— 比不显示更让人困惑。归属关系在 labels.json 的 parent 里。 */
  /* ---------- 点击反馈：金色波纹 + 一声轻响 ----------
     波纹用 DOM 画（三圈错开 90ms），音效用 WebAudio 现场合成 ——
     不引任何音频文件，省一个请求，也不占仓库体积。 */
  var _lastDown = { x: 0, y: 0 };
  document.addEventListener('pointerdown', function (e) {
    _lastDown.x = e.clientX;
    _lastDown.y = e.clientY;
  }, true);

  function rippleAt(x, y) {
    for (var k = 0; k < 3; k++) {
      (function (delay) {
        setTimeout(function () {
          var d = document.createElement('div');
          d.className = 'ripple';
          d.style.left = x + 'px';
          d.style.top = y + 'px';
          document.body.appendChild(d);
          setTimeout(function () { d.remove(); }, 800);
        }, delay);
      })(k * 90);
    }
  }

  var _ac = null;
  function chime(freq) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!_ac) _ac = new AC();
      if (_ac.state === 'suspended') _ac.resume();
      var t = _ac.currentTime;
      /* 两个正弦差五度叠加，音量 10ms 冲上去、400ms 衰减干净 ——
         像敲了一下小铜铃，不是"嘟"的一声提示音。 */
      [freq, freq * 1.5].forEach(function (f, i) {
        var o = _ac.createOscillator(), g = _ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(i ? 0.042 : 0.070, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.40 + i * 0.12);
        o.connect(g);
        g.connect(_ac.destination);
        o.start(t);
        o.stop(t + 0.6);
      });
    } catch (e) { /* 老浏览器没有 AudioContext，静默跳过 */ }
  }

  function openCountry(c) {
    /* 时间指示模式（旗子）下不打开任何档案。标签那边已经关了
       pointer-events，这里再兜一道：大洲/海洋那几个标签走的是 parent 分支，
       只关国家标签的话，点"北美洲"照样会弹出一张卡片。 */
    if (globe.timeMode) return;
    rippleAt(_lastDown.x, _lastDown.y);
    chime(880);
    var iso = String(c.iso || '').toUpperCase();
    var par = String(c.parent || '').toUpperCase();
    var known = Object.keys(HAS_DOC).length > 0;
    var target = (known && !HAS_DOC[iso] && par) ? par : (iso || par);
    if (!target) return;
    openDetail(target, cardOf(target), false);
  }

  /* 面板关闭按钮 + Esc */
  (function bindPanel() {
    var btn = document.getElementById('d-close');
    if (btn) btn.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && detail.classList.contains('open')) closePanel();
    });
  })();

  /* 把档案里的文化正文拆成「历史 / 民俗」两节。
     优先用显式字段（新采集的都写 history_text + custom_text）；
     老档案只有合并的 custom_text，按空行拆一次 —— 那是当初 prompt 里写死的
     两段结构（第一段历史、第二段民俗），拆出来和显式字段等价。 */
  function culturalParts(d) {
    var h = String(d.history_text || '').trim();
    var f = String(d.custom_text || '').trim();
    if (h) return { history: h, folk: f };
    var ps = f.split(/\n{2,}/).map(function (x) { return x.trim(); })
              .filter(function (x) { return x.length > 0; });
    if (ps.length >= 2) {
      return { history: ps[0], folk: ps.slice(1).join('\n\n') };
    }
    return { history: '', folk: f };
  }

  function renderDetail(d, quiet) {
    dTitle.textContent = d.name_zh;
    dSub.textContent = d.name_en + ' · ' + d.iso_a2 + ' / ' + d.iso_a3 + ' · ' + d.qid;

    var wrap = el('div', 'dwrap');

    /* 左：影像 */
    var left = el('div');
    var imgs = d.landmark_images || [];
    if (imgs.length) {
      var picWrap = el('div', 'dimg-wrap loading');
      var pic = el('img', 'dimg');
      picWrap.appendChild(pic);
      var capEl = el('div', 'cap', '');
      var licEl = el('div', 'cap dim', '');
      var strip = imgs.length > 1 ? el('div', 'thumbstrip') : null;
      var items = [];
      var picSeq = 0;

      function showPic(idx) {
        var it = imgs[idx];
        var seq = ++picSeq;
        picWrap.classList.remove('loaded');
        picWrap.classList.add('loading');
        picWrap.classList.remove('blank');   // 上一张失败留下的 blank 要清掉，否则 display:none 一直挂着
        pic.alt = it.caption_zh || it.caption || d.name_zh;
        pic.onload = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('loaded');
          picWrap.classList.remove('blank');
          // 竖构图（如埃菲尔铁塔 1400x2591）用 cover 会把塔顶塔基裁掉，
          // 改 contain 装下整张，两侧用底色补。横构图仍用 cover 铺满。
          var portrait = pic.naturalHeight > pic.naturalWidth * 1.15;
          picWrap.classList.toggle('fit', portrait);
        };
        pic.__onfail = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('blank');
        };
        /* 直接上主图。
           原来先挂缩略图、等主图预载好再替换，视觉上是"先糊一下再变清晰"——
           用户明确不要这个过渡。OBS 上主图 50~150KB、0.2 秒就到，
           这点等待比"糊一下"舒服。缩略图只在底下那条胶片带里用。 */
        setAsset(pic, it.url || it.thumb_url);
        // 换到同一张图时浏览器不会重新触发 load，loaded 就永远加不上，图是透明
        if (pic.complete && pic.naturalWidth) pic.onload();
        capEl.textContent = it.caption_zh || it.caption || '';
        licEl.textContent = it.license
          ? '授权：' + it.license + (it.author ? ' · ' + it.author : '')
          : '授权待确认（来源已记录：' + (it.title || 'Commons') + '）';
        items.forEach(function (n, i) { n.classList.toggle('active', i === idx); });
      }

      left.appendChild(picWrap);
      if (strip) {
        imgs.forEach(function (it, i) {
          var t = el('img', 'ts-item');
          t.alt = it.caption_zh || it.caption || (d.name_zh + ' 图片 ' + (i + 1));
          t.setAttribute('data-tip', t.alt);
          t.loading = 'lazy';
          setAsset(t, it.thumb_url || it.url);
          t.addEventListener('click', function () { showPic(i); });
          items.push(t);
          strip.appendChild(t);
        });
      }
      showPic(0);
      if (strip) left.appendChild(strip);
      left.appendChild(capEl);
      left.appendChild(licEl);
    } else {
      left.appendChild(el('div', 'dimg blank', '暂无地标影像'));
    }

    /* 右：结构化 + 文本 */
    var right = el('div');

    var meta = el('dl', 'dmeta');
    [['首都', d.capital || '—'],
     ['大洲', d.continent || '—'],
     ['坐标', d.centroid ? d.centroid[1].toFixed(2) + '°N, ' + d.centroid[0].toFixed(2) + '°E' : '—'],
     ['语言', (d.languages || []).map(function (l) { return l.name_zh; }).join(' / ') || '—'],
     ['边界', d.geometry
        ? 'Natural Earth 10m · ' + ((d.geometry_stats || {}).vertices || '?') + ' 顶点'
        : 'Natural Earth 10m · 分片几何']
    ].forEach(function (p) {
      var dd = el('dd', null, p[1]);
      if (p[0] === '边界') {
        /* 常被当成"边界画偏了"的那段：江苏外海在 2004 年的卫星图上是一大片
           含沙浑水（长江、旧黄河口），颜色和岸上的土一样。国界是矢量、按测绘
           海岸线画，两者在河口本来就不会完全重合 —— 说清楚，省得每次都要解释。 */
        dd.setAttribute('data-tip', '国界取自 Natural Earth 矢量（10m），底图是 2004 年卫星影像：'
          + '河口与外海的含沙浑水在影像上接近陆地色，边界与影像色块不完全重合属正常');
        dd.style.cursor = 'help';
        dd.style.textDecoration = 'underline dotted rgba(140,165,220,.45)';
        dd.style.textUnderlineOffset = '3px';
      }
      meta.appendChild(el('dt', null, p[0]));
      meta.appendChild(dd);
    });
    right.appendChild(meta);

    // 边界不能只写"已采集"——用户看不见等于没采。这里用等距圆柱投影画成 SVG 轮廓，
    // 无第三方库、离线可用，也顺带验证了阶段 D 要用的 GeoJSON 是好的。
    /* 轮廓来源分两种：三国档案里带着 geometry 路径；其余国家不单独存 geojson
       （223 个国家各自一个文件，部署时就是 223 次提交），改从 geo/c*.json
       分片里取 —— 那份数据本来就为"球面点亮国界"加载过，多半已在内存里。 */
    var geoBox = el('div', 'geo-box');
    geoBox.appendChild(el('div', 'sub-label', '国界轮廓'));
    var svgHost = el('div', 'geo-svg', '读取边界数据…');
    geoBox.appendChild(svgHost);
    right.appendChild(geoBox);
    /* 轮廓是一大串 path 字符串 + 一次布局，放在面板滑入动画之后再算，
       否则正好卡在动画第一帧。 */
    setTimeout(function () {
      if (d.geometry) { renderOutline(d.geometry, svgHost); return; }
      /* 注意这里在 renderDetail(d) 里，没有 iso 变量 —— 用档案自己的 iso_a2 */
      loadGeo(d.iso_a2 || '').then(function (gj) {
        if (gj) drawOutline(gj, svgHost);
        else svgHost.textContent = '没有这个国家的边界数据';
      });
    }, 220);

    /* 先把关键词列表设好，paraText 才能把正文里的词标出来 */
    KW_LIST = ((d.custom_facets || {}).keywords || [])
      .map(function (k) { return String(k.v || k || '').trim(); })
      .filter(function (w) { return w.length >= 2; })
      .sort(function (a, b) { return b.length - a.length; });

    var txt = el('div', 'dtext');
    var sumTxt = trimDup(d.summary_text, d.custom_text);
    if (sumTxt) txt.appendChild(paraText(sumTxt, 2));
    /* 历史与民俗分两节 —— 两者主题不同（发生过什么 / 今天怎么生活），
       揉在一段里读起来像一篇不分类的散文。新数据直接给 history_text 字段；
       旧数据只有一整段 custom_text，就按空行拆（第一段是历史，这是当时
       prompt 的固定结构），拆不开就整段落在「民俗」下面，不硬标标题。 */
    var parts = culturalParts(d);
    if (parts.history) {
      txt.appendChild(el('div', 'sub-label', '历史'));
      txt.appendChild(paraText(parts.history, 2));
    }
    if (parts.folk) {
      txt.appendChild(el('div', 'sub-label', '民俗'));
      txt.appendChild(paraText(parts.folk, 2));
    }
    right.appendChild(txt);

    /* 文化特征：由大模型在构建期从摘要与民俗文本抽取，页面只读结果。
       每个标签的 title 属性挂着抽取时的原文片段，鼠标悬停可核对依据。 */
    var facets = d.custom_facets || {};
    var fgroups = [
      ['节庆', facets.festivals],
      ['饮食', facets.cuisine],
      ['宗教', facets.religion],
      ['建筑', facets.architecture],
      ['遗产', facets.heritage]
    ].filter(function (g) { return g[1] && g[1].length; });
    var kws = facets.keywords || [];

    if (fgroups.length || kws.length) {
      var fbox = el('div', 'facets');
      fbox.appendChild(el('div', 'sub-label', '文化特征'));
      if (kws.length) {
        var krow = el('div', 'frow');
        krow.appendChild(el('span', 'fkey', '关键词'));
        var kwrap = el('div', 'fval');
        kws.forEach(function (k) {
          var c = el('span', 'chip chip-kw', k.v || k);
          if (k.evidence) c.setAttribute('data-tip', '原文：' + k.evidence);
          kwrap.appendChild(c);
        });
        krow.appendChild(kwrap);
        fbox.appendChild(krow);
      }
      fgroups.forEach(function (g) {
        var row = el('div', 'frow');
        row.appendChild(el('span', 'fkey', g[0]));
        var wrap = el('div', 'fval');
        g[1].forEach(function (x) {
          var c = el('span', 'chip', x.v || x);
          if (x.evidence) c.setAttribute('data-tip', '原文：' + x.evidence);
          wrap.appendChild(c);
        });
        row.appendChild(wrap);
        fbox.appendChild(row);
      });
      right.appendChild(fbox);
    }

    /* 音频：每个语言一条。
       地区语言只在大国给 —— 卢森堡、摩纳哥这种国家列一串地区语言纯属噪音，
       读的人只会觉得"怎么这么多"。阈值 1000 万人口。 */
    var popNow = LABEL_POP[(d.iso_a2 || '').toUpperCase()] || 0;
    var langs = (d.languages || []);
    if (popNow && popNow < 1e7) {
      langs = langs.filter(function (l) { return l.role !== 'regional'; });
    }
    var withAudio = langs.filter(function (l) { return l.audio_url; });
    var without = langs.filter(function (l) { return !l.audio_url; });
    if (withAudio.length) {
      right.appendChild(el('div', 'sub-label', '语音'));
      withAudio.forEach(function (l) {
        var box = el('div', 'lang-block');
        var row = el('div', 'lang-audio');
        row.appendChild(el('span', 'la-name', l.name_zh));
        /* 三种角色：official 官方 / spoken 通用（美国那种联邦无官方语言、
           只有实际通行语的情况）/ regional 区域。以前只有两档，
           spoken 会被显示成"区域"，读起来像地方方言。 */
        var roleText = l.role === 'official' ? '官方'
          : (l.role === 'spoken' ? '通用' : '区域');
        row.appendChild(el('span', 'la-role', roleText));
        row.appendChild(makePlayer(l.audio_url));
        box.appendChild(row);
        /* 播放器下面配原文 + 中文翻译：外国语音不翻译等于听不懂。
           中文语音本身就不用再翻一遍。 */
        if (l.tts_text) {
          var tr = el('div', 'lang-trans');
          var srcLine = el('div', 'lt-src', l.tts_text);
          tr.appendChild(srcLine);
          /* 给外语配中文翻译。以前用 /[A-Za-z]/ 判断"是不是外语"，只认拉丁字母 ——
             阿拉伯语、日语、泰语一个拉丁字母都没有，于是中文翻译被整段吞掉，
             播放器下面只剩一行看不懂的原文。改成按语种代码判断：
             中文（zh*）和粤语（yue）本身是汉语，不用再翻一遍；其余都配中文。 */
          var isHan = /^(zh|yue)/i.test(l.code || '');
          if (l.tts_text_zh && !isHan && l.tts_text_zh !== l.tts_text) {
            tr.appendChild(el('div', 'lt-zh', l.tts_text_zh));
          }
          box.appendChild(tr);
        }
        right.appendChild(box);
      });
    }
    if (without.length) {
      right.appendChild(el('div', 'pending',
        '暂无语音：' + without.map(function (l) { return l.name_zh; }).join('、')));
    }

    /* 数据待补：只写短标签，一行说完。
       详细成因（P443 语种不符、Commons 无音源…）留在 docs 与 CI 日志里 ——
       面板是给人看国家的地方，不是构建日志。 */
    var brief = d.review_short || [];
    if (brief.length) {
      var dq = el('div', 'dq');
      dq.appendChild(el('span', 'dq-k', '待补'));
      dq.appendChild(el('span', 'dq-v', brief.join(' · ')));
      right.appendChild(dq);
    }

    wrap.appendChild(left);
    wrap.appendChild(right);
    dBody.innerHTML = '';
    dBody.appendChild(wrap);
  }

  /* ---------- 基础档案 ----------
     站点的定位是"所有国家"，但多模态档案是逐国采集的，短期只能有三家完整。
     没采集到的国家不该弹一句"读取失败"—— 那样等于告诉用户"这个国家不存在"。
     所以这里给一张基础档案：国界几何、中文名、大洲、人口、中心坐标，
     全部来自 Natural Earth（公有领域），并且明确说明多模态内容还在队列里。 */
  function fmtPop(n) {
    n = Number(n) || 0;
    if (!n) return '—';
    if (n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(0) + ' 万';
    return String(n);
  }

  function fmtLL(lon, lat) {
    if (lon == null || lat == null) return '—';
    return Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + ', ' +
           Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W');
  }

  function renderBasic(iso) {
    var key = String(iso).toUpperCase();
    var m = (LABEL_META && LABEL_META[key]) || { n: key, en: '', cont: '', pop: 0, lon: null, lat: null };
    dTitle.textContent = m.n;
    dSub.textContent = (m.en || '') + ' · ' + key + ' · 基础档案';

    var wrap = el('div', 'dwrap');
    var left = el('div');
    var right = el('div');

    var geoBox = el('div', 'geo-box');
    var svgHost = el('div', 'geo-svg', '读取边界数据…');
    geoBox.appendChild(svgHost);
    geoBox.appendChild(el('div', 'cap dim', '国界轮廓 · Natural Earth 1:50m · 公有领域'));
    left.appendChild(geoBox);

    var meta = el('dl', 'dmeta');
    [['中文名', m.n],
     ['英文名', m.en || '—'],
     ['大洲', m.cont || '—'],
     ['人口', m.pop ? fmtPop(m.pop) + '（NE 估算）' : '—'],
     ['中心坐标', fmtLL(m.lon, m.lat)],
     ['档案层级', '基础 · 几何与地名']
    ].forEach(function (pair) {
      meta.appendChild(el('dt', null, pair[0]));
      meta.appendChild(el('dd', null, pair[1]));
    });
    right.appendChild(meta);

    right.appendChild(el('div', 'sub-label', '多模态内容'));
    var box = el('div', 'prose');
    box.appendChild(el('p', null,
      '这个国家的文本（沿革与文化）、地标影像、多语种语音三类内容还在采集队列里。' +
      '上面这些是它的基础档案 —— 国界几何、名称、大洲、人口与中心点，' +
      '来自 Natural Earth 的公有领域数据，可以直接用于定位与检索。'));
    right.appendChild(box);

    var q = el('div', 'dq');
    q.appendChild(el('span', 'dq-k', '进度'));
    q.appendChild(el('span', 'dq-v', '基础档案已就绪 · 文本 / 影像 / 语音待补'));
    right.appendChild(q);

    wrap.appendChild(left);
    wrap.appendChild(right);
    dBody.innerHTML = '';
    dBody.appendChild(wrap);
    /* 轮廓在面板滑入之后再算，避开动画第一帧（与完整档案同一套逻辑） */
    setTimeout(function () {
      loadGeo(key).then(function (gj) { drawOutline(gj, svgHost); });
    }, 220);
  }

  /* ---------- 国界轮廓（等距圆柱投影，纯 SVG） ---------- */
  /* 轮廓几何分成 8 个分片（见 scripts/build_countries.py）。
     分片按 ISO 的字符和取模，前后端各算一次，不需要额外索引。
     拿到的分片在内存里缓存，同一个分片里的国家不会再请求第二次。 */
  var GEO_CHUNKS = {};
  function geoBucket(iso) {
    var n = 0;
    for (var i = 0; i < iso.length; i++) n += iso.charCodeAt(i);
    return n % 8;
  }
  function loadGeo(iso) {
    var key = String(iso).toUpperCase();
    var b = geoBucket(key);
    if (GEO_CHUNKS[b]) return Promise.resolve(GEO_CHUNKS[b][key] || null);
    return fetchAny('geo/c' + b + '.json')
      .then(function (all) {
        GEO_CHUNKS[b] = all || {};
        return GEO_CHUNKS[b][key] || null;
      })
      .catch(function () { return null; });
  }

  function renderOutline(url, host) {
    fetchAny(url, { text: true })
      .then(function (txt) { drawOutline(JSON.parse(txt), host); })
      .catch(function (e) {
        host.textContent = '边界读取失败（' + e.message + '）';
      });
  }

  /* 把 FeatureCollection 画成等距圆柱投影的轮廓 */
  function drawOutline(gj, host) {
    if (!gj) { host.textContent = '边界数据为空'; return; }
    (function () {
        var rings = [];
        (gj.features || []).forEach(function (f) {
          var g = f.geometry || {};
          var polys = g.type === 'Polygon' ? [g.coordinates]
            : (g.type === 'MultiPolygon' ? g.coordinates : []);
          polys.forEach(function (poly) {
            poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
          });
        });
        if (!rings.length) { host.textContent = '边界数据为空'; return; }

        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        rings.forEach(function (ring) {
          ring.forEach(function (pt) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
            if (pt[1] < minY) minY = pt[1];
            if (pt[1] > maxY) maxY = pt[1];
          });
        });
        var W = 300, pad = 10;
        var spanX = Math.max(maxX - minX, 0.01);
        var spanY = Math.max(maxY - minY, 0.01);
        var scale = Math.min((W - pad * 2) / spanX, 150 / spanY);
        var H = Math.round(spanY * scale + pad * 2);
        var ox = (W - spanX * scale) / 2;
        var oy = (H - spanY * scale) / 2;

        var d = rings.map(function (ring) {
          return ring.map(function (pt, i) {
            var x = (ox + (pt[0] - minX) * scale).toFixed(1);
            var y = (oy + (maxY - pt[1]) * scale).toFixed(1);
            return (i ? 'L' : 'M') + x + ' ' + y;
          }).join('') + 'Z';
        }).join('');

        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
          /* 深底卡片：轮廓用浅青描边 */
          '<path d="' + d + '" fill="rgba(150,200,226,.12)" stroke="rgba(178,214,240,.85)" ' +
          'stroke-width=".8" stroke-linejoin="round"/></svg>';
        host.setAttribute('data-rings', rings.length);
    })();
  }

  /* ---------- 知识库检索（2-gram + BM25，纯本地） ----------
     为什么在前端检索而不是每次调大模型：
     1) key 不能进浏览器，公开仓库的静态站更是碰都不能碰；
     2) 三个国家的知识库只有几十条，本地算比一次网络往返快两个数量级；
     3) 断网、无代理也能演示 —— 这是录屏的硬要求。
     中文没有空格，用 2-gram 切分（不分词、不引词典），BM25 打分。 */
  var IDX = null;
  var qInput = document.getElementById('q');
  var qRes = document.getElementById('q-res');
  var qSub = document.getElementById('search-sub');

  function tokenize(text) {
    var s = String(text || '').toLowerCase();
    var toks = [], buf = '', mode = null;
    function flushCJK(b) {
      if (!b) return;
      if (b.length === 1) { toks.push(b); return; }
      for (var i = 0; i < b.length - 1; i++) toks.push(b.substr(i, 2));
    }
    function flushWord(b) { if (b.length >= 2) toks.push(b); }
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var m = /[\u3400-\u9fff]/.test(ch) ? 'c' : (/[a-z0-9]/.test(ch) ? 'a' : null);
      if (m !== mode) {
        if (mode === 'c') flushCJK(buf);
        else if (mode === 'a') flushWord(buf);
        buf = ''; mode = m;
      }
      if (m) buf += ch;
    }
    if (mode === 'c') flushCJK(buf);
    else if (mode === 'a') flushWord(buf);
    return toks;
  }

  function buildIdx(docs) {
    var postings = {}, df = {}, lens = [];
    docs.forEach(function (d, i) {
      var toks = tokenize(d.index_text);
      lens[i] = toks.length || 1;
      var tf = {};
      toks.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
      for (var t in tf) {
        if (!postings[t]) postings[t] = {};
        postings[t][i] = tf[t];
        df[t] = (df[t] || 0) + 1;
      }
    });
    var sum = lens.reduce(function (a, b) { return a + b; }, 0);
    return { docs: docs, postings: postings, df: df, lens: lens,
             avgdl: sum / (docs.length || 1), N: docs.length };
  }

  /* 疑问句里的虚词。中文 2-gram 会把「哪里能看」切成「哪里/里能/能看」，
     这些碎片在多个文档里都出现，是纯噪声 —— 实测「哪里能看长城」会把
     「法国面积有多大？首都是哪里？」顶到第二名，就因为含「哪里」。 */
  var STOP = {};
  ('哪里 里能 能看 什么 怎么 哪些 哪个 多少 哪儿 有什 么地 么语 么节 么样 么东 ' +
   '有哪 些地 请问 一下 告诉 知道 我想 想要 是否 可以 应该 这个 那个 ' +
   '这些 那些 是什 为什 一个 有些 有没 没有 是不 不是').split(' ').forEach(function (w) {
    if (w) STOP[w] = 1;
  });

  var MIN_SCORE = 1.5;   // 绝对阈值：低于此分视为噪声（实测「日本有什么」最高只有 1.74）
  var REL_RATIO = 0.35;  // 相对阈值：只保留最高分的 35% 以上

  function bm25(q, topk) {
    if (!IDX) return [];
    var k1 = 1.5, b = 0.75, score = {};
    tokenize(q).forEach(function (t) {
      if (STOP[t]) return;
      var pl = IDX.postings[t];
      if (!pl) return;
      var n = IDX.df[t] || 0;
      var idf = Math.log(1 + (IDX.N - n + 0.5) / (n + 0.5));
      for (var i in pl) {
        var tf = pl[i], dl = IDX.lens[i];
        score[i] = (score[i] || 0) +
          idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / IDX.avgdl));
      }
    });
    var arr = [];
    for (var i in score) { if (score[i] > MIN_SCORE) arr.push([IDX.docs[i], score[i]]); }
    arr.sort(function (a, b) { return b[1] - a[1]; });
    if (!arr.length) return [];
    var floor = arr[0][1] * REL_RATIO;
    arr = arr.filter(function (x) { return x[1] >= floor; });
    return arr.slice(0, topk || 5);
  }

  function cardOf(iso) {
    var all = cardsEl.children;
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset && all[i].dataset.iso === iso) return all[i];
    }
    return null;
  }

  function renderResults(q) {
    var hits = bm25(q, 5);
    qRes.innerHTML = '';
    qRes.hidden = false;
    if (!hits.length) {
      qRes.appendChild(el('div', 'sr-empty',
        '没有匹配内容（知识库共 ' + (IDX ? IDX.N : 0) + ' 条）'));
      return;
    }
    hits.forEach(function (h) {
      var d = h[0];
      var item = el('div', 'sr-item');
      var top = el('div', 'sr-top');
      top.appendChild(el('span', 'sr-country', d.name));
      top.appendChild(el('span', 'sr-q', d.q));
      if (d.kind === 'country') top.appendChild(el('span', 'sr-tag', '基础'));
      item.appendChild(top);
      item.appendChild(el('div', 'sr-a', d.a));
      item.addEventListener('click', function () {
        openDetail(d.iso, cardOf(d.iso), false);
        setSearch(false);              // 选中即收起，视线回到地球
        if (qInput) qInput.blur();
        /* 只有"搜的是内容"才需要滚到命中段落。
           搜国家名（"日本"）时整份档案就是在讲它，滚过去只会把主图顶出可视区 ——
           实测点开日本，主图和缩略图都被滚到了负坐标。 */
        var qq = String(q || '').trim();
        var isNameOnly = !qq || qq === d.name || qq.toLowerCase() === String(d.iso || '').toLowerCase();
        if (d.kind !== 'country' && !isNameOnly) locateInPanel(q);
      });
      qRes.appendChild(item);
    });
  }

  /* 搜到了却只跳到面板顶部，等于没定位。
     这里在渲染完之后按相关度找一段，滚过去并闪一下。
     中文没有空格，所以切成二元组打分（"中国传统节日" → 中国/国传/传统/统节/节日），
     这样"传统节日"也能命中正文里的"是岁首最重要的节日"。 */
  function locateInPanel(q) {
    var host = document.getElementById('d-body');
    if (!host || !q) return;
    var raw = String(q).trim();
    var terms = [];
    if (/[\u4e00-\u9fa5]/.test(raw)) {
      for (var i = 0; i + 2 <= raw.length; i++) terms.push(raw.substr(i, 2));
    } else {
      raw.split(/\s+/).forEach(function (t) { if (t.length >= 2) terms.push(t.toLowerCase()); });
    }
    if (!terms.length) return;
    setTimeout(function () {
      var nodes = host.querySelectorAll('.prose p, .chip, .cap, dd');
      var best = null, bestScore = 0;
      for (var i = 0; i < nodes.length; i++) {
        var t = (nodes[i].textContent || '');
        var tl = t.toLowerCase();
        var score = 0;
        for (var k = 0; k < terms.length; k++) if (tl.indexOf(terms[k]) >= 0) score += terms[k].length;
        if (score > bestScore) { bestScore = score; best = nodes[i]; }
      }
      if (!best || bestScore < 2) return;
      best.scrollIntoView({ block: 'center', behavior: 'smooth' });
      best.classList.add('hit-flash');
      setTimeout(function () { best.classList.remove('hit-flash'); }, 1700);
    }, 260);
  }

  /* 国家列表：由搜索框右端的下拉按钮触发（不自动弹）。
     空输入直接点开时它就是入口，用户不用先背关键词。 */
  function showCountryList() {
    if (!IDX || !IDX.docs) {
      qRes.innerHTML = '';
      qRes.hidden = false;
      qRes.appendChild(el('div', 'sr-empty', '知识库索引尚未就绪'));
      return;
    }
    var seen = {}, list = [];
    IDX.docs.forEach(function (d) {
      if (d.iso && !seen[d.iso]) {
        seen[d.iso] = 1;
        list.push(d);
      }
    });
    /* 全部国家都在这里，排法：有完整档案的置顶，其余按人口降序。
       人口取不到就排最后 —— 这样打开列表第一屏就是"有料的那几个"。 */
    list.sort(function (a, b) {
      var da = a.kind === 'country' ? 0 : 1, db = b.kind === 'country' ? 0 : 1;
      if (da !== db) return db - da;
      var pa = (LABEL_META || {})[a.iso] ? LABEL_META[a.iso].pop || 0 : 0;
      var pb = (LABEL_META || {})[b.iso] ? LABEL_META[b.iso].pop || 0 : 0;
      return pb - pa;
    });
    qRes.innerHTML = '';
    qRes.hidden = false;
    list.forEach(function (d) {
      var item = el('div', 'sr-item sr-country-row');
      item.appendChild(el('span', 'sr-country', d.iso));
      item.appendChild(el('span', 'sr-q', d.name));
      if (d.kind === 'country') item.appendChild(el('span', 'sr-tag', '基础'));
      item.appendChild(el('span', 'sr-arrow', '›'));
      item.addEventListener('click', function () {
        openDetail(d.iso, cardOf(d.iso), false);
        setSearch(false);
        if (qInput) qInput.blur();
      });
      qRes.appendChild(item);
    });
  }

  var searchWrap = document.getElementById('search-wrap');
  var searchPanel = document.getElementById('search-panel');
  var searchDrop = document.getElementById('search-drop');

  /* ---------- 自绘提示气泡 ----------
     原生 title 要悬停一秒才弹、样式不可控、移动端干脆没有。
     这里用 data-tip 接管，悬停 120ms 后出现在元素上方（空间不够就放下面）。 */
  (function bindTip() {
    var tip = document.getElementById('tip');
    var cur = null, timer = 0;
    function place(el) {
      if (!tip) return;
      var r = el.getBoundingClientRect();
      tip.classList.add('on');
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      /* 靠左的元素（左下角竖排工具栏）提示一律放右边。
         放上面会直接盖住上面那颗按钮 —— 竖排按钮间距只有 8px，
         提示一出来就分不清是在说谁。 */
      if (r.left + r.width / 2 < window.innerWidth * 0.4) {
        tip.classList.add('side-right');
        tip.style.left = (r.right + 10) + 'px';
        tip.style.top = (r.top + r.height / 2) + 'px';
        return;
      }
      tip.classList.remove('side-right');
      var cx = Math.min(Math.max(r.left + r.width / 2, tw / 2 + 8),
                        window.innerWidth - tw / 2 - 8);
      /* 一律放在元素下方。
         原来是"上面放不下才放下方"，于是同一排关键词里：靠上的那几个提示在下面、
         其余的在上面，鼠标扫过去一上一下，看着很散。统一在下，
         只有真的贴着屏幕底边（比如左下角那排按钮）才翻上去。 */
      var y = r.bottom + 8;
      if (y + th > window.innerHeight - 8) y = Math.max(6, r.top - th - 8);
      tip.style.left = cx + 'px';
      tip.style.top = y + 'px';
    }
    function show(el) {
      var txt = el.getAttribute('data-tip');
      if (!txt || !tip) return;
      cur = el;
      tip.textContent = txt;
      place(el);

    function hide() {
      clearTimeout(timer);
      cur = null;
      if (tip) tip.classList.remove('on');

    document.addEventListener('pointerover', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (!el || el === cur) return;

      timer = setTimeout(function () { show(el); }, 120);

    document.addEventListener('pointerout', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;

  /* 开合只有一个入口，避免三处各改一半导致状态对不上 */
  function setSearch(open, list) {

  /* 框本身常驻：点框内任何位置都算"要输入"，展开并聚焦。

    var PH_LONG = '试试这么问：法国人吃什么？ 埃及有什么宗教？';

  /* 所有国家的元数据：名称/大洲/人口/中心点。
     20KB，首屏就取 —— 检索、基础档案、飞行动画都要用。 */
  function loadCountryMeta() {

      .then(function (m) {

      .catch(function () { /* 拿不到就退化成"只有三国可查"，不影响地球本体 */ });

  function updateIdxSub() {

      ? '知识库 ' + IDX.N + ' 条 · 覆盖 ' + n + ' 个国家与地区 · 本地检索'
      : '知识库 ' + IDX.N + ' 条 · 2-gram + BM25 本地检索';

  /* 把"还没有档案的国家"作为基础条目并进检索。

  function mergeCountryDocs() {
    if (!IDX || !LABEL_META) return;
    var have = {};
    IDX.docs.forEach(function (d) { if (d.iso) have[d.iso] = 1; });
    var added = 0;
    Object.keys(LABEL_META).forEach(function (iso) {
      if (have[iso]) return;
      var m = LABEL_META[iso];
      IDX.docs.push({
        id: 'c-' + iso,
        iso: iso,
        name: m.n,
        kind: 'country',
        q: m.n + (m.en ? '　' + m.en : ''),
        a: (m.cont || '') + (m.pop ? ' · 人口约 ' + fmtPop(m.pop) : '') + ' · 基础档案',
        index_text: m.n + ' ' + (m.en || '') + ' ' + (m.cont || '')
      });

    });
