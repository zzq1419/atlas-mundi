  .globe-tip{font-size:11.5px;line-height:1.75}

  @media (max-width:900px){
    .globe-wrap{grid-template-columns:1fr}
    .globe-stage{aspect-ratio:1/1}
  }

  /* 知识库检索 */
  .search-box{margin-top:2px}
  #q{
    width:100%;box-sizing:border-box;
    padding:13px 16px;font-size:14px;font-family:inherit;
    color:var(--ink);background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:10px;outline:none;
    transition:border-color .2s ease,background .2s ease;
    -webkit-appearance:none;appearance:none;
  }
  #q::placeholder{color:var(--ink-faint)}
  #q:focus{border-color:rgba(148,182,224,.5);background:rgba(255,255,255,.05)}
  #q::-webkit-search-cancel-button{filter:invert(.5)}

  .sr-examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .sr-ex{
    font-size:12px;padding:4px 11px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:transparent;font-family:inherit;cursor:pointer;
    transition:border-color .2s ease,color .2s ease;
  }
  .sr-ex:hover{border-color:rgba(148,182,224,.45);color:var(--ink)}

  .search-res{
    margin-top:12px;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:rgba(255,255,255,.018);
  }
  .sr-item{
    padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .18s ease;
  }
  .sr-item:last-child{border-bottom:0}
  .sr-item:hover{background:rgba(148,182,224,.06)}
  .sr-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sr-country{
    font-size:11px;letter-spacing:.05em;color:rgba(148,182,224,.9);
    border:1px solid rgba(148,182,224,.3);border-radius:999px;
    padding:1px 7px;flex:0 0 auto;
  }
  .sr-q{font-size:13.5px;color:var(--ink)}
  .sr-a{font-size:12.5px;color:var(--ink-dim);line-height:1.65;margin-top:4px}
  .sr-empty{padding:14px;font-size:12.5px;color:var(--ink-faint);line-height:1.6}
  .sr-country-row{display:flex;align-items:center;gap:9px;padding:10px 14px}
  .sr-arrow{
    margin-left:auto;font-size:15px;line-height:1;color:rgba(148,182,224,.45);
    transition:color .18s ease,transform .18s ease;
  }
  .sr-country-row:hover .sr-arrow{color:rgba(200,222,250,.9);transform:translateX(2px)}

  /* 文化特征标签 */
  .facets{margin-top:4px}
  .frow{display:flex;gap:10px;align-items:flex-start;margin-top:7px}
  .fkey{
    flex:0 0 40px;font-size:11px;letter-spacing:.06em;
    color:var(--ink-faint);padding-top:4px;
  }
  .fval{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:12px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:rgba(255,255,255,.02);cursor:default;
    transition:border-color .2s ease,color .2s ease;
  }
  .chip:hover{border-color:rgba(148,182,224,.5);color:var(--ink)}
  .chip-kw{
    border-color:rgba(148,182,224,.35);
    color:rgba(148,182,224,.92);
    background:rgba(148,182,224,.05);
  }

  /* 国界轮廓 */
  .geo-box{margin-top:4px}
  .geo-svg{
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#0c1220,#090e1a);
    padding:4px;font-size:12px;color:var(--ink-faint);
  }
  .geo-svg svg{display:block;width:100%;height:auto}

  /* 多图切换 */
  .thumbstrip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ts-item{
    width:64px;height:46px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:pointer;opacity:.55;
    transition:opacity .2s ease,border-color .2s ease;
  }
  .ts-item:hover{opacity:.85}
  .ts-item.active{opacity:1;border-color:rgba(148,182,224,.65)}

  /* 语言音频行 */
  .lang-audio{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line);
  }
  .lang-audio:last-child{border-bottom:0}
  .la-name{font-size:14px;color:var(--ink);min-width:88px}
  .la-role{
    font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;
  }
  .la-player{flex:1;height:32px;min-width:0}

  @media (max-width:760px){
    .dwrap{grid-template-columns:1fr}
  }

/* ============ 全屏地球布局 ============ */
/* 这一层覆盖旧的"长页面"排版：不再有文档流滚动，一切浮在 3D 舞台之上。 */
html,body{
  height:100%;overflow:hidden;
}
body{
  margin:0;padding:0;
  background:#04070d;
}

#globe-stage{
  /* 顶部让出 62px：顶栏是浮层，不该压在球上。之前球顶被搜索框切掉一条。 */
  position:fixed;inset:62px 0 0 0;z-index:0;
  transform-origin:50% 50%;
  transition:transform .68s cubic-bezier(.22,.61,.36,1);
}
#globe-stage canvas{
  display:block;width:100%;height:100%;cursor:grab;
  /* WebGL 首帧合成偶尔会白一帧。canvas 自己淡进来，这点白就被吃掉了。 */
  opacity:0;transition:opacity .9s ease;
}
#globe-stage canvas.ready{opacity:1}

/* 档案面板打开时，地球整体左移并缩小 —— 比改相机更稳，
   不会触发 canvas 反复 resize，也不会有一次性的抖动。 */
body.panel-open #globe-stage{
  /* 只平移，不缩放。缩放在视觉上会同时"变小 + 被裁"，
     而用户接受面板压住一点地球，所以让球保持原尺寸左移即可。 */
  transform:translateX(-14%);
}

/* --- 顶部栏 --- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  pointer-events:none;              /* 只有子元素可点，不挡地球拖拽 */
}
#topbar > *{pointer-events:auto}

.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.brand-cn{
  font-family:var(--serif,"Songti SC",serif);
  font-size:20px;letter-spacing:.16em;color:var(--ink);
}
.brand-en{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);
}

/* ============ 搜索：左侧一个圆钮，点开向右展开 ============
   展开面板是绝对定位的，只改它自己的宽度，不参与 topbar 的 flex 排版。
   之前是把 .search-wrap 的宽度做过渡，右边那行计数会被挤着跳，看起来"卡"。
   金色只留给地球上的国界，控件一律冷色。 */
.search-wrap{
  position:relative;width:38px;height:38px;flex:0 0 auto;
}

.search-toggle{
  position:absolute;inset:0;z-index:3;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:999px;cursor:pointer;
  background:rgba(12,20,34,.74);
  border:1px solid rgba(126,158,198,.24);
  transition:opacity .18s ease,border-color .22s ease,background .22s ease;
}
.search-toggle svg{
  width:15px;height:15px;
  fill:none;stroke:rgba(158,190,228,.88);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.search-toggle:hover{border-color:rgba(150,185,230,.52);background:rgba(19,30,49,.9)}
.search-wrap.open .search-toggle{opacity:0;pointer-events:none}

.search-panel{
  position:absolute;left:0;top:0;z-index:4;
  display:flex;align-items:center;
  height:38px;width:38px;
  border-radius:999px;overflow:hidden;
  background:rgba(11,18,31,.94);
  border:1px solid rgba(126,158,198,.26);
  box-shadow:0 12px 34px rgba(0,0,0,.42);
  opacity:0;pointer-events:none;
  transition:width .46s cubic-bezier(.2,.9,.25,1),
             opacity .18s ease,
             border-color .22s ease;
  will-change:width;
}
.search-wrap.open .search-panel{
  width:min(392px, 46vw);opacity:1;pointer-events:auto;
}
.search-wrap.open .search-panel:focus-within{border-color:rgba(150,185,230,.5)}

.search-panel .search-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;pointer-events:none;
  fill:none;stroke:rgba(150,182,220,.62);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}

#q{
  flex:1 1 auto;min-width:0;height:100%;box-sizing:border-box;
  padding:0 4px 0 34px;
  font-size:13px;font-family:inherit;
  color:var(--ink);caret-color:#bcd6f5;
  background:transparent;border:0;outline:none;
  -webkit-appearance:none;appearance:none;
}
#q::-webkit-search-cancel-button{filter:invert(.42)}

/* 展开后才出现的下拉按钮：国家列表由用户自己点开 */
.search-drop{
  flex:0 0 auto;width:26px;height:26px;margin-right:5px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;
  background:transparent;border:1px solid transparent;
  opacity:.68;
  transition:opacity .2s ease,border-color .2s ease,background .2s ease;
}
.search-drop svg{
  width:13px;height:13px;
  fill:none;stroke:rgba(158,190,228,.85);
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s cubic-bezier(.2,.9,.25,1);
}
.search-drop:hover{opacity:1;border-color:rgba(150,185,230,.42);background:rgba(150,185,230,.1)}
.search-wrap.list-open .search-drop{opacity:1}
.search-wrap.list-open .search-drop svg{transform:rotate(180deg)}

.topbar-meta{
  flex:0 0 auto;margin-left:auto;
  font-size:11px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}

/* 搜索结果 / 国家列表：从搜索框下方浮出 */
#q-res{
  position:absolute;top:calc(100% + 8px);left:0;
  width:min(392px, 46vw);
  max-height:52vh;overflow-y:auto;
  border-radius:12px;border:1px solid rgba(120,150,190,.28);
  background:rgba(8,13,23,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 48px rgba(0,0,0,.55);
}
#q-res[hidden]{display:none}

/* --- 底部国家导航 --- */
#dock{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  z-index:30;pointer-events:none;
}
#dock #cards{
  display:flex;gap:10px;pointer-events:auto;
}
.dock-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 16px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--ink-dim);
  background:rgba(10,16,28,.72);
  border:1px solid rgba(120,150,190,.26);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .22s ease;
}
.dock-item:hover{
  border-color:rgba(148,182,224,.55);color:var(--ink);
  transform:translateY(-2px);
}
.dock-item.active{
  border-color:rgba(148,182,224,.85);
  background:rgba(148,182,224,.14);
  color:#f2d9a4;
}
.di-iso{
  font-size:9.5px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dock-item.active .di-iso{color:rgba(242,217,164,.75)}

/* --- 右侧档案面板 --- */
/* 档案面板：一张浮起来的卡片，四边留白、圆角、带偏移的柔和阴影。
   之前是贴边的侧栏，像浏览器自带的抽屉；浮卡才有"弹出来"的感觉。 */
#detail{
  position:fixed;top:16px;right:16px;bottom:16px;z-index:40;
  width:min(500px, calc(100vw - 32px));
  display:flex;flex-direction:column;
  background:rgba(9,14,24,.955);
  border:1px solid rgba(126,158,198,.22);
  border-radius:20px;
  box-shadow:0 28px 70px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.42);
  transform:translateX(calc(100% + 28px));
  transition:transform .56s cubic-bezier(.22,.61,.36,1);
  visibility:hidden;
  overflow:hidden;                 /* 圆角要裁掉内部滚动区的直角 */
}
#detail.open{transform:none;visibility:visible}
#detail[hidden]{display:none}

.dhead{
  padding:22px 26px 16px;border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.dhead h2{
  margin:0;font-family:var(--serif,"Songti SC",serif);
  font-size:26px;font-weight:500;letter-spacing:.05em;color:var(--ink);
}
#d-sub{
  margin-top:6px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dscroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding:18px 24px 28px;
}
/* 内部任何元素都不许撑破面板产生横向滚动条 */
#detail *{max-width:100%}
#detail img,#detail video,#detail canvas{max-width:100%;height:auto}
#detail .dwrap,#detail .dblock,#detail .meta,#detail .facets{min-width:0}
#detail pre,#detail code{white-space:pre-wrap;word-break:break-word}
.dclose{
  position:absolute;top:15px;right:15px;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;cursor:pointer;
  color:var(--ink-dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-family:inherit;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.dclose:hover{color:var(--ink);border-color:rgba(148,182,224,.5);background:rgba(148,182,224,.10)}

/* 面板里空间窄，详情原本的两列网格改为单列 */
#detail .dwrap{grid-template-columns:1fr;gap:16px}
#detail .dimg-wrap{aspect-ratio:16/10}

/* --- 左下角提示 --- */
#footline{
  position:fixed;left:26px;bottom:30px;z-index:20;
  display:flex;flex-direction:column;gap:4px;
  font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint);
  pointer-events:none;
  opacity:.8;
}
.fl-src{font-size:9.5px;opacity:.7}

/* --- 移动端 --- */
@media (max-width:760px){
  #topbar{padding:12px 14px;gap:10px;flex-wrap:nowrap}
  .brand-en{display:none}
  .brand-cn{font-size:17px}
  .topbar-meta{display:none}
  .search-wrap.open .search-panel{width:calc(100vw - 108px)}
  #q-res{width:calc(100vw - 108px)}
  #globe-stage{inset:60px 0 0 0}
  #detail{
    top:auto;left:10px;right:10px;bottom:10px;
    width:auto;height:82vh;height:82dvh;
    border-radius:18px;
    transform:translateY(calc(100% + 20px));
  }
  #detail.open{transform:none}
  body.panel-open #globe-stage{transform:translateY(-11%)}
  #footline{display:none}
}

/* ============ 浏览器表面 ============
   这些部件不是画出来的，但一样带设计：选区颜色、滚动条、焦点环。
   它们是最便宜的"这页是被建造的"信号，也是最常被漏掉的一层。 */
::selection{
  background:rgba(148,182,224,.30);
  color:#fdf6e8;
}
::-moz-selection{background:rgba(148,182,224,.30);color:#fdf6e8}

.dscroll::-webkit-scrollbar,
#q-res::-webkit-scrollbar{width:10px}
.dscroll::-webkit-scrollbar-track,
#q-res::-webkit-scrollbar-track{background:transparent}
.dscroll::-webkit-scrollbar-thumb,
#q-res::-webkit-scrollbar-thumb{
  background:rgba(140,168,208,.24);
  border:3px solid transparent;
  background-clip:padding-box;
  border-radius:10px;
}
.dscroll::-webkit-scrollbar-thumb:hover,
#q-res::-webkit-scrollbar-thumb:hover{
  background:rgba(148,182,224,.42);
  background-clip:padding-box;
}
.dscroll{scrollbar-width:thin;scrollbar-color:rgba(140,168,208,.28) transparent}

:focus-visible{
  outline:2px solid rgba(148,182,224,.78);
  outline-offset:3px;
  border-radius:6px;
}
#q:focus-visible{outline-offset:0;border-radius:999px}

/* ============ 正文段落 ============
   中文长段落首行缩进两字，段间留白；不缩进会连成一片很难读。 */
.prose p{
  margin:0 0 .82em;
  text-indent:2em;
  line-height:1.95;
  color:var(--ink-dim);
  font-size:14.5px;
  letter-spacing:.01em;
}
.prose p:last-child{margin-bottom:0}
.prose{padding:0}

/* 面板里的标题层级：分组标签比正文重一档，比大标题轻一档 */
.sub-label{
  font-size:11.5px;letter-spacing:.12em;text-transform:none;
  color:rgba(148,182,224,.82);
  margin:20px 0 10px;
}
.sub-label:first-child{margin-top:0}

/* ============ 球面国名 ============
   div 由 JS 每帧定位到国家中心的投影位置，转到背面自动淡出。 */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.glabel{
  position:absolute;left:0;top:0;
  padding:3px 11px;border-radius:999px;
  font-size:11.5px;letter-spacing:.10em;white-space:nowrap;
  color:#e8f1ff;
  background:rgba(8,14,25,.52);
  border:1px solid rgba(150,185,230,.32);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  transition:opacity .32s ease,border-color .2s ease,background .2s ease;
  cursor:pointer;
}
.glabel:hover{
  border-color:rgba(195,222,255,.72);
  background:rgba(16,27,44,.82);
}

/* ============ 左下角工具按钮 ============ */
#tools{
  position:fixed;left:22px;bottom:22px;z-index:25;
  display:flex;flex-direction:column;gap:8px;
}
.tool-btn{
  width:36px;height:36px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  background:rgba(11,18,31,.72);
  border:1px solid rgba(126,158,198,.24);
  transition:border-color .2s ease,background .2s ease;
}
.tool-btn svg{
  width:15px;height:15px;
  fill:none;stroke:rgba(158,190,228,.7);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .2s ease;
}
.tool-btn:hover{border-color:rgba(150,185,230,.55);background:rgba(19,31,50,.88)}
.tool-btn:hover svg{stroke:rgba(200,222,250,.95)}
.tool-btn.on{border-color:rgba(150,185,230,.62);background:rgba(28,44,68,.9)}
.tool-btn.on svg{stroke:rgba(214,232,255,.98)}

/* ============ 提示（加载完成后短暂出现） ============ */
.toast{
  position:fixed;left:50%;bottom:58px;z-index:28;
  transform:translateX(-50%);
  padding:8px 18px;border-radius:999px;
  font-size:11.5px;letter-spacing:.08em;color:rgba(206,224,246,.9);
  background:rgba(10,17,29,.78);
  border:1px solid rgba(126,158,198,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:1;transition:opacity .9s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.out{opacity:0}

/* ============ 语言音频：自绘控件 ============
   浏览器原生 <audio controls> 是一整块浅色系统控件，在深色面板里非常扎眼。 */
.aud{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
.aud-btn{
  width:28px;height:28px;flex:0 0 auto;padding:0;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(126,158,198,.3);
  transition:border-color .2s ease,background .2s ease;
}
.aud-btn svg{width:10px;height:10px;fill:rgba(178,203,232,.9)}
.aud-btn:hover{border-color:rgba(150,185,230,.6);background:rgba(150,185,230,.12)}
/* 播放中只提亮，不用金色 —— 金色是地球国界的专属 */
.aud.playing .aud-btn{border-color:rgba(178,208,244,.8);background:rgba(150,185,230,.16)}
.aud.playing .aud-btn svg{fill:#e8f2ff}

/* 进度条给足高度：之前只有 3px，在深色面板里几乎看不见，
   看起来就像"只剩按钮和计时器"。 */
.aud-bar{
  flex:1 1 auto;min-width:56px;height:18px;
  display:flex;align-items:center;position:relative;cursor:pointer;
}
.aud-track{
  position:relative;width:100%;height:4px;border-radius:3px;
  background:rgba(160,190,225,.22);
  transition:height .16s ease;
}
.aud-bar:hover .aud-track{height:6px}
.aud-fill{
  position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;
  background:rgba(190,216,248,.85);
  transition:width .1s linear;
}
.aud.playing .aud-fill{background:rgba(214,232,255,.95)}
.aud-fill::after{
  content:"";position:absolute;right:-4px;top:50%;
  width:8px;height:8px;border-radius:50%;
  transform:translateY(-50%) scale(.001);
  background:#eaf3ff;
  transition:transform .16s ease;
}
.aud-bar:hover .aud-fill::after,
.aud.playing .aud-fill::after{transform:translateY(-50%) scale(1)}
.aud-time{
  flex:0 0 auto;min-width:62px;text-align:right;
  font-size:10.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
</style>
</body>
</html>
