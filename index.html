      map: tex, transparent: true, depthWrite: false, side: THREE.FrontSide
    });
    var out = new THREE.Mesh(new THREE.SphereGeometry(radius, 96, 48), mat);

    /* 南北极各补一枚小球。
       等距圆柱贴图在这里有个绕不过去的上限：极点附近所有经度被压进同一个 3D 点，
       纹理的横向分辨率趋近于零，经线不管画多粗都会被压没 —— 所以贴图上的经线
       在离极点还有十来度的地方就断了，看着是散开的，不像交汇。
       两枚小球正好盖住那个缺口，十二条经线看起来就收于一点了。 */
    /* 光补个点不够 —— 贴图的经线在离极点十二度左右就没了，中间还是空的。
       所以这一小段（78°→90°）用 3D 线段补，十二条经线的末端都落在同一个极点坐标上，
       才是真的交汇。线宽 1px 由 GPU 定，和贴图那边被压细的部分正好接得上。 */
    var segPts = [], va = new THREE.Vector3(), vb = new THREE.Vector3();
    for (var mlon = -180; mlon < 180; mlon += 30) {
      for (var mlat = 78; mlat < 90; mlat += 2) {
        llToVec3(mlon, mlat, radius, va);
        llToVec3(mlon, mlat + 2, radius, vb);
        segPts.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
        llToVec3(mlon, -mlat, radius, va);
        llToVec3(mlon, -(mlat + 2), radius, vb);
        segPts.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
      }
    }
    var segGeo = new THREE.BufferGeometry();
    segGeo.setAttribute('position', new THREE.Float32BufferAttribute(segPts, 3));
    out.add(new THREE.LineSegments(segGeo, new THREE.LineBasicMaterial({
      color: 0xe2be78, transparent: true, opacity: 0.55, depthWrite: false
    })));

    /* 极点上再压一枚小球，把贴图与 3D 线的接缝盖住 */
    var dotGeo = new THREE.SphereGeometry(radius * 0.0065, 10, 8);
    var dotMat = new THREE.MeshBasicMaterial({
      color: 0xe6c078, transparent: true, opacity: 0.9, depthWrite: false
    });
    [1, -1].forEach(function (sgn) {
      var dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.set(0, sgn * radius * 1.002, 0);
      out.add(dot);
    });
    return out;
  }

  /* 世界坐标（球面）→ 经纬度 */
  function vec3ToLL(v) {
    var n = v.clone().normalize();
    var lat = Math.asin(Math.max(-1, Math.min(1, n.y))) * R2D;
    var lon = Math.atan2(n.z, -n.x) * R2D - 180;
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lon: lon, lat: lat };
  }

  /* 全量国界索引（223 国 / 1201 环，来自 geo/flat.json）。

     这里原来只在 geo/globe.json 的 **3 个国家**（CN/FR/US）里找 bbox，
     还放宽了 2°。于是点德国国土时，德国整块都落在法国那个大包围盒里，
     函数返回法国 —— 用户看到的就是"点德国跳出法国"。
     点国名反而是对的：那条路走标签自己的 iso，根本不经过这里。

     现在改成：bbox 粗筛 → 按面积升序 → 射线法。小国优先，
     大国包住小国时（南非/斯威士兰、法国/德国）不会再把邻国吞掉。 */
  var FLAT_BOXES = null, FLAT_TRIED = false;

  function loadFlatBoxes() {
    if (FLAT_BOXES || FLAT_TRIED) return;
    FLAT_TRIED = true;
    fetchAny('geo/flat.json')
      .catch(function () { return null; })
      .then(function (d) {
        if (!d || !d.countries) return;
        var sc = d.scale || 1, out = [];
        d.countries.forEach(function (c) {
          var box = { iso: c.iso, x0: 999, y0: 999, x1: -999, y1: -999, rings: [] };
          (c.rings || []).forEach(function (raw) {
            var ring = new Array(raw.length), i, p;
            for (i = 0; i < raw.length; i++) {
              p = [raw[i][0] / sc, raw[i][1] / sc];
              ring[i] = p;
              if (p[0] < box.x0) box.x0 = p[0];
              if (p[1] < box.y0) box.y0 = p[1];
              if (p[0] > box.x1) box.x1 = p[0];
              if (p[1] > box.y1) box.y1 = p[1];
            }
            if (ring.length > 2) box.rings.push(ring);
          });
          if (!box.rings.length) return;
          box.area = Math.max(0.01, (box.x1 - box.x0) * (box.y1 - box.y0));
          out.push(box);
        });
        FLAT_BOXES = out;
      });
  }

  function countryAt(lon, lat) {
    if (FLAT_BOXES && FLAT_BOXES.length) {
      var cand = [], k, c, r;
      for (k = 0; k < FLAT_BOXES.length; k++) {
        var f = FLAT_BOXES[k];
        // 粗筛也放宽一点：球面点击有像素级误差，但 0.6° 已经够
        if (lon >= f.x0 - 0.6 && lon <= f.x1 + 0.6 &&
            lat >= f.y0 - 0.6 && lat <= f.y1 + 0.6) cand.push(f);
      }
      cand.sort(function (a, b) { return a.area - b.area; });
      for (c = 0; c < cand.length; c++) {
        for (r = 0; r < cand[c].rings.length; r++) {
          if (pointInRing(lon, lat, cand[c].rings[r])) {
            return { iso: cand[c].iso, bbox: [cand[c].x0, cand[c].y0, cand[c].x1, cand[c].y1] };
          }
        }
      }
      return null;      // 确认落在海里，不再退回 bbox 乱猜
    }
    /* 索引还在路上时（这条链路 13 秒才到），不要退回三国的 bbox ——
       那正是"点德国跳法国"的来源。改成找最近的国名标签：
       标签位置本来就标在国土内部，误差远小于包围盒。 */
    var best = null, bd = 64;      // 64 平方度，约 8°
    var cosL = Math.cos(lat * Math.PI / 180);
    (globe.labels || []).forEach(function (L) {
      if (!L.iso || !L.lon) return;          // 洲名、洋名没有 iso，跳过
      var dx = (lon - L.lon) * cosL, dy = lat - L.lat;
      var d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = L; }
    });
    return best ? { iso: best.iso, bbox: null } : null;
  }

  /* 排查用：控制台里 __hitTest(10.5, 51) 直接看得某经纬度判给哪个国家。
     地球是三维的，"点屏幕中心"未必落在想点的地方，靠这个才能把
     判定逻辑和点击位置分开验证。 */
  window.__hitTest = function (lon, lat) {
    var c = countryAt(lon, lat);
    return { iso: c && c.iso, ready: !!(FLAT_BOXES && FLAT_BOXES.length) };
  };

  function setActive(iso) {
    globe.active = iso || null;
    /* 点开某国 = 拼上一块：轮廓亮金，且关面板后不熄（lightBorder 内部处理）。
       传 null 只表示"当前不再看谁"，把最亮那条降一档，仍然留着 —— 以前这里
       会 setActive(null) 顺手把金线一起撤掉，于是"退出后国境线还亮着"和
       "退出后全黑了"两种相反的现象在不同路径下都出现过。 */
    if (iso && globe.lightBorder) globe.lightBorder(iso);
    else if (globe.dimCurrent) globe.dimCurrent();
    Array.prototype.forEach.call(
      document.querySelectorAll('.dock-item'),
      function (n) { n.classList.toggle('active', n.dataset.iso === iso); }
    );
  }

  /* 把某国转到正对相机。
     spin 绕 Y：点 (lon,lat) 的方位角 θ=(lon+180)°，令 θ+ry=90° 即朝向 +Z，
     得 ry = -lon - 90。
     tilt 绕 X：正角度使北极转向相机，故北半球国家用正 lat。 */
  function focusCountry(iso, ms) {
    /* 飞向别的国家 = 用户不想钉在中国了 */
    if (iso !== 'CN' && globe.pinCN) setPinChina(false);
    var c = null;
    (globe.data.countries || []).forEach(function (x) { if (x.iso === iso) c = x; });
    if (!c || !globe.spin) return;
    var toY = -c.center[0] * D2R - Math.PI / 2;
    var toX = c.center[1] * D2R;
    var fromY = globe.spin.rotation.y;
    var fromX = globe.tilt.rotation.x;
    var dY = toY - fromY;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;
    var dX = toX - fromX;
    var t0 = performance.now();
    var dur = ms || 760;
    globe.idleUntil = performance.now() + dur + 2600;
    globe.autoSpin = false;
    (function step() {
      var k = Math.min(1, (performance.now() - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      globe.spin.rotation.y = fromY + dY * e;
      globe.tilt.rotation.x = fromX + dX * e;
      if (k < 1) requestAnimationFrame(step);
      else globe.autoSpin = !globe.pinCN;   // 钉住的时候别自己转走
    })();
  }

  /* ---------- 常驻中国 ----------
     原来是一颗一次性动作按钮（act）：按下去飞过去，飞完自转照旧，中国又转走了；
     而且是六个按钮里唯一不会亮的那个 —— 和旁边五个开关明显不是一类。
     改成开关：点亮 = 镜头钉在中国上空并冻结自转，再点一次解除。
     六个按钮于是全是 aria-pressed 开关，点亮态、交互、读屏口径都统一了。

     解除的时机有两处：用户手动拖球（dragDown）、或飞向别的国家（focusCountry）。
     滚轮缩放不算 —— 拉近看中国正是在用它，不该把钉子拔掉。 */
  function setPinChina(on) {
    on = !!on;
    if (globe.pinCN === on) return;
    globe.pinCN = on;
    var btn = document.getElementById('btn-china');
    if (btn) btn.classList.toggle('on', on);   // aria-pressed 由末尾的 MutationObserver 同步
    if (on) {
      globe.camMode = 'manual';
      globe.flying = false;
      /* 高度回到首屏那个 3.02，否则"定位到中国"会变得很随机 ——
         上次放大到街道级别的话，点一下还是贴在街道上。只动相机，不开面板。 */
      globe.camTarget = 3.02;
      focusCountry('CN', 900);
    } else {
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + 600;
    }
  }

  /* ---------- 地球贴图与材质 ----------
     为什么需要 CORS：<img> 展示图片不受跨域限制，但 WebGL **纹理**必须有
     Access-Control-Allow-Origin，否则纹理会加载失败（画布被污染）。这是
     图片与纹理最容易踩的差别 —— 之前 assets 里的图片能显示，不代表贴图能用。

     加载策略（v2026-10-27-G 改）：
       4K 日面、夜面、8K 日面**一起下**，三张都推上显存之后才让球淡入。
     之前是"4K 先出球、8K 后台补"，但补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间（缩放、拖拽、点国家都撞上过）。
     现在把它挪到"球还完全透明"的阶段：屏幕上只有线框地球 + 加载环，
     卡也卡在用户预期之内；球一出现就是最终画质，之后不再有任何贴图切换。
     网络太慢（5.2 秒下不完 8K）才回退到"先出 4K"，迟到的 8K 等手停再挂。 */
  var TEX_BASES = [OBS_BASE + 'assets/tex/', 'assets/tex/'];

  /* 单文件多源尝试：OBS 失败退仓库同域 */
  function loadTex(loader, name, ok, fail) {
    var i = 0;
    (function next() {
      if (i >= TEX_BASES.length) { fail(); return; }
      var url = TEX_BASES[i++] + name;
      loader.load(url, function (t) { ok(t, url); }, undefined, next);
    })();
  }

  /* 8K 只在真有本钱的情况下加载：
     - GPU 最大纹理尺寸够 8192（老集显/手机常见上限 4096）
     - 不是移动端（移动端 8K 纹理 ~180MB 显存，容易直接掉帧）
     - 用户没开省流量 */
  function canUse8K() {
    if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) return false;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;
    if (navigator.connection && navigator.connection.saveData) return false;
    if ((window.innerWidth || 0) < 1024) return false;
    return true;
  }

  /* 三张图一起下：4K 日面、夜面、8K 日面（能上 8K 的机器才要）。
     等 4K 与夜面到齐、且 8K 有结论（成功 / 失败 / 超时）之后才出球。
     为什么不"4K 先出球、8K 后台补"：补的那一刻要把 8192×4096 传上 GPU，
     这笔开销无论怎么挪都会落在用户操作中间 —— 缩放、拖拽、点国家都撞上过。
     现在把上传挪到"球还没出现"的阶段：屏幕上只有星空 + 加载环，
     卡也卡在用户预期之内。 */
  function loadEarthTextures(cb, renderer) {
    var loader = new THREE.TextureLoader();
    var day4 = null, night = null, day8 = null;
    var need = 2, settled8 = false, done = false, msgSent = false;
    /* 注意这里要用传进来的 renderer：globe.renderer 是在 buildGlobe 末尾才赋值的，
       这个函数在赋值之前就被调用了 —— 用 globe.renderer 会永远读到 4096，8K 永远不加载。 */
    var maxTex = (renderer && renderer.capabilities &&
                  renderer.capabilities.maxTextureSize) || 4096;
    var want8 = (maxTex >= 8192 && canUse8K());
    globe.can8k = want8;

    function finish() {
      if (done) return;
      done = true;
      cb(day4, night, day8);
    }
    function maybe() {
      if (done || need > 0) return;
      if (want8 && !settled8) {
        /* 4K 已经到手、还在等 8K：文字换成"准备高清贴图"，
           让用户知道这几秒不是白等（屏幕上已经有线框地球在转）。 */
        if (!msgSent) { msgSent = true; globeMsg('地表影像就位，正在准备高清贴图…'); }
        return;
      }
      finish();
    }

    loadTex(loader, 'earth-day.webp',
      function (t) { day4 = t; need--; maybe(); },
      function () { day4 = null; need--; maybe(); });
    loadTex(loader, 'earth-night.webp',
      function (t) { night = t; need--; maybe(); },
      function () { night = null; need--; maybe(); });

    /* 地形法线贴图：185KB，**不算进"出球"的等待**（need 不加），
       晚到一点没影响 —— 到了把 uBump 打开，地形就有了起伏。
       night 只作用于夜面，日面的山脉/沙漠本来是平的。 */
    loadTex(loader, 'earth-normal.webp',
      function (t) {
        t.anisotropy = 4;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.generateMipmaps = true;
        t.needsUpdate = true;
        globe.normalTex = t;
        if (globe.earthMat) {
          globe.earthMat.uniforms.uNormalMap.value = t;
          globe.earthMat.uniforms.uBump.value = 1;
        }
      },
      function () { /* 拿不到就只是没有起伏，不影响其它 */ });

    if (want8) {      loadTex(loader, 'earth-day-8k.webp', function (t) {
        t.anisotropy = 1;                 // 无 mipmap，各向异性过滤没意义
        t.generateMipmaps = false;        // 省掉最贵的一步（3300 万像素的 mip 链）
        t.minFilter = THREE.LinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.needsUpdate = true;
        day8 = t;
        globe.tex8k = t;
        settled8 = true;
        /* 超时之后才到的：球已经出来了，这时候上传会卡一下。
           标记成 ready，等用户手停下来（渲染循环里）再挂。 */
        if (done) globe.tex8kReady = true;
        maybe();
      }, function () {
        globe.can8k = false;
        settled8 = true;
        maybe();
      });
      /* 网络太慢就别耗着：5.2 秒还没下完就先用 4K 出球。
         迟到的 8K 仍然会被收下（tex8kReady），等手停下来再挂上去。 */
      setTimeout(function () {
        if (settled8) return;
        settled8 = true;
        maybe();
      }, 5200);
    }
  }

  /* ---------- 8K 的"迟到"路径 ----------
     正常情况 8K 和 4K 一起下、一起上传，球一出现就是高清，没有中途切换。
     只有网络太慢（5.2 秒没下完）时才会走这条路：球先出 4K，
     8K 到了先不挂，等用户手停下来（见渲染循环）再挂 —— 那一下的上传卡顿
     才不会落在拖拽/缩放中间。 */
  function bind8k() {
    if (!globe.tex8k || !globe.earthMat) return;
    globe.tex8kReady = false;
    globe.earthMat.uniforms.dayMapB.value = globe.tex8k;
    globe.mixBTarget = 1;
  }

  /* 星空：球面均匀分布的点云，带闪烁。
     用 PointsMaterial 出来的是"一堆死白点"；换成自定义 shader，每颗星带一个
     随机相位，亮度按 sin 缓慢呼吸（周期各不相同），才有真正夜空的感觉。
     半径 26~66 落在相机 far(100) 之内，不跟随地球自转，所以它是"背景"。 */
  var STAR_MAT = null;
  function addStars(scene) {
    /* 相机永远看着球心、fov 固定，所以视野其实是**一个固定的圆锥**。
       把星星撒满整个球面，只有 3% 会出现在画面里 —— 3200 颗看起来像 100 颗。
       所以直接在视野锥里撒（半角 44°，覆盖宽屏的水平视场），
       1400 颗就真的能看到 1400 颗，密度才像夜空。 */
    var N = 2000;
    var COSA = Math.cos(44 * Math.PI / 180);
    /* 一条"银河"：约三分之一星集中在一个大圆带附近（法向 n 的平面），
       实拍照片里银河就是一条斜贯画面的密集带，均匀撒是撒不出来的。 */
    var NW = [0.46, 0.78, 0.42];
    var pos = new Float32Array(N * 3);
    var col = new Float32Array(N * 3);
    var pha = new Float32Array(N);
    var siz = new Float32Array(N);
    var spk = new Float32Array(N);
    for (var i = 0; i < N; i++) {
      var r = 26 + Math.pow(Math.random(), 0.65) * 40;
      var dx, dy, dz, tries = 0;
      do {
        var cosT = 1 - Math.random() * (1 - COSA);
        var sinT = Math.sqrt(Math.max(0, 1 - cosT * cosT));
        var ph = Math.random() * Math.PI * 2;
        dx = sinT * Math.cos(ph);
        dy = sinT * Math.sin(ph);
        dz = -cosT;                        // -Z 是相机朝向，星星在正前方
        // 前三分之一的星要求落在银河带附近（|与带法向的夹角| < 0.34）
        if (i % 2 !== 0) break;
      } while (Math.abs(dx * NW[0] + dy * NW[1] + dz * NW[2]) > 0.24 && ++tries < 14);
      pos[i * 3] = r * dx;
      pos[i * 3 + 1] = r * dy;
      pos[i * 3 + 2] = r * dz;
      // 星色微差：少量暖白、一部分冷蓝、其余纯白，避免一片死白
      var b = 0.46 + Math.random() * 0.54;
      var t = Math.random();
      if (t < 0.18) { col[i*3] = b; col[i*3+1] = b*0.86; col[i*3+2] = b*0.72; }
      else if (t < 0.50) { col[i*3] = b*0.78; col[i*3+1] = b*0.89; col[i*3+2] = b; }
      else { col[i*3] = b; col[i*3+1] = b; col[i*3+2] = b; }
      pha[i] = Math.random() * Math.PI * 2;
      // 幂次压低：多数是小星，少数几颗明显亮 —— 真实夜空就是这个分布
      siz[i] = 0.8 + Math.pow(Math.random(), 2.6) * 2.6;
      // 最亮的那 3% 给十字星芒（实拍里过曝的亮星都带衍射十字）
      spk[i] = (i % 2 === 0 && Math.random() < 0.07) ? 1 : 0;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.Float32BufferAttribute(col, 3));
    g.setAttribute('aPhase', new THREE.Float32BufferAttribute(pha, 1));
    g.setAttribute('aSize', new THREE.Float32BufferAttribute(siz, 1));
    g.setAttribute('aSpike', new THREE.Float32BufferAttribute(spk, 1));

    STAR_MAT = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) }
      },
      vertexShader: [
        'attribute vec3 aColor;',
        'attribute float aPhase;',
        'attribute float aSize;',
        'attribute float aSpike;',
        'uniform float uTime;',
        'uniform float uDpr;',
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vC = aColor;',
        '  vS = aSpike;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        // 每颗星的呼吸周期不同（0.9~2.3 倍速），相位也随机
        '  float tw = 0.5 + 0.5 * sin(uTime * (0.9 + fract(aPhase) * 2.4) + aPhase * 7.0);',
        '  vA = 0.5 + 0.5 * tw;',
        // 点的大小要给足：1 像素以下的点在浏览器里基本看不见，
         // 之前那版就是这样，整片夜空看起来"没有星星"
        '  gl_PointSize = clamp(aSize * uDpr * (52.0 / -mv.z) * (0.85 + 0.3 * tw)',
        '                       * (1.0 + aSpike * 1.6), 1.0, 9.0 * uDpr);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vC;',
        'varying float vA;',
        'varying float vS;',
        'void main() {',
        '  vec2 q = gl_PointCoord - vec2(0.5);',
        '  float d = length(q);',
        // 星核：软边圆点
        '  float core = smoothstep(0.5, 0.06, d);',
        // 十字星芒：两条极窄的亮带叠在核上，只有 vS=1 的亮星才有
        '  float sx = smoothstep(0.045, 0.0, abs(q.x)) * smoothstep(0.5, 0.02, d);',
        '  float sy = smoothstep(0.045, 0.0, abs(q.y)) * smoothstep(0.5, 0.02, d);',
        '  float a = max(core, max(sx, sy) * vS * 0.9);',
        '  gl_FragColor = vec4(vC * vA, a * vA);',
        '}'
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    scene.add(new THREE.Points(g, STAR_MAT));
  }

  function srgbToLin(c) { return Math.pow(c, 2.2); }

  function earthMaterial(dayTex, nightTex) {
    var hasNight = nightTex ? 1 : 0;
    var uniforms = {
      dayMap: { value: dayTex },
      dayMapB: { value: dayTex },   // 8K 到达前先指向同一张，mix 恒为 0
      uMixB: { value: 0 },          // 0 → 1 时从 dayMap 交叉淡化到 dayMapB
      nightMap: { value: nightTex || dayTex },
      hasNight: { value: hasNight },
      nightMix: { value: 0 },       // 0=白天，1=全夜（看城市灯光）
      uFade: { value: 0 },          // 整球淡入，避免"啪"一下贴上来
      /* 昼夜分界：按太阳方向决定这半边用白天贴图还是夜间贴图。
         uTermOn=0 时完全不参与计算，行为和以前一模一样。 */
      uSunDir: { value: new THREE.Vector3(1, 0, 0) },
      uTermOn: { value: 0 },
      /* 地形法线：贴图没到时 uBump 保持 0，整段计算被跳过，
         行为和加这个功能之前完全一样。 */
      uNormalMap: { value: dayTex },
      uBump: { value: 0 },
      uNormalScale: { value: 1.25 },
      uRelief: { value: 2.1 },
      uShade: { value: 1.0 },
      /* 专题图层（气候 / 地形）：uLayerMap 是等距柱状贴图，uLayerMix 做淡入。
         uLayerMix=0 时整段不参与计算，行为和没有这个功能之前一模一样。
         气候贴图海洋处 alpha=0，于是海面仍透出底下的卫星影像；
         地形贴图不透明，整颗球换成地图册式的高程着色。 */
      uLayerMap: { value: null },
      uLayerMix: { value: 0 },
      uSpec: { value: 0.7 },
      uSpecPow: { value: 26.0 },
      uTone: { value: 0.9 },
      uLight: { value: new THREE.Vector3(0, 0, 1) }
    };

    var vert = [
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'void main() {',
      '  vUv = uv;',
      // vNL 是没旋转过的法线：昼夜分界要"钉在地表上"，不能被自转/拖拽带跑
      '  vNL = normalize(normal);',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vV = normalize(cameraPosition - wp.xyz);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    /* 光照只跟「面朝相机」有关，不再跟世界坐标里的太阳位置有关。
       原因很直接：地球一转，固定光源就会把暗面转到正面，于是"白天模式"
       看起来总有半颗球是黑的。现在亮面永远朝着观察者，边缘做一点收暗
       保留球体的立体感，但不再出现晨昏线 —— 白天就是全球白天。 */
    var frag = [
      'uniform sampler2D dayMap;',
      'uniform sampler2D dayMapB;',
      'uniform sampler2D nightMap;',
      'uniform float uMixB;',
      'uniform float hasNight;',
      'uniform float nightMix;',
      'uniform float uFade;',
      'uniform vec3 uSunDir;',
      'uniform float uTermOn;',
      'uniform sampler2D uNormalMap;',
      'uniform float uBump;',
      'uniform float uNormalScale;',
      'uniform float uRelief;',
      'uniform float uShade;',
      'uniform float uSpec;',
      'uniform float uSpecPow;',
      'uniform float uTone;',
      'uniform vec3 uLight;',
      'uniform sampler2D uLayerMap;',
      'uniform float uLayerMix;',
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vNL;',
      'varying vec3 vV;',
      'vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }',
      'vec3 l2s(vec3 c){ return pow(c, vec3(1.0/2.2)); }',
      'void main() {',
      '  vec3 n = normalize(vN);',
      '  vec3 v = normalize(vV);',
      '  float facing = max(dot(n, v), 0.0);',
      // 只在轮缘收暗到 80%，既有体积感又不出现"暗面"
      '  float limb = mix(0.80, 1.0, smoothstep(0.0, 0.66, facing));',
      '  vec3 dA = s2l(texture2D(dayMap, vUv).rgb);',
      '  vec3 dB = s2l(texture2D(dayMapB, vUv).rgb);',
      /* 一张像素覆盖几个 uv × 8192 = 每屏幕像素吃几个 8K 纹理像素。
         放大时（<1）才用 8K；缩小时 8K 会走 mip 缺失的最近邻采样而闪烁，
         所以缩小时退回带 mipmap 的 4K —— 两张图按这个比例软过渡，没有跳变。 */
      '  float tpp = max(fwidth(vUv.x), fwidth(vUv.y)) * 8192.0;',
      '  float k = smoothstep(1.5, 0.8, tpp) * uMixB;',
      /* ---------- 体积光 ----------
         贴图直出时整颗球亮度一样，看着就是个圆片。这里加一束"从观察者
         左上方打过来"的光（跟法线起伏用的是同一束，两者方向一致才不打架）：
         亮面提 10%、暗面压 30%，球就有了立体感。
         光跟着相机走而不是太阳 —— 否则地球一转，暗面就转到正面，
         "白天模式"里会凭空出现半个黑夜。 */
      /* 光必须是**一个方向**，不能拿"点到相机的方向"加个偏移凑：
         v 每个像素都不同，等于光源跟着像素乱转，明暗自然出不来。
         uLight 由 CPU 每帧按相机算好（相机上方偏左）。 */
      '  vec3 Lv = normalize(uLight);',
      '  float sdot = dot(n, Lv);',
      '  float shade = mix(1.0 - 0.60 * uShade, 1.0 + 0.20 * uShade,',
      '                    smoothstep(-0.55, 0.85, sdot));',
      '  vec3 day = mix(dA, dB, k) * limb * shade;',
      /* ---------- 海面反光 ----------
         海水和陆地的差别在蓝通道：海是"蓝远大于红"。用这个差当遮罩，
         在光来的那一侧加一块小而亮的高光（Blinn-Phong，指数 46 = 很紧的一点）。
         这是"球是立体的"最有效的暗示 —— 一块会移动的亮斑，
         比任何明暗渐变更像真的。 */
      '  float sea = smoothstep(0.012, 0.075, day.b - day.r);',
      '  vec3 Hv = normalize(Lv + v);',
      '  float spec = pow(max(dot(n, Hv), 0.0), uSpecPow) * sea * uSpec;',
      '  day += vec3(0.42, 0.56, 0.78) * spec;',
      /* ---------- 地形法线（起伏） ----------
         贴图本身是"平"的：山脉和沙漠一样亮，只能靠颜色区分。
         这里用一张法线贴图把每个像素的法线歪一下，再跟"从观察者左上方
         打过来"的一束光做点积，明暗差就是这一点的起伏。
         光源固定在相机侧而不是太阳侧 —— 否则转到夜面时整片地形全黑。
         TBN 不用屏幕导数算：球面的切向就是"东"和"北"，
         east = 上 × n，north = n × east，两个叉乘就够。 */
      '  if (uBump > 0.5) {',
      '    vec3 nt = texture2D(uNormalMap, vUv).xyz * 2.0 - 1.0;',
      '    vec3 east = cross(vec3(0.0, 1.0, 0.0), n);',
      '    if (length(east) < 0.0008) east = vec3(1.0, 0.0, 0.0);',
      '    east = normalize(east);',
      '    vec3 north = normalize(cross(n, east));',
      '    vec3 nP = normalize(n + (east * nt.x + north * nt.y) * uNormalScale);',
      '    vec3 L = Lv;',
      '    float rl = (dot(nP, L) - dot(n, L)) * uRelief;',
      '    day *= clamp(1.0 + rl, 0.52, 1.62);',
      '  }',
      '  vec3 col = day;',
      '  float nightK = nightMix;',   // 夜里用多少夜间贴图（0=全白天）
      '  if (hasNight > 0.5) {',
      '    vec3 lights = s2l(texture2D(nightMap, vUv).rgb);',
      /* 夜图自己的"深蓝海面"就是整片蓝雾的来源：直接乘 3.2 会把它一起提亮。
         先按亮度做软阈值，只留真正的灯光，底噪压掉；再补 0.6% 的地表亮度
         给陆地一点轮廓 —— 再多就又开始发蓝了。 */
      '    float ll = dot(lights, vec3(0.299, 0.587, 0.114));',
      '    lights *= smoothstep(0.014, 0.11, ll);',
      /* 夜半球保留 10% 的地表亮度（原来是 0.6%）。
         纯灯光的夜面是一块黑，看不出那边是什么大陆；留一点底色，
         轮廓认得出来，又不至于像加了层蓝雾。 */
      /* 2.1 → 2.9：加了 ACES 之后中间调被压，灯光显得发闷，
         这里补回来，夜里还是一眼能看出城市带。 */
      '    vec3 night = lights * 2.9 + day * 0.10;',
      /* 昼夜分界：世界坐标法线点太阳方向，>0 是白昼侧。
         ±0.05 的过渡带 ≈ 3°，一条柔和的过渡，不是一条硬线。 */
      '    if (uTermOn > 0.5) {',
      // 用局部法线：分界跟着地表走，转球/自转都不会让它跑掉
      '      float sd = dot(normalize(vNL), normalize(uSunDir));',
      '      float dayK = smoothstep(-0.05, 0.05, sd);',
      '      nightK = max(nightMix, (1.0 - dayK) * uTermOn);',
      '    }',
      '    col = mix(day, night, nightK);',
      '  }',
      // 边缘大气：Fresnel 越靠轮廓越亮，模拟散射
      '  float rim = pow(1.0 - facing, 3.8);',
      // 夜面把蓝色边缘光收掉大半，否则整个轮廓糊成一圈蓝雾
      '  col += vec3(0.12, 0.32, 0.66) * rim * 0.26 * (1.0 - 0.7 * nightK);',
      /* 这里必须自己转回 sRGB。
         实测过：three 的 outputColorSpace 只作用于内置材质，
         自写的 ShaderMaterial 不会被追加 colorspace 转换 ——
         去掉这行，渲染出来的像素正好比贴图暗一个 gamma（102 → 35）。
         取中心点与 8K 贴图同坐标对比：贴图 (101,80,48)、渲染 (102,81,48)，
         一一对上，说明这条链路是对的。 */
      /* ---------- 轻微调色 ----------
         和实验页并排看，这颗球"发淡"：贴图直出没有明暗层次，
         中间调偏灰。这里补两笔（都作用在线性值上）：
         · 提饱和 12%：把每个像素往远离灰色的方向推
         · 压一点暗部：pow(1.06) 让中间调略沉，白的地方基本不动
         数值都很小，目的是"更像照片"，不是滤镜。 */
      '  float lum0 = dot(col, vec3(0.2126, 0.7152, 0.0722));',
      '  col = mix(vec3(lum0), col, 1.12);',
      /* ACES 的近似曲线（Narkowicz 版），在**线性**空间里压中间调、收高光：
         这正是实验页看起来"厚"的原因 —— 它挂了 toneMapping，我们没挂。
         直接照搬会让整颗球发闷，所以用 uTone 控制混合比例。 */
      '  vec3 aces = (col * (2.51 * col + 0.03)) / (col * (2.43 * col + 0.59) + 0.14);',
      '  col = mix(col, aces, uTone);',
      '  col = pow(max(col, 0.0), vec3(1.06));',
      /* ---------- 专题图层（气候 / 地形） ----------
         必须放在**调色之后**：ACES + 提饱和 + pow(1.06) 会把图层压暗，
         地球上的颜色就和图例的色块对不上了（用户一眼就看出来了）。
         放在最后 → 输出正好等于贴图原色。
         limb 保留边缘收暗，球不至于看起来像一张贴纸。
         alpha 参与混合：气候图海洋 alpha=0，海面继续用卫星影像。 */
      '  if (uLayerMix > 0.001) {',
      '    vec4 lc = texture2D(uLayerMap, vUv);',
      '    col = mix(col, s2l(lc.rgb) * limb, lc.a * uLayerMix);',
      '  }',
      '  gl_FragColor = vec4(l2s(col) * uFade, 1.0);',
      '}'
    ].join('\n');

    return new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vert,
      fragmentShader: frag
    });
  }

  /* ---------- 球面地名标注 ----------
     "像谷歌地图"拆开就是两件事，都靠数据 + 一次贪心排布解决：

     ① 每个地名自带「从第几级缩放开始出现」的门槛。这个门槛不是我们拍的，
        是 Natural Earth 的 MIN_LABEL（制图师标好的）—— 世界视角只出现
        二十来个大国与洲名，拉近了小国才逐个浮出。
     ② 放不下的让位。按重要度从高到低试着放，和已放的矩形一撞就藏。
        242 个国家名同时铺上去必然糊成一团，避让才是"专业感"的来源。

     用 3D 点投影到屏幕坐标，而不是 CSS2DRenderer（那要多引一个模块）。 */
  var NE_FAR_ZOOM = 2.0;          // 世界视角 ≈ Natural Earth zoom 2.0
  var _lp = null;
  var _lc = null;                 // 复用的投影临时量，避免每帧分配

  function neZoomNow() {
    var z = globe.camTarget || CAM_FAR;
    return NE_FAR_ZOOM + (CAM_FAR - z) * 2.4;
  }

  var LABEL_POP = {};
  var LABEL_META = null;     // geo/meta.json：所有国家的名称/大洲/人口/中心点
  /* iso → 主权国 iso。港/澳/台这类地区在 labels.json 里带 parent（CN），
     球面点它们时不能开独立档案卡，要落到主权国（中国）的档案上。
     从 labels.json 的 countries 提取（40 条：格陵兰→DK、关岛→US、港澳台→CN……）。 */
  var SOVEREIGN = { TW: 'CN', HK: 'CN', MO: 'CN' };  // 港澳台先硬兜底，labels.json 到了再按数据补齐

  function buildLabels(pack) {
    var host = document.getElementById('labels');
    if (!host || !pack) return;
    host.innerHTML = '';
    globe.labels = [];
    if (!_lp) _lp = new THREE.Vector3();
    /* 各国人口（NE 的 POP_EST），卡片用它决定"要不要列地区语言"：
       小国只留官方语言。数据里没有人口时按 0 处理，等于不筛。 */
    LABEL_POP = pack.pops || {};

    /* 归属表：地区 iso → 主权国 iso（港澳台→CN、格陵兰→DK、法属波利尼西亚→FR……）。
       球面点击靠它把"点地区"落到"主权国的档案"，不再给台湾这类地区单开一张卡。 */
    /* 不清空：港澳台的硬兜底必须先留着，labels.json 里有的按 iso 覆盖上来 */
    (pack.countries || []).forEach(function (c) {
      if (c.iso && c.parent) {
        SOVEREIGN[String(c.iso).toUpperCase()] = String(c.parent).toUpperCase();
      }
    });

    /* 优先级的唯一含义是"抢位顺序"：数字小的先放，后来者撞上就让。
       国家要排在大洲前面 —— 大洲的锚点几乎一定压在大国领土上（南美洲的锚点
       就在巴西境内），大洲先放的话，巴西、阿根廷在全球视角永远显示不出来，
       屏幕上只剩"南美洲"。 */
    var list = [];
    (pack.countries || []).forEach(function (c) {
      /* 有完整档案的（cn/fr/us）排最前、样式更亮；
         其余国家也可点，但只是基础档案，按普通国名处理。 */
      list.push({ c: c, cls: c.d ? 'mk' : '', pri: c.d ? 0 : 1 });
    });
    (pack.oceans || []).forEach(function (c) { list.push({ c: c, cls: 'mo', pri: 2 }); });
    (pack.continents || []).forEach(function (c) { list.push({ c: c, cls: 'mc', pri: 3 }); });
    /* 岛 / 湖 / 海峡：都要放大到很后面才出现，优先级最低 —— 位置冲突时先让国家名 */
    (pack.features || []).forEach(function (c) {
      list.push({ c: c, cls: c.k === 'i' ? 'mi' : (c.k === 'l' ? 'ml' : 'ms'), pri: 4 });
    });

    // 只排一次。同优先级内保持数据本身的顺序（国家已按 LABELRANK 排好）
    list.sort(function (a, b) { return a.pri - b.pri; });

    list.forEach(function (it) {
      var c = it.c, d = el('div', 'mlabel' + (it.cls ? ' ' + it.cls : ''), c.n);
      var rec = {
        el: d, lon: c.lon, lat: c.lat, z: c.z || 0,
        kind: it.cls || 'kp', iso: c.iso || '',
        v: new THREE.Vector3(), w: 0, h: 0, on: false
      };
      var tgt = c.iso || c.parent || "";
      if (tgt) {
        d.dataset.iso = tgt;
        /* 按在字上也要能转球：把 pointerdown 交给同一套拖拽逻辑。
           松开时如果位移很小才算"点击"，否则一次拖拽会顺手打开一个档案。 */
        d.addEventListener('pointerdown', function (e) {
          if (globe.dragDown) globe.dragDown(e);
        });
        d.addEventListener('click', function (e) {
          e.stopPropagation();
          if (globe.moved > 6) return;
          openCountry(c);
        });
        /* 悬停预热：鼠标停在国名上，多半下一步就是点它。
           几何和档案一起取 —— 点下去时两条链路都已落地，卡片和国界同时出现。
           这是替代原来「开机 4 秒后把 236 个档案全部预取一遍」的做法：
           那个方案实测要下 5MB、耗时 33 秒，把首屏带宽全占了，
           而用户一次浏览最多点三五个国家。 */
        d.addEventListener('mouseenter', function () {
          var up = String(tgt).toUpperCase();
          loadGeo(up);
          prefetchCard(up);
        });
      }
      host.appendChild(d);
      globe.labels.push(rec);
    });

    // 量一遍尺寸（此时全部 opacity:0 但已布局，一次 reflow 拿全）
    globe.labels.forEach(function (L) {
      L.w = L.el.offsetWidth || 40;
      L.h = L.el.offsetHeight || 16;
    });
  }

  function hideLabel(L) {
    if (L.on || L._o !== '0') { L.on = false; L._o = '0'; L.el.style.opacity = '0'; }
    /* 飞行 / 拖拽期间**不撤销** will-change。
       撤销再重建一次，浏览器要把这段文字重新栅格化、重传一张纹理；
       760ms 的飞行里几十个标签反复进出，就是"镜头一顿一顿"的主要来源
       （实测：把标签层整个藏起来，同一段飞行掉帧从 6 次变 0 次）。
       停下来后的下一帧，这里会因为 flying/dragging 都为 false 而统一收掉，
       层数不会越积越多。 */
    if (L._wc && !globe.flying && !globe.dragging) { L._wc = 0; L.el.style.willChange = 'auto'; }
    if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
  }

  /* ---------- 地形标签 ----------
     山脉 / 高原 / 盆地 / 平原 / 沙漠 / 河流 / 名峰，结构对齐国名标签
     （el / lon / lat / z / v / w / h / on），updateLabels 直接复用同一套
     投影、球缘裁剪和矩形避让 —— 不必再写一份。 */
  function buildTerrainLabels(data) {
    var host = document.getElementById('tlabels');
    if (!host || !data) return;
    host.innerHTML = '';
    globe.tlabels = [];
    if (!_lp) _lp = new THREE.Vector3();
    data.forEach(function (d) {
      var node = el('div', 'tlabel k-' + d.k, d.n);
      host.appendChild(node);
      /* 点名字 → 在球上画出这块地貌的边界。按在字上也要能转球，
         所以 pointerdown 交给拖拽逻辑，松手位移很小才算点击。 */
      node.addEventListener('pointerdown', function (e) {
        if (globe.dragDown) globe.dragDown(e);
      });
      node.addEventListener('click', function (e) {
        e.stopPropagation();
        if (globe.moved > 6) return;
        if (globe.toggleTShape) globe.toggleTShape(d.n);
      });
      globe.tlabels.push({
        el: node, lon: d.lon, lat: d.lat, z: d.z || 4,
        kind: d.k, pri: d.z || 4, tap: true,
        v: new THREE.Vector3(), w: node.offsetWidth, h: node.offsetHeight, on: false
      });
    });
  }

  /* ---------- 地形边界 ----------
     点地形名 → 在球上画出这块山 / 盆地 / 高原的外轮廓。
     数据来自 Natural Earth 的面要素，构建期抽稀成 0.1° 精度的整数点
     （geo/terrain_shapes.json，约 200KB，点一次才下载）。

     颜色用青白而不是金色：金色留给地名和「定位」标记，而且地形底图是棕绿
     暖色，金线压上去几乎看不见。 */
  var tShapeData = null, tShapeLoading = false, tShapeLine = null, tShapeName = '';
  var TSHAPE_COLOR = 0x9ff0ff;

  function tShapeClear() {
    if (tShapeLine) {
      if (tShapeLine.parent) tShapeLine.parent.remove(tShapeLine);
      tShapeLine.traverse(function (c) {
        if (c.geometry) c.geometry.dispose();
        if (c.material) c.material.dispose();
      });
    }
    tShapeLine = null;
    if (tShapeName) {
      (globe.tlabels || []).forEach(function (L) {
        if (L.el.textContent === tShapeName) L.el.classList.remove('picked');
      });
    }
    tShapeName = '';
  }
  globe.tShapeClear = tShapeClear;

  function tShapeDraw(name, ring) {
    if (!globe.sphere || !ring || ring.length < 3) return;
    /* 河流用更细的线：河流是线要素，本来就该比山脉轮廓细一档 */
    var kind = '';
    (globe.tlabels || []).forEach(function (L) {
      if (L.el.textContent === name) kind = L.kind;
    });
    var RAD = kind === 'river' ? 0.0009 : 0.0015;
    var n = ring.length;
    /* 闭合判定：面要素首尾点重合，河流不是。坐标是 ×10 的整数，5 就是 0.5°。 */
    var closed = Math.abs(ring[0][0] - ring[n - 1][0]) < 5 &&
                 Math.abs(ring[0][1] - ring[n - 1][1]) < 5;

    /* 按"跨换日线就断开"切成若干段折线。
       不切的话，楚科奇、斐济那种环会在经度上从 +179 跳到 -179，
       连起来就是横穿整个球面的一条直线。 */
    var runs = [], cur = [];
    for (var i = 0; i < n + (closed ? 1 : 0); i++) {
      var q = ring[i % n];
      var lon = q[0] / 10, lat = q[1] / 10;
      if (cur.length) {
        var prev = cur[cur.length - 1];
        if (Math.abs(lon - prev[0]) > 180) { runs.push(cur); cur = []; }
      }
      cur.push([lon, lat]);
    }
    if (cur.length > 1) runs.push(cur);
    if (!runs.length) return;

    var group = new THREE.Group();
    group.userData.tshape = true;
    var MAT = new THREE.MeshBasicMaterial({
      color: TSHAPE_COLOR, transparent: true, opacity: 0.95, depthWrite: false
    });
    var v = new THREE.Vector3();

    /* 用细管（TubeGeometry）而不是 Line：
       WebGL 的 linewidth 在绝大多数平台被忽略，画出来永远 1px ——
       球面缩到 700px 宽时这条线几乎看不见。管子的粗细由几何决定，
       0.0038 个球半径 ≈ 半径 1.5px，才是一条"看得见的线"。 */
    runs.forEach(function (pts) {
      if (pts.length < 2) return;
      var vs = pts.map(function (q) {
        llToVec3(q[0], q[1], 1.0068, v);
        return new THREE.Vector3(v.x, v.y, v.z);
      });
      var curve = new THREE.CatmullRomCurve3(vs, false, 'catmullrom', 0);
      var seg = Math.min(Math.max(vs.length * 2, 16), 400);
      var geo;
      /* 线宽按要素类型分：山脉/盆地这种"区域轮廓"用细线勾勒（约 1.2px），
         河流更细（约 0.7px），像地图册上那样 —— 之前一律 0.0038 太粗，
         看着像给地貌描了个黑边。 */
      try {
        geo = new THREE.TubeGeometry(curve, seg, RAD, 4, false);
      } catch (e) { return; }
      var mesh = new THREE.Mesh(geo, MAT);
      mesh.renderOrder = 3;
      group.add(mesh);
    });
    if (!group.children.length) return;
    tShapeLine = group;
    globe.sphere.add(group);
  }

  function tShapeApply() {
    if (!tShapeName || !tShapeData) return;
    var ring = tShapeData[tShapeName];
    if (!ring) return;
    tShapeDraw(tShapeName, ring);
    (globe.tlabels || []).forEach(function (L) {
      if (L.el.textContent === tShapeName) L.el.classList.add('picked');
    });
  }
  globe.tShapeApply = tShapeApply;

  /* 点名字：第一次选它、再点一次取消；点另一块就换过去。 */
  globe.toggleTShape = function (name) {
    if (tShapeName === name) { tShapeClear(); return; }
    if (tShapeData) {
      tShapeName = name;
      tShapeClear();
      tShapeName = name;
      tShapeApply();
      return;
    }
    if (tShapeLoading) return;
    tShapeLoading = true;
    tShapeName = name;
    fetchAny('geo/terrain_shapes.json').then(function (d) {
      tShapeData = d || {};
      tShapeLoading = false;
      tShapeApply();
    }).catch(function () { tShapeLoading = false; });
  };

  function updateLabels() {
    /* 图层模式下换一套数据源：国名让位给地形名（两层同时铺满必然糊成一团）。
       但开了"全部国境线"就得反过来 —— 判国家要靠国名，地形名这时收起来。 */
    var useTerrain = !!(globe.layerName && !globe.allBordersOn &&
                        globe.tlabels && globe.tlabels.length);
    var arr = useTerrain ? globe.tlabels : globe.labels;
    if (!arr || !arr.length) return;
    var stage = globeStage();
    if (!stage) return;
    var paint = [];                 // 本帧要画的标签：[[x, y, alpha, L], ...]
    if (!_lp) _lp = new THREE.Vector3();
    if (!_lc) _lc = new THREE.Vector3();
    var w = stage.clientWidth, h = stage.clientHeight;
    var nz = neZoomNow();
    var camPos = globe.camera.position;
    var camLen = camPos.length() || 1;
    var placed = [];               // 已占用矩形 [x0,y0,x1,y1]

    /* ---- 两道"分批上"的闸门（治点击后镜头一顿一顿）----
       实测：点开一个国家，镜头压到 CAM_NEAR 之后屏幕上的地名会从十几条
       跳到七十多条 —— 探针中途取样那一次，60ms 内新冒出 59 条。
       每冒一条就是一次文字栅格化 + 一次合成层创建，59 条挤在同一帧里，
       那一帧必然超过 16.7ms；而飞行期间这七十几条又每帧改 transform，
       把飞行段的每一帧都顶在预算线上（实测：把整个地名层藏起来，掉帧归零）。

       ① 每帧最多放 10 条新地名的名额。多出来的等下一帧、再下一帧 ——
          反正只差几十毫秒，观众看到的是"渐次浮现"，比"唰一下全出来"更好看。
       ② 镜头在飞/手在拖时，在场地名封顶 34 条（按优先级，也就是 Natural Earth
          的 LABELRANK，重要的先上）。已经在场的永不因这条被撤，所以不会闪。
          停下来后名额恢复，剩下的地名照样补齐 —— 静止时的画面和原来完全一样。 */
    /* 原来 34 / 10：飞行时最多 34 条、每帧只放 10 条新地名 —— 慢机上要两秒才铺满
       （实测点开法国后可见标签 31→39→47→…→60，到 +2 秒才齐），用户反馈
       "国家名晚了好几秒才出来"。现在放宽到 100 / 60：一帧就能把候选全部摆上，
       几乎看不出"渐次浮现"，代价是那一帧多栅格化几十条文字。
       100 这个上限也不是随便定的：1280×800 下经矩形避让后实际最多只能摆 60 条左右，
       所以它基本不再构成瓶颈，只是防止极小屏幕上叠字。
       用户第二次反馈"点了国家之后有些国家或岛屿的名字会延迟"——就是这两个数字
       卡出来的（岛屿在优先级里排最后，名额一满全被挡住，要等飞行结束才补上）。 */
    var flyCap = (globe.flying || globe.dragging) ? 100 : 1e9;
    var newBudget = 60;

    /* ---- 球体的屏幕投影圆 ----
       球在透视投影下仍是一个圆：视半角 asin(R/z)，投影到 NDC 的半径
       = tan(asin(R/z)) / tan(fov/2)，再乘半屏高就是像素半径。
       以前只按"法线朝向"过滤，但球缘的点投影压缩得很厉害，标签自己还有宽高，
       于是字会越过球的轮廓、飘在星空上。现在硬性要求整个标签框都落在圆内。 */
    var vHalf = (globe.camera.fov * 0.5) * Math.PI / 180;
    var silN = Math.tan(Math.asin(Math.min(0.995, 1 / camLen))) / Math.tan(vHalf);
    var rPx = silN * h * 0.5;
    _lc.set(0, 0, 0).project(globe.camera);
    var cx = (_lc.x * 0.5 + 0.5) * w;
    var cy = (-_lc.y * 0.5 + 0.5) * h;

    for (var i = 0; i < arr.length; i++) {
      var L = arr[i];

      /* 位置要先算出来：下面"该不该显示"不再只看全局 nz，
         还要看这个标签离视点中心有多近（见 centerBoost）。 */
      llToVec3(L.lon, L.lat, 1.02, L.v);
      L.v.applyMatrix4(globe.spin.matrixWorld);
      // 与相机方向的夹角余弦：1 = 正在视点中心，0 = 球的侧面
      var dot = (L.v.x * camPos.x + L.v.y * camPos.y + L.v.z * camPos.z) /
                (L.v.length() * camLen);

      /* 视点中心加成 —— 治"点开国家后，周围的国家和岛屿名字不出现"。
         原来只按全局 nz 判定门槛，可 nz 只由相机距离决定：
           全球视角 z=CAM_FAR   → nz = 2.0
           点开一个国家 z=CAM_NEAR → nz = 2.5   （就这两档）
         而 labels.json 里国家 z 的中位数是 4.0、岛屿在 3.2~4.4 ——
         也就是说点进去之后，门槛 2.5 只够让"最大的那几十个"名字露头，
         用户想看的周边小国和岛屿全在门槛之外，得自己再滚一轮滚轮才会冒出来。
         所以聚焦模式下按视线放宽：正对镜头那片最多放宽 2 档，球缘那片 0.25
         以下不放宽。全球视角（camMode=far）不加成，保持干净的地球。 */
      var focusMode = (globe.camMode === 'near' || globe.flying);
      var centerBoost = focusMode ? Math.max(0, (dot - 0.25) / 0.75) * 2.0 : 0;
      var nzEff = nz + centerBoost;

      // ① 缩放门槛：洲名远了才在、洋名中段、国名按 MIN_LABEL 逐个放开
      /* 国家名一律走 MIN_LABEL，中法美也不例外 ——
         "永远显示"会让缩小以后只剩三个名字挂在球上，看着像作弊。
         可点这件事不靠显示来保证：它们仍然排在最前面（避让时优先）。 */
      var show;
      if (L.kind === 'mc') show = nz < 3.5;          // 大洲：拉近就撤
      else if (L.kind === 'mo') show = nzEff >= (L.z || 0);  // 海域：按各自的门槛浮现
      /* 留 0.03 的容差：全球视角 nz 恰好算成 2.0，可相机阻尼永远差一点点
         到不了目标值，nz 就是 1.99x —— 于是 MIN_LABEL=2.0 的那批大国
         （巴西、阿根廷、中国）在全球视角全都不显示。 */
      /* 滞回：已经显示出来的标签，要掉到门槛以下 0.09 才撤。
         没有这条时，飞行中 nz 连续变化，边缘的小国会一帧显示一帧隐藏，
         屏幕上就是一片乱闪。 */
      else show = nzEff >= L.z - (L.on ? 0.09 : 0.03);
      if (!show) { hideLabel(L); continue; }

      /* 只留"正对镜头的那一面"。之前阈值 0.14 太松，球edge一圈的国家名
         全被投影到画面边界上挤成一圈 —— 现在 0.30 起步，再往上渐显。 */
      /* 国名要求正对镜头（球面 61° 以内），否则球边缘那一圈压缩得最厉害、
         文字挤成一排。大洲大洋例外：它们本来就稀疏、一个字管一大片，
         放宽到 75° 才能压住画面四周的空。 */
      /* 只留"真正正对镜头"的那一片：0.62 约等于球面 ±52°。
         再往外，投影压缩得厉害，字会飘到球外、压在星空上。 */
      /* 圆边界裁剪已经保证"字不会出球"，所以这里不必再用很高的角度门槛。
         门槛太高（0.62≈52°）时，巴西、阿根廷这种正好落在球缘附近的国家
         会整片消失 —— 那是"少了一半国家"而不是"更干净"。 */
      var dotMin = (L.kind === 'mc' || L.kind === 'mo') ? 0.26 : 0.34;
      // 同理：已经显示的，多给 0.06 的余量再撤
      if (dot < dotMin - (L.on ? 0.06 : 0)) { hideLabel(L); continue; }

      _lp.copy(L.v).project(globe.camera);
      var x = (_lp.x * 0.5 + 0.5) * w;
      var y = (-_lp.y * 0.5 + 0.5) * h;
      /* 岛屿标签抬到点上方：小岛本来就只有几个像素，字压在正中间等于把岛盖住。 */
      if (L.kind === 'mi') y -= L.h * 0.75;

      // 出画一半的地名直接藏：贴着边缘被切一半的字比没有还难看
      var rx = x - L.w / 2, ry = y - L.h / 2;
      if (rx < 2 || rx + L.w > w - 2 || ry < 2 || ry + L.h > h - 2) { hideLabel(L); continue; }

      /* 整个标签框必须落在球体投影圆内（用框的对角半径算，不是中心点）：
         中心在圆内、四个角探出去的，照样会飘在星空上。 */
      var qx = Math.abs(x - cx) + L.w * 0.5;
      var qy = Math.abs(y - cy) + L.h * 0.5;
      var far = Math.sqrt(qx * qx + qy * qy);
      var discA = (rPx * 0.99 + (L.on ? 9 : 0) - far) / Math.max(22, rPx * 0.13);
      if (discA <= 0) { hideLabel(L); continue; }
      discA = Math.min(1, discA);

      // ② 矩形避让
      /* 避让带容差：已经显示出来的标签，被别人压掉一半以内就先让着，
         压掉一半以上才撤。没有容差时，两个位置接近的地名会随零点几像素
         的位移反复抢位 —— 屏幕上就是"一闪一闪"。
         新出现的标签（L.on 为 false）仍然要求完全不重叠，保证不会挤成一坨。 */
      var area = L.w * L.h, cover = 0;
      for (var k = 0; k < placed.length; k++) {
        var q = placed[k];
        var ox = Math.min(rx + L.w, q[2]) - Math.max(rx, q[0]);
        var oy = Math.min(ry + L.h, q[3]) - Math.max(ry, q[1]);
        if (ox > 0 && oy > 0) cover += ox * oy;
        if (!L.on && cover > 0) break;
      }
      if (cover > (L.on ? area * 0.5 : 0)) { hideLabel(L); continue; }
      /* 上面两道闸门：已经显示的不受名额限制（免得一闪一闪），
         新出现的才排队。 */
      if (!L.on) {
        if (placed.length >= flyCap || newBudget <= 0) { hideLabel(L); continue; }
        newBudget--;
      }
      placed.push([rx, ry, rx + L.w, ry + L.h]);

      /* 两道渐隐：越靠近球轮廓越淡（转过去就不会突然消失），
         越靠近屏幕边缘越淡（不贴着边界堆成一圈）。 */
      // 距阈值 0.18 以内渐显，再往里满亮
      var limb = Math.min(1, Math.max(0, (dot - dotMin) / 0.16));
      var edge = Math.min(Math.min(rx, w - rx - L.w), Math.min(ry, h - ry - L.h));
      var edgeA = Math.min(1, Math.max(0, edge / 110));
      /* 以前是 limb*edgeA*discA 三连乘，越靠近球缘/屏幕边缘越淡，最后只剩一丁点不透明度。
         实测代价：加拿大、格陵兰这些正好落在雪原上的国名，本来就白字压白雪，
         再被乘到 0.1 就直接看不见了。改成给"贴边"留一条下限 —— 仍然会淡，
         但淡到 0.6 就打住，不会淡成不存在。 */
      var alpha = limb * (0.60 + 0.40 * edgeA * discA);
      if (alpha < (L.on ? 0.05 : 0.08)) { hideLabel(L); continue; }

      /* 341 个标注每帧无脑写 style 是最贵的一笔开销（首屏卡顿的来源之一）。
         只在数值真的变了才写，静止时几乎零写入。 */
      /* translate3d 让浏览器把这一层交给合成器按小数像素平移，
         而不是每帧重新栅格化文字 —— 后者就是"自转时国名疯狂抖动"的原因。
         will-change 只给当前可见的那几十个，不然 341 个图层会把首屏拖死。 */
      /* 越靠球缘字越小（0.78→1.0）：这是"贴在球面上"的视觉线索之一，
         比单纯淡出更像球面透视。 */
      /* 0.78 的缩放在 13.5px 上只剩 10.5px，雪白底上真的认不出来；收到 0.88 起步 */
      var sc = (0.88 + 0.12 * dot).toFixed(3);
      var tr = 'translate(-50%,-50%) translate3d(' +
               x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) scale(' + sc + ')';
      if (L._t !== tr) { L._t = tr; L.el.style.transform = tr; }
      if (!L._wc) { L._wc = 1; L.el.style.willChange = 'transform'; }
      var op = alpha.toFixed(2);
      if (L._o !== op) { L._o = op; L.el.style.opacity = op; }
      /* 时间指示模式下所有标签都不接事件 —— 不只是国家，大洲/海洋/岛这些
         没 iso 的标签也在内。它们同样挂着 click（走 parent 分支），
         只关国家那几个的话，点"北美洲"照样会弹出一张卡片。
         这里写的是内联样式，优先级高于 CSS 的 .time-mode .mlabel 规则，
         所以必须在这拦一道。 */
      var picking = globe.timeMode || globe.probeMode ||
                    (!!globe.layerName && !!globe.allBordersOn);
      if (picking) {
        if (L.el.style.pointerEvents !== 'none') L.el.style.pointerEvents = 'none';
      } else if (L.tap) {
        /* 地形名可以点：点开在球上画出这块山/盆地的边界 */
        if (L.el.style.pointerEvents !== 'auto') L.el.style.pointerEvents = 'auto';
      } else if (L.iso && L.el.style.pointerEvents === 'none') {
        L.el.style.pointerEvents = 'auto';
      }
      L.on = true;
      paint.push([x, y, alpha, L]);
    }
    paintLabels(paint, w, h);
  }

  /* ---------- 地名 Canvas 绘制 ----------
     所有地名文字画在一张覆盖层 canvas 上，DOM 标签的文字由 CSS 置为透明。
     为什么不用 DOM 文字：文字作为合成层，在亚像素位置平移时会被反复插值采样，
     144Hz 下球缘那批（每帧只挪 0.5~2px）清晰度高频跳变，看起来就是在闪。
     canvas 每帧直接光栅化到屏幕，同一位置只画一次，没有累积插值。 */
  var _lblCanvas = null, _lblCtx = null;

  /* 各类型地名的字形参数，照抄 CSS 里的 .mlabel / .mc / .mo / .mi / .ml / .ms / .mk。
     canvas 套不了 class，只能手动对齐；将来改 CSS 记得同步这张表。 */
  var LBL_FONT = '"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  var LBL_STYLE = {
    mc: { size: 14.5, weight: 600, color: 'rgba(232,241,254,.92)', italic: false },
    mo: { size: 13,   weight: 400, color: 'rgba(180,212,246,.78)', italic: true },
    mi: { size: 12.5, weight: 400, color: 'rgba(214,232,252,.82)', italic: false },
    ml: { size: 12,   weight: 400, color: 'rgba(148,206,238,.82)', italic: true },
    ms: { size: 11.5, weight: 400, color: 'rgba(162,202,240,.76)', italic: true },
    mk: { size: 13.5, weight: 500, color: '#ffffff', italic: false }
  };
  var LBL_DEFAULT = { size: 13, weight: 400, color: '#ffffff', italic: false };

  /* sprite 超采样倍率。2 倍分辨率渲染、按 1 倍尺寸绘制：
     缩小采样本身会平滑边缘，浮点定位时的插值差异因此小得多，
     文字边缘不会再一帧一个样（否则就是"闪"）。 */
  var SPR_SS = 2;

  /* 把一个地名栅格化成一张离屏小画布，缓存到 L._spr 上（文字不变，只做一次）。
     返回 { c: 画布, w/h: CSS 像素尺寸 }。按 dpr 放大渲染，高分屏上不糊。 */
  function labelSprite(L, dpr) {
    if (L._txt === undefined) L._txt = (L.el.textContent || '').trim();
    if (!L._txt) return null;
    if (L._spr && L._spr.dpr === dpr) return L._spr;

    var st = LBL_STYLE[L.kind] || LBL_DEFAULT;
    var font = (st.italic ? 'italic ' : '') + st.weight + ' ' + st.size + 'px ' + LBL_FONT;

    var m = document.createElement('canvas').getContext('2d');
    m.font = font;
    var tw = m.measureText(L._txt).width;
    /* 留出描边和斜体的余量 */
    var pad = Math.ceil(st.size * 0.45);
    var w = Math.ceil(tw) + pad * 2;
    var h = Math.ceil(st.size * 1.35) + pad * 2;

    var k = dpr * SPR_SS;
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * k));
    cv.height = Math.max(1, Math.round(h * k));
    var cx = cv.getContext('2d');
    cx.scale(k, k);
    cx.font = font;
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.lineJoin = 'round';

    /* 描边压底：原来靠 4 层 text-shadow 在多背景上都压得住，
       canvas 用一圈圆角描边近似 —— 白字压在雪原/沙漠上也能看清。 */
    cx.lineWidth = 2.4;
    cx.strokeStyle = 'rgba(0,0,0,.72)';
    cx.strokeText(L._txt, w / 2, h / 2);

    cx.fillStyle = st.color;
    cx.fillText(L._txt, w / 2, h / 2);

    L._spr = { c: cv, w: w, h: h, dpr: dpr };
    return L._spr;
  }

  function paintLabels(paint, w, h) {
    var stage = globeStage();
    if (!stage) return;

    if (!_lblCanvas) {
      _lblCanvas = document.createElement('canvas');
      _lblCanvas.id = 'labels-canvas';
      _lblCtx = _lblCanvas.getContext('2d');
      if (!_lblCtx) {
        /* 拿不到 2d 上下文（极少数环境禁 canvas）→ 回退成原来的 DOM 文字 */
        _lblCanvas = null;
        document.body.classList.remove('labels-canvas');
        return;
      }
      document.body.classList.add('labels-canvas');
    }

    /* 必须真的挂进 DOM —— 少了这一行，canvas 只是个游离对象：
       画得再好也不会显示（getBoundingClientRect 返回 0x0、computed style 全空）。
       挂到 #globe-stage 下、与 #labels 平级，z-index:10 才能压过 #labels 的 5。 */
    var host = stage;
    if (_lblCanvas.parentNode !== host) host.appendChild(_lblCanvas);

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (_lblCanvas.width !== cw || _lblCanvas.height !== ch) {
      _lblCanvas.width = cw;
      _lblCanvas.height = ch;
      _lblCanvas.style.width = w + 'px';
      _lblCanvas.style.height = h + 'px';
    }

    var c = _lblCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';

    /* 每个地名先栅格化成一张小位图（sprite），之后每帧只做 drawImage 搬运。
       为什么不每帧 fillText：canvas 的 fillText 会在当前基线上重新光栅化文字，
       基线是浮点数，亚像素位置每帧都不同 → 每次得到的字形位图都有细微差别，
       看起来就是文字在上下跳。sprite 只栅格化一次，之后就固定不变了。
       （这一步也顺带让每帧开销从"重新排版+光栅化"降到"贴一张图"。） */
    for (var i = 0; i < paint.length; i++) {
      var p = paint[i];
      var x = p[0], y = p[1], a = p[2], L = p[3];
      if (a <= 0.02) continue;

      var spr = labelSprite(L, dpr);
      if (!spr) continue;

      c.globalAlpha = a;
      /* 位置用浮点，不对齐像素。
         sprite 是高倍超采样的位图，缩小绘制时 GPU 会做平滑采样，
         文字边缘不会一帧一个样；反过来，对齐到设备像素会让每帧位移
         0.5~2px 的标签变成 1/dpr 的阶梯（144Hz 下就是明显的一跳一跳）。 */
      c.drawImage(spr.c, x - spr.w / 2, y - spr.h / 2, spr.w, spr.h);
    }

    c.globalAlpha = 1;
  }

  /* ---------- 相机与飞行动画 ----------
     用"目标值 + 每帧阻尼逼近"而不是 tween 时间轴：这样飞行途中随时可以
     被拖拽打断，不会出现动画和手动操作互相抢控制权。 */
  /* 相机距离要保证「整颗球 + 大气层」都在画面里：
     fov=42° 时视口高 = 2*z*tan(21°)，要装下半径 R 的球，z ≥ R/tan(21°)。
     之前的 CAM_NEAR=2.60 是按半径 1.0 算出来的临界值，可大气层半径 1.095，
     于是点到某个国家、相机压到 2.60 时上下各被切掉一条 —— 这才是
     "点开之后上面一小部分被截断"的真凶。现在两个距离都由 fitZ() 按实际
     大气外缘反算，竖屏时还会把水平方向一起算进去。
     手动缩放下限单独给（比聚焦距离近得多），才能像以前一样贴到地表看细节。 */
  var CAM_FAR = 3.02;      // 全球视角（buildGlobe 里按视口重算）
  var CAM_NEAR = 2.81;     // 聚焦某国（整球入画）
  var CAM_MIN = 1.42;      // 手动缩放最近：球会超出画面，等于贴近看
  var CAM_MAX = 5.20;

  function flyTo(lon, lat, camZ) {
    if (!globe.spin) return;
    globe.rotTargetY = -lon * D2R - Math.PI / 2;
    globe.rotTargetX = Math.max(-1.15, Math.min(1.15, lat * D2R));
    globe.camTarget = camZ;
    globe.flying = true;
    globe.autoSpin = false;
  }

  function flyToCountry(iso) {
    var list = (globe.data && globe.data.countries) || [];
    var c = null;
    for (var i = 0; i < list.length; i++) if (list[i].iso === iso) c = list[i];
    /* 只有三国在球面有国界几何，但"飞过去"这件事对所有国家都成立 ——
       没有几何就从 meta 的中心点飞。以前这里直接 return，
       于是点日本、点埃及都停在原地，像没反应。 */
    var lon, lat;
    if (c) { lon = c.center[0]; lat = c.center[1]; }
    else {
      var m = LABEL_META && LABEL_META[String(iso).toUpperCase()];
      if (!m) return;
      lon = m.lon; lat = m.lat;
    }
    globe.camMode = 'near';
    flyTo(lon, lat, CAM_NEAR);
    globe.idleUntil = performance.now() + 1e9;   // 面板开着就不自转
  }

  /* 只退回"全球尺度"，**不动朝向**。
     点开中国 → 关面板，应该还是看着中国，只是镜头拉回；
     转球和挪镜头是两件事，混在一起就变成了"关闭 = 重置"。
     双击同理：只缩回去，不把球转回初始角度。 */
  function flyOut() {
    if (!globe.spin) return;
    globe.camMode = 'far';
    globe.camTarget = CAM_FAR;
    globe.autoSpin = true;
    globe.idleUntil = performance.now() + 1200;
  }

  /* 等镜头停稳（飞行阻尼收敛）再做事。
     典型用途：卡片里的地标照片。它们要下载、解码、再当纹理传上 GPU，
     而这三件事全落在镜头正在飞的这 700ms 里 —— 实测点一个国家掉的那几帧，
     一半来自这里。宁可让图晚 0.3 秒出现，也别让镜头抖。
     1.6 秒兜底：飞行被打断、或者用户拖住了球，不能让回调永远不执行。 */
  globe.whenSettled = function (cb) {
    var t0 = performance.now();
    (function wait() {
      if (!globe.flying || performance.now() - t0 > 1600) { cb(); return; }

  function buildGlobe(data) {

    var spin = new THREE.Group();

    scene.add(tilt);

    var fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0e2438 });

    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 100), fallbackMat);

       （城市灯光那套）。第一版做的是"整体压暗 + 画一条金色晨昏线"，
       方向错了 —— 要的是"一半白天模式、一半黑夜模式"，不是一条分界线。 */
    globe.term = { on: false };

        if (globe.grid) globe.grid.visible = true;

      tune(nightTex);

         shader 里按 fwidth 算"每像素吃几个 8K 纹素"，缩放时自动在 4K/8K 之间软切换，
         所以这里不需要任何交叉淡化动画 —— 也就没有"淡化到一半卡一下"这回事。 */
      if (day8) {

        globe.earthMat.uniforms.uMixB.value = 1;

      globe.texReady = true;

         renderer.initTexture 是同步的：这一步会卡住主线程（8K 那张在集显上

      try {

        if (nightTex) renderer.initTexture(nightTex);
        if (day8) renderer.initTexture(day8);
      } catch (e) { /* 老版本 three 没有 initTexture，交给首帧上传也一样 */ }

      /* 再等两帧才起淡入：让"上传 + 着色器编译"都落在球不可见的时候。 */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          globe.fadeStart = performance.now();
        });
      });
      if (typeof onGlobeReady === 'function') onGlobeReady();

      var subEl3 = document.getElementById('globe-sub');
      if (subEl3) subEl3.textContent = '拖动旋转 · 滚轮缩放 · 点击地名开档';
    }, renderer);

    /* 点亮一国国界 —— 这就是"拼图"的那一块。
       规则（用户定的玩法）：
         1. 点开哪国，就把那国轮廓留成金色，关掉面板也不熄 —— 拼上的块不撤；
         2. 当前正在看的那条更亮（matOn），其余已拼的略暗（matLit）；
         3. 只有"关闭全部国境线"会清盘：所有线一起熄灭。
       内置三家（中法美）的线在建球时就建好了，其余国家按需从 geo 分片里取，
       取到后缓存起来 —— 同一国第二次点不再走网络，也不再建几何。 */
    var borderCache = {};      // iso -> Line（含内置三国）
    var borderSrc = {};        // iso -> 'coarse' | 'fine'，粗轮廓是临时的，细的到了要换掉
    var pendingLit = {};       // iso -> [cb]，正在加载的
    var curLit = null;         // 当前最亮的那条
    globe.wantLit = {};        // iso -> true，表示"用户点过、应该亮着"

    function applyLit(iso, line) {

      curLit = line;
      globe.active = iso;
    }

    /* 用档案自带的粗轮廓先点亮。
       为什么需要这一步：金线走 geo/（CDN），卡片走 data/（同源 Pages），
       两条链路实测差最多 700ms，表现就是"卡片展开了、国土还在路上"。
       档案里的 outline 是随卡片一起来的，先拿它顶上去，画面立刻完整；
       精细几何随后到，再把这条换成 0.006° 的版本（下面 upgrade）。
       球面一像素约 0.3°，粗轮廓是 0.05°，肉眼分不出，所以这个"升级"
       主要是为了放大后和面板里的 SVG 对齐。 */
    function litFromOutline(iso, outline) {
      var rings = outlineRings(outline);
      if (!rings) return false;
      return litFromRings(iso, rings, 'coarse');
    }

    /* 用一串环直接点亮 —— 数据在内存里时走这条，不等网络。 */
    function litFromRings(iso, rings, src) {
      var line = ringsToLines(rings, BORDER_R_ON, globe.matLit);
      if (!line) return false;
      borderCache[iso] = line;
      borderSrc[iso] = src || 'pre';
      spin.add(line);
      applyLit(iso, line);
      return true;
    }

    function lineFromGeo(gj) {
      var rings = [];
      (gj.features || []).forEach(function (f) {
        var g = f.geometry || {};
        var polys = g.type === 'Polygon' ? [g.coordinates]
          : (g.type === 'MultiPolygon' ? g.coordinates : []);
        polys.forEach(function (poly) {
          poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
        });
      });
      if (!rings.length) return null;
      /* 半径 1.008：必须比全量国境线（1.006）更靠外，否则两线重合时
         外层那条会盖住这条，"当前选中"就亮不起来了（深度缓冲按视线方向取近的）。 */
      return ringsToLines(rings, BORDER_R_ON, globe.matLit);
    }

    /* 档案到得比几何早时，用粗轮廓先画（由 renderDetail 调用）。 */
    globe.maybePreempt = function (iso, outline) {
      if (!iso || !outline) return;
      iso = String(iso).toUpperCase();
      if (!globe.wantLit[iso]) return;         // 用户已经关掉/换国了
      if (borderSrc[iso] === 'fine') return;   // 精细的已经在画了，别倒退
      if (borderCache[iso]) return;            // 已经有线，交给 upgrade 处理
      litFromOutline(iso, outline);
    };

    globe.lightBorder = function (iso, cb) {
      if (!iso) { if (cb) cb(); return; }
      iso = String(iso).toUpperCase();
      globe.wantLit[iso] = true;

      var cached = borderCache[iso] || globe.groups[iso];
      if (cached) { applyLit(iso, cached); if (cb) cb(); return; }
      if (pendingLit[iso]) { if (cb) pendingLit[iso].push(cb); return; }

      /* 快路径：全量国境线的顶点早就下好了（geo/borders.json），同一份数据按国家
         分过组，直接切出本国那几环就能画 —— 不发任何请求。
         这就是"有的国家点下去还要等一下"的根治：那点延迟原本全在等
         data/{iso}.json 或 geo/n/{iso}.json 的网络往返。 */
      if (ALL_BY_ISO && ALL_BY_ISO[iso]) {
        if (litFromRings(iso, ALL_BY_ISO[iso], 'pre')) { if (cb) cb(); return; }
      }

      /* 数据还没预加载完（页面刚开几秒）：先用档案里的粗轮廓顶上 */
      if (CARD_OUTLINE[iso] && litFromOutline(iso, CARD_OUTLINE[iso])) {

      }

      pendingLit[iso] = [];
      loadGeo(iso).then(function (gj) {
        var waits = pendingLit[iso] || [];
        delete pendingLit[iso];
        /* 异步回来时用户可能已经关面板、或点了"关闭全部国境线"（清盘） */
        if (gj && globe.wantLit[iso]) {
          var line = lineFromGeo(gj);
          if (line) {
            /* 粗线已占位：原地换成精细的。两条都挂在 spin 上，先加后删，
               中间不会有一帧"什么都没有"。 */
            var old = borderCache[iso];
            borderCache[iso] = line;
            borderSrc[iso] = 'fine';
            spin.add(line);
            applyLit(iso, line);

    /* 关面板：当前这条降成"已拼"，不熄灭。 */
    globe.dimCurrent = function () {

      curLit = null;
      globe.active = null;
    };

    /* 清盘：全量国境线关掉时调用，连同已拼的块一起熄灭。 */
    globe.clearLit = function () {
      Object.keys(borderCache).forEach(function (k) { borderCache[k].visible = false; });
      Object.keys(globe.groups).forEach(function (k) { globe.groups[k].visible = false; });
      globe.wantLit = {};
      pendingLit = {};
      borderSrc = {};
      curLit = null;
      globe.active = null;
      Array.prototype.forEach.call(
        document.querySelectorAll('.dock-item'),
        function (n) { n.classList.remove('active'); }
      );
    };

    /* 空闲预热：这两样第一次使用都要现做（全量国境线的顶点拼装、

       球稳定后趁空闲先把它们建好，之后开关只切 visible —— 秒开。
       建好先设 visible=false，不改变当前画面。

       注意：预热**不走** toggleAllBorders。开关语义里"关掉全量国境线"等于清盘，
       预热打开再关掉就会把用户已经拼上的金线一起清掉。 */
    function warmHeavyLayers() {
      if (!globe.spin) return;
      if (!globe.grid && typeof buildGraticule === 'function') prepareGrid(true);

      /* 把 AudioContext 提前建好（此时是 suspended 状态，不发声）。
         以前只在第一次 pointerdown 里建，而创建 AudioContext 本身要
         60~100ms —— 正好压在点击起飞的那一帧上，第一次点任何国家都会
         顿一下。提前建，第一次点击只剩一次 resume，几毫秒。 */
      warmAudio();

      /* 全量国境线提前备好。
         以前这里预取的是十六个分片共 4.0MB，实测首屏 30 秒累计 8.9MB / 185 条请求，
         手机流量和弱网扛不住，所以砍掉了；砍完的代价是每次点按钮都要现拉现合并。
         现在换成专门为这层做的 geo/borders.json：0.06° 抽稀，721KB（gzip 236KB），
         是分片的六分之一 —— 预取不再心疼，按钮回到秒开。
         排到 2.6 秒之后：让首屏贴图和影像先走，别抢链路。
         这里不用 requestIdleCallback —— 页面一直跑着 rAF 循环，实测等不到
         空闲帧（timeout 兜底在 headless 下也没如期触发），预热就这么丢了；

       但 4096×2048 的 CanvasTexture 的 mip 链仍要等到第一次真实 draw call
       才生成，那一帧在软件渲染下能到 1 秒，在独显上也有几十毫秒。
       所以这里把网格缩到球心（0.001 倍，连一个像素都占不到），
       挂上去渲染两帧，等纹理和 program 都进了显存再还原、再隐藏。
       预热期掉这两帧，用户看到的是自转中的地球，不会注意到。 */
    function prepareGrid(silent) {

      if (!globe.spin) return null;
      var g = buildGraticule(1.0018);

      globe.grid = g;

          });
        });

      return g;
    }

    /* 排查用：把某个经纬度转到正对相机，并指定相机距离。
       截图比对"金线贴不贴合"时必须能精确复现同一个视角，靠拖鼠标没法复现。 */
    window.__look = function (lon, lat, dist) {
      if (!globe.spin || !globe.tilt) return false;
      globe.camMode = 'manual';
      globe.flying = false;
      globe.autoSpin = false;

      globe.spin.rotation.y = -lon * D2R - Math.PI / 2;
      globe.tilt.rotation.x = lat * D2R;
      return true;
    };

    /* 排查用：看当前拼上了几块、全量线在不在。 */
    window.__sb = function () {
      return {
        active: globe.active || null,
        lit: Object.keys(borderCache).filter(function (k) { return borderCache[k].visible; }),
        litBuiltin: Object.keys(globe.groups).filter(function (k) { return globe.groups[k].visible; }),
        gridBuilt: !!globe.grid,
        gridVisible: !!(globe.grid && globe.grid.visible),
        bordersBuilt: !!allBorders,
        bordersVisible: !!(allBorders && allBorders.visible),
        bordersBusy: !!allBusy,
        /* 调试用：相机距离与球体朝向。手机端捏合/拖拽没法用肉眼验证，
           靠这两个数确认手势到底有没有生效。 */
        camZ: globe.camera ? Math.round(globe.camera.position.z * 1000) / 1000 : null,
        rot: globe.spin ? Math.round(globe.spin.rotation.y * 1000) / 1000 : null,

        pinCN: !!globe.pinCN

    /* 全部国境线：一条 LineSegments 铺满整颗球。

       数据用 geo/borders.json（scripts/build_all_borders.py 生成，0.06° 抽稀）：
       721KB，十六个分片是 4.0MB。之所以能砍这么多——球面一像素约 0.3°，
       分片那份 0.006° 的精度有 99% 的点落在同一个像素里，纯属白传。
       这份数据在地球稳定后就会预取、预建几何，点按钮只切 visible。

       分片那条老路留着兜底：all.json 拿不到（旧版本缓存、改坏了）时照旧合并，
       只是慢一点，不会变成"按钮点了没反应"。 */
    var allBorders = null, allBusy = false, allWant = false, allPend = null;

    /* 解析 geo/borders.json。数据是按国家分组的（c: {ISO: [环...]}），一份两用：
         · 全量国境线 —— 把所有环拼成一条 LineSegments
         · 点亮单国  —— 直接切出该国那几环，零网络
       坐标是整数化的 0.02°，这里还原成度。 */
    function ringsFromAllData(d) {
      if (!d || !d.c) return null;
      var s = d.s || 1, byIso = {}, all = [];
      Object.keys(d.c).forEach(function (iso) {

        for (var i = 0; i < src.length; i++) {

          for (j = 0; j < row.length; j++) ring[j] = [row[j][0] / s, row[j][1] / s];
          if (ring.length > 2) { rings.push(ring); all.push(ring); }
        }
        if (rings.length) byIso[String(iso).toUpperCase()] = rings;
      });
      if (!all.length) return null;
      ALL_BY_ISO = byIso;
      return all;
    }

    /* 取全量国界顶点：一个 Promise、一次网络，多处调用共享。 */
    function loadAllRings() {
      if (allPend) return allPend;
      allPend = fetchAny('geo/borders.json').then(function (d) {
        var rings = ringsFromAllData(d);
        if (!rings) throw new Error('all.json 内容为空');
        return rings;
      });
      /* 失败一次就别反复打网络，清掉让下次还有机会重试 */
      allPend.catch(function () { allPend = null; });
      return allPend;
    }

    /* 建几何。建过一次就不再建（开关只切 visible）。
       半径 1.006：球半径是 1，差值必须比深度缓冲的精度大一档，
       否则线会陷进球面被剔掉（1.0045 实测就完全看不见）。
       颜色与选中的金线同一支（matAll = 0.40 透明度），只分浓淡。
       点亮的那几国画在 1.008，永远压在这层上面。 */
    function makeAllBorders(rings) {
      if (allBorders || !rings || !rings.length) return allBorders;
      allBorders = ringsToLines(rings, BORDER_R_ALL, globe.matAll);
      allBorders.visible = false;
      spin.add(allBorders);
      return allBorders;
    }

    /* 加载期间用户又点了：把回调排上，加载完一次性通知。
       以前是 `if (allBusy) return;` —— 直接返回、cb 不调、按钮的 busy 类
       永远摘不掉，之后所有点击都被 `if (classList.contains('busy')) return`
       挡在外面。用户点两下就变成"按钮没反应"，而屏幕上线的状态跟他以为的
       完全对不上 —— 这就是"偶发"的来源。 */
    var allWait = [];

    function flushAll(v) {
      allWait.splice(0).forEach(function (f) { try { f(v); } catch (e) {} });
    }

    /* 兜底：十六个分片合并（4.0MB）。只在 all.json 不可用时走。 */
    function ringsFromChunks() {
      var jobs = [];
      var got = 0;
      function tick() {
        got++;
        if (!allWant) return;
        globeMsg(got < GEO_COUNT
          ? '正在加载全部国境线… ' + got + '/' + GEO_COUNT
          : '正在合并国境线…');

      for (var b = 0; b < GEO_COUNT; b++) {
        jobs.push(fetchAny('geo/c' + b + '.json')
          .then(function (x) { tick(); return x; })
          .catch(function () { tick(); return null; }));

      return Promise.all(jobs).then(function (list) {
        var rings = [];
        list.forEach(function (all) {
          if (!all) return;
          Object.keys(all).forEach(function (iso) {
            (((all[iso] || {}).features) || []).forEach(function (f) {

        });

      if (allBorders) {                 // 预建已完成：只切显隐，秒开
        allBorders.visible = allWant;
        if (!allWant) globe.clearLit();
        globeMsg('');
        flushAll(allWant);
        return;
      }
      if (allBusy) return;              // 在路上的那次会按最新 allWant 收尾
      allBusy = true;
      if (allWant) globeMsg('正在准备全部国境线…');

      loadAllRings()
        .catch(function () {
          if (allWant) globeMsg('正在加载全部国境线… 0/' + GEO_COUNT);
          return ringsFromChunks();
        })
        .then(function (rings) {
          allBusy = false;
          if (!rings || !rings.length) { globeMsg(''); flushAll(false); return; }
          makeAllBorders(rings);
          if (allBorders) allBorders.visible = allWant;
          globeMsg('');
          flushAll(allWant);

        .catch(function () {

          globeMsg('');
          flushAll(false);

        makeAllBorders(rings);
        if (allBorders) {
          allBorders.visible = false;
          if (globe.renderer && globe.renderer.compile) {

            try { globe.renderer.compile(scene, camera); } catch (e) {}

      /* 建好一次就留着，开关只切 visible。
         以前关掉就 dispose，下次打开又得重新合并一轮 —— 用户手感就是
         "第一次点卡一下、第二次又卡一下"。这个对象只有一条 draw call，
         留着占不了多少内存。 */
      if (allBorders) {
        allBorders.visible = !allBorders.visible;
        /* 关掉全量国境线 = 清盘：连已拼上的金线一起熄灭。

        if (!allBorders.visible) globe.clearLit();

    loadAllRings().then(function () {

    var cv = renderer.domElement;
    var downAt = { x: 0, y: 0 };

    /* 拖拽要能从"地名"上开始。
       现在 239 个国家的地名都可点，它们盖住了球面相当大一片；如果按住字就拖不动，
       手感会碎得厉害。所以：down 绑在 canvas 和每个地名上，move/up 统一挂 window
       （带 globe.dragging 守卫），这样从字上按下也能直接转球。 */
    /* ---------- 拖拽旋转 + 双指捏合缩放 ----------
       以前只有 wheel：手机上根本没有滚轮事件，所以**缩放完全不可用**；
       而拖拽虽然没有 pointercancel 保护（#globe-stage 少了 touch-action:none），
       手指划两下就被浏览器抢去滚页面，收到的是一次 pointercancel。

       这里把指针按 id 记账：手机两根手指会同时发 pointermove，
       不分 id 的话两指的位移互相覆盖，镜头会跳。
       一根手指 = 转球；两根手指 = 捏合，转动同时停下
       （否则球会跟着两指中点乱跑）。 */
    var ptrs = {};          // pointerId -> {x, y}
    var dragId = null;      // 负责转球的那根

    var pinchCam0 = 0;      // 捏合开始时的相机距离

      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };

      if (ptrCount() === 1) {
        dragId = e.pointerId;
        globe.dragging = true;
        globe.lastInput = performance.now();
        globe.last.x = e.clientX;
        globe.last.y = e.clientY;
        downAt.x = e.clientX;
        downAt.y = e.clientY;
        globe.moved = 0;
        globe.vel.x = globe.vel.y = 0;
