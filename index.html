        globe.autoSpin = false;
        if (globe.pinCN) setPinChina(false);   // 手一转就是要自己看，钉子拔掉
        globe.flying = false;        // 手动接管，打断正在进行的飞行
        return;
      }

      if (ptrCount() === 2) {
        pinching = true;
        pinch0 = ptrDist();
        pinchCam0 = globe.camTarget;
        globe.dragging = false;
        globe.vel.x = globe.vel.y = 0;
        globe.moved = 999;           // 这一串动作不许被当成"点了一下"
        cv.classList.remove('dragging');
        globe.camMode = 'manual';
        globe.flying = false;
      }
    }

    function dragMove(e) {
      var p = ptrs[e.pointerId];
      if (!p) return;                // 不是我们记过的指针（比如第二根手指之外的多余触点）
      p.x = e.clientX;
      p.y = e.clientY;
      globe.lastInput = performance.now();

      /* 双指：只算缩放。两指分开 → 距离变大 → 相机拉近（camZ 变小）。
         用手势的"倍数"而不是每帧增量，捏多少走多少，松手不飘。 */
      if (pinching && ptrCount() >= 2) {
        var d = ptrDist();
        if (pinch0 > 0 && d > 0) {
          globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, pinchCam0 * (pinch0 / d)));
        }
        globe.autoSpin = false;
        globe.idleUntil = performance.now() + 2600;
        return;
      }

      if (!globe.dragging || e.pointerId !== dragId) return;
      var dx = e.clientX - globe.last.x;
      var dy = e.clientY - globe.last.y;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      globe.moved += Math.abs(dx) + Math.abs(dy);
      // 0.0016 弧度/像素：拖满 1200px 约转 110°，手一抖不会转到背面
      globe.vel.x = dx * 0.0016;
      globe.vel.y = dy * 0.0016;
      globe.spin.rotation.y += globe.vel.x;
      globe.tilt.rotation.x += globe.vel.y;
      var lim = 78 * D2R;
      globe.tilt.rotation.x = Math.max(-lim, Math.min(lim, globe.tilt.rotation.x));
    }

    /* 收尾：抬起一根手指、或整段手势结束。 */
    function dragUp(e) {
      if (e && e.pointerId !== undefined) delete ptrs[e.pointerId];
      var n = ptrCount();

      if (pinching && n < 2) {
        pinching = false;
        globe.idleUntil = performance.now() + 2600;
        if (n === 1) {
          /* 松掉一根、还剩一根：让留下的那根接着转。
             基准点重设到它当前的位置，否则球会"跳"一下。 */
          for (var k in ptrs) { dragId = Number(k); break; }
          globe.dragging = true;
          globe.last.x = ptrs[dragId].x;
          globe.last.y = ptrs[dragId].y;
          globe.vel.x = globe.vel.y = 0;
          cv.classList.add('dragging');
          return;
        }
      }
      if (n > 0) return;

      dragId = null;
      if (!globe.dragging) {
        /* 捏合结束时 dragging 已经是 false，但自转要恢复 */
        globe.autoSpin = true;
        return;
      }
      globe.dragging = false;
      cv.classList.remove('dragging');
      /* 只有真正拖动过才延时恢复自转。
         之前这里一律 +2.4 秒，于是"点一下画面"也会让地球停两秒半 ——
         单击本来只是看看，不该改变自转状态。
         顺带修了个老 bug：原来看的是"最后一小段位移"，慢慢拖松手时几乎总是 0，
         于是拖动之后自转立刻恢复，和"停 2.4 秒"的意图不符。现在累计整段位移。 */
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + (globe.moved > 6 ? 2400 : 0);
    }
    globe.dragDown = dragDown;
    cv.addEventListener('pointerdown', dragDown);

    /* ---------- 时间指示 ----------
       射线打到球面拿交点，再转回经纬度算当地时间。
       交点用的是世界坐标，必须先 worldToLocal 回球体坐标 ——
       直接拿世界坐标算经纬度，地球转过多少，时间就错多少。 */
    var _ray = new THREE.Raycaster();
    var _ndc = new THREE.Vector2();
    globe.pickLL = function (clientX, clientY) {
      var r = cv.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      _ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
      _ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
      _ray.setFromCamera(_ndc, camera);
      var hit = _ray.intersectObject(sphere, false);
      if (!hit || !hit.length) return null;
      var p = hit[0].point.clone();
      sphere.worldToLocal(p);
      return vec3ToLL(p);
    };

    var pinLayer = document.getElementById('time-pins');
    var TPIN_MAX = 6;                      // 最多同时钉 6 个，再多就从最早的开始收
    var pins = [];                         // { anchor, lat, lon, kind } —— 位置靠经纬度每帧重算
    /* 点一下气泡本体就关掉它（不再单独做 ×）。
       直接改 DOM 会漏掉 pins 数组（它才是每帧投影的依据），两边一起删。 */
    function bindPinClose(rec, box) {
      var b = box.querySelector('.tp-bubble');
      if (!b) return;
      b.title = '点击关闭';
      b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var at = pins.indexOf(rec);
        if (at >= 0) pins.splice(at, 1);
        rec.anchor.classList.add('out');
        setTimeout(function () {
          if (rec.anchor.parentNode) rec.anchor.parentNode.removeChild(rec.anchor);
        }, 170);
      });
    }

    /* 超过上限就收最早的一个。按 pins 数组删 —— 之前按 children 删，
       加了单独关闭之后两边顺序会不同步，可能删错节点。 */
    function trimPins() {
      while (pins.length > TPIN_MAX) {
        var old = pins.shift();
        if (old.anchor.parentNode) old.anchor.parentNode.removeChild(old.anchor);
      }
    }

    function showTimePin(cx, cy, ll) {
      if (!pinLayer) return;
      /* 时区按经度算：每 15° 一小时。真实时区有政治边界，
         这里要的是"这一点在太阳下的地方时"，按经度反而更自洽。 */
      var offMin = Math.round(ll.lon / 15 * 60);
      var now = new Date();
      var t = new Date(now.getTime() + offMin * 60000);
      var hh = t.getUTCHours(), mm = t.getUTCMinutes();
      var off = offMin / 60;
      var offStr = 'UTC' + (off >= 0 ? '+' : '−') +
        (Math.abs(off) % 1 === 0 ? Math.abs(off) : Math.abs(off).toFixed(1));
      var ns = ll.lat >= 0 ? 'N' : 'S';
      var ew = ll.lon >= 0 ? 'E' : 'W';

      /* 每个落点各自一个标记，互不覆盖 —— 连着点三处就有三个时间钉在那儿。
         气泡里的时间是**点击那一刻**的，不会跟着走；但钉子的**位置**必须跟着地球：
         它记的是经纬度，每帧重新投影到屏幕上，所以缩放、拖拽之后它仍然扎在同一个点上。 */
      var anchor = document.createElement('div');
      anchor.className = 'tpin-anchor';
      var d = document.createElement('div');
      d.className = 'tpin k-time' + (cy < 150 ? ' below' : '');
      d.innerHTML =
        '<div class="tp-bubble"><b>' + (hh < 10 ? '0' : '') + hh + ':' +
          (mm < 10 ? '0' : '') + mm + '</b>　' +
          (t.getUTCMonth() + 1) + '月' + t.getUTCDate() + '日 · ' + offStr +
          '<i>' + Math.abs(ll.lat).toFixed(1) + '°' + ns + '　' +
          Math.abs(ll.lon).toFixed(1) + '°' + ew + '</i></div>' +
        '<div class="tp-stem"></div>';
      anchor.appendChild(d);
      pinLayer.appendChild(anchor);
      var rec = { anchor: anchor, lat: ll.lat, lon: ll.lon, kind: 'time' };
      pins.push(rec);
      bindPinClose(rec, d);
      trimPins();
      placePins();          // 立刻摆到位，别先闪在左上角
    }

    /* 把每个钉子的经纬度投影回屏幕。每帧跑，最多 6 个，开销可以忽略。
       背面（法线背对相机）直接淡出 —— 否则一个球背面的钉子会"穿"到正面来。 */
    var _pv = null, _pw = null;
    function placePins() {
      if (!pins.length || !globe.sphere || !globe.camera) return;
      if (!_pv) { _pv = new THREE.Vector3(); _pw = new THREE.Vector3(); }
      var cam = globe.camera;
      /* canvas 会跟着面板打开被整体上移（body.panel-open 给 #globe-stage 加了 transform），
         所以必须用它的实际位置换算，不能拿视口尺寸直接算。 */
      var r = cv.getBoundingClientRect();
      for (var i = 0; i < pins.length; i++) {
        var p = pins[i];
        llToVec3(p.lon, p.lat, 1.004, _pv);
        globe.sphere.localToWorld(_pv);
        _pw.copy(cam.position).sub(_pv).normalize();
        var facing = _pv.clone().normalize().dot(_pw);
        var v = _pv.project(cam);
        var x = r.left + (v.x * 0.5 + 0.5) * r.width;
        var y = r.top + (-v.y * 0.5 + 0.5) * r.height;
        p.anchor.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' +
                                   y.toFixed(1) + 'px,0)';
        p.anchor.style.opacity = facing > 0.04 ? '' : '0';
      }
    }
    globe.placePins = placePins;

    /* 按类别收气泡：退出哪种定位就只收哪种留下的。
       kind 为空 = 全收。必须放在这个作用域里 —— 它要用 pinLayer / pins，
       工具栏那层闭包看不见这两个变量（之前放在那里，一调就 pinLayer is not defined）。 */
    globe.clearPins = function (kind) {
      if (!pinLayer) return;
      for (var i = pins.length - 1; i >= 0; i--) {
        if (kind && pins[i].kind !== kind) continue;
        var a = pins.splice(i, 1)[0].anchor;
        a.classList.add('out');
        (function (n) {
          setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 170);
        })(a);
      }
    };

    /* 退出旗子模式时全部收掉：先淡出再删，一起消失 */
    globe.hideTimePin = function () {
      if (!pinLayer || !pinLayer.children.length) return;
      Array.prototype.forEach.call(pinLayer.children, function (n) {
        n.classList.add('out');
      });
      setTimeout(function () {
        if (pinLayer) pinLayer.innerHTML = '';
        pins.length = 0;
      }, 180);
    };

    /* ---------- 点选查询：气候 / 海拔 ----------
       两张索引图都放仓库、同源加载：OBS 没配 CORS，跨域图画进 canvas 会把
       canvas 污染，getImageData 直接抛错。
       气候图直接查颜色（14 个色值取最近），地形查 Terrarium 编码的高程图。 */
    var PROBE_COLORS = [
      [26, 107, 60, '热带雨林'], [47, 138, 79, '热带季风'], [163, 184, 74, '热带草原'],
      [223, 174, 99, '热沙漠'], [214, 195, 154, '冷沙漠'],
      [210, 154, 88, '热草原'], [191, 168, 125, '冷草原'],
      [184, 162, 75, '地中海气候'], [122, 178, 115, '亚热带湿润'], [106, 167, 154, '温带海洋性'],
      [91, 144, 166, '温带大陆性'], [74, 122, 158, '亚寒带'],
      [159, 169, 181, '苔原'], [223, 231, 239, '冰盖']
    ];
    var probeClim = null, probeElev = null, probeQ = { clim: null, elev: null };

    function probeImg(src, done) {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        var x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        done({ ctx: x, w: img.width, h: img.height });
      };
      img.onerror = function () { done(null); };
      img.src = src;
    }

    /* 按需加载：查气候就只等 climate，别让 2.8MB 的高程图把第一次点击拖住 ——
       "第一颗气泡要卡一两秒"就是原来"两张图都加载完才回调"造成的。 */
    function ensureProbe(kind, cb) {
      var key = (kind === 'elev') ? 'elev' : 'clim';
      var have = (key === 'elev') ? probeElev : probeClim;
      if (have) { cb(); return; }
      if (probeQ[key]) { probeQ[key].push(cb); return; }
      probeQ[key] = [cb];
      probeImg(key === 'elev' ? 'assets/tex/elev.png' : 'assets/tex/climate.webp',
               function (o) {
        if (key === 'elev') probeElev = o; else probeClim = o;
        var q = probeQ[key]; probeQ[key] = null;
        (q || []).forEach(function (f) { f(); });
      });
    }
    /* 进模式就先拉图，点下去通常已经就绪 */
    globe.preloadProbe = function (kind) {
      ensureProbe(kind === 'elev' ? 'elev' : 'climate', function () {});
    };

    function llToPixel(o, lon, lat) {
      var x = Math.floor((lon + 180) / 360 * o.w);
      var y = Math.floor((90 - lat) / 180 * o.h);
      return [Math.max(0, Math.min(o.w - 1, x)), Math.max(0, Math.min(o.h - 1, y))];
    }

    function probeColorAt(lon, lat) {
      if (!probeClim) return null;
      var p = llToPixel(probeClim, lon, lat);
      var d = probeClim.ctx.getImageData(p[0], p[1], 1, 1).data;
      if (d[3] < 40) return null;                    // 海洋：alpha=0
      var best = null, bd = 1e9;
      for (var i = 0; i < PROBE_COLORS.length; i++) {
        var c = PROBE_COLORS[i];
        var dd = (d[0] - c[0]) * (d[0] - c[0]) + (d[1] - c[1]) * (d[1] - c[1]) + (d[2] - c[2]) * (d[2] - c[2]);
        if (dd < bd) { bd = dd; best = c; }
      }
      return best;
    }

    function probeElevAt(lon, lat) {
      if (!probeElev) return null;
      var p = llToPixel(probeElev, lon, lat);
      var d = probeElev.ctx.getImageData(p[0], p[1], 1, 1).data;
      return d[0] * 256 + d[1] - 32768;
    }

    /* 点一下：拾取经纬度 → 查数据 → 钉一个气泡（位置跟着球走，见 placePins） */
    cv.addEventListener('click', function (e) {
      if (!globe.probeMode) return;
      if (globe.moved > 6) return;
      var ll = globe.pickLL(e.clientX, e.clientY);
      if (!ll) return;
      rippleAt(e.clientX, e.clientY);
      keyClick();
      ensureProbe(globe.probeKind, function () {
        var ns = ll.lat >= 0 ? 'N' : 'S', ew = ll.lon >= 0 ? 'E' : 'W';
        var coord = Math.abs(ll.lat).toFixed(1) + '°' + ns + '　' +
                    Math.abs(ll.lon).toFixed(1) + '°' + ew;
        var cn = countryAt(ll.lon, ll.lat);
        var cname = '';
        if (cn && cn.iso) {
          var m = LABEL_META && LABEL_META[String(cn.iso).toUpperCase()];
          cname = (m && m.n) || (CARDS && CARDS[cn.iso] && CARDS[cn.iso].name_zh) || '';
        }
        var html;
        if (globe.probeKind === 'elev') {
          var h = probeElevAt(ll.lon, ll.lat);
          var txt = h == null ? '海拔未知'
                  : (h >= 0 ? '海拔 ' + Math.round(h).toLocaleString() + ' 米'
                            : '海面下 ' + Math.abs(Math.round(h)).toLocaleString() + ' 米');
          html = '<b>' + txt + '</b>' + (cname ? '　' + cname : '') + '<i>' + coord + '</i>';
        } else {
          var c = probeColorAt(ll.lon, ll.lat);
          var sw = c ? '<span class="tp-sw" style="background:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')"></span>' : '';
          html = '<b>' + (c ? c[3] : '海洋') + '</b>' + sw +
                 (cname ? '　' + cname : '') + '<i>' + coord + '</i>';
        }
        var anchor = document.createElement('div');
        anchor.className = 'tpin-anchor';
        var d = document.createElement('div');
        d.className = 'tpin k-clim' + (e.clientY < 150 ? ' below' : '');
        /* 上一版删掉 × 按钮时把这里的 + 一起删了，气泡 HTML 是断的 ——
           只有半个 div，竖线和小尾巴都不见了。 */
        d.innerHTML = '<div class="tp-bubble">' + html +
                      '</div><div class="tp-stem"></div>';
        anchor.appendChild(d);
        pinLayer.appendChild(anchor);
        var rec = { anchor: anchor, lat: ll.lat, lon: ll.lon,
                    kind: globe.probeKind || 'climate' };
        pins.push(rec);
        bindPinClose(rec, d);
        trimPins();
        placePins();
      });
    });

    cv.addEventListener('click', function (e) {
      if (!globe.timeMode) return;
      if (globe.moved > 6) return;            // 拖动过就不算"点了一下"
      var ll = globe.pickLL(e.clientX, e.clientY);
      if (!ll) return;
      rippleAt(e.clientX, e.clientY);
      keyClick();
      showTimePin(e.clientX, e.clientY, ll);
    });
    /* 指针事件挂在 window 上：手指滑出画布（或滑到面板上）也要继续跟手。
       pointercancel 必须当成抬起 —— 系统手势、来电、切后台都会发它，
       不处理的话球会一直"被按住"，自转再也不恢复。 */
    window.addEventListener('pointermove', dragMove);
    window.addEventListener('pointerup', dragUp);
    window.addEventListener('pointercancel', dragUp);
    /* 切走窗口：把所有指针清掉，别留下"一直按着"的状态 */
    window.addEventListener('blur', function () {
      ptrs = {};
      pinching = false;
      dragUp({ pointerId: -1 });
    });

    // ---- 交互：缩放 ----
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      // 触控板捏合会带 ctrlKey，deltaY 很小，得放大步长才跟手
      /* 0.0026 时一格滚轮只挪一点点，看一个国家要连滚七八下。
         调到 0.0042（一格约 1.6 倍步长）；触控板捏合同比例。 */
      var d = e.deltaY * (e.ctrlKey ? 0.014 : 0.0042);
      globe.camMode = 'manual';
      globe.lastInput = performance.now();
      globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget + d));
      /* 8K 在首屏就和 4K 一起下好、一起上传了，缩放时不再触发任何贴图操作。 */
      // 开始缩放就是想看地球了，搜索框该收回去（滚轮不会让 input 失焦）
      if (searchWrap && searchWrap.classList.contains('open')) setSearch(false);
      globe.autoSpin = true;
      globe.idleUntil = performance.now() + 2600;
      globe.flying = false;         // 手动缩放接管，别再和飞行抢相机
    }, { passive: false });

    /* 双击复位：不再占一个按钮。双击同时会给两次 click，
       所以 click 里用 e.detail > 1 忽略掉第二次，避免顺手打开档案。 */
    cv.addEventListener('dblclick', function () {
      closePanel();
      setActive(null);
      flyOut();
    });

    // ---- 交互：点击拾取 ----
    var ray = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    cv.addEventListener('click', function (e) {
      // 拖拽结束时浏览器也会派发 click，位移超过 6px 视为拖动而非点击
      if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 6) return;
      if (e.detail > 1) return;        // 双击的第二次，交给 dblclick 复位
      /* 时间指示模式下这里什么都不做：点哪儿都只是"问时间"，
         不能顺手高亮国界、更不能弹档案。真正处理时间的是另一个监听器。 */
      if (globe.timeMode) return;
      /* 点选查询模式下同理：点哪儿都只是问数据，不能顺手点开档案 */
      if (globe.probeMode) return;
      var rect = cv.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      var hits = ray.intersectObject(sphere);
      if (!hits.length) return;
      // 关键：交点在世界坐标，必须转回 spin 的局部坐标才能反算经纬度
      var local = globe.spin.worldToLocal(hits[0].point.clone());
      var ll = vec3ToLL(local);
      var c = countryAt(ll.lon, ll.lat);
      if (!c) return;
      /* 地区（港/澳/台）落到主权国；有自己档案的地区（新喀/南乔治亚）开自己的。
         判定统一在 targetIso 里，见 openCountry 上方。 */
      var isoRaw = String(c.iso || '').toUpperCase();
      var tgt = targetIso(isoRaw, c.parent);
      setActive(tgt);
      openDetail(tgt, cardOf(tgt), false);
    });

    // ---- 渲染循环 ----
    function render() {
      globe.raf = requestAnimationFrame(render);
      if (document.hidden) return;          // 切到别的标签页就停，省电

      /* 帧间隔归一化。所有"每帧加一点"的动画都必须乘这个系数，
         否则 144Hz 屏上转得比 60Hz 快 2.4 倍 —— 之前自转就是"每帧固定加"。 */
      var nowMs = performance.now();
      var dtf = Math.min(3, (nowMs - (globe.lastMs || nowMs)) / 16.667) || 1;
      globe.lastMs = nowMs;

      // 飞行：朝目标角度阻尼逼近。用阻尼而不是时间轴 tween，
      // 是为了飞行途中被拖拽打断时不会两套动画抢控制权。
      /* 系数 0.075 → 0.12：地名是"跟着镜头到位"的，镜头飞多久，用户就要
         等多久才看全周围的名字。0.075 时从任意角度飞到目标要约 98 帧
         （≈1.6 秒），这也是"点开国家后地名迟迟不齐"的底层原因；0.12 约 60 帧
         （≈1 秒），动作更利落，掉帧窗口反而更短。 */
      if (globe.flying && !globe.dragging) {
        var dy = globe.rotTargetY - spin.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        spin.rotation.y += dy * 0.12;
        tilt.rotation.x += (globe.rotTargetX - tilt.rotation.x) * 0.12;
        if (Math.abs(dy) < 0.0015 &&
            Math.abs(globe.rotTargetX - tilt.rotation.x) < 0.0015) {
          globe.flying = false;
        }
      }

      /* 帧率无关的指数逼近：60fps 下系数 0.12，144fps 下自动变小，
         否则高刷屏上"飞近国家"会瞬间到位、看不到过程。 */
      camera.position.z += (globe.camTarget - camera.position.z) * (1 - Math.pow(0.88, dtf));
      if (STAR_MAT) STAR_MAT.uniforms.uTime.value = performance.now() / 1000;
      // 滚轮停下来了，才把 8K 传上 GPU
      /* 只在"手停下来"的时候才把 8K 传上 GPU。拖拽过程中 pointerdown 之后
         就没有新的输入事件了，所以必须同时看 dragging 标记 ——
         否则用户拖到一半正好命中上传，就是"拖拽途中卡一下"。 */
      if (globe.tex8kReady && !globe.dragging && !globe.flying &&
          nowMs - (globe.lastInput || 0) > 420) bind8k();

      if (globe.earthMat) {
        var U = globe.earthMat.uniforms;
        U.nightMix.value += (globe.nightTarget - U.nightMix.value) * 0.09;

        /* 场景光：相机正前方再往"上偏左"抬一点。
           每帧按相机算，所以拖到任何角度，球面都是"左上亮、右下暗"，
           立体感稳定；它不跟地球自转，否则一转暗部就跑到正面来了。 */
        if (U.uLight) {
          var cd = globe.camDir || (globe.camDir = new THREE.Vector3());
          cd.copy(camera.position).normalize();          // 球心在原点，相机位置就是方向
          var upv = globe.camUp || (globe.camUp = new THREE.Vector3());
          upv.set(0, 1, 0).applyQuaternion(camera.quaternion);   // 屏幕上方向
          var rtv = globe.camRight || (globe.camRight = new THREE.Vector3());
          rtv.crossVectors(upv, cd).normalize();                  // 屏幕右方向
          /* 系数决定"有多斜"：z 太大等于正面打光，整颗球一样亮（没立体感），
             所以这里把正前方向压到 0.55，往上 0.85、往左 0.55 ——
             光从左上斜着进来，明暗才铺得开。 */
          U.uLight.value.copy(cd).multiplyScalar(0.55)
            .addScaledVector(upv, 0.85).addScaledVector(rtv, -0.55).normalize();
        }

        /* 整球淡入：0 → 1 用 1.1 秒、smoothstep 缓动。
           不是过渡动画炫技 —— 贴图从无到有如果硬切，观感就是"闪了一下"。
           两层大气一起淡，避免出现"光晕先到、球后到"。 */
        if (globe.fadeStart) {
          /* 2.8 秒淡入。既然 8K 在出球前就准备好了，这里可以把时间拉长：
             越长越像"从星空里浮出来"，也越不容易看出贴图是"贴"上去的。 */
          var kf = (performance.now() - globe.fadeStart) / 2800;
          kf = kf > 1 ? 1 : kf;
          var ef = kf * kf * (3 - 2 * kf);
          U.uFade.value = ef;
          globe.fadeVal = ef;
          /* 线框与大陆轮廓反向淡出：球 0→1 的同时它们 1→0，
             两者在中间交叠，观感是"骨架化成了实体"，而不是"线框没了、球才来"。 */
          if (globe.wire) {
            var wOp = 1 - ef;
            globe.wire.forEach(function (w) {
              w.o.material.opacity = w.base * wOp;
              w.o.visible = wOp > 0.02;
            });
            if (kf >= 1) globe.wire = null;
          }
          if (kf >= 1) globe.fadeStart = 0;
        }
        /* 大气壳的透明度每帧算一次：淡入值 × 夜面衰减。
           夜面时蓝色气壳几乎收掉，否则整颗球像蒙着蓝纱、城市灯光也糊。 */
        if (globe.atmo) {
          var atmoK = (globe.fadeVal == null ? 1 : globe.fadeVal) *
                      (1 - 0.93 * U.nightMix.value);
          globe.atmo.forEach(function (a) {
            a.mat.uniforms.uOpacity.value = a.base * atmoK;
          });
        }

        /* 8K 淡入：只把 uMixB 推到 1，不接管 dayMap、也不释放 4K ——
           4K 还要负责缩小时的 mipmap 采样。 */
        if (U.uMixB.value < globe.mixBTarget) {
          U.uMixB.value = Math.min(globe.mixBTarget,
            U.uMixB.value + (globe.mixBTarget - U.uMixB.value) * 0.055 + 0.002);
        }
      }

      if (globe.spinWanted !== false && globe.autoSpin && !globe.pinCN && !globe.dragging && !globe.flying &&
          nowMs > globe.idleUntil && !(globe.term && globe.term.on) &&
          !globe.timeMode) {
        /* 自转：0.0009 弧度/帧@60fps ≈ 116 秒一圈（原来 0.0013 = 80 秒，偏快）。
           再按相机距离减速：同样的角速度，凑近看时地表掠过屏幕的速度会快得多，
           乘 z/CAM_FAR 正好把这个放大抵消掉，远近看着一样从容。 */
        var spd = 0.0009 * Math.min(1.2, Math.max(0.35, camera.position.z / CAM_FAR));
        spin.rotation.y += spd * dtf;
      }
      if (!globe.dragging && Math.abs(globe.vel.x) + Math.abs(globe.vel.y) > 0.0002) {
        var decay = Math.pow(0.93, dtf);
        globe.vel.x *= decay;
        globe.vel.y *= decay;
        spin.rotation.y += globe.vel.x * dtf;
        tilt.rotation.x += globe.vel.y * dtf;
        var lim2 = 78 * D2R;
        tilt.rotation.x = Math.max(-lim2, Math.min(lim2, tilt.rotation.x));
      }
      if (pins.length) placePins();
      renderer.render(scene, camera);
      /* 每帧都更新。
         之前为了省集显的开销，飞行/拖拽时降到了 30 次/秒 —— 那是错的：
         画面 60fps 在动、标签只有一半帧在跟，实测 65% 的帧标签位置完全冻结，
         变的那一帧却要挪两倍距离，看屏幕就是"国名疯狂抖动"。
         真要省，正确做法是降"写样式"的次数（数值没变就不写，代码里已有），
         而不是降"算位置"的次数。 */
      updateLabels();
    }
    render();

    // ---- 尺寸变化 ----
    function resize() {
      var w2 = stage.clientWidth, h2 = stage.clientHeight;
      if (!w2 || !h2) return;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2, false);
      /* 视口一变，"整球入画"所需的距离也变（竖窗口时水平方向更紧）。
         处在这两个"贴合"状态时要把相机重新对到新值上，否则窗口一改
         球就被裁 —— 只在 buildGlobe 里算一次是不够的。 */
      CAM_FAR = farZ();
      CAM_NEAR = nearZ();
      if (globe.camMode === 'far') globe.camTarget = CAM_FAR;
      else if (globe.camMode === 'near') globe.camTarget = CAM_NEAR;
      else globe.camTarget = Math.max(CAM_MIN, Math.min(CAM_MAX, globe.camTarget));
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);

    /* 地名标注数据（242 个国家/地区 + 洲名洋名），和逐国档案分开取，
       标注加载失败不影响地球本体 */
    fetchAny('geo/labels.json')
      .then(buildLabels)
      .catch(function () { /* 静默降级：没有地名，球还在 */ });
    /* 地形名称单独一份，只在气候/地形图层下启用 */
    fetchAny('geo/terrain_labels.json')
      .then(buildTerrainLabels)
      .catch(function () { /* 没有就只是没有地形名 */ });

    setActive(null);        // 初始不点亮任何国界
  }

  function startGlobe() {
    if (globe.state !== 'idle') return;
    /* 全量国界索引立刻开始下：这条链路只有 18KB/s，143KB 要八秒。
       放在 labels.json 之后才开始的话，白白晚五秒才拿到。 */
    loadFlatBoxes();
    if (!window.WebGLRenderingContext) {
      globeMsg('当前浏览器不支持 WebGL，3D 地球无法显示。国界轮廓在各国详情页内仍可查看。', true);
      globe.state = 'failed';
      return;
    }
    globe.state = 'loading';
    globeMsg('正在加载地球模型…');
    loadScriptOnce(GLOBE_SRC, function (err) {
      if (err || !window.THREE) {
        globe.state = 'failed';
        globeMsg('3D 模型未能加载（three.js 不可达）。国界轮廓在各国详情页内仍可查看。', true);
        return;
      }
      fetchAny('geo/globe.json')
        .then(function (data) {
          try {
            buildGlobe(data);
            globe.state = 'ok';
          } catch (e2) {
            globe.state = 'failed';
            globeMsg('3D 初始化失败：' + e2.message, true);
          }
        })
        .catch(function (e3) {
          globe.state = 'failed';
          globeMsg('地球数据未能加载（' + e3.message + '）', true);
        });
    });
  }

  /* ---------- 左下角工具 ----------
     国名不再是开关（改成按缩放自动分级），复位也不再是按钮（双击画面）。
     这里只剩"白天/夜晚"一个真开关。 */
  (function bindTools() {
    var bni = document.getElementById('btn-night');
    if (bni) {
      bni.addEventListener('click', function () {
        globe.nightTarget = globe.nightTarget > 0.5 ? 0 : 1;
        var on = globe.nightTarget > 0.5;
        bni.classList.toggle('on', on);
        bni.setAttribute('data-tip', on ? '回到白天模式' : '切换到夜晚模式');
        if (window.__tipHide) window.__tipHide();
      });
    }

    /* ---------- 专题图层：气候带 / 地形 ----------
       两张等距柱状贴图，叠在地球着色器上（uLayerMap + uLayerMix）。
       气候图的海洋是 alpha=0，所以海面仍透出卫星影像，只有陆地被染色；
       地形图不透明，整颗球换成地图册式的高程着色。
       贴图懒加载：点开才下，不占首屏带宽。 */
    var LG = {
      climate: {
        title: '气候带',
        tex: 'climate.webp',
        src: 'Köppen-Geiger 分类 · Kottek et al. 2006（0.5° 栅格，30 类）',
        rows: [
          ['热带', [['#1a6b3c', '雨林'], ['#2f8a4f', '季风'], ['#a3b84a', '草原']]],
          ['干旱', [['#dfae63', '热沙漠'], ['#d6c39a', '冷沙漠'], ['#d29a58', '热草原'], ['#bfa87d', '冷草原']]],
          ['温带', [['#b8a24b', '地中海'], ['#7ab273', '湿润'], ['#6aa79a', '海洋性']]],
          ['寒温带', [['#5b90a6', '大陆性'], ['#4a7a9e', '亚寒带']]],
          ['极地', [['#9fa9b5', '苔原'], ['#dfe7ef', '冰盖']]]
        ]
      },
      terrain: {
        title: '地形',
        tex: 'terrain.webp',
        src: 'Natural Earth HYP 高程着色（1:5000 万）',
        band: ['#2c5c8a', '#8fc0dc', '#6f9c5a', '#a8b06a', '#c8a878', '#b8a890', '#eef4f9'],
        ticks: ['0', '500', '1500', '3000', '5000 m']
      }
    };
    var lgEl = document.getElementById('layer-legend');
    var lgTex = {}, lgCur = '', lgAnim = 0, lgMix = 0;

    function lgLoad(name, cb) {
      if (lgTex[name]) { cb(lgTex[name]); return; }
      var loader = new THREE.TextureLoader();
      var i = 0;
      /* 必须带版本号：OBS 上的对象带 7 天 Cache-Control，换了贴图不换 URL
         的话浏览器一直用旧的（用户会以为"改了没生效"）。 */
      var q = BUILD_TAG ? ('?v=' + encodeURIComponent(BUILD_TAG)) : '';
      (function next() {
        if (i >= TEX_BASES.length) { cb(null); return; }
        loader.load(TEX_BASES[i++] + LG[name].tex + q, function (t) {
          /* 各向异性拉到设备的极限。气候图在球上是大角度斜视，4 倍过滤把
             远处的地块糊成一片；16 倍能沿视线方向多采几次，斜面上的分区
             边界基本能保住 —— 这是"糊"的另一半原因（另一半是缺描边）。 */
          t.anisotropy = (globe.renderer && globe.renderer.capabilities)
            ? globe.renderer.capabilities.getMaxAnisotropy() : 4;
          t.generateMipmaps = true;
          t.minFilter = THREE.LinearMipmapLinearFilter;
          t.magFilter = THREE.LinearFilter;
          t.needsUpdate = true;
          lgTex[name] = t;
          cb(t);
        }, undefined, next);
      })();
    }

    function lgFade(to, dur) {
      var from = lgMix, t0 = performance.now();
      cancelAnimationFrame(lgAnim);
      (function step() {
        var k = Math.min(1, (performance.now() - t0) / dur);
        var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        lgMix = from + (to - from) * e;
        if (globe.earthMat) globe.earthMat.uniforms.uLayerMix.value = lgMix;
        if (k < 1) { lgAnim = requestAnimationFrame(step); }
        else if (to === 0 && globe.earthMat) {
          globe.earthMat.uniforms.uLayerMap.value = null;
        }
      })();
    }

    function lgLegend(name) {
      if (!lgEl) return;
      var cfg = LG[name], h = '';
      h += '<div class="lg-head"><span class="lg-title">' + cfg.title + '</span>' +
           '<button class="lg-close" type="button" aria-label="关闭图例">×</button></div>';
      (cfg.rows || []).forEach(function (r) {
        h += '<div class="lg-line"><span class="lg-key">' + r[0] + '</span><span class="lg-grid">' +
             r[1].map(function (x) {
               return '<span class="lg-item"><i style="background:' + x[0] + '"></i>' + x[1] + '</span>';
             }).join('') + '</span></div>';
      });
      if (cfg.band) {
        h += '<div class="lg-band" style="background:linear-gradient(90deg,' + cfg.band.join(',') + ')"></div>';
        h += '<div class="lg-ticks">' + cfg.ticks.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>';
      }
      h += '<div class="lg-src">' + cfg.src + '</div>';
      lgEl.innerHTML = h;
      lgEl.classList.add('on');
      lgEl.setAttribute('aria-hidden', 'false');
      var cx = lgEl.querySelector('.lg-close');
      if (cx) cx.addEventListener('click', lgClose);
    }

    function lgSync() {
      var bcl = document.getElementById('btn-climate');
      var btr = document.getElementById('btn-terrain');
      if (bcl) {
        bcl.classList.toggle('on', lgCur === 'climate');
        bcl.setAttribute('aria-pressed', lgCur === 'climate' ? 'true' : 'false');
        bcl.setAttribute('data-tip', lgCur === 'climate' ? '关闭气候带' : '显示气候带');
      }
      if (btr) {
        btr.classList.toggle('on', lgCur === 'terrain');
        btr.setAttribute('aria-pressed', lgCur === 'terrain' ? 'true' : 'false');
        btr.setAttribute('data-tip', lgCur === 'terrain' ? '关闭地形' : '显示地形');
      }
    }

    function lgClose() {
      lgCur = '';
      globe.layerName = '';
      lgFade(0, 260);
      if (lgEl) { lgEl.classList.remove('on'); lgEl.setAttribute('aria-hidden', 'true'); }
      lgSync();
      /* 定位不再跟着图层走：查的是本地索引图，关掉图层照样能问 */
      if (globe.syncBorderColor) globe.syncBorderColor();
      if (globe.syncLabelLayers) globe.syncLabelLayers();
    }

    function lgToggle(name) {
      if (lgCur === name) { lgClose(); return; }
      if (!globe.earthMat) return;
      lgLoad(name, function (t) {
        if (!t || !globe.earthMat) return;
        globe.earthMat.uniforms.uLayerMap.value = t;
        lgCur = name;
        globe.layerName = name;
        lgFade(1, 380);
        lgLegend(name);
        lgSync();
        if (globe.syncBorderColor) globe.syncBorderColor();
        if (globe.syncLabelLayers) globe.syncLabelLayers();
        /* 换了图层，气候/高度的气泡就作废了（同一个点问的已经是另一件事）。
           时间气泡与图层无关，留着。 */
        if (globe.clearPins) { globe.clearPins('climate'); globe.clearPins('elev'); }
        if (globe.tShapeClear) globe.tShapeClear();
      });
      if (window.__tipHide) window.__tipHide();
    }

    (function () {
      var bcl = document.getElementById('btn-climate');
      var btr = document.getElementById('btn-terrain');
      if (bcl) bcl.addEventListener('click', function () { lgToggle('climate'); });
      if (btr) btr.addEventListener('click', function () { lgToggle('terrain'); });
      lgSync();
    })();

    /* ---------- 三种定位：时间 / 气候 / 高度 ----------
       一个模式一支光标，互斥；再点同一个按钮退出。
       气候和高度需要对应图层，所以点它们会自动把图层切过去 ——
       不必"先开图层、再回来找按钮"，任何状态下都能直接定位。 */
    var PICK_BTNS = {
      time: document.getElementById('btn-time'),
      climate: document.getElementById('btn-probe-clim'),
      elev: document.getElementById('btn-probe-elev')
    };

    function setPick(kind) {
      var cur = globe.pickKind || '';
      if (cur === kind) kind = '';              // 再点一次同一个 = 退出
      if (cur && cur !== kind && globe.clearPins) globe.clearPins(cur);  // 换模式：旧模式的气泡收掉
      globe.pickKind = kind || '';
      globe.timeMode = kind === 'time';
      globe.probeMode = kind === 'climate' || kind === 'elev';
      globe.probeKind = globe.probeMode ? kind : '';

      for (var k in PICK_BTNS) {
        var b = PICK_BTNS[k];
        if (!b) continue;
        b.classList.toggle('on', k === kind);
        b.setAttribute('aria-pressed', k === kind ? 'true' : 'false');
      }
      var st = document.getElementById('globe-stage');
      if (st) {
        st.classList.toggle('time-mode', globe.timeMode);
        st.classList.toggle('probe-mode', globe.probeMode);
      }
      /* 定位时要"点哪儿算哪儿"，标签不能接事件 —— 否则点在国名上会弹档案。
         立刻刷一遍，不等下一帧（那一帧的空窗里手快正好点进去）。 */
      (globe.labels || []).forEach(function (L) {
        L.el.style.pointerEvents = (globe.timeMode || globe.probeMode)
          ? 'none' : (L.iso ? 'auto' : '');
      });
      /* 三种定位是独立的查询工具，不改变当前看的图层 ——
         在地球仪模式下也能问"这里是气候/海拔"，只是不给图看。 */
      if (globe.probeMode && globe.preloadProbe) globe.preloadProbe(kind);
      if (window.__tipHide) window.__tipHide();
    }
    globe.setPick = setPick;

    for (var _pk in PICK_BTNS) {
      (function (k, b) {
        if (b) b.addEventListener('click', function () { setPick(k); });
      })(_pk, PICK_BTNS[_pk]);
    }

    /* 图层模式下国名让位给地形名：两层字同时铺满屏幕必然糊成一团。
       用 visibility 而不是 display —— 量宽高还要靠它排版。 */
    function syncLabelLayers() {
      var a = document.getElementById('labels');
      var b = document.getElementById('tlabels');
      var layerOn = !!globe.layerName;
      /* 开了"全部国境线"就得知道哪条线是哪国 —— 这时国名要让位回来，
         地形名收起（两层字同时铺满必然糊）。但图层模式下的国名只做标注，
         不给点击：想看国家请先关掉图层。 */
      var showCountry = !layerOn || !!globe.allBordersOn;
      if (a) {
        a.style.visibility = showCountry ? '' : 'hidden';
        a.style.pointerEvents = (layerOn && globe.allBordersOn) ? 'none' : '';
      }
      if (b) b.style.visibility = (layerOn && !globe.allBordersOn) ? 'visible' : 'hidden';
    }
    globe.syncLabelLayers = syncLabelLayers;


    /* 工具栏收纳（只在手机上生效，桌面永远整条展开）。
       原来这里也有一段"收起后只留一颗按钮"的代码，但那个按钮和它的样式
       后来被删掉了 —— toolsToggle 恒为 null，整段是死代码。现在按钮回来了。 */
    var toolsWrap = document.getElementById('tools');
    var toolsToggle = document.getElementById('tools-toggle');
    if (toolsWrap && toolsToggle) {
      var setToolsOpen = function (v) {
        toolsWrap.classList.toggle('open', v);
        toolsToggle.setAttribute('aria-expanded', v ? 'true' : 'false');
        toolsToggle.setAttribute('aria-label', v ? '收起工具' : '展开工具');
      };
      toolsToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        setToolsOpen(!toolsWrap.classList.contains('open'));
      });
      /* 不自动收起：一次可能连着开好几个（国境线 + 经纬线 + 气候），
         点完就关反而要反复拉开。关法交回给"点球面"和再点一次入口。 */

      /* 只有点入口按钮才开合。
         原来还挂了"点别处自动收起"，结果一拖球、一点球面面板就没了 ——
         用户要的是自己控制：开了就一直开着。 */

    }

    /* 开关状态同步给读屏：这五个是 aria-pressed 开关，复位那颗是动作，不参与。
       用 MutationObserver 盯 class，比在六处 classList.toggle 后面各补一句可靠 ——
       漏一处就永远对不上。 */
    (function () {
      var all = document.querySelectorAll('#tools .tool-btn[aria-pressed]');
      var sync = function () {
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute('aria-pressed',
            all[i].classList.contains('on') ? 'true' : 'false');
        }
      };
      if (window.MutationObserver) {
        var mo = new MutationObserver(sync);
        for (var i = 0; i < all.length; i++) {
          mo.observe(all[i], { attributes: true, attributeFilter: ['class'] });
        }
      }
      sync();
    })();

    /* 自转：用户意愿单独存一个 spinWanted。autoSpin 会被飞行、拖动、钉中国
       这些逻辑临时改，用它当开关会被"飞过去再也没转回来"。 */
    var bsp = document.getElementById('btn-spin');
    if (bsp) {
      bsp.classList.toggle('on', globe.spinWanted !== false);
      bsp.addEventListener('click', function () {
        globe.spinWanted = !(globe.spinWanted !== false);
        bsp.classList.toggle('on', globe.spinWanted);
        bsp.setAttribute('aria-pressed', globe.spinWanted ? 'true' : 'false');
        var stx = bsp.querySelector('.tl');
        if (stx) stx.textContent = globe.spinWanted ? '暂停自转' : '开启自转';
        if (globe.spinWanted) globe.idleUntil = performance.now() + 250;
        if (window.__tipHide) window.__tipHide();
      });
    }

    var bcn = document.getElementById('btn-china');
    if (bcn) {
      bcn.addEventListener('click', function () {
        setPinChina(!globe.pinCN);
        if (window.__tipHide) window.__tipHide();
      });
    }

    /* 全部国境线：切换。加载 8 个分片期间按钮置 busy，避免连点重复请求。 */
    var bbd = document.getElementById('btn-borders');
    if (bbd) {
      bbd.addEventListener('click', function () {
        if (bbd.classList.contains('busy')) return;
        bbd.classList.add('busy');
        globe.toggleAllBorders(function (on) {
          bbd.classList.remove('busy');
          bbd.classList.toggle('on', !!on);
          globe.allBordersOn = !!on;
          if (globe.syncLabelLayers) globe.syncLabelLayers();
          bbd.setAttribute('data-tip', on ? '隐藏全部国境线' : '显示全部国境线');
        });
        if (window.__tipHide) window.__tipHide();
      });
    }

    /* 经纬线：只是把兜底骨架重新亮出来，不重建几何。 */
    var bgd = document.getElementById('btn-grid');
    if (bgd) {
      bgd.addEventListener('click', function () {
        var built = !!globe.grid;
        if (!built) {
          // 预热还没跑到（用户点得太快）才会走到这里。不置 busy：
          // 建线本来就是同步的，加了 loading 态反而多一次多余的样式切换。
          if (!globe.spin) return;
          prepareGrid();
        }
        if (!globe.grid) return;
        /* 刚建好时 visible 已经是 true（要让渲染器把它画一遍），
           这里不能取反 —— 否则第一次点"显示经纬线"会变成刚开就关。 */
        var on = built ? !globe.grid.visible : true;
        globe.grid.visible = on;
        bgd.classList.toggle('on', on);
        bgd.setAttribute('data-tip', on ? '隐藏经纬线' : '显示经纬线');
        if (window.__tipHide) window.__tipHide();
      });
    }

    /* 昼夜分界：开关。打开时停自转，让这张"此刻的昼夜"定住；
       再点一次恢复自转。每分钟对一次太阳位置（太阳一小时才移 15°，
       每帧算纯属浪费）。 */
    var btm = document.getElementById('btn-term');
    var sunTimer = 0;
    if (btm) {
      btm.addEventListener('click', function () {
        var T = globe.term;
        if (!T || !globe.earthMat) return;
        T.on = !T.on;
        globe.earthMat.uniforms.uTermOn.value = T.on ? 1 : 0;
        if (T.on) {
          globe.updateSunTerm();
          clearInterval(sunTimer);
          sunTimer = setInterval(globe.updateSunTerm, 60000);
        } else {
          clearInterval(sunTimer);
        }
        btm.classList.toggle('on', T.on);
        btm.setAttribute('data-tip', T.on
          ? '关闭昼夜分界' : '按此刻的太阳位置分出昼夜两半');
        if (window.__tipHide) window.__tipHide();
      });
    }

    /* 时间指示的按钮已经和另外两个定位一起绑到 setPick 了，
       这里不再单独挂开关 —— 三个模式互斥，各点各的会互相打架。 */
  })();

  /* 射线法：点是否在多边形内。
     跨换日线的环（俄罗斯、斐济）经度从 -180 跳到 180，判定会失效 ——
     所以对同一个点，把经度平移 ±360 再试一次。 */
  function pointInRing(lon, lat, ring) {
    for (var shift = -360; shift <= 360; shift += 360) {
      var x = lon + shift, inside = false;
      for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        var xi = ring[i] && ring[i][0], yi = ring[i] && ring[i][1];
        var xj = ring[j] && ring[j][0], yj = ring[j] && ring[j][1];
        if (xi == null || xj == null) continue;
        if (((yi > lat) !== (yj > lat)) &&
            (x < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
      }
      if (inside) return true;
    }
    return false;
  }

  /* ---------- 2D 平面地图 ----------
     一张 6144×1024 的画布，横向首尾相接三份等距圆柱世界图。
     为什么是三份：单张 2:1 的世界图放到 16:9 屏幕上，要么上下留两条黑边，
     要么横向拉宽到失真。三份循环之后可以"铺满高度 + 左右无限延伸"，
     默认把 -100°（美洲）对到屏幕正中，左右两侧自然就是亚洲。

     画布本身不随缩放重绘 —— 平移缩放只改 CSS transform。 */
  (function bindMap2D() {
    var wrap = document.getElementById('map2d');
    var cv = wrap && wrap.querySelector('.map2d-canvas');
    var btnView = document.getElementById('btn-view');
    var btnPaper = document.getElementById('btn-paper');
    var stage = document.getElementById('globe-stage');
    var labelsEl = document.getElementById('labels');
    if (!wrap || !cv || !btnView) return;

    var W = cv.width, H = cv.height;   // 6144 × 1024（三份）
    var ONE = W / 3;                   // 一份的宽度
    var ringsAll = null, boxes = [], baseImg = null;
    var loading = null, painted = false, boundsDone = false;
    var imgReady = false, imgLoading = false, hiDone = false;
    var is2D = false, paper = false;
    var loadMsg = wrap.querySelector('.map2d-loading');

    // 视口参数：baseH = 铺满屏幕的高度；zoom = 缩放倍数；offX = 横向平移
    var baseH = 0, zoom = 1, offX = 0;

    /* 两份资源分开加载，谁先到先画谁。
       之前是 Promise.all 等 8 个分片 + 1.25MB 底图一起回来才画第一笔，
       线上实测要 20 秒以上，这 20 秒里整个屏幕是纯黑的 —— 用户以为坏了。
       现在底图（431KB）先出，国界线（gzip 后 143KB）随后叠上。 */
    /* 底图分两级加载：
       低清 512×256 只有 14KB，境外链路上一两秒就到，先铺上去让用户立刻看到
       "这是张世界地图"；高清 3072×1536 到了再无缝换掉。
       直接等高清的话，慢网上是十几秒的纯黑 —— 用户只会觉得坏了。 */
    function loadBase() {
      if (imgReady || imgLoading) return;
      imgLoading = true;
      var low = new Image();
      low.onload = function () {
        baseImg = low; imgReady = true;      // 先当正式底图用，后面会被顶掉
        if (is2D) paint();
        var hi = new Image();
        hi.onload = function () {
          baseImg = hi; hiDone = true;
          if (is2D) paint();
        };
        hi.onerror = function () { hiDone = true; };
        hi.src = 'assets/tex/world-2d.webp';
      };
      low.onerror = function () {
        // 低清都失败就直接上高清，别卡在这一步
        var hi = new Image();
        hi.onload = function () { baseImg = hi; imgReady = true; hiDone = true; if (is2D) paint(); };
        hi.onerror = function () { imgReady = true; hiDone = true; paint(); };
        hi.src = 'assets/tex/world-2d.webp';
      };
      low.src = 'assets/tex/world-2d-low.webp';
    }

    function loadBounds() {
      if (boundsDone) return;
      boundsDone = true;              // 只请求一次，失败也不重试
      fetchAny('geo/flat.json')
        .catch(function () { return null; })
        .then(function (data) {
          ringsAll = [];
          if (!data || !data.countries) { if (is2D) paint(); return; }
          var sc = data.scale || 1;
          var bx = {};
          data.countries.forEach(function (c) {
            var box = { x0: 999, y0: 999, x1: -999, y1: -999, rings: [] };
            c.rings.forEach(function (raw) {
              // 存的是 0.1° 单位的整数，这里一次性还原成浮点，
              // 后面绘制和命中判定都不用再除
              var ring = new Array(raw.length);
              for (var i = 0; i < raw.length; i++) {
                ring[i] = [raw[i][0] / sc, raw[i][1] / sc];
                var p = ring[i];
                if (p[0] < box.x0) box.x0 = p[0];
                if (p[1] < box.y0) box.y0 = p[1];
                if (p[0] > box.x1) box.x1 = p[0];
                if (p[1] > box.y1) box.y1 = p[1];
              }
              ringsAll.push({ iso: c.iso, ring: ring });
              box.rings.push(ring);
            });
            bx[c.iso] = box;
          });
          boxes = Object.keys(bx).map(function (iso) {
            var b0 = bx[iso];
            b0.iso = iso;
            b0.area = Math.max(0.01, (b0.x1 - b0.x0) * (b0.y1 - b0.y0));
            return b0;
          });
          if (is2D) paint();
        });
    }

    function drawOne(g, dx) {
      var i;
      // 国界：白底色稿用蓝线，卫星底图上用暖白
      if (paper) {
        g.strokeStyle = 'rgba(38,86,148,.85)';
        g.lineWidth = 2.4;
        g.shadowColor = 'rgba(40,70,110,.55)';   // 海岸线一点的投影，让陆地"浮"起来
        g.shadowBlur = 5;
        g.shadowOffsetY = 1;
      } else {
        g.strokeStyle = 'rgba(244,232,210,.72)';
        g.lineWidth = 1.6;
        g.shadowColor = 'transparent';
        g.shadowBlur = 0;
      }
      g.lineJoin = 'round';
      var prevX = null;
      var rings = ringsAll || [];
      for (var k = 0; k < rings.length; k++) {
        var ring = rings[k].ring;
        g.beginPath();
        prevX = null;
        for (i = 0; i < ring.length; i++) {
          var pt = ring[i];
          if (!pt) continue;
          var x = dx + (pt[0] + 180) / 360 * ONE;
          var y = (90 - pt[1]) / 180 * H;
          // 跨换日线的多边形断开重起笔，否则会横穿整张图
          if (prevX !== null && Math.abs(x - prevX) > ONE * 0.5) g.moveTo(x, y);
          else if (prevX === null) g.moveTo(x, y);
          else g.lineTo(x, y);
          prevX = x;
        }
        g.stroke();
      }
      g.shadowColor = 'transparent';
      g.shadowBlur = 0;
    }

    /* 重绘。底图和国界谁到了就画谁 —— 不再等两份都齐。
       paper 模式下底图不画，但米白底可以先铺上，用户至少看到一张空白地图
       而不是黑洞。 */
    function paint() {
      if (!ringsAll && !baseImg && !paper) return;
      var g = cv.getContext('2d');
      g.clearRect(0, 0, W, H);
      if (paper) {
        g.fillStyle = '#f6f2e9';
        g.fillRect(0, 0, W, H);
      } else if (baseImg) {
        for (var i = 0; i < 3; i++) g.drawImage(baseImg, i * ONE, 0, ONE, H);
      }
      for (var j = 0; j < 3; j++) drawOne(g, j * ONE);
      painted = true;
      // 留个时间戳：canvas 很大，外部靠读像素计时会被 getImageData 本身拖慢，
      // 排查"到底几秒才画出来"只能靠它
      window.__map2dPaintedAt = performance.now();
      window.__map2dHasBase = !!baseImg;
      window.__map2dHasBounds = !!(ringsAll && ringsAll.length);
      if (loadMsg) {
        loadMsg.classList.toggle('on', !(ringsAll && (paper || imgReady)));
      }
    }

    /* 布局：画布高度铺满视口，宽度随之 ×2；offX 决定横向位置。
       初始让 -100° 落在屏幕中央 —— 那是美洲，左右两边就是亚洲。 */
    function layout(reset) {
      baseH = window.innerHeight;
      var cssW = baseH * 2 * 3 * zoom;
      var cssH = baseH * zoom;
      cv.style.width = cssW + 'px';
      cv.style.height = cssH + 'px';
      cv.style.top = Math.round((window.innerHeight - cssH) / 2) + 'px';
      if (reset) offX = window.innerWidth / 2 - (baseH * 2) * (1 + (80 / 360)) * zoom;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    }

    /* 平移边界：循环折返，而不是硬夹住。
       画布里是同一张世界图首尾相接的三份，所以把 offX 整体挪一整份，
       屏幕上的内容**一模一样** —— 挪的时候用户看不出来，也就不会有
       "拖到头撞墙/露黑边"这回事。
       允许区间：offX ∈ [VW - 3·ONE, 0]，保证三份里总有一份能盖满视口。 */
    function clampOff() {
      var ONEcss = baseH * 2 * zoom;
      var min = window.innerWidth - ONEcss * 3;
      var guard = 0;
      while (offX > 0 && guard++ < 8) offX -= ONEcss;
      while (offX < min && guard++ < 8) offX += ONEcss;
      if (offX > 0) offX = 0;
      if (offX < min) offX = min;
    }

    function set2D(on) {
      is2D = on;
      btnView.classList.toggle('on', on);
      btnView.setAttribute('data-tip', on ? '切换回三维地球' : '切换到平面地图');
      var svg = btnView.querySelector('svg');
      if (svg) {
        svg.innerHTML = on
          ? '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.9" ry="8.6"/>'
          : '<rect x="2.6" y="5.4" width="18.8" height="13.2" rx="2"/>' +
            '<path d="M2.6 12h18.8M9 5.4v13.2M15 5.4v13.2"/>';
      }
      if (on) {
        wrap.classList.add('on');
        wrap.setAttribute('aria-hidden', 'false');
        if (stage) stage.style.opacity = '0';
        if (labelsEl) labelsEl.style.opacity = '0';
        btnPaper.hidden = false;
        layout(true);
        loadBase();
        loadBounds();
        paint();
      } else {
        wrap.classList.remove('on');
        wrap.setAttribute('aria-hidden', 'true');
        if (stage) stage.style.opacity = '1';
        if (labelsEl) labelsEl.style.opacity = '1';
        btnPaper.hidden = true;
        paper = false;
        wrap.classList.remove('paper');
        btnPaper.classList.remove('on');
        btnPaper.setAttribute('data-tip', '白底线稿');
      }
    }

    btnView.addEventListener('click', function () {
      set2D(!is2D);
      if (window.__tipHide) window.__tipHide();
    });

    btnPaper.addEventListener('click', function () {
      if (!is2D) return;
      paper = !paper;
      wrap.classList.toggle('paper', paper);
      btnPaper.classList.toggle('on', paper);
      btnPaper.setAttribute('data-tip', paper ? '回到卫星底图' : '白底线稿');
      painted = false;
      if (ringsAll) paint();
      if (window.__tipHide) window.__tipHide();
    });

    /* ---- 拖拽平移 ---- */
    var drag = null;
    wrap.addEventListener('pointerdown', function (e) {
      if (!is2D) return;
      drag = { x: e.clientX, off: offX };
      wrap.classList.add('dragging');
      wrap.setPointerCapture && wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', function (e) {
      if (!drag) return;
      offX = drag.off + (e.clientX - drag.x);
      if (Math.abs(e.clientX - drag.x) > 4) drag.moved = true;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    });
    var justDragged = false;
    function endDrag() {
      justDragged = !!(drag && drag.moved);
      drag = null;
      wrap.classList.remove('dragging');
    }
    wrap.addEventListener('pointerup', endDrag);
    wrap.addEventListener('pointercancel', endDrag);

    /* ---- 滚轮缩放（以屏幕中心为锚） ---- */
    wrap.addEventListener('wheel', function (e) {
      if (!is2D) return;
      e.preventDefault();
      var k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      var nz = Math.max(0.85, Math.min(6, zoom * k));
      if (nz === zoom) return;
      // 让缩放围绕屏幕中心：先算出中心点在画布上的比例，缩放后校正 offX
      var cx = window.innerWidth / 2;
      var ratio = (cx - offX) / (baseH * 2 * 3 * zoom);
      zoom = nz;
      layout(false);
      offX = cx - ratio * baseH * 2 * 3 * zoom;
      clampOff();
      cv.style.left = Math.round(offX) + 'px';
    }, { passive: false });

    /* ---- 点击开档案 ---- */
    wrap.addEventListener('click', function (e) {
      if (!is2D || !ringsAll) return;
      if (justDragged) { justDragged = false; return; }
      var cssW = baseH * 2 * 3 * zoom;
      var px = (e.clientX - offX) / cssW * W;         // 画布像素
      var py = (e.clientY - parseFloat(cv.style.top || 0)) / (baseH * zoom) * H;
      var lon = ((px % ONE) / ONE) * 360 - 180;
      var lat = 90 - py / H * 180;
      if (lat > 90 || lat < -90) return;
      /* 先用 bbox 粗筛，再做射线法判定。
         只靠 bbox 会错得离谱：西班牙的矩形包围盒把整个摩洛哥和阿尔及利亚北部
         都盖住了，点阿尔及利亚会开出西班牙。
         粗筛命中后按面积从小到大试（小国优先），第一个真正包含该点的就是答案。 */
      var cand = [];
      for (var i = 0; i < boxes.length; i++) {
        var b = boxes[i];
        if (lon >= b.x0 - 0.4 && lon <= b.x1 + 0.4 &&
            lat >= b.y0 - 0.4 && lat <= b.y1 + 0.4) cand.push(b);
      }
      cand.sort(function (a, b) { return a.area - b.area; });
      var best = null;
      for (var c = 0; c < cand.length && !best; c++) {
        for (var r = 0; r < cand[c].rings.length; r++) {
          if (pointInRing(lon, lat, cand[c].rings[r])) { best = cand[c]; break; }
        }
      }
      if (!best) return;
      /* 2D 地图同样走 targetIso（有档案的地区开自己的） */
      var bIso = String(best.iso || '').toUpperCase();
      var bTgt = targetIso(bIso);
      setActive(bTgt);
      openDetail(bTgt, cardOf(bTgt), false);
    });

    window.addEventListener('resize', function () {
      if (is2D) layout(false);
    });
  })();

  /* ---------- 首屏就是地球，直接启动。之前那套"滚到区块才加载"已经不适用 ——
     现在地球是页面主体，拖到后面才出现是不可接受的。 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGlobe);
  } else {
    startGlobe();
  }

  /* ---------- 启动 ---------- */
  fetchAny('data/index.json')
    .then(function (idx) {
      (idx.countries || []).forEach(function (c) {
        var k = String(c.iso_a2 || '').toUpperCase();
        if (!k) return;
        if (c.status !== 'placeholder') HAS_DOC[k] = 1;
      });
      renderCards(idx.countries || []);
      var total = (idx.countries || []).length;
      var ready = (idx.countries || []).filter(function (c) { return c.status !== 'placeholder'; }).length;
      subEl.textContent = total + ' 个国家/地区 · ' + ready + ' 条已接入 · schema v' + idx.schema_version;
      hintEl.textContent = '';
      // 注意：这里**不**自动打开任何档案。首屏应该是完整的地球，
      // 由用户点击国土或底部胶囊再展开面板。
      loadSearchIndex();
      loadCapitals();
      loadCountryMeta();
      /* 以前这里会在开机 4.2 秒后，把 236 个国家的 data/*.json 全部预取一遍
         （每 140ms 一条）。初衷是"第一次点某个国家不要现取现解析"，
         但它实测要下约 5MB、跑满 33 秒，把用户此刻正在看的贴图和影像全挤掉了 ——
         首屏流量警报有很大一部分是它贡献的。
         现在改成在国名上悬停时按需预取（见 prefetchCard），一次浏览最多几份。 */
    })
    .catch(function (e) {
      subEl.textContent = '数据未加载';
      fail('读取 data/index.json 失败：' + e.message +
           '。若你是直接双击打开本地文件（file:// 协议），浏览器会禁止 fetch —— 请用公网地址或起一个本地服务器。');
    });
})();
</script>

  <!-- 版本号：固定右下角。之前只在 <meta name="build"> 里，用户根本看不到，
       每次改完只能靠"感觉画面变没变"判断，很容易误判成"没更新"。
       这里直接从 meta 读出来显示，只改一处、不会对不上。 -->
  <div id="build-tag" style="position:fixed;right:10px;bottom:8px;z-index:99999;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(150,180,220,.55);pointer-events:none;letter-spacing:.3px">build</div>
  <script>
    (function () {
      var m = document.querySelector('meta[name="build"]');
      var t = document.getElementById('build-tag');
      if (m && t) t.textContent = 'build ' + (m.content || '?');
    })();
  </script>

</body>
</html>
