             DETAIL_ABORT ? { signal: DETAIL_ABORT.signal } : undefined)
      .then(function (d) {
        if (seq !== DETAIL_SEQ) return;      // 已经切到别的国家了，丢掉
        renderDetail(d, true);
      })
      .catch(function (e) {
        if (seq !== DETAIL_SEQ || (e && e.name === 'AbortError')) return;
        /* 没有完整档案不等于"没有这个国家"。只要 meta 里有它，
           就给一张基础档案（几何 + 地名 + 人口），而不是一句读取失败。 */
        if (LABEL_META && LABEL_META[key]) {
          if (window.console) console.info('[atlas] ' + iso + ' 无完整档案，使用基础档案：' + e.message);
          renderBasic(iso);
          return;
        }
        dTitle.textContent = '档案未就绪';
        dSub.textContent = iso;
        dBody.appendChild(el('p', 'hint',
          '读取 data/' + iso.toLowerCase() + '.json 失败（' + e.message + '），' +
          '基础元数据里也没有这个代码。'));
      });
  }

  /* 有完整档案的国家（data/index.json 里 status 不是 placeholder）。
     点地名时用它决定"开自己的，还是开归属国的"。 */
  var HAS_DOC = {};

  /* ---------- 全量卡片：236 国面板文字合并成一份 ----------
     同源一个请求有 1.2 秒固定延迟（实测 data/fr.json 31KB 也要 1.27 秒），
     所以逐份取档案时，"点过的国家秒出、没点过的空白半天"。把面板要用的
     字段全合并成 data/cards.json，首屏之后空闲时取一次，之后就都在内存里。
     走 OBS：同一份文件 OBS 624KB/s，GitHub Pages 25KB/s，差 20 倍。 */
  var CARDS = {};
  var CARDS_LOADING = false;

  function loadCards() {
    if (CARDS_LOADING) return;
    CARDS_LOADING = true;
    var q = BUILD_TAG ? ('?v=' + encodeURIComponent(BUILD_TAG)) : '';
    var urls = [OBS_BASE + 'data/cards.json' + q, 'data/cards.json' + q];
    var i = 0;
    (function next() {
      if (i >= urls.length) { CARDS_LOADING = false; return; }
      fetch(urls[i++])
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (o) { CARDS = o || {}; CARDS_LOADING = false; })
        .catch(next);   // OBS 没对象就退回同源
    })();
  }

  /* 首屏之后才开始取：地球和贴图先转起来，别和首屏抢带宽。
     没取到之前用户点国家，走下面那条老路（骨架 + 单份档案），不会卡住。 */
  function scheduleCards() {
    setTimeout(loadCards, 300);
  }
  if (document.readyState === 'complete') scheduleCards();
  else window.addEventListener('load', scheduleCards);

  /* 点一个地名之后到底开谁的档案：
     1. 自己有完整档案 → 开自己的
     2. 没有，但归某个主权国管 → 开主权国的
        （格陵兰→丹麦、关岛→美国、法属波利尼西亚→法国、索马里兰→索马里）
     3. 都没有 → 交给 openDetail 走基础档案
     以前格陵兰、关岛这类有 ISO 码但从来没采过档案的条目，点开只有一句
     "档案未就绪" —— 比不显示更让人困惑。归属关系在 labels.json 的 parent 里。 */
  /* ---------- 点击反馈：金色波纹 + 一声轻响 ----------
     波纹用 DOM 画（三圈错开 90ms），音效用 WebAudio 现场合成 ——
     不引任何音频文件，省一个请求，也不占仓库体积。 */
  var _lastDown = { x: 0, y: 0 };
  document.addEventListener('pointerdown', function (e) {
    _lastDown.x = e.clientX;
    _lastDown.y = e.clientY;
    /* 顺手把 AudioContext 建好。实测第一次点国家时现场 new AudioContext()
       要 30~50ms，正好卡在镜头起飞的瞬间 —— 那一下的"顿"就是这么来的。
       在第一次按下鼠标时就付掉这笔钱，用户还在拖鼠标，感觉不到。 */
    warmAudio();
  }, true);

  function rippleAt(x, y) {
    for (var k = 0; k < 3; k++) {
      (function (delay) {
        setTimeout(function () {
          var d = document.createElement('div');
          d.className = 'ripple';
          d.style.left = x + 'px';
          d.style.top = y + 'px';
          document.body.appendChild(d);
          setTimeout(function () { d.remove(); }, 800);
        }, delay);
      })(k * 90);
    }
  }

  var _ac = null;

  function warmAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!_ac) _ac = new AC();
      if (_ac.state === 'suspended') _ac.resume();
    } catch (e) { /* 不支持就算了，点击时再试 */ }
  }

  /* 点击音：机械键盘的"嗒"。
     第一版是 50ms 白噪声过带通（Q 只有 0.9）—— 听起来是"沙"，不是键盘：
     噪声拖了整整 50 毫秒、滤波器又宽，整段都在嘶。
     现在拆成"一个瞬态 + 三个音高"，靠音高做出"嗒"的实体感：
       · 6ms 噪声过 2.8kHz 高通，音量压到 0.055 —— 只当边缘的一点毛刺，不是主体；
       · 1250Hz / 2650Hz 两个正弦，7~11ms 衰完 —— 塑料键帽撞上去那一下；
       · 230Hz 滑到 165Hz、32ms 衰减 —— 触底的"咚"，给一点重量。
     全程 40ms 内收干净，连点也不会糊成一片沙沙声。 */
  function keyClick() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!_ac) _ac = new AC();
      if (_ac.state === 'suspended') _ac.resume();
      var t = _ac.currentTime;
      var sr = _ac.sampleRate;

      function tone(freq, dur, gain, toFreq) {
        var o = _ac.createOscillator();
        var g = _ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, t);
        if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.0015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(_ac.destination);
        o.start(t);
        o.stop(t + dur + 0.01);
      }

      var n = Math.max(1, Math.floor(sr * 0.006));
      var buf = _ac.createBuffer(1, n, sr);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < n; i++) {
        ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (n * 0.16));
      }
      var src = _ac.createBufferSource();
      src.buffer = buf;
      var hp = _ac.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 2800;
      var g0 = _ac.createGain();
      g0.gain.value = 0.055;
      src.connect(hp); hp.connect(g0); g0.connect(_ac.destination);
      src.start(t);

      // 能量重心放在 1~3kHz：键盘声是"嗒"，不是"咚"。
      // 低频只留一点点（0.045），给点击一点重量，压过头就变成敲门声。
      tone(1250, 0.012, 0.115);            // 键帽的"嗒"
      tone(2650, 0.008, 0.055);            // 高频的一点脆
      tone(230, 0.026, 0.045, 180);        // 触底的"咚"，很轻
    } catch (e) { /* 没有 AudioContext 就静默 */ }
  }

  /* 点了某个 iso，到底该开谁的档案 —— 全站唯一一处判定，5 个入口都调它。
     规则：
       ① 港澳台按政策固定归中国，不看有没有自己的档案；
       ② **自己有档案的一律开自己的**（这条是 2026-11-04 补的）；
       ③ 自己没档案、但 parent 指向主权国的，落到主权国（格陵兰→丹麦、
          法罗→丹麦、皮特凯恩→英国……）；
       ④ 都不是就开自己。
     为什么补 ②：新喀里多尼亚（NC）、南乔治亚（GS）、法属波利尼西亚（PF）这些
     地区**有自己的完整档案和地标图**，但 parent 指向 FR / GB。旧逻辑只看
     SOVEREIGN 表，于是搜"新喀"点开结果直接跳到了法国 —— 用户看到的
     "搜索框有 bug、点结果跑到法国去了"就是这个。 */
  function targetIso(iso, parent) {
    var k = String(iso || '').toUpperCase();
    var par = String(parent || '').toUpperCase();
    if (!k) return par;
    if (k === 'TW' || k === 'HK' || k === 'MO') return 'CN';
    if (HAS_DOC[k] || (CARDS && CARDS[k])) return k;
    return SOVEREIGN[k] || par || k;
  }

  function openCountry(c) {
    /* 时间指示模式（旗子）下不打开任何档案。标签那边已经关了
       pointer-events，这里再兜一道：大洲/海洋那几个标签走的是 parent 分支，
       只关国家标签的话，点"北美洲"照样会弹出一张卡片。 */
    if (globe.timeMode) return;
    /* 波纹只在"点地球问时间"时出现；打开档案时画面本来就要飞过去、
       面板会滑出来，再叠一圈扩散的金环会打架。音效在 openDetail 里统一放。 */
    var iso = String(c.iso || '').toUpperCase();
    var par = String(c.parent || '').toUpperCase();
    /* 有完整档案的开自己的；否则落到主权国（港澳台→CN、格陵兰→DK……）。
       原来靠 `known = Object.keys(HAS_DOC).length > 0` 判断，index.json 还没回来时
       known 为 false，target 就退成 iso —— 台湾于是打开自己的空档案，显示"档案未就绪"。
       改用 SOVEREIGN（含港澳台硬兜底）后，不管档案索引到没到，都落到中国。 */
    var target = targetIso(iso, par);
    if (!target) return;
    openDetail(target, cardOf(target), false);
  }

  /* 面板关闭按钮 + Esc */
  (function bindPanel() {
    var btn = document.getElementById('d-close');
    if (btn) btn.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (LB && LB.classList.contains('on')) { closeLightbox(); return; }
      if (detail.classList.contains('open')) closePanel();
    });
  })();

  /* 把档案里的文化正文拆成「历史 / 民俗」两节。
     优先用显式字段（新采集的都写 history_text + custom_text）；
     老档案只有合并的 custom_text，按空行拆一次 —— 那是当初 prompt 里写死的
     两段结构（第一段历史、第二段民俗），拆出来和显式字段等价。 */
  function culturalParts(d) {
    var h = String(d.history_text || '').trim();
    var f = String(d.custom_text || '').trim();
    if (h) return { history: h, folk: f };
    var ps = f.split(/\n{2,}/).map(function (x) { return x.trim(); })
              .filter(function (x) { return x.length > 0; });
    if (ps.length >= 2) {
      return { history: ps[0], folk: ps.slice(1).join('\n\n') };
    }
    return { history: '', folk: f };
  }

  var panelT0 = 0;          // 面板开始滑入的时刻（whenPanelIn 用来算剩余时长）

  /* ---- 点击主图看大图 ----------------------------------------------------
     面板里的图框只有 360 CSS px 宽，油画笔触、岩画线条、纪念碑铭文全看不清。
     这里做一层最朴素的查看器：同一个 1080 宽的原图铺满视口，不额外请求。
     交互：点图开、点背景/✕/Esc 关。Esc 要先让给这里，否则会把整个档案关掉。 */
  var LB = null, LBimg = null, LBcap = null;
  var LAST_DETAIL_ISO = '';   // 上一次渲染的是哪个国家，用来判断要不要把阅读位置归零

  function ensureLightbox() {
    if (LB) return;
    LB = el('div');
    LB.id = 'lightbox';
    LBimg = el('img', 'lb-img');
    LBcap = el('div', 'lb-cap');
    var x = el('div', 'lb-x', '✕');
    LB.appendChild(LBimg);
    LB.appendChild(LBcap);
    LB.appendChild(x);
    (document.body || document.documentElement).appendChild(LB);
    x.addEventListener('click', closeLightbox);
    LB.addEventListener('click', function (e) { if (e.target === LB) closeLightbox(); });
  }

  function openLightbox(src, capText, lic, author) {
    if (!src) return;
    ensureLightbox();
    LBimg.src = src;
    LBimg.alt = capText || '';
    LBcap.textContent = capText || '';
    if (lic) {
      var meta = el('i', null, '　授权：' + lic + (author ? ' · ' + author : ''));
      LBcap.appendChild(meta);
    }
    LB.classList.add('on');
  }

  function closeLightbox() {
    if (!LB || !LB.classList.contains('on')) return;
    LB.classList.remove('on');
    setTimeout(function () {
      if (!LB.classList.contains('on')) LBimg.removeAttribute('src');
    }, 260);
  }

  /* 这张图是不是竖构图？要在加载之前就知道，否则框型会先铺后跳（闪）。
     两个来源都用：cards.json 里带 portrait 标记；直接从 data/xx.json 读时
     没有这个标记，就按 size.detail（"1080x1398"）现算。 */
  function isPortraitImage(it) {
    if (it.portrait != null) return !!it.portrait;
    var m = /^(\d+)x(\d+)$/.exec((it.size && it.size.detail) || '');
    return m ? (+m[2] > +m[1] * 1.15) : false;
  }

  function renderDetail(d, quiet) {
    /* 记下面板开始滑入的时刻。后面 whenPanelIn 要用它算"动画还剩多久"——
       光靠 transitionend 会漏：镜头飞行本身就 900ms，若飞行比动画晚结束，
       监听时动画已经跑完了，事件永远不会再来，只能吃兜底超时（实测 2.87 秒才见图）。 */
    panelT0 = performance.now();
    dTitle.textContent = d.name_zh;
    dSub.textContent = d.name_en + ' · ' + d.iso_a2 + ' / ' + d.iso_a3 + ' · ' + d.qid;

    /* 换国家时把阅读位置拉回顶部。
       两个调用点都传 quiet=true（它的含义是"别重跑入场动画"，不是"同一个国家"），
       所以不能拿 quiet 当条件 —— 实测那样写完全不生效，滚动位置还是 420。
       改成记住上一次渲染的 ISO：只有真的换了国家才归零。
       放在建 DOM 之前：此时滚动高度还是旧值，归零不会闪一下。 */
    var _isoNow = String(d.iso_a2 || '').toUpperCase();
    if (_isoNow && _isoNow !== LAST_DETAIL_ISO) {
      var sc = document.querySelector('.dscroll');
      if (sc) sc.scrollTop = 0;
    }
    LAST_DETAIL_ISO = _isoNow;

    /* 档案里带着粗轮廓 → 记下来，球面上如果还没画线就先拿它顶。
       记在这里而不是 renderDetail 末尾：后面的 DOM 构建还要几十毫秒。 */
    var isoKey = String(d.iso_a2 || '').toUpperCase();
    if (isoKey && d.outline) {
      CARD_OUTLINE[isoKey] = d.outline;
      /* 面板已经滑出来了，球上还空着 —— 这一刻就把画补上，别等后面那个 220ms */
      if (globe && globe.maybePreempt) globe.maybePreempt(isoKey, d.outline);
    }

    var wrap = el('div', 'dwrap');

    /* 左：影像 */
    var left = el('div');
    var imgs = d.landmark_images || [];
    if (imgs.length) {
      var picWrap = el('div', 'dimg-wrap loading');
      var pic = el('img', 'dimg');
      /* 解码放到渲染线程之外。卡片首图普遍 1200×800 上下，同步解码
         一次要 30~50ms —— 正好落在面板滑入、镜头起飞的那一帧上，
         用户看到的就是"点一下顿一下"。decoding=async 让浏览器把解码
         挪到别的线程，主线程只负责布局。 */
      pic.decoding = 'async';
      picWrap.appendChild(pic);
      /* 放大提示 + 点击查看大图 */
      picWrap.appendChild(el('div', 'zoomhint', '⤢'));
      picWrap.addEventListener('click', function () {
        var it = imgs[picIdx];
        if (!it || !picWrap.classList.contains('loaded')) return;
        openLightbox(it.url || it.thumb_url,
                     it.caption_zh || it.caption || d.name_zh,
                     it.license, it.author);
      });
      var capEl = el('div', 'cap', '');
      var licEl = el('div', 'cap dim', '');
      var strip = imgs.length > 1 ? el('div', 'thumbstrip') : null;
      var items = [];
      var picSeq = 0;
      var picIdx = 0;      // 当前主图下标，点击放大时要知道是哪一张

      /* 题注和授权是纯文本，立刻就能填 —— 图片要等镜头停稳（见下面 whenSettled），
         这段时间面板不能是空白的，先让图注占住位置，视觉上不跳。 */
      function setCap(idx) {
        var it = imgs[idx];
        capEl.textContent = it.caption_zh || it.caption || '';
        var licText = it.license
          ? '授权：' + it.license + (it.author ? ' · ' + it.author : '')
          : '授权待确认（来源已记录：' + (it.title || 'Commons') + '）';
        licEl.textContent = licText;
        licEl.title = licText;      // 视觉上截两行，全文留在 title 里（署名信息不能丢）
        items.forEach(function (n, i) { n.classList.toggle('active', i === idx); });
      }

      function showPic(idx) {
        picIdx = idx;
        var it = imgs[idx];
        var seq = ++picSeq;
        /* 竖图在**换图之前**就把框型定好。
           原来是在 onload 里才发现"这是竖的"再切 .fit —— 于是先按 16:10 铺一遍、
           再跳成 4/5，用户看到的就是"先闪成全屏、再变竖图"。
           cards.json 里带 portrait 标记（build_cards 按 1080x1398 算好的），
           加载前就能决定，不跳。 */
        picWrap.classList.toggle('fit', isPortraitImage(it));
        picWrap.classList.remove('loaded', 'blank');
        picWrap.classList.add('loading');
        /* 预取过（已在内存）就免淡入；没预取才淡 0.26s，避免"闪" */
        pic.classList.toggle('now', !!it.__ready);
        picWrap.classList.remove('blank');   // 上一张失败留下的 blank 要清掉，否则 display:none 一直挂着
        pic.alt = it.caption_zh || it.caption || d.name_zh;
        pic.onload = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('loaded');
          picWrap.classList.remove('blank');
          /* 兜底：cards.json 里没有 portrait 的老数据，仍按实际尺寸补一次。
             有标记的不会走到这里改变框型，所以不会跳。 */
          if (it.portrait == null && !(it.size && it.size.detail)) {
            picWrap.classList.toggle('fit', pic.naturalHeight > pic.naturalWidth * 1.15);
          }
        };
        pic.__onfail = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('blank');
        };
        /* 直接上主图。
           原来先挂缩略图、等主图预载好再替换，视觉上是"先糊一下再变清晰"——
           用户明确不要这个过渡。OBS 上主图 50~150KB、0.2 秒就到，
           这点等待比"糊一下"舒服。缩略图只在底下那条胶片带里用。 */
        setAsset(pic, it.url || it.thumb_url, it.v);
        // 换到同一张图时浏览器不会重新触发 load，loaded 就永远加不上，图是透明
        if (pic.complete && pic.naturalWidth) pic.onload();
        setCap(idx);
      }

      left.appendChild(picWrap);
      if (strip) {
        imgs.forEach(function (it, i) {
          /* 用 <div> 的背景图，而不是 <img>。
             <img> 在"还没下到"或"加载失败"时，浏览器会在框里画一个破图小图标
             （alt 置空也只是去掉文字，图标照画），那个图标没有 CSS 能关掉。
             背景图没有这个副作用：图没到就是一块干净的骨架，图到了整块盖上。 */
          var label = it.caption_zh || it.caption || (d.name_zh + ' 图片 ' + (i + 1));
          var t = el('div', 'ts-item');
          t.setAttribute('role', 'img');
          t.setAttribute('aria-label', label);
          t.setAttribute('data-tip', label);
          /* 这里只装"怎么加载"，不立刻发请求 —— 由下面 whenSettled 统一触发。
             之前是在创建时就 probe.src，五张图会和面板的图层光栅化撞在同一帧，
             实测点开后 40~170ms 那一片掉帧就是从这来的（主图反而在 900ms 后才取）。 */
          t.__load = function (rel, ver) {
            if (t.__loading) return;
            t.__loading = true;
            var probe = new Image();
            var settled = false;
            var apply = function (src) {
              t.style.backgroundImage = 'url("' + src + '")';
              t.classList.add('loaded');
            };
            /* 与主图同一套双源策略：先 OBS，失败回退仓库相对路径。
               两个 URL 都试完仍然是坏的，就让它保持骨架，不显示任何占位图。 */
            probe.onload = function () { settled = true; apply(assetSrc(rel, ver)); };
            probe.onerror = function () {
              if (settled) return;
              settled = true;
              var fallback = new Image();
              fallback.onload = function () { apply(rel); };
              fallback.src = rel;
            };
            probe.src = assetSrc(rel, ver);   // 必须带同一个版本号，否则预载和显示会各下一次
          };
          t.addEventListener('click', function () { showPic(i); });
          items.push(t);
          strip.appendChild(t);
        });
      }
      setCap(0);
      /* 图片一律等镜头停稳再取。
         实测：点开一个国家时，掉帧有一半来自这几张图 —— 主图 1200×800 要下载、
         解码、再当纹理传上 GPU，而那 700 毫秒正是镜头在飞的时候；缩略图一次
         五六张，情况更糟。而"冷/热"两遍的差别（第一次点卡、再点不卡）也正是
         它们。题干说"先等镜头固定了再下也能接受"，那就按这个来：
         面板立刻滑入、图注立刻显示，图位置留一块微光的骨架，停稳后再填图。 */
      /* 等面板滑入动画彻底走完再取图。
         实测（同一台机器、六国连点、屏蔽掉全部 webp 做对照）：
           正常 31 次掉帧 / 屏蔽图片后只剩 5 次
         —— 图片的解码和上传 GPU 就是点击后那一顿的绝对主因，占比八成以上。
         光"等镜头停稳"（900ms）不够：面板滑入本身要 1.05s，图正好砸在动画尾巴上。
         代价是图晚 0.15 秒出现，骨架多显示一会儿 —— 用户说过"慢能接受，卡不能"。 */
      function whenPanelIn(cb) {
        if (!detail) { cb(); return; }
        /* 动画时长从 CSS 读，别写死 —— 以后调 1.05s 这里不会失配。 */
        var dur = 0;
        try {
          /* 取所有过渡里最长的那个。桌面是 transform .56s，手机是 1.05s，
             直接读第一个会有平台差异，取最大值最稳。 */
          var parts = (getComputedStyle(detail).transitionDuration || '0s').split(',');
          for (var i = 0; i < parts.length; i++) {
            var v = parts[i].trim();
            var n = parseFloat(v) || 0;
            if (v.slice(-2) !== 'ms') n *= 1000;
            if (n > dur) dur = n;
          }
        } catch (e) { dur = 600; }
        var left = dur - (performance.now() - panelT0);
        if (left <= 20) { cb(); return; }
        setTimeout(cb, left + 60);
      }

      /* 图片直接开始取，不再等镜头停稳。
         OBS 上主图 50~150KB、实测 0.2 秒就到 —— 早取早显示，比"等 1.6 秒
         飞完再取"体验好得多。主图先发，五张缩略图错开 60ms 跟上，
         别和主图挤在同一帧。 */
      if (picSeq === 0) showPic(0);
      if (strip) {
        imgs.forEach(function (it, i) {
          var node = items[i];
          if (!node || !node.__load) return;
          setTimeout(function () { node.__load(it.thumb_url || it.url, it.v); }, i * 60);
        });

        /* 预取详情图（1080 宽，60~120KB）。
           胶片带只预载 240px 缩略图，1080 的原图以前是点开才下 —— 这是"切一张等一会儿"的根。
           两条触发：
             ① 面板停稳 0.7s 后按 160ms 间隔补一遍（不等用户动手）；
             ② 鼠标移到某张缩略图上时立刻抓那一张（"急着切"的兜底，命中率最高）。
           流量敏感（saveData / 2G）不预取。 */
        var prefetching = {};
        function prefetchDetail(i) {
          var it = imgs[i];
          if (!it || i === 0 || it.__ready || prefetching[i]) return;
          prefetching[i] = true;
          var pre = new Image();
          pre.decoding = 'async';
          pre.onload = function () { it.__ready = true; };
          pre.src = assetSrc(it.url || it.thumb_url, it.v);
        }
        try {
          var conn = navigator.connection || {};
          if (!conn.saveData && !/2g/.test(conn.effectiveType || '')) {
            imgs.forEach(function (it, i) {
              if (i === 0) return;
              setTimeout(function () { prefetchDetail(i); }, 700 + i * 160);
            });
            items.forEach(function (node, i) {
              node.addEventListener('mouseenter', function () { prefetchDetail(i); });
              node.addEventListener('touchstart', function () { prefetchDetail(i); }, { passive: true });
            });
          }
        } catch (e) {}
      }
      if (strip) left.appendChild(strip);
      left.appendChild(capEl);
      left.appendChild(licEl);
    } else {
      left.appendChild(el('div', 'dimg blank', '暂无地标影像'));
    }

    /* 右：结构化 + 文本 */
    var right = el('div');

    var meta = el('dl', 'dmeta');
    [['首都', d.capital || '—'],
     ['大洲', d.continent || '—'],
     ['坐标', d.centroid ? d.centroid[1].toFixed(2) + '°N, ' + d.centroid[0].toFixed(2) + '°E' : '—'],
     ['语言', (d.languages || []).map(function (l) { return l.name_zh; }).join(' / ') || '—'],
     ['边界', d.geometry
        ? 'Natural Earth 10m · ' + ((d.geometry_stats || {}).vertices || '?') + ' 顶点'
        : 'Natural Earth 10m · 分片几何']
    ].forEach(function (p) {
      var dd = el('dd', null, p[1]);
      dd.setAttribute('data-k', p[0]);   /* 定位时把键名算进主题 */
      if (p[0] === '边界') {
        /* 常被当成"边界画偏了"的那段：江苏外海在 2004 年的卫星图上是一大片
           含沙浑水（长江、旧黄河口），颜色和岸上的土一样。国界是矢量、按测绘
           海岸线画，两者在河口本来就不会完全重合 —— 说清楚，省得每次都要解释。 */
        dd.setAttribute('data-tip', '国界取自 Natural Earth 矢量（10m），底图是 2004 年卫星影像：'
          + '河口与外海的含沙浑水在影像上接近陆地色，边界与影像色块不完全重合属正常');
        dd.style.cursor = 'help';
        dd.style.textDecoration = 'underline dotted rgba(140,165,220,.45)';
        dd.style.textUnderlineOffset = '3px';
      }
      meta.appendChild(el('dt', null, p[0]));
      meta.appendChild(dd);
    });
    right.appendChild(meta);

    // 边界不能只写"已采集"——用户看不见等于没采。这里用等距圆柱投影画成 SVG 轮廓，
    // 无第三方库、离线可用，也顺带验证了阶段 D 要用的 GeoJSON 是好的。
    /* 轮廓来源分两种：三国档案里带着 geometry 路径；其余国家不单独存 geojson
       （223 个国家各自一个文件，部署时就是 223 次提交），改从 geo/c*.json
       分片里取 —— 那份数据本来就为"球面点亮国界"加载过，多半已在内存里。 */
    var geoBox = el('div', 'geo-box');
    geoBox.appendChild(el('div', 'sub-label', '国界轮廓'));
    var svgHost = el('div', 'geo-svg');   /* 不再写"读取边界数据…"，等 SVG 直接画 */
    geoBox.appendChild(svgHost);
    right.appendChild(geoBox);
    /* 轮廓是一大串 path 字符串 + 一次布局，放在面板滑入动画之后再算，
       否则正好卡在动画第一帧。 */
    setTimeout(function () {
      if (d.geometry) { renderOutline(d.geometry, svgHost); return; }
      /* 注意这里在 renderDetail(d) 里，没有 iso 变量 —— 用档案自己的 iso_a2 */
      var iso = String(d.iso_a2 || '').toUpperCase();
      var coarse = outlineRings(d.outline);
      /* 先画手上有的，再等精细的替换：预加载的全量数据（0.06°）已经够细，
         档案自带的 outline 次之，两者都比干等"读取边界数据…"强。 */
      var pre = ALL_BY_ISO && ALL_BY_ISO[iso];
      if (pre) drawRings(pre, svgHost);
      else if (coarse) drawRings(coarse, svgHost);
      if (iso && globe.maybePreempt) globe.maybePreempt(iso, d.outline);
      loadGeo(iso).then(function (gj) {
        if (gj) drawOutline(gj, svgHost);
        else if (!coarse && !pre) svgHost.textContent = '没有这个国家的边界数据';
      });
    }, 220);

    /* 先把关键词列表设好，paraText 才能把正文里的词标出来 */
    KW_LIST = ((d.custom_facets || {}).keywords || [])
      .map(function (k) { return String(k.v || k || '').trim(); })
      .filter(function (w) { return w.length >= 2; })
      .sort(function (a, b) { return b.length - a.length; });

    var txt = el('div', 'dtext');
    var sumTxt = trimDup(d.summary_text, d.custom_text);
    if (sumTxt) txt.appendChild(paraText(sumTxt, 2));
    /* 历史与民俗分两节 —— 两者主题不同（发生过什么 / 今天怎么生活），
       揉在一段里读起来像一篇不分类的散文。新数据直接给 history_text 字段；
       旧数据只有一整段 custom_text，就按空行拆（第一段是历史，这是当时
       prompt 的固定结构），拆不开就整段落在「民俗」下面，不硬标标题。 */
    var parts = culturalParts(d);
    if (parts.history) {
      txt.appendChild(el('div', 'sub-label', '历史'));
      txt.appendChild(paraText(parts.history, 2));
    }
    if (parts.folk) {
      txt.appendChild(el('div', 'sub-label', '民俗'));
      txt.appendChild(paraText(parts.folk, 2));
    }
    right.appendChild(txt);

    /* 文化特征：由大模型在构建期从摘要与民俗文本抽取，页面只读结果。
       每个标签的 title 属性挂着抽取时的原文片段，鼠标悬停可核对依据。 */
    var facets = d.custom_facets || {};
    var fgroups = [
      ['节庆', facets.festivals],
      ['饮食', facets.cuisine],
      ['宗教', facets.religion],
      ['建筑', facets.architecture],
      ['遗产', facets.heritage]
    ].filter(function (g) { return g[1] && g[1].length; });
    var kws = facets.keywords || [];

    if (fgroups.length || kws.length) {
      var fbox = el('div', 'facets');
      fbox.appendChild(el('div', 'sub-label', '文化特征'));
      if (kws.length) {
        var krow = el('div', 'frow');
        krow.appendChild(el('span', 'fkey', '关键词'));
        var kwrap = el('div', 'fval');
        kws.forEach(function (k) {
          var c = el('span', 'chip chip-kw', k.v || k);
          if (k.evidence) c.setAttribute('data-tip', '原文：' + k.evidence);
          kwrap.appendChild(c);
        });
        krow.appendChild(kwrap);
        fbox.appendChild(krow);
      }
      fgroups.forEach(function (g) {
        var row = el('div', 'frow');
        row.appendChild(el('span', 'fkey', g[0]));
        var wrap = el('div', 'fval');
        g[1].forEach(function (x) {
          var c = el('span', 'chip', x.v || x);
          if (x.evidence) c.setAttribute('data-tip', '原文：' + x.evidence);
          wrap.appendChild(c);
        });
        row.appendChild(wrap);
        fbox.appendChild(row);
      });
      right.appendChild(fbox);
    }

    /* 音频：每个语言一条。
       地区语言只在大国给 —— 卢森堡、摩纳哥这种国家列一串地区语言纯属噪音，
       读的人只会觉得"怎么这么多"。阈值 1000 万人口。 */
    var popNow = LABEL_POP[(d.iso_a2 || '').toUpperCase()] || 0;
    var langs = (d.languages || []);
    if (popNow && popNow < 1e7) {
      langs = langs.filter(function (l) { return l.role !== 'regional'; });
    }
    var withAudio = langs.filter(function (l) { return l.audio_url; });
    var without = langs.filter(function (l) { return !l.audio_url; });
    if (withAudio.length) {
      right.appendChild(el('div', 'sub-label', '语音'));
      withAudio.forEach(function (l) {
        var box = el('div', 'lang-block');
        var row = el('div', 'lang-audio');
        row.appendChild(el('span', 'la-name', l.name_zh));
        /* 三种角色：official 官方 / spoken 通用（美国那种联邦无官方语言、
           只有实际通行语的情况）/ regional 区域。以前只有两档，
           spoken 会被显示成"区域"，读起来像地方方言。 */
        var roleText = l.role === 'official' ? '官方'
          : (l.role === 'spoken' ? '通用' : '区域');
        row.appendChild(el('span', 'la-role', roleText));
        row.appendChild(makePlayer(l.audio_url));
        box.appendChild(row);
        /* 播放器下面配原文 + 中文翻译：外国语音不翻译等于听不懂。
           中文语音本身就不用再翻一遍。 */
        if (l.tts_text) {
          var tr = el('div', 'lang-trans');
          var srcLine = el('div', 'lt-src', l.tts_text);
          tr.appendChild(srcLine);
          /* 给外语配中文翻译。以前用 /[A-Za-z]/ 判断"是不是外语"，只认拉丁字母 ——
             阿拉伯语、日语、泰语一个拉丁字母都没有，于是中文翻译被整段吞掉，
             播放器下面只剩一行看不懂的原文。改成按语种代码判断：
             中文（zh*）和粤语（yue）本身是汉语，不用再翻一遍；其余都配中文。 */
          var isHan = /^(zh|yue)/i.test(l.code || '');
          if (l.tts_text_zh && !isHan && l.tts_text_zh !== l.tts_text) {
            tr.appendChild(el('div', 'lt-zh', l.tts_text_zh));
          }
          box.appendChild(tr);
        }
        right.appendChild(box);
      });
    }
    if (without.length) {
      right.appendChild(el('div', 'pending',
        '暂无语音：' + without.map(function (l) { return l.name_zh; }).join('、')));
    }

    /* 数据待补：只写短标签，一行说完。
       详细成因（P443 语种不符、Commons 无音源…）留在 docs 与 CI 日志里 ——
       面板是给人看国家的地方，不是构建日志。 */
    var brief = d.review_short || [];
    if (brief.length) {
      var dq = el('div', 'dq');
      dq.appendChild(el('span', 'dq-k', '待补'));
      dq.appendChild(el('span', 'dq-v', brief.join(' · ')));
      right.appendChild(dq);
    }

    wrap.appendChild(left);
    wrap.appendChild(right);
    dBody.innerHTML = '';
    dBody.appendChild(wrap);
  }

  /* ---------- 基础档案 ----------
     站点的定位是"所有国家"，但多模态档案是逐国采集的，短期只能有三家完整。
     没采集到的国家不该弹一句"读取失败"—— 那样等于告诉用户"这个国家不存在"。
     所以这里给一张基础档案：国界几何、中文名、大洲、人口、中心坐标，
     全部来自 Natural Earth（公有领域），并且明确说明多模态内容还在队列里。 */
  function fmtPop(n) {
    n = Number(n) || 0;
    if (!n) return '—';
    if (n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
    if (n >= 1e4) return (n / 1e4).toFixed(0) + ' 万';
    return String(n);
  }

  function fmtLL(lon, lat) {
    if (lon == null || lat == null) return '—';
    return Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S') + ', ' +
           Math.abs(lon).toFixed(2) + '°' + (lon >= 0 ? 'E' : 'W');
  }

  function renderBasic(iso) {
    var key = String(iso).toUpperCase();
    var m = (LABEL_META && LABEL_META[key]) || { n: key, en: '', cont: '', pop: 0, lon: null, lat: null };
    dTitle.textContent = m.n;
    dSub.textContent = (m.en || '') + ' · ' + key + ' · 基础档案';

    var wrap = el('div', 'dwrap');
    var left = el('div');
    var right = el('div');

    var geoBox = el('div', 'geo-box');
    var svgHost = el('div', 'geo-svg');   /* 不再写"读取边界数据…"，等 SVG 直接画 */
    geoBox.appendChild(svgHost);
    geoBox.appendChild(el('div', 'cap dim', '国界轮廓 · Natural Earth 1:50m · 公有领域'));
    left.appendChild(geoBox);

    var meta = el('dl', 'dmeta');
    [['中文名', m.n],
     ['英文名', m.en || '—'],
     ['大洲', m.cont || '—'],
     ['人口', m.pop ? fmtPop(m.pop) + '（NE 估算）' : '—'],
     ['中心坐标', fmtLL(m.lon, m.lat)],
     ['档案层级', '基础 · 几何与地名']
    ].forEach(function (pair) {
      meta.appendChild(el('dt', null, pair[0]));
      meta.appendChild(el('dd', null, pair[1]));
    });
    right.appendChild(meta);

    right.appendChild(el('div', 'sub-label', '多模态内容'));
    var box = el('div', 'prose');
    box.appendChild(el('p', null,
      '这个国家的文本（沿革与文化）、地标影像、多语种语音三类内容还在采集队列里。' +
      '上面这些是它的基础档案 —— 国界几何、名称、大洲、人口与中心点，' +
      '来自 Natural Earth 的公有领域数据，可以直接用于定位与检索。'));
    right.appendChild(box);

    var q = el('div', 'dq');
    q.appendChild(el('span', 'dq-k', '进度'));
    q.appendChild(el('span', 'dq-v', '基础档案已就绪 · 文本 / 影像 / 语音待补'));
    right.appendChild(q);

    wrap.appendChild(left);
    wrap.appendChild(right);
    dBody.innerHTML = '';
    dBody.appendChild(wrap);
    /* 轮廓在面板滑入之后再算，避开动画第一帧（与完整档案同一套逻辑） */
    setTimeout(function () {
      loadGeo(key).then(function (gj) { drawOutline(gj, svgHost); });
    }, 220);
  }

  /* ---------- 国界轮廓（等距圆柱投影，纯 SVG） ---------- */
  /* 轮廓几何分成 8 个分片（见 scripts/build_countries.py）。
     分片按 ISO 的字符和取模，前后端各算一次，不需要额外索引。
     拿到的分片在内存里缓存，同一个分片里的国家不会再请求第二次。 */
  var GEO_CHUNKS = {};
  /* 分片表：桶内 ISO 用逗号隔开、桶间用 `|`，由 scripts/rebuild_buckets.py 生成。
     为什么不用 `hash % N`：哈希没法均衡，俄罗斯、加拿大、美国这种巨无霸
     一撞桶就是 800KB+，点下去"卡片出来了、金线还在路上"。
     改成按体积贪心分 16 桶（最大 553KB，其余 232KB），代价只是这张表。
     704 个字符内联，比多一次 HTTP 往返便宜得多。 */
  var GEO_GROUPS = "CA|US|RU|AQ,BT,CH,GD,GM,GQ,LI,MC,MH,SY|AO,AT,CK,GL,HM,IL,KE,LY,ME,MF,NU,PL,PY,TT,UY|AE,AF,AS,CG,DK,EG,FO,GT,GY,ID,KW,NR,SR,TD,TO,VC,WF|CF,CL,DZ,GU,HR,LK,MN,NE,RW,SC,SM,TG,TJ,TN,TV,WS,YE|AI,BD,BE,CV,ES,ET,HU,JE,JO,MP,NO,SD,SH,SN,SO,TM,UM,UZ|AD,BB,BJ,CN,EC,ER,GA,GH,IT,KY,LV,MA,MW,MY,PK,QA,TC,VG|AU,AW,AX,CI,EH,GG,HN,KI,KM,MK,MR,NI,TR,TZ,UA,UG,VI,ZA|AM,BR,CZ,GS,IR,JM,KP,KR,LT,ML,MM,MT,MU,NA,NF,NG,SZ,TL,VU|AG,BO,CO,DM,FJ,HT,IE,JP,LR,NC,NL,NP,PM,PR,PT,SE,SG,SI,VN,XK|BF,BG,BH,BS,BZ,CU,CY,EE,FR,GE,GN,IN,KG,PE,PG,PN,PS,RS,ST,SX|BI,BL,BM,BY,CR,CW,FI,FM,LA,LU,MD,MZ,NZ,PA,PH,SL,SS,SV,VE,ZM|AL,AR,AZ,BN,BW,CD,CM,DJ,DO,FK,IM,IO,IQ,IS,KH,LB,MS,MX,SA,TH|BA,DE,GB,GI,GR,GW,KN,KZ,LC,LS,MG,MV,OM,PF,PW,RO,SB,SK,TF,ZW";
  var GEO_COUNT = GEO_GROUPS.split('|').length;
  var GEO_IDX = null;
  function geoBucket(iso) {
    if (!GEO_IDX) {
      GEO_IDX = {};
      GEO_GROUPS.split('|').forEach(function (g, i) {
        g.split(',').forEach(function (k) { if (k) GEO_IDX[k] = i; });
      });
    }
    var idx = GEO_IDX[iso];
    /* 表里没有的国家（新增/写法变体）落到 0 桶，别让整条链路断掉 */
    return idx == null ? 0 : idx;
  }
  var GEO_ONE = {};                      // 单国几何的缓存（已解析的对象）
  var GEO_PEND = {};                     // 正在飞的请求（同一个国家会被两处同时要）
  var CARD_OUTLINE = {};                 // iso -> 档案自带的粗轮廓（见 scripts/inline_outline.py）
  var CARD_PREFETCH = {};                // iso -> true，悬停时已经预取过档案
  /* iso -> 该国全部环（浮点经纬度）。来自 geo/borders.json 的预加载，
     是"点一下立刻出金线"的底气：数据早在内存里，不用等任何网络。 */
  var ALL_BY_ISO = null;

  /* 悬停预取档案（20~30KB）。用户从"鼠标停在国名上"到真的点下去，
     通常有 200ms 以上，足够把这一份取回来 —— 点开时就不用再等。
     同一国只发一次，重复 hover 不重复打网络。 */
  function prefetchCard(iso) {
    iso = String(iso || '').toUpperCase();
    if (!iso || CARD_PREFETCH[iso]) return;
    CARD_PREFETCH[iso] = true;
    setTimeout(function () {
      fetchAny('data/' + iso.toLowerCase() + '.json').catch(function () {});
    }, 140);
  }

  /* 取一个国家的国界几何。
     优先取**单国文件** geo/n/<iso>.json —— 中位数只有 5KB（加拿大 553KB 是极端值），
     而分片是 232KB 起。限速 1.6Mbps 下实测：走分片"点下去 6.2 秒才出金线"，
     走单国文件基本是即时的。
     单国文件缺失（理论上不会有，新加国家可能）才退回分片，保证不会空手。 */
  function loadGeo(iso) {
    var key = String(iso).toUpperCase();
    var b = geoBucket(key);
    if (GEO_CHUNKS[b] && GEO_CHUNKS[b][key]) return Promise.resolve(GEO_CHUNKS[b][key]);
    if (GEO_ONE[key]) return Promise.resolve(GEO_ONE[key]);
    /* 点一下国家，有两处会同时要它的几何（面板里的 SVG 轮廓、球面上的金线），
       不去重就是两条 5KB 的重复请求，弱网下还会互相排队。 */
    if (GEO_PEND[key]) return GEO_PEND[key];

    /* 单国文件同样走 fetchAny（CDN 优先、同源兜底）。
       实测同一个 jp.json：Pages 1.25s、jsDelivr 约 0.2s —— 文件小的时候
       差的不是带宽而是链路。刚部署那几分钟 CDN 可能还是 404，多花两轮 RTT
       就退到同源，不影响正确性。 */
    GEO_PEND[key] = fetchAny('geo/n/' + key.toLowerCase() + '.json')
      .then(function (gj) {
        if (!gj || !gj.features) throw new Error('empty');
        GEO_ONE[key] = gj;
        delete GEO_PEND[key];
        return gj;
      })
      .catch(function () {
        delete GEO_PEND[key];
        if (GEO_CHUNKS[b]) return GEO_CHUNKS[b][key] || null;
        return fetchAny('geo/c' + b + '.json')
          .then(function (all) {
            GEO_CHUNKS[b] = all || {};
            return GEO_CHUNKS[b][key] || null;
          })
          .catch(function () { return null; });
      });
    return GEO_PEND[key];
  }

  function renderOutline(url, host) {
    fetchAny(url, { text: true })
      .then(function (txt) { drawOutline(JSON.parse(txt), host); })
      .catch(function (e) {
        host.textContent = '边界读取失败（' + e.message + '）';
      });
  }

  /* 把 FeatureCollection 画成等距圆柱投影的轮廓 */
  function drawOutline(gj, host) {
    if (!gj) { host.textContent = '边界数据为空'; return; }
    var rings = [];
    (gj.features || []).forEach(function (f) {
      var g = f.geometry || {};
      var polys = g.type === 'Polygon' ? [g.coordinates]
        : (g.type === 'MultiPolygon' ? g.coordinates : []);
      polys.forEach(function (poly) {
        poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
      });
    });
    if (!rings.length) { host.textContent = '边界数据为空'; return; }
    drawRings(rings, host);
  }

  /* 档案里自带的那份粗轮廓（scripts/inline_outline.py 生成）。
     坐标是整数化的 0.01°，还原成度再画 —— 这样点开国家时轮廓和卡片
     同一次响应到达，不用等 geo/ 那条更慢的链路。 */
  function outlineRings(o) {
    if (!o || !o.length) return null;
    var rings = [];
    for (var i = 0; i < o.length; i++) {
      var src = o[i], pts = [];
      for (var j = 0; j < src.length; j++) pts.push([src[j][0] / 100, src[j][1] / 100]);
      if (pts.length > 2) rings.push(pts);
    }
    return rings.length ? rings : null;
  }

  function drawRings(rings, host) {
    (function () {
        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        rings.forEach(function (ring) {
          ring.forEach(function (pt) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
            if (pt[1] < minY) minY = pt[1];
            if (pt[1] > maxY) maxY = pt[1];
          });
        });
        var W = 300, pad = 10;
        var spanX = Math.max(maxX - minX, 0.01);
        var spanY = Math.max(maxY - minY, 0.01);
        var scale = Math.min((W - pad * 2) / spanX, 150 / spanY);
        var H = Math.round(spanY * scale + pad * 2);
        var ox = (W - spanX * scale) / 2;
        var oy = (H - spanY * scale) / 2;

        var d = rings.map(function (ring) {
          return ring.map(function (pt, i) {
            var x = (ox + (pt[0] - minX) * scale).toFixed(1);
            var y = (oy + (maxY - pt[1]) * scale).toFixed(1);
            return (i ? 'L' : 'M') + x + ' ' + y;
          }).join('') + 'Z';
        }).join('');

        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
          /* 深底卡片：轮廓用浅青描边 */
          '<path d="' + d + '" fill="rgba(150,200,226,.12)" stroke="rgba(178,214,240,.85)" ' +
          'stroke-width=".8" stroke-linejoin="round"/></svg>';
        host.setAttribute('data-rings', rings.length);
    })();
  }

  /* ---------- 知识库检索（2-gram + BM25，纯本地） ----------
     为什么在前端检索而不是每次调大模型：
     1) key 不能进浏览器，公开仓库的静态站更是碰都不能碰；
     2) 三个国家的知识库只有几十条，本地算比一次网络往返快两个数量级；
     3) 断网、无代理也能演示 —— 这是录屏的硬要求。
     中文没有空格，用 2-gram 切分（不分词、不引词典），BM25 打分。 */
  var IDX = null;
  var qInput = document.getElementById('q');
  var qRes = document.getElementById('q-res');
  var qSub = document.getElementById('search-sub');

  /* ---------- 首都 → 国家 ----------
     搜「罗马」时，索引只会命中「罗马尼亚」（它的名字里就含这两个字），
     意大利一条都不出 —— 意大利的条目里根本没有"罗马"这三个字。
     可用户敲的是一个首都名，想找的就是那个国家。这里建一张首都表：
     输入正好等于某国首都时，把那个国家顶到第一条（结果里没有就补一条）。 */
  var CAP_ISO = null;
  /* 单独一份 8KB 的首都表（iso → [国名, 首都]）。
     cards.json 有 950KB，本地 http.server 是单线程、还要和贴图抢带宽，
     经常七八秒才到 —— 那之前搜「罗马」只有罗马尼亚。首都表首屏就到。 */
  var CAP_MINI = null;

  function buildCapitalIndex() {
    if (CAP_ISO) return;
    if (CAP_MINI) {
      CAP_ISO = {};
      Object.keys(CAP_MINI).forEach(function (iso) {
        var cap = String((CAP_MINI[iso] || [])[1] || '').trim();
        /* 首都重名不止一处（圣乔治、维多利亚…）：只认第一个，
           后面的国家仍可以靠自己的国名搜到，不会丢。 */
        if (cap && !CAP_ISO[cap]) CAP_ISO[cap] = String(iso).toUpperCase();
      });
      return;
    }
    if (!CARDS) return;
    CAP_ISO = {};
    Object.keys(CARDS).forEach(function (iso) {
      var cap = String((CARDS[iso] || {}).capital || '').trim();
      if (!cap || cap === '—' || cap.length < 2) return;
      if (!CAP_ISO[cap]) CAP_ISO[cap] = String(iso).toUpperCase();
    });
  }

  function loadCapitals() {
    fetchAny('data/capitals.json')
      .then(function (d) {
        if (!d) return;
        CAP_MINI = d;
        CAP_ISO = null;            // 重量表优先，用 CARDS 建的那份让位
        buildCapitalIndex();
        /* 首都表比用户慢到时补一次重绘：那一秒列表里还只有罗马尼亚 */
        if (qRes && !qRes.hidden && !searchWrap.classList.contains('list-open') &&
            performance.now() >= qFreezeUntil) {
          var cur = qInput ? qInput.value.trim() : '';
          if (cur) renderResults(cur);
        }
      })
      .catch(function () { /* 拿不到就退回 cards.json 里那份 */ });
  }

  function capitalIsoOf(q) {
    buildCapitalIndex();
    if (!CAP_ISO) return null;
    var k = String(q || '').trim().replace(/[\s，,。.、？！?!·:：]/g, '');
    if (k.length < 2 || k.length > 10) return null;
    return CAP_ISO[k] || null;
  }

  function boostByCapital(q, hits) {
    var iso = capitalIsoOf(q);
    if (!iso) return hits;
    var i, at = -1;
    for (i = 0; i < hits.length; i++) {
      if (String((hits[i][0] || {}).iso || '').toUpperCase() === iso) { at = i; break; }
    }
    if (at === 0) return hits;
    if (at > 0) { hits.unshift(hits.splice(at, 1)[0]); return hits; }

    /* 结果里压根没有这个国家 —— 补一条。左列会显示「意大利 · 首都 · 罗马」，
       点进去开意大利的档案；右栏的相关搜索也会跟着变成国家名。 */
    var c = CARDS && CARDS[iso];
    var nm = (c && c.name_zh) ||
             ((LABEL_META && LABEL_META[iso]) ? LABEL_META[iso].n : '');
    if (!nm) return hits;
    var capName = String(q || '').trim();
    hits.unshift([{
      id: 'cap-' + iso,
      iso: iso,
      name: nm,
      kind: 'country',
      q: '首都 · ' + capName,
      a: '首都 · ' + capName,
      noTag: true,
      index_text: nm
    }, hits.length ? hits[0][1] : 1]);
    return hits;
  }

  /* 问题里点了名的国家，它**得分最高的那条问答**提到第一位，其余不动。
     长问句里"产业""发展"这类散词能把别的国家顶上来，但用户开口就写了国名，
     那才是他要找的。只提一条：把该国的条目全部前移会打乱相关性排序，
     而"某某的国家基础条目"提到第一位又会变成"点了只开卡不定位"。 */
  /* 从索引里按国家 + 类型取一条档案（brief = 该国简介）。
     它在 BM25 候选里排不上（"简介"两字跟国名无关），纯国名查询要单独取。 */
  function indexDocOf(iso, kind) {
    if (!IDX || !IDX.docs) return null;
    for (var i = 0; i < IDX.docs.length; i++) {
      var d = IDX.docs[i];
      if (String(d.iso || '').toUpperCase() === iso && d.kind === kind) return d;
    }
    return null;
  }

  function boostByCountry(q, hits) {
    var c = findCountryInQuery(q);
    if (!c) return hits;
    var iso = String(c.iso || '').toUpperCase();

    /* 敲的是国名本身（"朝鲜"），或是港澳台这类归到主权国的地区
       （"中国香港" → 中国）：把该国档案条目顶到第一条。
       否则结果全是该国的问答，第一条可能是"中国说什么话？"这种无关条目，
       回车/点第一条就滚到语言那一节，看着像跳错了地方。 */
    var pure = !c.rest || /^(香港|澳门|台湾)/.test(String(c.rest || ''));
    if (pure) {
      var host = targetIso(iso);
      var entry = null, at = -1;
      for (var k = 0; k < hits.length; k++) {
        var hd = (hits[k] && hits[k][0]) || {};
        if (String(hd.iso || '').toUpperCase() === host && hd.kind === 'brief') { entry = hits[k]; at = k; break; }
      }
      /* hits 里通常没有简介这条（BM25 前 5 全是问答），从索引单独取。
         不能退而拿第一条问答顶上 —— 那等于原样插回，排序一点没变。 */
      if (!entry) {
        var bd = indexDocOf(host, 'brief') || indexDocOf(host, 'country');
        if (bd) entry = [bd, 0];
      }
      if (entry) {
        if (at >= 0) hits.splice(at, 1);
        hits.unshift(entry);
        if (hits.length > 6) hits.pop();
      }
      return hits;
    }

    /* 短查询不参与："中国美食"这种本来就是关键词检索，
       把"该国得分最高的一条"提上来反而会把最相关的挤掉。 */
    if (String(q || '').length < 10) return hits;
    var at2 = -1;
    for (var j = 0; j < hits.length; j++) {
      var dj = (hits[j] && hits[j][0]) || {};
      if (String(dj.iso || '').toUpperCase() === iso && dj.kind !== 'country') { at2 = j; break; }
    }
    if (at2 > 0) hits.unshift(hits.splice(at2, 1)[0]);
    return hits;
  }

  /* 列表项按下时冻结 400ms 重绘：输入法候选词会触发 input 事件，
     180ms 防抖后的重建可能正好落在"按下"与"松开"之间，被点的元素被移出
     DOM，click 就永远不派发（表现为"偶尔点了没反应"）。冻结窗口里被挡下的
     查询记进 qPending，解冻后补一次重绘，避免列表停在旧内容。 */
  var qFreezeUntil = 0;
  var qPending = null;
  if (qRes) {
    qRes.addEventListener('pointerdown', function () {
      qFreezeUntil = performance.now() + 400;
      setTimeout(function () {
        if (qPending !== null && performance.now() >= qFreezeUntil) {
          var q = qPending;
          qPending = null;
          renderResults(q);
        }
      }, 420);
    }, { passive: true });
  }

  function tokenize(text) {
    var s = String(text || '').toLowerCase();
    var toks = [], buf = '', mode = null;
    function flushCJK(b) {
      if (!b) return;
      if (b.length === 1) { toks.push(b); return; }
      for (var i = 0; i < b.length - 1; i++) toks.push(b.substr(i, 2));
    }
    function flushWord(b) { if (b.length >= 2) toks.push(b); }
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var m = /[\u3400-\u9fff]/.test(ch) ? 'c' : (/[a-z0-9]/.test(ch) ? 'a' : null);
      if (m !== mode) {
        if (mode === 'c') flushCJK(buf);
        else if (mode === 'a') flushWord(buf);
        buf = ''; mode = m;
      }
      if (m) buf += ch;
    }
    if (mode === 'c') flushCJK(buf);
    else if (mode === 'a') flushWord(buf);
    return toks;
  }

  function buildIdx(docs) {
    var postings = {}, df = {}, lens = [];
    docs.forEach(function (d, i) {
      var toks = tokenize(d.index_text);
      lens[i] = toks.length || 1;
      var tf = {};
      toks.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
      for (var t in tf) {
        if (!postings[t]) postings[t] = {};
        postings[t][i] = tf[t];
        df[t] = (df[t] || 0) + 1;
      }
    });
    var sum = lens.reduce(function (a, b) { return a + b; }, 0);
    return { docs: docs, postings: postings, df: df, lens: lens,
             avgdl: sum / (docs.length || 1), N: docs.length };
  }

  /* 疑问句里的虚词。中文 2-gram 会把「哪里能看」切成「哪里/里能/能看」，
     这些碎片在多个文档里都出现，是纯噪声 —— 实测「哪里能看长城」会把
     「法国面积有多大？首都是哪里？」顶到第二名，就因为含「哪里」。 */
  var STOP = {};
  ('哪里 里能 能看 什么 怎么 哪些 哪个 多少 哪儿 有什 么地 么语 么节 么样 么东 ' +
   '有哪 些地 请问 一下 告诉 知道 我想 想要 是否 可以 应该 这个 那个 ' +
   '这些 那些 是什 为什 一个 有些 有没 没有 是不 不是').split(' ').forEach(function (w) {
    if (w) STOP[w] = 1;
  });

  var MIN_SCORE = 1.5;   // 绝对阈值：低于此分视为噪声（实测「日本有什么」最高只有 1.74）
  var REL_RATIO = 0.35;  // 相对阈值：只保留最高分的 35% 以上

    function bm25(q, topk) {
    if (!IDX) return [];
    var k1 = 1.5, b = 0.75, score = {}, hit = {};
    /* 查询词先去重：同一个二元组出现两次不该把分算两遍。
       qn = 这一句里到底有几个不同的词，用来算"这篇命中了多少"。 */
    var qset = {}, qn = 0;
    tokenize(q).forEach(function (t) {
      if (STOP[t] || qset[t]) return;
      qset[t] = 1; qn++;
    });
    Object.keys(qset).forEach(function (t) {
      var pl = IDX.postings[t];
      if (!pl) return;
      var n = IDX.df[t] || 0;
      var idf = Math.log(1 + (IDX.N - n + 0.5) / (n + 0.5));
      for (var i in pl) {
        var tf = pl[i], dl = IDX.lens[i];
        score[i] = (score[i] || 0) +
          idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / IDX.avgdl));
        hit[i] = (hit[i] || 0) + 1;
      }
    });
    var arr = [];
    for (var i in score) {
      /* 覆盖率因子：这句里有多少个不同的词在这篇里出现。
         BM25 是"任一命中就加分"，长问句里散落的几个稀有词会把不相干的文档
         顶上来 —— 实测「沙特阿拉伯现在的发展情况怎么样？…主要靠什么产业？」
         排第一的是美属维尔京群岛，就因为"产业""发展"那几个词在那篇里也出现。
         乘上覆盖率，只中一两个词的文档直接被压下去。 */
      /* 只在长查询上生效：3~4 个词的短查询本来就是关键词检索，
         用它反而会把最相关的那条压下去（中国美食的第一条会变成
         中国说什么话）。 */
      var cov = qn >= 5 ? (hit[i] || 0) / qn : 1;
      var s = score[i] * (0.45 + 0.55 * cov);
      if (s > MIN_SCORE) arr.push([IDX.docs[i], s]);
    }
    arr.sort(function (a, b) { return b[1] - a[1]; });
    if (!arr.length) return [];
    var floor = arr[0][1] * REL_RATIO;
    arr = arr.filter(function (x) { return x[1] >= floor; });
    return arr.slice(0, topk || 5);
  }

  function cardOf(iso) {
    var all = cardsEl.children;
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset && all[i].dataset.iso === iso) return all[i];
    }
    return null;
  }

  /* 结果行左侧那枚圆形图标底（Google 地图那种：灰圆 + 线条图标）。
     国家用地图针，知识条目用文档 —— 一眼能分出"这是个地方"还是"这是句话"。 */
  var SR_ICON_PATH = {
    place: '<path d="M12 21s6.2-5.5 6.2-10.4A6.2 6.2 0 0 0 5.8 10.6C5.8 15.5 12 21 12 21z"/>' +
           '<circle cx="12" cy="10.4" r="2.3"/>',
    doc: '<path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/>' +
         '<path d="M13.5 3.5V9H19"/><path d="M8.5 13.2h7"/><path d="M8.5 16.6h4.5"/>'
  };

  function srIcon(kind) {
    var box = el('span', 'sr-ico');
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = SR_ICON_PATH[kind === 'country' ? 'place' : 'doc'];
    box.appendChild(s);
    return box;
  }

  function renderResults(q) {
    if (performance.now() < qFreezeUntil) { qPending = q; return; }
    qPending = null;
    var hits = boostByCapital(q, boostByCountry(q, bm25(q, 5)));
    qRes.innerHTML = '';
    qRes.hidden = false;
    /* 行都塞进 .sr-list，这样底部的说明行能钉在卡片下沿不动 */
    var box = el('div', 'sr-list');
    qRes.appendChild(box);
    if (!hits.length) {
      box.appendChild(el('div', 'sr-empty',
        '没有匹配内容（知识库共 ' + (IDX ? IDX.N : 0) + ' 条）'));
      return;
    }
    hits.forEach(function (h) {
      var d = h[0];
      var item = el('div', 'sr-item');
      /* 形状对齐 Google 地图：圆形图标 + 两行字（主标题 / 灰色副标题）。
         主标题用命中的那句问法、副标题用答案开头 —— 搜"沙特"会命中同一国的
         五个问题，若拿国家名当主标题，五行会整齐地重复"沙特阿拉伯"，
         等于把最有用的信息（到底命中了什么）全藏了起来。 */
      var isCountry = d.kind === 'country';
      /* brief 是"国家简介"那条：标题写国名就够，"朝鲜 简介"多两个字
         不增加信息量，还把它顶到第一条时显得像条公文。 */
      var headText = isCountry ? (d.name || '')
                   : (d.kind === 'brief' ? (d.name || d.q || '') : (d.q || d.name || ''));
      item.appendChild(srIcon(isCountry || d.kind === 'brief' ? 'country' : 'doc'));
      var txt = el('div', 'sr-txt');
      var nm = el('div', 'sr-name', headText);
      if (isCountry) {
        if (!d.noTag) nm.appendChild(el('span', 'sr-tag', '基础'));
      } else if (d.name && String(d.q || '').indexOf(d.name) < 0) {
        /* 问句里没带国名时才补一枚（"首都是哪里？"）。
           像"朝鲜人说什么语言？"本身已经说明是朝鲜，再挂一枚纯属噪音。 */
        nm.appendChild(el('span', 'sr-tag', d.name));
      }
      txt.appendChild(nm);
      var sub = d.a || '';
      if (sub) txt.appendChild(el('div', 'sr-sub', sub));
      item.appendChild(txt);
      /* 鼠标移到这条结果上就把它的国界分片拉下来（232KB）。
         点下去到"金线出现"之间原本要现取现解析，卡片会先出来、线还在路上 ——
         这一下预热通常能省掉 200~800ms 的空窗。 */
      if (d.iso) {
        item.addEventListener('mouseenter', function () {
          loadGeo(String(d.iso).toUpperCase());
        });
      }
      item.addEventListener('click', function () {
        /* 地区归属统一走 targetIso：港澳台→中国，但**有自己档案的地区
           （新喀、南乔治亚、法属波利尼西亚……）不再被跳去主权国。 */
        executeHit(d, d.q || q);
      });
      box.appendChild(item);
    });
  }

  /* 搜到了却只跳到面板顶部，等于没定位。
     这里在渲染完之后按相关度找一段，滚过去并闪一下。
     中文没有空格，所以切成二元组打分（"中国传统节日" → 中国/国传/传统/统节/节日），
     这样"传统节日"也能命中正文里的"是岁首最重要的节日"。 */
    /* 从查询里认出一个国家（取最长匹配），剩下的部分当话题词。
     "中国美食" → { iso:'CN', name:'中国', rest:'美食' } */
  function findCountryInQuery(v) {
    if (!LABEL_META || !v) return null;
    var best = null;
    Object.keys(LABEL_META).forEach(function (iso) {
      var nm = String((LABEL_META[iso] || {}).n || '');
      if (nm.length < 2) return;
      var at = v.indexOf(nm);
      if (at < 0) return;
      /* 取最长的那个名字，免得长名字被短名字先吃掉 */
      if (!best || nm.length > best.name.length) {
        best = {
          iso: iso,
          name: nm,
          rest: (v.slice(0, at) + v.slice(at + nm.length))
                  .replace(/^[的之与和及，,、\s]+/, '')
        };
      }
    });
    return best;
  }

  /* 打开一条搜索结果：开卡 → 收起搜索 → 定位到命中段。
     altProbe 是"国家+话题"里拆出来的话题词，用它当定位探针。 */
  function executeHit(d, q, focus) {
    /* 地区（港澳台）归到主权国：不给台湾单独开卡，搜到也落到中国 */
    var iso = String(d.iso || '').toUpperCase();
    var tgt = targetIso(iso);
    openDetail(tgt, cardOf(tgt), false);
    setSearch(false);              // 选中即收起，视线回到地球
    /* 框里保留用户敲的词，让他自己清 —— 程序顺手清空会丢掉上下文，
       想改一个字重搜还得整句重打。 */
    if (qInput) qInput.blur();

    /* 港澳台这类没有独立档案、归到主权国的地区：开主人国的档案之后，
       要定位到正文里提到它的那一段 —— 否则点「中国香港」只是弹出一张中国卡，
       停在最上面，跟用户点的那三个字没有关系。 */
    if (!focus && d.kind === 'country' && tgt.toUpperCase() !== iso) {
      var shortName = String(d.name || '').replace(/^中国/, '');
      if (shortName.length >= 2) focus = { probe: shortName, extra: '' };
    }

    /* 纯国名不滚：整份档案就是在讲它，滚过去只会把主图顶出可视区 ——
       实测点开日本，主图和缩略图都被滚到了负坐标。 */
    var qq = String(q || '').trim();
    var nm = d.name || '';
    /* 基础档案那种条目（国家本身）没有"命中段落"可言，只在带话题词时才定位 */
    if (d.kind === 'country' && !focus) return;

    /* 框里敲的就是这个国名（"朝鲜"），点的又是它的简介条目：
       到这里就够了，别再拿问句去正文里找段落 —— 回车会滚到"语言"那一节，
       看着像跳错了地方。点具体问答（kind=qa）仍然滚到对应那段。
       港澳台例外：开的不是它自己的卡，必须滚到提到它的那一段。 */
    var typed = qInput ? qInput.value.trim() : '';
    var cq = findCountryInQuery(typed);
    if (cq && !cq.rest && d.kind === 'brief' &&
        tgt.toUpperCase() === String(cq.iso || '').toUpperCase()) return;

    /* 搜的是地区（"中国香港"→ 开的是中国卡）：必须滚到正文里提到它的那一段。
       第一条往往是该国随便一条问答，拿它的答案定位会滚到语言/地理段，
       跟用户要找的东西无关。 */
    if (!focus && cq) {
      var region = '';
      if (tgt.toUpperCase() !== String(cq.iso || '').toUpperCase()) {
        region = String(cq.name || '').replace(/^中国/, '');
      } else {
        var rm = String(cq.rest || '').match(/^(香港|澳门|台湾)/);
        if (rm) region = rm[1];
      }
      if (region.length >= 2) focus = { probe: region, extra: '' };
    }
    /* 开的是自己那张卡，且输入的就是国名本身 → 不滚（整份档案都是它）。
       港澳台不适用：开的是中国卡，输入框里写的就是"中国澳门"，
       这时反而必须滚到提到澳门的那一段，否则就是"搜了没反应"。 */
    var isOwnCard = tgt.toUpperCase() === iso;
    if (isOwnCard && (!qq || qq === nm || qq.toLowerCase() === iso.toLowerCase())) return;

    if (focus) {
      /* 主探针：先用话题词本身（"美食""历史"）。它短，二元组只有一两个，
         只要段落里出现这个词，覆盖率就是 1.0 —— 定位几乎必中。
         同国高分问答的答案文本只当备选：它动辄上百字，摊进覆盖率里分母太大，
         分数被压到阈值以下，反而"点了没反应"（实测"中国历史"就卡在这）。 */
      var primary = focus.probe || focus.extra || '';
      var secondary = [focus.extra, qq].filter(Boolean).join(' ');
      locateInPanel({ name: nm, q: secondary, a: primary }, qq);
    } else if (d.kind !== 'country') {
      locateInPanel(d, qq);
    }
  }

  /* 从搜索结果跳到档案里对应的那一段。
     旧实现只拿用户敲的词去正文里找二元组，两个问题：
       ① 用户搜的是**问题**（"法国人吃什么"），正文里未必出现这几个字，
          真正能对上的是答案里那几个实词；
       ② scrollIntoView 会被面板滑入动画打断，而且它会把整页一起滚，
          落点经常偏掉。
     现在：
       · 探针用**搜索结果里的答案原文**（它本来就是从整份档案里抽出来的），
         再补上问题关键词，两者取较高的那一个；
       · 打分用 Ochiai 系数（交集 / √(|A|×|B|)）：两边一边长一边短也不会被吃掉，
         "地标/景点"这种答案里全是专有名词，正好能对上图片题注；
       · 自己算 scrollTop 滚 .dscroll，不碰整页；
       · 图片到位后再校正一次，用户自己滚过就不再插手。 */
  var LOCATE_SEQ = 0;

  /* 话题词的说法不止一种。档案里写的是"饮食上大体南米北面，鲁、川、粤、淮扬
     等菜系各有章法"，用户搜的是"美食" —— 二元组一个都对不上，定位直接失效。
     这张表只在**定位**时用，不影响搜索排序。左边是用户可能敲的词，
     右边是档案正文里真正会出现的词。 */
  var LOCATE_SYN = {
    '美食': ['饮食', '菜系', '菜', '小吃', '餐', '吃'],
    '好吃': ['饮食', '菜', '吃'],
    '饮食': ['饮食', '菜系', '菜', '吃'],
    '节日': ['节日', '节庆', '习俗', '过年', '节'],
    '民俗': ['民俗', '习俗', '节序', '岁时', '过年'],
    '宗教': ['宗教', '信仰', '佛教', '道教', '天主教', '伊斯兰', '教派'],
    '语言': ['语言', '方言', '语'],
    '历史': ['历史', '王朝', '世纪', '帝国', '战争'],
    '地标': ['地标', '景点', '建筑', '遗迹', '塔', '宫'],
    '景点': ['景点', '地标', '建筑', '遗迹'],
    '经济': ['经济', '产业', '农业', '工业', '贸易'],
    '人口': ['人口', '万人'],
    '位置': ['位于', '地处', '接壤', '邻'],
    '气候': ['气候', '季风', '降水', '气温']
  };

  function locateInPanel(doc, q) {
    var token = ++LOCATE_SEQ;
    var tries = 0;

    function norm(t) {
      return String(t == null ? '' : t).toLowerCase()
        .replace(/[^\u4e00-\u9fa5a-z0-9]/g, '');
    }
    /* 中文没有空格，切成二元组。"中国传统节日" → 中国/国传/传统/统节/节日 */
    function grams(t) {
      var str = norm(t), map = {}, n = 0;
      for (var i = 0; i + 1 < str.length; i++) {
        var g = str.substr(i, 2);
        if (!map[g]) { map[g] = 1; n++; }
      }
      return { g: map, n: n };
    }
    function sim(a, b) {
      if (!a.n || !b.n) return 0;
      var m = 0;
      for (var k in a.g) if (b.g[k]) m++;
      if (!m) return 0;
      /* 两种口径取大的：
         Ochiai（交集 / √(|A|×|B|)）适合"长答案 vs 长段落"；
         覆盖率（交集 / |A|）适合"短探针 vs 长段落" —— 探针只剩两个字时，
         摊进 √ 里会被段落长度压死，怎么都过不了阈值。 */
      return Math.max(m / Math.sqrt(a.n * b.n), m / a.n);
    }

    /* 国名要从问题里剔掉：否则"法国人吃什么"里那两个字会把每一段都点亮 */
    var nm = (doc && doc.name) || '';
    var probes = [];
    if (doc && doc.a) probes.push(grams(doc.a));
    if (doc && doc.q) probes.push(grams(String(doc.q).split(nm).join('')));
    if (q) probes.push(grams(String(q).split(nm).join('')));
    probes = probes.filter(function (p) { return p.n > 0; });
    if (!probes.length) return;

    /* 段落内定位用的原词（不是二元组）。长段落里命中的词往往在后半截：
       "经济"落在"宋元之际市镇经济与印刷…"这半句上，而段落开头讲的是
       "隋唐确立的科举制" —— 只滚到段落顶部，用户会觉得"跳到毫无关系的历史"。 */
    var words = [];
    if (doc && doc.a) words.push(String(doc.a));
    if (doc && doc.q) words.push(String(doc.q).split(nm).join(''));
    if (q) words.push(String(q).split(nm).join(''));
    words = words.filter(function (w) { return w && w.length >= 2; });

    /* 话题词的同义扩展（见 LOCATE_SYN）：命中哪一组就按哪一组补分 */
    var ask = String((doc && doc.q) || '') + ' ' + String(q || '');
    var syn = null;
    Object.keys(LOCATE_SYN).forEach(function (k) {
      if (!syn && ask.indexOf(k) >= 0) syn = LOCATE_SYN[k];
    });

    function pick() {
      var host = document.getElementById('d-body');
      var sc = document.querySelector('.dscroll');
      if (!host || !sc) return null;
      /* 「地标 / 景点」直接去图片区：卡片最上面就是主图加缩略图，
         而正文里能对上的往往只是"宫殿""建筑"这类泛词，落点没有意义
         （实测印度、挪威、法国点"地标"都落在不相干的段落上）。 */
      if (/地标|景点/.test(ask)) {
        var img0 = host.querySelector('.dimg-wrap');
        if (img0) return { node: img0, sc: sc, words: [] };
      }
      /* 候选：正文段落、章节标题（历史 / 民俗 / 文化特征）、
         元信息的键和值（首都/语言/坐标）、文化特征标签、图片题注。
         标题必须收进来：搜「中国民俗」，档案里"民俗"两个字只出现在章节标题上，
         正文写的是"岁时节序构成日常生活的主干……"，只查 p 一个都对不上。
         dt 也要一起收：问"语言"时，那两个字同样只写在键名上。 */
      var nodes = host.querySelectorAll('.prose p, .sub-label, .dmeta dt, .dmeta dd, .chip, .cap');
      if (!nodes.length) return null;        // 骨架屏阶段：还没有可定位的内容
      var bestNode = null, bestVal = 0, bestWord = '';
      for (var i = 0; i < nodes.length; i++) {
        var txt = nodes[i].textContent || '';
        /* 元信息的键名（首都/语言/坐标…）不在屏幕上，但它是这一行真正的主题：
           问"法语"要落到"语言 | 法语"，问"语言"同样要落到这一行。
           把它拼进待匹配文本，两种问法都能对上。 */
        var kk = nodes[i].getAttribute && nodes[i].getAttribute('data-k');
        if (kk) txt = kk + ' ' + txt;
        var ng = grams(txt);
        var v = 0, hitWord = '';
        for (var k = 0; k < probes.length; k++) {
          var t = sim(probes[k], ng) * (k === 0 ? 1 : 0.55);
          if (t > v) { v = t; hitWord = ''; }   // 二元组命中，段内位置交给原词去找
        }
        /* 同义词命中：按词的"具体程度"加权，而不是简单地数个数。
           "佛教"命中一次比"教"这个单字命中一次可信得多 —— 正文里"教"字
           到处都有（教育、教会、教派），不加权的话「中国宗教」会被
           随便一段带"教"字的正文抢走。
           同时记下"具体命中的是哪个词"：点"美食"落到的段落里写的是
           "饮食/菜系"，标出来的也应该是这两个字，而不是用户敲的"美食"。 */
        if (syn) {
          var hitW = 0, synWord = '';
          for (var si = 0; si < syn.length; si++) {
            if (txt.indexOf(syn[si]) >= 0) {
              hitW += Math.min(1, syn[si].length / 3);   // 单字 0.33 / 双字 0.67 / 三字以上 1
              if (syn[si].length > synWord.length || !synWord) synWord = syn[si];
            }
          }
          /* 1.6 分算"很确定"：一个三字词（宗教/天主教）+ 一个双字词就够；
             只有单字命中时 0.17，过不了 0.15 的线，正好当噪声滤掉。 */
          var sv = 0.8 * Math.min(1, hitW / 1.6);
          if (sv > v) { v = sv; hitWord = synWord; }
        }
        if (v > bestVal) { bestVal = v; bestNode = nodes[i]; bestWord = hitWord; }
      }
      /* 0.15 以下基本是巧合命中，宁可不滚 —— 乱滚比停在顶部更让人迷惑。
         0.15 这条线正好卡在"只有一个单字命中"（0.167）和"什么都没有"之间：
         「语言」靠一个"语"字就能落到"现代标准汉语 / 粤语"那一行。 */
      if (!bestNode || bestVal < 0.15) return null;
      /* 同义词命中时用**实际命中的那个词**去量位置、去打高亮 ——
         点"美食"落到的段落写的是"饮食/菜系"，拿"美食"去 indexOf 什么都找不到，
         高亮和段内定位就都失效了。 */
      return { node: bestNode, sc: sc, words: bestWord ? [bestWord] : words };
    }

    /* 量出"命中词"在段落里到底落在哪一行。
       段落动辄两三行到十几行，把段落顶部滚到中间，用户看到的是开头
       那句无关的话；滚到命中词所在行，才看得见自己点的是什么。 */
    function wordRect(node, words) {
      try {
        var raw = node.textContent || '';
        var bestAt = -1, bestLen = 0;
        for (var i = 0; i < words.length; i++) {
          var at = raw.indexOf(words[i]);
          if (at >= 0 && (bestAt < 0 || at < bestAt)) { bestAt = at; bestLen = words[i].length; }
        }
        if (bestAt < 0) return null;
        var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
        var acc = 0, tn;
        while ((tn = walker.nextNode())) {
          var len = tn.nodeValue.length;
          if (acc + len > bestAt) {
            var rg = document.createRange();
            var start = bestAt - acc;
            /* 只框住命中词的第一个字：整词跨行时 getBoundingClientRect
               会给出一个横跨两行的大盒子，拿它居中会偏掉。 */
            rg.setStart(tn, start);
            rg.setEnd(tn, Math.min(len, start + 1));
            var rects = rg.getClientRects();
            var rect = (rects && rects.length) ? rects[0] : rg.getBoundingClientRect();
            return (rect && rect.height > 4) ? rect : null;
          }
          acc += len;
        }
      } catch (e) { /* Range 走到奇怪节点就退回按整段算 */ }
      return null;
    }

    /* 把命中的那个词本身标出来（1.9 秒后原样还原）。
       跳到的段落不一定整段都在讲这件事，标出词才能让人看明白落点。 */
    function flashWord(node, words) {
      try {
        var raw = node.textContent || '';
        var at = -1, bestLen = 2;
        for (var i = 0; i < words.length; i++) {
          var w = words[i];
          if (!w || w.length < 2) continue;
          var p = raw.indexOf(w);
          if (p >= 0 && (at < 0 || p < at)) { at = p; bestLen = w.length; }
        }
        /* 最新版结果行给的是整句问答，正文里不会原样出现：退化成用
           二元组找一个真正落在段落里的字眼，否则跳过去了却没标出落点。 */
        if (at < 0) {
          for (var wi = 0; wi < words.length && at < 0; wi++) {
            var w2 = String(words[wi] || '');
            for (var gi = 0; gi + 2 <= w2.length; gi++) {
              var gram = w2.substr(gi, 2);
              if (!/^[\u4e00-\u9fa5]{2}$/.test(gram)) continue;
              var p2 = raw.indexOf(gram);
              if (p2 >= 0) { at = p2; bestLen = 2; break; }
            }
          }
        }
        if (at < 0) return;
        var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
        var acc = 0, tn;
        while ((tn = walker.nextNode())) {
          var len = tn.nodeValue.length;
          if (acc + len > at) {
            var start = at - acc;
            var end = Math.min(len, start + bestLen);
            if (end <= start) return;
            var after = tn.splitText(end);
            var mid = tn.splitText(start);
            var span = document.createElement('span');
            span.className = 'hit-word';
            mid.parentNode.insertBefore(span, mid);
            span.appendChild(mid);
            setTimeout(function () {
              var par = span.parentNode;
              if (!par) return;
              par.insertBefore(mid, span);
              par.removeChild(span);
              par.normalize();
            }, 1900);
            return;
          }
          acc += len;
        }
      } catch (e) { /* 标不出来也不影响滚动 */ }
    }

    function centerOn(hit, smooth) {
      var node = hit.node, sc = hit.sc;
      var r = wordRect(node, hit.words) || node.getBoundingClientRect();
      var s = sc.getBoundingClientRect();
      var target = sc.scrollTop + (r.top - s.top) - (sc.clientHeight - r.height) / 2;
      var max = sc.scrollHeight - sc.clientHeight;
      target = Math.max(0, Math.min(max, target));
      if (Math.abs(target - sc.scrollTop) < 2) return;
      if (smooth) {
        try { sc.scrollTo({ top: target, behavior: 'smooth' }); }
        catch (e) { sc.scrollTop = target; }
      } else {
        sc.scrollTop = target;     // 首帧直接到位：面板一出来就已经在命中的那一段
      }
    }

    var t0 = -1;
    function run() {
      if (token !== LOCATE_SEQ) return;         // 又点开了别的国家，这次作废
      var hit = pick();
      if (!hit) {
        /* 卡片数据（cards.json 950KB）还没到时，#d-body 里是骨架屏，
           一个候选节点都没有。以前只重试 1.3 秒就放弃 —— 本地这条路要七八秒，
           于是「刚打开页面就点澳门」会停在卡片顶部，什么也没定位到。
           现在重试到 13 秒；期间用户自己滚过就放手，别跟他抢。 */
        var scNow = document.querySelector('.dscroll');
        if (t0 < 0) t0 = scNow ? scNow.scrollTop : 0;
        else if (scNow && Math.abs(scNow.scrollTop - t0) > 20) return;
        if (tries++ < 100) { setTimeout(run, 130); return; }
        /* 重试到尽头还是没对上：什么都不做，让卡片停在自己该在的位置。
           打开新卡时 openDetail 已经把它归零了；同一个国家里没对上，
           就保持用户当前看到的那一段 —— 硬滚回顶部只会像"跳错了地方"。 */
        return;
      }
      centerOn(hit, false);
      flashWord(hit.node, hit.words);
      hit.node.classList.add('hit-flash');
      setTimeout(function () { hit.node.classList.remove('hit-flash'); }, 1700);

      /* 图片和题注是延后加载的，可能把版面推一点：隔一会儿校正两次。
         用户这期间自己滚过就不再插手，否则会跟他抢滚动条。 */
      var bumped = false;
      function bum() { bumped = true; }
      hit.sc.addEventListener('wheel', bum, { once: true, passive: true });
      hit.sc.addEventListener('touchstart', bum, { once: true, passive: true });
      hit.sc.addEventListener('pointerdown', bum, { once: true });
      [700, 1500].forEach(function (ms) {
        setTimeout(function () {
          if (token !== LOCATE_SEQ || bumped) return;
          centerOn(hit, true);
        }, ms);
      });
    }

    run();
  }

  /* 国家列表：由搜索框右端的下拉按钮触发（不自动弹）。
     空输入直接点开时它就是入口，用户不用先背关键词。 */
  function showCountryList() {
    if (!IDX || !IDX.docs) {
      qRes.innerHTML = '';
      qRes.hidden = false;
      var emptyBox = el('div', 'sr-list');
      emptyBox.appendChild(el('div', 'sr-empty', '知识库索引尚未就绪'));
      qRes.appendChild(emptyBox);
      return;
    }
    var seen = {}, list = [];
    IDX.docs.forEach(function (d) {
      if (d.iso && !seen[d.iso]) {
        seen[d.iso] = 1;
        list.push(d);
      }
    });
    /* 全部国家都在这里，排法：有完整档案的置顶，其余按人口降序。
       人口取不到就排最后 —— 这样打开列表第一屏就是"有料的那几个"。 */
    list.sort(function (a, b) {
      var da = a.kind === 'country' ? 0 : 1, db = b.kind === 'country' ? 0 : 1;
      if (da !== db) return db - da;
      var pa = (LABEL_META || {})[a.iso] ? LABEL_META[a.iso].pop || 0 : 0;
      var pb = (LABEL_META || {})[b.iso] ? LABEL_META[b.iso].pop || 0 : 0;
      return pb - pa;
    });
    qRes.innerHTML = '';
    qRes.hidden = false;
    var box = el('div', 'sr-list');
    qRes.appendChild(box);
    list.forEach(function (d) {
      var item = el('div', 'sr-item');
      item.appendChild(srIcon('country'));
      var txt = el('div', 'sr-txt');
      var nm = el('div', 'sr-name', d.name || '');
      if (d.kind === 'country') nm.appendChild(el('span', 'sr-tag', '基础'));
      txt.appendChild(nm);
      /* 副标题给英文名 + 大洲，和 Google 地图"家 / China"那种第二行一个位置 */
      var m = (LABEL_META || {})[String(d.iso || '').toUpperCase()];
      var sub = [m && m.en, m && m.cont].filter(Boolean).join(' · ');
      if (sub) txt.appendChild(el('div', 'sr-sub', sub));
      item.appendChild(txt);
      item.appendChild(el('span', 'sr-arrow', '›'));
      item.addEventListener('click', function () {
        /* 同理走 targetIso：有档案的地区开自己的，没档案的才落到主权国 */
        var lTgt = targetIso(d.iso);
        openDetail(lTgt, cardOf(lTgt), false);
        setSearch(false);
        if (qInput) qInput.blur();
      });
      box.appendChild(item);
    });
    qRes.appendChild(el('div', 'sr-foot', '共 ' + list.length + ' 个国家 / 地区 · 按人口排序'));
  }

  var searchWrap = document.getElementById('search-wrap');
  var searchPanel = document.getElementById('search-panel');

  /* 结果区一显示，搜索框就从"一只胶囊"变成"一张连通卡片"（Google 地图那种
     形状：搜索行坐在结果面板顶上，共用一圈外轮廓）：给 wrap 挂 card-open，
     输入行只留上半圆角、结果区只留下半圆角，中间由结果区的内阴影当分隔线。
     用观察器盯 hidden，比在 renderResults / showCountryList / setSearch
     三四处各补一行 classList 更不容易漏改。 */
  if (qRes && searchWrap) {
    new MutationObserver(function () {
      searchWrap.classList.toggle('card-open', !qRes.hidden);
    }).observe(qRes, { attributes: true, attributeFilter: ['hidden'] });
  }

  /* ---------- 自绘提示气泡 ----------
     原生 title 要悬停一秒才弹、样式不可控、移动端干脆没有。
     这里用 data-tip 接管，悬停 120ms 后出现在元素上方（空间不够就放下面）。 */
  (function bindTip() {
    var tip = document.getElementById('tip');
    var cur = null, timer = 0;
    function place(el) {
      if (!tip) return;
      var r = el.getBoundingClientRect();
      tip.classList.add('on');
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      /* 靠左的元素（左下角竖排工具栏）提示一律放右边。
         放上面会直接盖住上面那颗按钮 —— 竖排按钮间距只有 8px，
         提示一出来就分不清是在说谁。 */
      if (r.left + r.width / 2 < window.innerWidth * 0.4) {
        tip.classList.add('side-right');
        tip.style.left = (r.right + 10) + 'px';
        tip.style.top = (r.top + r.height / 2) + 'px';
        return;
      }
      tip.classList.remove('side-right');
      var cx = Math.min(Math.max(r.left + r.width / 2, tw / 2 + 8),
                        window.innerWidth - tw / 2 - 8);
      /* 一律放在元素下方。
         原来是"上面放不下才放下方"，于是同一排关键词里：靠上的那几个提示在下面、
         其余的在上面，鼠标扫过去一上一下，看着很散。统一在下，
         只有真的贴着屏幕底边（比如左下角那排按钮）才翻上去。 */
      var y = r.bottom + 8;
      if (y + th > window.innerHeight - 8) y = Math.max(6, r.top - th - 8);
      tip.style.left = cx + 'px';
      tip.style.top = y + 'px';
    }
    function show(el) {
      var txt = el.getAttribute('data-tip');
      if (!txt || !tip) return;
      cur = el;
      tip.textContent = txt;
      place(el);
    }
    function hide() {
      clearTimeout(timer);
      cur = null;
      if (tip) tip.classList.remove('on');
    }
    document.addEventListener('pointerover', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (!el || el === cur) return;
      clearTimeout(timer);
      timer = setTimeout(function () { show(el); }, 120);
    });
    document.addEventListener('pointerout', function (e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
      if (el && el === cur) hide();
      else if (el) clearTimeout(timer);
    });
    document.addEventListener('pointerdown', hide, true);
    window.addEventListener('scroll', hide, true);
    window.__tipHide = hide;
  })();

  /* 开合只有一个入口，避免三处各改一半导致状态对不上 */
  function setSearch(open, list) {
    if (!searchWrap) return;
    searchWrap.classList.toggle('open', !!open);
    if (!open) {
      qRes.hidden = true;
      searchWrap.classList.remove('list-open');
      return;
    }
    searchWrap.classList.toggle('list-open', !!list);
    if (list) showCountryList(); else qRes.hidden = true;
  }

  /* 框本身常驻：点框内任何位置都算"要输入"，展开并聚焦。
     不再有那个圆钮 —— 一眼看不出是搜索框，反而像工具菜单。 */
  if (searchPanel) {
    searchPanel.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!searchWrap.classList.contains('open')) setSearch(true, true);
      if (qInput && document.activeElement !== qInput) {
        setTimeout(function () { qInput.focus(); }, 130);
      }
    });
  }
  if (qInput) {
    /* 没点进去之前不显示任何提示词（框本身够清楚，常驻的灰字只是噪音）。
       点进去、框展开变长之后才给两个真实问句 —— 提示"能提问"这件事，
       举一个例子比写十个字有用。 */
    var PH_LONG = '试试这么问：法国人吃什么？ 埃及有什么宗教？';
    qInput.addEventListener('focus', function () {
      /* 有字就恢复这轮搜索的结果，别拿 236 国全量列表盖掉它 ——
         否则用户按回车会选中全量列表的第一条（"中国"），
         看上去就像"搜了朝鲜却跳到中国"。 */
      var v = qInput.value.trim();
      if (!searchWrap.classList.contains('open')) setSearch(true, !v);
      if (v.length >= 2) { qRes.hidden = false; renderResults(v); }
      if (!v) qInput.placeholder = PH_LONG;
    });
    qInput.addEventListener('blur', function () {
      qInput.placeholder = '';
      // 点了下拉列表的话不收起；空输入离开才收起
      setTimeout(function () {
        if (document.activeElement === qInput) return;
        if (!qInput.value.trim()) setSearch(false);
      }, 140);
    });
  }


  document.addEventListener('click', function (e) {
    if (searchWrap && !searchWrap.contains(e.target)) setSearch(false);
  });

  var searchClear = document.getElementById('search-clear');
  if (searchClear) {
    searchClear.addEventListener('click', function (e) {
      e.stopPropagation();
      if (qInput) { qInput.value = ''; qInput.focus(); }
      searchWrap.classList.remove('has-text');
      setSearch(true, true);
    });
  }

  if (qInput) {
    var qTimer = null;
    qInput.addEventListener('input', function () {
      clearTimeout(qTimer);
      var v = qInput.value.trim();
      searchWrap.classList.toggle('has-text', !!qInput.value);
      searchWrap.classList.remove('list-open');
      qTimer = setTimeout(function () {
        if (v.length < 2) { qRes.hidden = true; qRes.innerHTML = ''; return; }
        renderResults(v);
      }, 180);
    });
    qInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        qInput.value = '';
        setSearch(false);
        qInput.blur();
        return;
      }
      /* 回车 = 选中第一条结果。
         原来这里**完全没有 Enter 处理**（只处理了 Esc），所以搜完按回车
         什么都没发生 —— 用户报的"输入新喀按回车没反应"就是这个。
         结果还没出来时（输入有 180ms 防抖）先同步渲染一次再点，
         不然手快的人按回车会撞在防抖窗口里。 */
      if (e.key === 'Enter') {
        e.preventDefault();
        /* 面板现在是 236 国全量列表（还没输入）时，回车不该随手打开
           列表第一条（"中国"）—— 那不是一次搜索，只是浏览。 */
        if (searchWrap.classList.contains('list-open')) return;
        var v = qInput.value.trim();
        var first = qRes.querySelector('.sr-item');
        if (!first && v.length >= 2) {
          clearTimeout(qTimer);
          renderResults(v);
          first = qRes.querySelector('.sr-item');
        }
        if (first) first.click();
      }
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.sr-ex'), function (btn) {
    btn.addEventListener('click', function () {
      qInput.value = btn.dataset.q;
      renderResults(btn.dataset.q);
      qInput.focus();
    });
  });

  function loadSearchIndex() {
    fetchAny('data/search.json')
      .then(function (d) {
        IDX = buildIdx(d.docs || []);
        mergeCountryDocs();
        updateIdxSub();
      })
      .catch(function (e) {
        if (qSub) qSub.textContent = '索引未加载（' + e.message + '）';
      });
  }

  /* 所有国家的元数据：名称/大洲/人口/中心点。
     20KB，首屏就取 —— 检索、基础档案、飞行动画都要用。 */
  function loadCountryMeta() {
    return fetchAny('geo/meta.json')
      .then(function (m) {
        LABEL_META = m || null;
        mergeCountryDocs();
        updateIdxSub();
      })
      .catch(function () { /* 拿不到就退化成"只有三国可查"，不影响地球本体 */ });
  }

  function updateIdxSub() {
    if (!qSub || !IDX) return;
    var n = Object.keys(LABEL_META || {}).length;
    qSub.textContent = n
      ? '知识库 ' + IDX.N + ' 条 · 覆盖 ' + n + ' 个国家与地区 · 本地检索'
      : '知识库 ' + IDX.N + ' 条 · 2-gram + BM25 本地检索';
  }

  /* 把"还没有档案的国家"作为基础条目并进检索。
     这样搜"日本""埃及"也能命中并飞过去，而不是只有三国可查。 */
  function mergeCountryDocs() {
    if (!IDX || !LABEL_META) return;
    var have = {};
    IDX.docs.forEach(function (d) { if (d.iso) have[d.iso] = 1; });
    var added = 0;
    Object.keys(LABEL_META).forEach(function (iso) {
      if (have[iso]) return;
      var m = LABEL_META[iso];
      IDX.docs.push({
        id: 'c-' + iso,
        iso: iso,
        name: m.n,
        kind: 'country',
        q: m.n + (m.en ? '　' + m.en : ''),
        a: (m.cont || '') + (m.pop ? ' · 人口约 ' + fmtPop(m.pop) : '') + ' · 基础档案',
        index_text: m.n + ' ' + (m.en || '') + ' ' + (m.cont || '')
      });
      added++;
    });
    if (added) IDX = buildIdx(IDX.docs);
  }

  /* ---------- 3D 地球 ----------
     设计上的四个决定：

     1) 懒加载。three.min.js 670KB，若在首屏加载会把 LCP 拖到 3 秒以上。
        用 IntersectionObserver 等区块进入视口再加载，首屏完全不受影响。

     2) 不用贴图，只用我们自己的 GeoJSON。真实地球纹理（4K 等距柱状图）动辄
        2~8MB，且来源授权要单独确认；而我们的数据只有 110KB —— 大陆轮廓 + 已采集国家的国界
        国界，全部来自 Natural Earth 与既有 geo/*.geojson。视觉上反而更统一：
        暗球 + 淡色大陆 + 金色国界，和站点其余部分同一套配色。

     3) 球面插值细分。国界相邻两点若相距较远，直接用直线连会在球体内部穿过去
        （弦切进球），表现为"线条沉到球里"。所以每条边按 ≤2° 插值成折线。

     4) 点击拾取要 worldToLocal。射线与球求交得到的是**世界坐标**，而我们要反算
        经纬度，必须先把交点转回 spinGroup 的局部坐标 —— 否则球体转过之后
        算出的经纬度全是错的。 */
  var GLOBE_SRC = [
    'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/vendor/three.min.js',
    'vendor/three.min.js'
  ];
  var globe = {
    state: 'idle', ready: false, data: null,
    scene: null, camera: null, renderer: null,
    tilt: null, spin: null, sphere: null,
    groups: {},           // iso -> LineSegments（内置三家的轮廓，其它按需进 borderCache）
    matOn: null, matLit: null, matAll: null,
    active: null,
    autoSpin: true,
    spinWanted: true,       // 用户意愿：关掉之后连 flyOut 也不恢复
    pickKind: '',           // 定位模式：'' / 'time' / 'climate' / 'elev'
    probeKind: '',          // probeMode 打开时具体是 climate 还是 elev
    pinCN: false,          // 「常驻中国」：钉住镜头、冻结自转
    inView: false,
    dragging: false,
    last: { x: 0, y: 0 },
    vel: { x: 0, y: 0 },
    idleUntil: 0,
    raf: 0,
    labels: null,
    nightTarget: 0,       // 0=昼夜，1=全夜
    texReady: false,
    fadeStart: 0,         // 淡入起点（performance.now），0 表示已完成
    mixBTarget: 0,        // 8K 交叉淡化的目标值
    tex8k: null,          // 8K 日面贴图（按需加载，无 mipmap）
    tex8kReady: false,    // 已下载，等交互停止再绑 GPU
    lastInput: 0,
    can8k: false,
    atmo: null,
    camTarget: 3.02,      // 相机的目标 z，每帧阻尼逼近
    camMode: 'far',       // far=全球视角 / near=聚焦某国 / manual=用户滚轮缩放
    rotTargetY: 0,        // 飞行目标经度（弧度）
    rotTargetX: 0,
    flying: false
  };

  var D2R = Math.PI / 180;
  var R2D = 180 / Math.PI;

  function globeStage() { return document.getElementById('globe-stage'); }
  function globeMsg(text, isErr) {
    var st = globeStage();
    if (!st) return;
    var m = document.getElementById('globe-msg');
    if (!m) {
      m = el('div', 'globe-msg');
      m.id = 'globe-msg';
      st.appendChild(m);
    }
    var cls = 'globe-msg' + (isErr ? ' err' : '');
    if (!text) { m.className = cls + ' gone'; return; }

    /* 进度更新（"3/16"→"4/16"）走这里：只换字，不重建节点。
       以前每次都清空重塞 + 做一次淡入，浏览器下就是每来一个分片整条提示闪一下。 */
    var prev = m.querySelector('.gm-txt');
    if (prev && m.className === cls) {
      if (prev.textContent !== text) prev.textContent = text;
      m.style.opacity = '';
      return;
    }

    m.className = cls;
    m.style.opacity = '';
    while (m.firstChild) m.removeChild(m.firstChild);
    /* 传空串 = 收起。不这么写的话会留下一个"还在转的加载环"，
       因为下面无条件塞了 .globe-spin。 */
    if (!isErr) m.appendChild(el('span', 'globe-spin'));
    m.appendChild(el('span', 'gm-txt', text));
    /* 文字本身也做一次淡入：换文案时不要硬切 */
    var tx = m.querySelector('.gm-txt');
    if (tx) { tx.style.opacity = '0'; void tx.offsetWidth; tx.style.opacity = '1'; }
  }

  function loadScriptOnce(urls, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { done(new Error('all sources failed')); return; }
      var src = urls[i++];
      var sc = document.createElement('script');
      sc.src = src;
      sc.async = true;
      sc.onload = function () { done(null); };
      sc.onerror = function () {
        sc.remove();
        next();
      };
      document.head.appendChild(sc);
    }
    next();
  }

  /* 经纬度 → 球面坐标。y 轴朝北，经度 0 落在 -Z 方向（正对初始相机）。 */
  function llToVec3(lon, lat, r, out) {
    var phi = (90 - lat) * D2R;
    var theta = (lon + 180) * D2R;
    var sp = Math.sin(phi);
    out.set(-r * sp * Math.cos(theta), r * Math.cos(phi), r * sp * Math.sin(theta));
    return out;
  }

  /* 把一条边按 ≤2° 插值成折线，避免弦切进球体 */
  function pushEdge(a, b, r, arr) {
    var dLon = b[0] - a[0];
    if (dLon > 180) dLon -= 360;
    if (dLon < -180) dLon += 360;
    var dLat = b[1] - a[1];
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dLon), Math.abs(dLat)) / 2));
    var va = new THREE.Vector3();
    llToVec3(a[0], a[1], r, va);
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      var vb = new THREE.Vector3();
      llToVec3(a[0] + dLon * t, a[1] + dLat * t, r, vb);
      arr.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
      va = vb;
    }
  }

  /* rings（环数组，null 表示断点）→ LineSegments */
  function ringsToLines(rings, radius, material) {
    var pos = [];
    rings.forEach(function (ring) {
      var prev = null;
      for (var i = 0; i < ring.length; i++) {
        var pt = ring[i];
        if (!pt) { prev = null; continue; }
        if (prev) pushEdge(prev, pt, radius, pos);
        prev = pt;
      }
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, material);
  }

  /* 经纬网：等距圆柱贴图，不是线段。
     线段版画不了度数，也走不到极点。这里在 4096×2048 的画布上按等距圆柱画：
       * 经线在赤道处断开一小段，度数直接塞进断口 —— 数字压线最难读
       * 纬线在 ±90° 经线处各断一次，左右对称各标一个度数
       * 南北回归线（23.5°）与极圈（66.5°）画虚线，同样标注
     贴到球壳上跟着球转，任何角度都对得上。 */
  function buildGraticule(radius) {
    var W = 4096, H = 2048;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var LINE = 'rgba(226,190,120,0.58)';
    var MAJOR = 'rgba(240,206,140,0.92)';
    var TEXT = 'rgba(248,224,176,0.96)';
    var FONT = 'bold 30px system-ui,-apple-system,"Microsoft YaHei",sans-serif';
    var lon, lat, x, y;

    function X(l) { return (l + 180) / 360 * W; }
    function Y(t) { return (90 - t) / 180 * H; }

    g.lineCap = 'butt';
    g.font = FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    /* ---- 经线：在北纬 40° 处断开，度数写进断口 ----
       为什么不是赤道：赤道是一条连续实线，数字摆在那里会被它从中间穿过去。
       40° 这一带是空的 —— 30° 和 66.5° 之间没有任何纬线，
       南半球同理（用 40°N 统一，所有经线的数字连成一条横向的带，好认）。
       断口宽度按文字实测：固定 40px 塞不下 "120°W"（约 100px）。 */
    var LAB_LAT = 40;
    g.lineWidth = 2.2;
    g.strokeStyle = LINE;
    for (lon = -180; lon < 180; lon += 30) {
      x = X(lon);
      var lab = lon === 0 ? '0°' : Math.abs(lon) + '°' + (lon > 0 ? 'E' : 'W');
      var gap = g.measureText(lab).width / 2 + 12;
      var ly = Y(LAB_LAT);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, ly - gap); g.stroke();
      g.beginPath(); g.moveTo(x, ly + gap); g.lineTo(x, H); g.stroke();
      g.fillStyle = TEXT;
      g.fillText(lab, x, ly);
    }

    /* ---- 纬线：在 ±90° 经线处断开，左右各标一个 ---- */
    function latLine(t, dashed, major) {
      y = Y(t);
      var lab = t === 0 ? '0°'
        : (Math.abs(t) % 1 === 0 ? Math.abs(t) : Math.abs(t).toFixed(1)) +
          '°' + (t > 0 ? 'N' : 'S');
      var gap = g.measureText(lab).width / 2 + 12;
      /* 断点放在 ±135° 而不是 ±90°。
         经线是在赤道处断开写度数的，如果纬线也在 ±90° 断，赤道和 90°W/90°E
         这两条经线的交点就会同时出现两个标注，糊成一团（"90°W" 里的 0 被
         "0°" 盖住，就是用户报的"西经 0 度的 0 被遮住"）。
         135 不是 30 的倍数，那里没有经线，两边仍然对称。 */
      var xs = [X(-135), X(135)];
      g.save();
      g.lineWidth = major ? 3.4 : (dashed ? 2.0 : 2.2);
      g.strokeStyle = major ? MAJOR : LINE;
      if (dashed) g.setLineDash([16, 13]);
      var from = 0;
      for (var i = 0; i < xs.length; i++) {
        g.beginPath(); g.moveTo(from, y); g.lineTo(xs[i] - gap, y); g.stroke();
        from = xs[i] + gap;
      }
      g.beginPath(); g.moveTo(from, y); g.lineTo(W, y); g.stroke();
      g.restore();

      g.fillStyle = TEXT;
      for (var k = 0; k < xs.length; k++) g.fillText(lab, xs[k], y);
    }

    // 常规纬线
    for (lat = -60; lat <= 60; lat += 30) latLine(lat, false, lat === 0);
    // 回归线与极圈：虚线
    [23.5, -23.5, 66.5, -66.5].forEach(function (t) { latLine(t, true, false); });

    var tex = new THREE.CanvasTexture(cv);
    /* 必须声明 sRGB。canvas 里的颜色本来就是按 sRGB 写的，
       不声明的话 three 当成线性值再转一次，整体被提亮 ——
       暖金 rgba(226,190,120) 就这么变成了接近白色，用户看到的"白线"就是它。 */
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    var mat = new THREE.MeshBasicMaterial({
