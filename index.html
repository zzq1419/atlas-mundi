<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="2026-10-31-H">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<!-- OBS 是图片/音频/贴图的唯一源站。提早点亮 DNS 和 TLS：
     点开第一个国家时才现握手，光这一项就要多等 200~400ms，
     用户体感就是"点了没反应，图过一会儿才冒出来"。 -->
<link rel="preconnect" href="https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com" crossorigin>
<link rel="dns-prefetch" href="//atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com">
<!-- 数据文件走 jsDelivr（GitHub 仓库的 CDN，大 JSON 在这里快一个数量级）。
     提前握手，省掉第一份 geo/*.json 的 3 次 RTT。 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<title>寰宇图志 · Atlas Mundi</title>
<meta name="description" content="寰宇图志：3D 地球上的多模态国家文化图谱。全球 200 多个国家与地区均有基础档案，多模态档案逐国推进。">
<style>
  /* 首帧兜底：样式解析完之前，浏览器用的是默认白底白控件。
     1) 先把 html/body 底色钉死；
     2) color-scheme:dark 让表单控件（输入框、按钮）默认也走深色主题 ——
        万一样式还没生效，露出的是深色控件而不是一块白。 */
  html,body{margin:0;background:#02040a}
  :root{color-scheme:dark}
</style>
<style>
  :root{
    --bg:#02040a;
    --bg-2:#0b1020;
    --ink:#e8ecf6;
    --ink-dim:#8e9ab5;
    --ink-faint:#5c6784;
    --line:rgba(140,165,220,.16);
    --line-strong:rgba(140,165,220,.32);
    --gold:#d8b26a;
    --cyan:#6fd6e8;
    --ok:#5fd6a4;
    --bad:#e8798a;
    --card:rgba(255,255,255,.028);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.7;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* 星空：纯 CSS，无外部图片依赖 */
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.1px 1.1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.6px 1.6px at 33% 62%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.1px 1.1px at 88% 71%, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(1.3px 1.3px at 62% 38%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1px 1px at 8% 82%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 46% 8%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 94% 42%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(circle at 50% -10%, rgba(56,92,168,.075), transparent 58%),
      radial-gradient(circle at 85% 110%, rgba(70,54,132,.055), transparent 58%);
  }
  .wrap{
    position:relative;z-index:1;
    max-width:1120px;
    margin:0 auto;
    padding:clamp(40px,7vw,92px) clamp(20px,4vw,40px) 72px;
  }

  /* ---------- 抬头 ---------- */
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:28px;
  }
  .eyebrow i{
    width:26px;height:1px;background:var(--line-strong);display:inline-block;
  }
  h1{
    font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;
    font-size:clamp(38px,7.4vw,76px);
    font-weight:600;
    letter-spacing:.12em;
    line-height:1.18;
    margin-bottom:6px;
  }
  .latin{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:clamp(15px,2.4vw,21px);
    color:var(--gold);
    letter-spacing:.14em;
    margin-bottom:22px;
    opacity:.92;
  }
  .lede{
    font-size:clamp(15px,2.3vw,18px);
    color:var(--ink-dim);
    max-width:46em;
  }
  .lede b{color:var(--ink);font-weight:500}

  /* ---------- 典故 ---------- */
  .quote{
    margin:38px 0 0;
    padding:20px 0 20px 22px;
    border-left:2px solid rgba(148,182,224,.42);
    font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;
    color:#c9d2e6;
    font-size:clamp(14px,2.1vw,16.5px);
    line-height:2;
  }
  .quote cite{
    display:block;
    margin-top:10px;
    font-style:normal;
    font-size:12.5px;
    letter-spacing:.1em;
    color:var(--ink-faint);
  }

  /* ---------- 区块标题 ---------- */
  .sec{margin-top:clamp(52px,8vw,84px)}
  .sec-head{
    display:flex;align-items:baseline;gap:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .sec-head h2{
    font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:600;color:var(--ink);
  }
  .sec-head span{
    font-size:12.5px;color:var(--ink-faint);letter-spacing:.02em;
  }

  /* ---------- 三国卡 ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px 20px;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
    overflow:hidden;
  }
  .card:hover{
    border-color:var(--line-strong);
    background:rgba(255,255,255,.05);
    transform:translateY(-2px);
  }
  .card .flag{
    font-size:11px;letter-spacing:.18em;color:var(--ink-faint);
    text-transform:uppercase;
  }
  .card h3{
    font-size:21px;font-weight:600;margin:6px 0 2px;
    font-family:"Source Han Serif SC","Songti SC",Georgia,serif;
    letter-spacing:.06em;
  }
  .card .en{font-size:12.5px;color:var(--ink-faint);letter-spacing:.04em}
  .mods{
    display:flex;gap:6px;margin-top:18px;flex-wrap:wrap;
  }
  .mods em{
    font-style:normal;font-size:11.5px;
    padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-faint);
    letter-spacing:.04em;
  }
  .card .state{
    margin-top:16px;padding-top:13px;
    border-top:1px dashed var(--line);
    font-size:12px;color:var(--ink-faint);
    display:flex;align-items:center;gap:7px;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);flex:none}

  /* ---------- 自检面板 ---------- */
  .check{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:rgba(255,255,255,.02);
  }
  .row{
    display:grid;
    grid-template-columns:120px 1fr 96px;
    gap:14px;
    align-items:center;
    padding:15px 18px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink-dim);letter-spacing:.04em}
  .row .u{
    color:var(--ink-faint);
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    font-size:11.5px;
    word-break:break-all;
    line-height:1.55;
  }
  .row .s{
    text-align:right;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .s.ok{color:var(--ok)}
  .s.bad{color:var(--bad)}

  .hint{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-faint);
    line-height:1.85;
  }
  .hint code{
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    font-size:11.5px;
    color:var(--cyan);
    background:rgba(111,214,232,.08);
    padding:1px 6px;
    border-radius:4px;
  }

  /* ---------- 阶段条 ---------- */
  .stages{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .stage{
    background:var(--bg-2);
    padding:16px 18px;
    font-size:12.5px;
  }
  .stage b{
    display:block;font-size:11px;letter-spacing:.16em;
    color:var(--ink-faint);margin-bottom:6px;font-weight:600;
  }
  .stage.done b{color:var(--ok)}
  .stage.doing b{color:var(--gold)}
  .stage.todo{opacity:.5}

  footer{
    margin-top:clamp(56px,9vw,96px);
    padding-top:22px;
    border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
    font-size:12px;color:var(--ink-faint);letter-spacing:.06em;
  }
  footer .r{font-family:Georgia,serif;font-style:italic;color:var(--gold);opacity:.75}

  @media (max-width:560px){
    .row{grid-template-columns:1fr;gap:6px}
    .row .s{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
<style>
  /* --- 卡片：图文头 + 正文 --- */
  .card{padding:0}
  .card .cbody{padding:18px 20px 20px}

  /* 图片一律套在 .*-wrap 里：<img> 是替换元素，伪元素在它身上不渲染，
     骨架必须由父容器画。loaded 之前图片 opacity:0，不出现半张图抖一下。 */
  .thumb-wrap{
    position:relative;height:132px;overflow:hidden;
    border-bottom:1px solid var(--line);background:#0b1020;
  }
  .thumb-wrap .thumb{
    display:block;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .45s ease;
  }
  .thumb-wrap.loaded .thumb{opacity:1}
  .thumb-wrap.blank{
    display:flex;align-items:center;justify-content:center;
    font-size:12px;letter-spacing:.1em;color:var(--ink-faint);
    background:
      repeating-linear-gradient(135deg,rgba(255,255,255,.022) 0 2px,transparent 2px 9px),
      linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .card.is-placeholder{opacity:.62}
  .card.is-placeholder:hover{opacity:.85}
  .card.active{border-color:rgba(148,182,224,.5);background:rgba(148,182,224,.05)}
  .mods em.off{opacity:.36}

  /* --- 详情 --- */
  .dwrap{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:26px;align-items:start}
  /* 高度写死，不跟着图片自身比例变。
     之前竖图（埃菲尔铁塔 760×1406）触发 .fit 把框改成 3/4，横图又是 16:10，
     于是"切一张图，下面的文字整体上移一截"。现在框高固定，
     竖图 contain 装整张、横图 cover 铺满，版式不动。 */
  .dimg-wrap{
    position:relative;width:100%;height:clamp(230px,34vh,372px);overflow:hidden;
    border:1px solid var(--line);border-radius:12px;background:#070b14;
  }
  .dimg-wrap .dimg{
    display:block;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .45s ease;
  }
  .dimg-wrap.loaded .dimg{opacity:1}
  /* 竖构图（埃菲尔铁塔 760×1406、长城烽燧之类）：框改成竖的、整张装进去，
     不再拿 16:10 的死框去裁 —— 那正是"塔被拉平看不到全貌"的来源。 */
  .dimg-wrap.fit{background:rgba(0,0,0,.28)}
  .dimg-wrap.fit .dimg{object-fit:contain}
  .dimg-wrap.blank{
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;color:var(--ink-faint);text-align:center;padding:12px;
    background:linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .dimg-wrap.blank .dimg{display:none}
  .cap{font-size:12px;color:var(--ink-dim);margin-top:9px;line-height:1.65}
  .cap.dim{color:var(--ink-faint)}

  .dmeta{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;margin-bottom:20px}
  .dmeta dt{color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap}
  .dmeta dd{color:var(--ink);font-variant-numeric:tabular-nums}

  /* 正文提一档字重：中文黑体在深底上 400 偏细 */
  .dtext p{font-size:14.5px;line-height:2;color:#dde5f3;margin-bottom:12px;font-weight:500;
    text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .dtext p .kw,.dtext p .kn{text-shadow:none}
  .dplayer{width:100%;margin-top:16px;border-radius:10px}
  .pending{
    margin-top:16px;padding:11px 14px;border-radius:10px;
    border:1px dashed rgba(148,182,224,.3);
    background:rgba(148,182,224,.05);
    font-size:12.5px;color:#c9b58c;line-height:1.75;
  }
  .todo-list{list-style:none;margin-top:4px}
  .todo-list li{
    position:relative;padding:5px 0 5px 15px;
    font-size:12.5px;color:var(--ink-faint);line-height:1.7;
  }
  .todo-list li::before{
    content:"";position:absolute;left:3px;top:13px;
    width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.6;
  }
  /* 数据待补：一行短标签，不写构建日志 */
  .dq{
    margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;gap:9px;align-items:baseline;
    font-size:11.5px;line-height:1.65;
  }
  .dq-k{flex:0 0 auto;letter-spacing:.08em;color:rgba(148,182,224,.7)}
  .dq-v{color:var(--ink-faint);min-width:0}

  /* 加载中骨架：避免录屏时出现纯白或灰块跳动 */
  .thumb-wrap.loading,.dimg-wrap.loading{
    background:linear-gradient(160deg,#0d1322,#0a0f1c);
  }
  .thumb-wrap.loading::after,.dimg-wrap.loading::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:linear-gradient(100deg,transparent 20%,rgba(140,165,220,.13) 50%,transparent 80%);
    background-size:220% 100%;
    animation:shimmer 1.35s linear infinite;
  }
  /* 占位文字（无图时的灰底卡）不参与骨架动画 */
  .thumb-wrap.blank::after,.dimg-wrap.blank::after{content:none}
  @keyframes shimmer{
    from{background-position:180% 0}
    to{background-position:-80% 0}
  }

  /* 3D 地球 */
  .globe-wrap{
    display:grid;grid-template-columns:1fr 232px;gap:22px;align-items:start;
  }
  .globe-stage{
    position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
    background:radial-gradient(circle at 42% 36%,#0e1b2e 0%,#070d16 55%,#03060b 100%);
    touch-action:none;               /* 拖拽时不触发页面滚动 */
  }
  .globe-stage canvas{display:block;width:100%;height:100%;cursor:grab}
  .globe-stage canvas.dragging{cursor:grabbing}
  .globe-msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:10px;
    font-size:12.5px;letter-spacing:.06em;color:var(--ink-faint);
    text-align:center;padding:20px;line-height:1.7;
    transition:opacity .6s ease;
  }
  /* 加载环用 CSS 动画（合成器线程）而不是 JS 驱动。
     关键点：上传 8K 贴图那一下主线程会停住 100~800ms，JS 驱动的进度条会跟着定住，
     看着像死机；CSS transform 动画不受影响，照样转，观感就是"在加载"而不是"卡住"。 */
  .globe-spin{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;
    border:1.5px solid rgba(150,185,230,.16);
    border-top-color:rgba(180,210,246,.92);
    border-right-color:rgba(140,180,230,.5);
    animation:gspin 1.05s linear infinite;
  }
  @keyframes gspin{to{transform:rotate(360deg)}}
  .gm-txt{transition:opacity .26s ease}
  .globe-msg.gone{opacity:0}
  .globe-msg.err{color:#c98a6a}

  .globe-side .sub-label{margin-top:0}
  .globe-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;margin-top:6px;border-radius:8px;
    border:1px solid var(--line);cursor:pointer;
    transition:border-color .2s ease,background .2s ease;
  }
  .globe-item:hover{border-color:rgba(148,182,224,.45);background:rgba(148,182,224,.05)}
  .globe-item.active{border-color:rgba(148,182,224,.7);background:rgba(148,182,224,.08)}
  .gi-flag{
    font-size:9.5px;letter-spacing:.08em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:4px;padding:1px 4px;flex:0 0 auto;
  }
  .gi-name{font-size:13px;color:var(--ink)}
  .gi-coord{
    margin-left:auto;font-size:10.5px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .globe-tip{font-size:11.5px;line-height:1.75}

  @media (max-width:900px){
    .globe-wrap{grid-template-columns:1fr}
    .globe-stage{aspect-ratio:1/1}
  }

  /* 知识库检索 */
  .search-box{margin-top:2px}
  #q{
    width:100%;box-sizing:border-box;
    padding:13px 16px;font-size:14px;font-family:inherit;
    color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:10px;outline:none;
    transition:border-color .2s ease,background .2s ease;
    -webkit-appearance:none;appearance:none;
  }
  #q::placeholder{color:var(--ink-faint)}
  /* 聚焦只改描边，不铺底色。之前这里有一层 rgba(255,255,255,.05)，
     在近黑面板上就是一块米白蒙版盖住整个搜索框 —— 反馈给多了。 */
  #q:focus{border-color:rgba(148,182,224,.5);background:transparent}
  #q::-webkit-search-cancel-button{filter:invert(.5)}

  .sr-examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .sr-ex{
    font-size:12px;padding:4px 11px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:transparent;font-family:inherit;cursor:pointer;
    transition:border-color .2s ease,color .2s ease;
  }
  .sr-ex:hover{border-color:rgba(148,182,224,.45);color:var(--ink)}

  .search-res{
    margin-top:12px;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:rgba(255,255,255,.018);
  }
  .sr-item{
    padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .18s ease;
  }
  .sr-item:last-child{border-bottom:0}
  .sr-item:hover{background:rgba(148,182,224,.06)}
  .sr-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sr-country{
    font-size:11px;letter-spacing:.05em;color:rgba(148,182,224,.9);
    border:1px solid rgba(148,182,224,.3);border-radius:999px;
    padding:1px 7px;flex:0 0 auto;
  }
  .sr-q{font-size:13.5px;color:var(--ink)}
  .sr-a{font-size:12.5px;color:var(--ink-dim);line-height:1.65;margin-top:4px}
  .sr-empty{padding:14px;font-size:12.5px;color:var(--ink-faint);line-height:1.6}
  .sr-country-row{display:flex;align-items:center;gap:9px;padding:10px 14px}
  /* "基础"标签：表示这个国家只有几何/地名/人口，多模态在队列里 */
  .sr-tag{
    flex:0 0 auto;margin-left:6px;padding:0 5px;border-radius:4px;
    font-size:10.5px;line-height:1.5;letter-spacing:.04em;
    color:rgba(174,206,240,.86);
    border:1px solid rgba(150,190,235,.26);
  }
  .sr-arrow{
    margin-left:auto;font-size:15px;line-height:1;color:rgba(148,182,224,.45);
    transition:color .18s ease,transform .18s ease;
  }
  .sr-country-row:hover .sr-arrow{color:rgba(200,222,250,.9);transform:translateX(2px)}

  /* 文化特征：左列窄标签 + 右侧色块。
     原来是 11px 灰字 + 12px 半透明 chip，在深色面板里几乎看不见；
     现在键名 13px 提亮、chip 13px 实色、行间加细分隔线，
     整体像一张"规格表"而不是一堆散落的灰点。 */
  .facets{margin-top:2px}
  .frow{
    display:grid;grid-template-columns:56px minmax(0,1fr);
    gap:4px 12px;align-items:start;
    padding:8px 0;
    border-bottom:1px solid rgba(140,165,220,.10);
  }
  .frow:last-child{border-bottom:0;padding-bottom:2px}
  .fkey{
    font-size:13px;line-height:1.5;letter-spacing:.02em;
    color:rgba(184,202,230,.92);padding-top:3px;white-space:nowrap;
  }
  .fval{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:13px;line-height:1.5;padding:3px 10px;border-radius:7px;
    border:1px solid rgba(140,170,215,.24);
    color:#d7e0ef;background:rgba(255,255,255,.04);
    cursor:default;
    transition:border-color .18s ease,color .18s ease,background .18s ease;
  }
  .chip:hover{
    border-color:rgba(160,192,236,.6);color:#fff;
    background:rgba(150,185,230,.12);
  }
  /* 关键词是"从正文里抽出来的词"，比人工归类的其它项亮一档 */
  .chip-kw{
    border-color:rgba(140,180,240,.38);
    color:#d3e6ff;background:rgba(120,165,235,.10);
  }

  /* 国界轮廓 */
  .geo-box{margin-top:4px}
  /* 高度必须固定。轮廓是 220ms 后异步画进来的，它的高度取决于国土长宽比
     （智利 4:1 竖长、俄罗斯 2:1 横长）；不占位的话，等它出现时
     会把下面「历史 / 民俗」正文整体往下顶一截 —— 用户看到的就是
     "文字先冒出来，然后被挤下去"。先占好位置，里面居中骨架，来了就地替换。 */
  .geo-svg{
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#0c1220,#090e1a);
    padding:6px;font-size:12px;color:var(--ink-faint);
    height:clamp(150px,21vh,196px);
    display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .geo-svg svg{display:block;width:100%;height:100%;max-height:100%}

  /* 多图切换 */
  .thumbstrip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ts-item{
    width:64px;height:46px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:pointer;opacity:.55;
    transition:opacity .2s ease,border-color .2s ease;
  }
  .ts-item:hover{opacity:.85}
  .ts-item.active{opacity:1;border-color:rgba(148,182,224,.65)}

  /* 语言音频行 */
  .lang-block{padding:10px 0;border-bottom:1px solid rgba(140,165,220,.12)}
  .lang-block:last-child{border-bottom:0;padding-bottom:2px}
  /* 三列网格：语言名固定 96px，播放器永远从同一条竖线开始。
     flex 时代名字长短不同，播放器位置就跟着飘，"英语"和"现代标准汉语"看着像两张表。 */
  /* 列宽由内容决定：名字多长，角色和播放器就跟到多后，永远紧挨着名字。
     固定 104px 时"英语"两个字和播放器之间会空出一大段。 */
  .lang-audio{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:10px;justify-content:start}
  /* 原文一行 + 中文一行。原文淡、译文亮，读的时候先看译文。 */
  .lang-trans{margin:6px 0 0 0;display:flex;flex-direction:column;gap:3px}
  .lt-src{
    font-size:12px;line-height:1.6;color:rgba(150,170,198,.72);
    font-style:italic;letter-spacing:.01em;
  }
  .lt-zh{font-size:12px;line-height:1.7;color:#bcd4ee}
  /* 名字列给足 104px（"现代标准汉语"六个字要 84px），单行不折；
     角色列 44px 且不折 —— 否则两个字的"官方"会竖着排。 */
  .la-name{
    font-size:14px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .la-role{
    justify-self:start;white-space:nowrap;
    font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;
  }
  .la-player{flex:1;height:32px;min-width:0}

  @media (max-width:760px){
    .dwrap{grid-template-columns:1fr}
  }

/* ============ 全屏地球布局 ============ */
/* 这一层覆盖旧的"长页面"排版：不再有文档流滚动，一切浮在 3D 舞台之上。 */
html,body{
  height:100%;overflow:hidden;
}
body{
  margin:0;padding:0;
  background:#02040a;
}

#globe-stage{
  /* 全屏。顶栏是浮层、不吃布局，地球可以顶到屏幕最上边 ——
     之前留了 62px 给顶栏，等于在画面上方盖了一条遮罩，球一大就被切。
     品牌字压在上面也没关系，加一点投影就够读。 */
  position:fixed;inset:0;z-index:0;
  transform-origin:50% 50%;
  will-change:transform;
  transition:transform 1.05s cubic-bezier(.22,.61,.36,1),opacity .42s ease;
}
#globe-stage canvas{
  display:block;width:100%;height:100%;cursor:grab;
  /* WebGL 首帧合成偶尔会白一帧。canvas 自己淡进来，这点白就被吃掉了。 */
  opacity:0;transition:opacity .9s ease;
}
#globe-stage canvas.ready{opacity:1}

/* 档案面板打开时，地球整体左移并缩小 —— 比改相机更稳，
   不会触发 canvas 反复 resize，也不会有一次性的抖动。 */
body.panel-open #globe-stage{
  /* 只平移，不缩放。缩放在视觉上会同时"变小 + 被裁"，
     而用户接受面板压住一点地球，所以让球保持原尺寸左移即可。 */
  transform:translateX(-14%);
}

/* --- 顶部栏 --- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:14px;
  padding:14px 26px;
  pointer-events:none;              /* 只有子元素可点，不挡地球拖拽 */
}
#topbar > *{pointer-events:auto}

.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand-logo{
  width:28px;height:28px;flex:0 0 auto;display:block;
  /* 地球是白点阵，压在深空背景上不加滤镜也够亮；这里只补一点极淡的外发光，
     让它和右侧文字在视觉重量上配平。 */
  filter:drop-shadow(0 0 6px rgba(150,190,240,.22));
}
.brand-cn{
  font-family:var(--serif,"Songti SC",serif);
  font-size:26px;letter-spacing:.18em;color:var(--ink);
  /* 品牌字压在球上也读得清：投影而不是底衬，不遮挡画面 */
  text-shadow:0 2px 10px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.6);
}
.brand-en{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* ============ 搜索：默认就是一只短输入框，点一下展开 ============
   之前做成"圆钮 → 点开才变输入框"，看着不像搜索，倒像工具菜单。
   现在常驻一个短框（150px），聚焦或点击时展开到 360px。
   宽度过渡直接放在 .search-wrap 上：topbar 里它后面已经没有别的元素了，
   不会把谁挤得跳来跳去。
   金色只留给地球上的国界，控件一律冷色。 */
.search-wrap{
  position:relative;height:34px;flex:0 0 auto;
  width:168px;
  transition:width .46s cubic-bezier(.2,.9,.25,1);
}
.search-wrap.open{width:min(384px, 46vw)}

.search-panel{
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;
  height:34px;border-radius:999px;overflow:hidden;
  /* 温润，但必须留在站点的冷色系里：
     上一版改用灰褐（暖）确实不刺眼了，可整站是"深空蓝 + 冷青高亮 + 金色国界"，
     一块暖灰胶囊贴上去像外来的控件。真正要改的是**对比**，不是色相。
     所以：底仍是深海军蓝（比 --bg-2 提一档），描边用同一族的 rgba(126,158,198)
     但压到 20%（上一版 34% 才是那道硬线），竖向渐变只差 9 个亮度。 */
  background:linear-gradient(180deg,rgba(9,13,22,.94) 0%,rgba(4,7,12,.96) 100%);
  border:1px solid rgba(126,158,198,.13);
  /* 这里原来有 backdrop-filter:blur(10px)。它会在首次合成时新建一个
     带模糊的图层，Chrome 上表现为刷新瞬间这块区域亮一下（就是"闪白"）。
     框里本来就没有需要虚化的内容，去掉最省事。 */
  cursor:text;
  /* 只有两层外阴影（近距接地 + 远距氛围）和一道极淡的内高光。
     上一版为了"立体"叠了五层，其中两道是纯黑硬环 —— 那就是刺眼的来源。 */
  box-shadow:
    0 1px 2px rgba(0,0,0,.32),
    0 9px 26px rgba(0,0,0,.44),
    0 22px 52px rgba(0,0,0,.18);
  /* 没有任何 inset 亮线：近黑底面上那 1px 的内高光看着就像一道划痕。 */
  transition:border-color .26s ease,background .26s ease,box-shadow .26s ease;
}
.search-wrap.open .search-panel{
  background:linear-gradient(180deg,rgba(11,16,26,.95) 0%,rgba(5,9,16,.97) 100%);
}
/* hover 必须有反应：之前只有聚焦才变，鼠标扫过去毫无反馈，像块死板子 */
.search-panel:hover{
  border-color:rgba(150,185,230,.24);
  background:linear-gradient(180deg,rgba(13,19,31,.95) 0%,rgba(6,11,19,.97) 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.34),
    0 10px 28px rgba(0,0,0,.46),
    0 24px 56px rgba(0,0,0,.20);
}
.search-panel:hover .search-icon{stroke:rgba(196,222,252,.88)}
.search-panel:focus-within{
  border-color:rgba(160,196,240,.30);
  box-shadow:
    0 0 0 2px rgba(120,165,235,.07),
    0 1px 2px rgba(0,0,0,.36),
    0 12px 32px rgba(0,0,0,.48),
    0 28px 64px rgba(0,0,0,.22);
}

.search-panel .search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:13.5px;height:13.5px;pointer-events:none;
  fill:none;stroke:rgba(158,190,228,.48);stroke-width:1.8;
  transition:stroke .26s ease;
  stroke-linecap:round;stroke-linejoin:round;
}

#q{
  flex:1 1 auto;min-width:0;height:100%;box-sizing:border-box;
  padding:0 6px 0 31px;
  font-size:13.5px;font-family:inherit;
  color:#dfe9f7;caret-color:#a9cbee;
  background:transparent;border:0;outline:none;
  -webkit-appearance:none;appearance:none;
}
#q::placeholder{color:rgba(180,200,222,.46)}
/* 自动填充会强行给输入框铺白底（深色页面上的大忌）。这行把它压回去。 */
#q:-webkit-autofill,
#q:-webkit-autofill:hover,
#q:-webkit-autofill:focus{
  -webkit-text-fill-color:#dfe9f7;
  -webkit-box-shadow:0 0 0 1000px rgba(20,32,50,.9) inset;
  transition:background-color 99999s ease-in-out 0s;
}
#q::-webkit-search-cancel-button{filter:invert(.42)}

/* 清空按钮：只在有字时出现。原生 ::-webkit-search-cancel-button 只在聚焦时冒出来，
   点它还要先抢一次焦点，用起来是"点两下才删"的感觉，所以自己画一个。 */
.search-clear{
  flex:0 0 auto;width:0;height:20px;margin-right:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;overflow:hidden;
  background:transparent;border:0;opacity:0;pointer-events:none;
  transition:width .18s ease,opacity .18s ease,margin .18s ease;
}
.search-wrap.has-text .search-clear{
  width:20px;margin-right:2px;opacity:.7;pointer-events:auto;
}
.search-clear:hover{opacity:1;background:rgba(150,185,230,.16)}
.search-clear svg{
  width:10px;height:10px;
  fill:none;stroke:rgba(190,214,244,.95);
  stroke-width:2.2;stroke-linecap:round;
}
/* 原生那个去掉，免得两个叉并排 */
#q::-webkit-search-cancel-button,
#q::-webkit-search-decoration{-webkit-appearance:none;display:none}

/* 展开后才出现的下拉按钮：国家列表由用户自己点开 */
.search-drop{
  flex:0 0 auto;width:0;height:22px;margin-right:0;padding:0;
  opacity:0;pointer-events:none;overflow:hidden;
  transition:width .2s ease,opacity .2s ease,background .2s ease,border-color .2s ease;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;
  background:transparent;border:1px solid transparent;
}
.search-wrap.open .search-drop{
  width:22px;margin-right:4px;opacity:.9;pointer-events:auto;
}
.search-drop svg{
  width:11px;height:11px;
  fill:none;stroke:rgba(184,210,242,.95);
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s cubic-bezier(.2,.9,.25,1);
}
.search-drop:hover{opacity:1;border-color:rgba(150,185,230,.42);background:rgba(150,185,230,.1)}
.search-wrap.list-open .search-drop{opacity:1}
.search-wrap.list-open .search-drop svg{transform:rotate(180deg)}

/* 搜索结果 / 国家列表：从搜索框下方浮出 */
#q-res{
  position:absolute;top:calc(100% + 8px);left:0;
  width:100%;
  max-height:52vh;overflow-y:auto;
  border-radius:12px;border:1px solid rgba(120,150,190,.28);
  background:rgba(8,13,23,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 48px rgba(0,0,0,.55);
}
#q-res[hidden]{display:none}

/* --- 底部国家导航 --- */
#dock{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  z-index:30;pointer-events:none;
}
#dock #cards{
  display:flex;gap:10px;pointer-events:auto;
}
.dock-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 16px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--ink-dim);
  background:rgba(10,16,28,.72);
  border:1px solid rgba(120,150,190,.26);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .22s ease;
}
.dock-item:hover{
  border-color:rgba(148,182,224,.55);color:var(--ink);
  transform:translateY(-2px);
}
.dock-item.active{
  border-color:rgba(148,182,224,.85);
  background:rgba(148,182,224,.14);
  color:#f2d9a4;
}
.di-iso{
  font-size:9.5px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dock-item.active .di-iso{color:rgba(242,217,164,.75)}

/* --- 右侧档案面板 --- */
/* 档案面板：一张浮起来的卡片，四边留白、圆角、带偏移的柔和阴影。
   之前是贴边的侧栏，像浏览器自带的抽屉；浮卡才有"弹出来"的感觉。 */
#detail{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",
              "Segoe UI",system-ui,sans-serif;
  position:fixed;top:16px;right:16px;bottom:16px;z-index:40;
  width:min(500px, calc(100vw - 32px));
  display:flex;flex-direction:column;
  /* 三段色 #303d67 → #79799a → #fddfdc 从左到右。
     直接铺满会有一个绕不开的矛盾：右端 #fddfdc 太亮，白字读不出；
     左端太暗，黑字也读不出 —— 而正文只有一种颜色。
     所以改成"深底 + 三段色的半透明罩染"：色相和走向都保留，
     但整条都被压到同一明度区间（右端合成后约 rgb(107,94,92)，
     白字对比度 5.6:1），文字终于能读了。
     边框用同组色全强度渐变（双背景 padding-box/border-box，
     border-image 会破坏圆角）。 */
  background:
    linear-gradient(100deg,
      rgba(48,61,103,.80) 0%,
      rgba(84,88,122,.66) 38%,
      rgba(121,121,154,.56) 66%,
      rgba(253,223,220,.40) 100%) padding-box,
    linear-gradient(180deg,#0b0f19 0%,#080b12 100%) padding-box,
    linear-gradient(100deg,#303d67 0%,#79799a 56%,#fddfdc 100%) border-box;
  border:1px solid transparent;
  border-radius:20px;
  box-shadow:0 28px 70px rgba(0,0,0,.62), 0 3px 10px rgba(0,0,0,.42);
  transform:translateX(calc(100% + 28px));
  /* visibility 不能过渡，但它会**立刻**生效 —— 移除 .open 的瞬间面板就被藏了，
     滑出动画根本没机会跑，看起来就是"啪"地消失。
     把 visibility 的切换延迟到 0.56 秒（正好是滑完的时间），动画才看得见。 */
  transition:transform .56s cubic-bezier(.22,.61,.36,1),
             visibility 0s linear .56s;
  visibility:hidden;
  overflow:hidden;                 /* 圆角要裁掉内部滚动区的直角 */
}
#detail.open{
  transform:none;visibility:visible;
  transition:transform .56s cubic-bezier(.22,.61,.36,1),visibility 0s;
}
#detail[hidden]{display:none}

.dhead{
  padding:22px 26px 16px;border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.dhead h2{
  /* 面板一律走无衬线粗体：中文用黑体（苹方/微软雅黑/思源黑），
     西文用同族无衬线粗体。之前用宋体，压在这个深色面板上显得又细又飘。 */
  margin:0;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",
              "Segoe UI",system-ui,sans-serif;
  font-size:26px;font-weight:700;letter-spacing:.02em;color:#fff;
}
#d-sub{
  margin-top:6px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dscroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding:18px 24px 28px;
}
/* 内部任何元素都不许撑破面板产生横向滚动条 */
#detail *{max-width:100%}
/* 只在正文流里限制媒体宽度。这里必须排除 .dimg / .ts-item：
   一条 `#detail img{height:auto}` 的优先级高于 `.dimg-wrap .dimg{height:100%}`，
   会把主图的高度改成图片自身比例，于是 4:3 的框只露出竖图顶部一截 ——
   埃菲尔铁塔那张（760×1406）看起来就是"被拉平、看不到全貌"。 */
#detail .prose img,#detail .prose video,
#detail .dimg-wrap .dimg,#detail .thumbstrip .ts-item{max-width:100%}
#detail video,#detail canvas{max-width:100%;height:auto}
#detail .dwrap,#detail .dblock,#detail .meta,#detail .facets{min-width:0}
#detail pre,#detail code{white-space:pre-wrap;word-break:break-word}
.dclose{
  position:absolute;top:15px;right:15px;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;cursor:pointer;
  color:var(--ink-dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-family:inherit;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.dclose:hover{color:var(--ink);border-color:rgba(148,182,224,.5);background:rgba(148,182,224,.10)}

/* 面板里空间窄，详情原本的两列网格改为单列。
   列宽必须是 minmax(0,1fr) 而不是 1fr —— `1fr` 的最小值是 auto，
   会被内容（.dimg-wrap 的 aspect-ratio × 固定高度 = 489px）撑开，
   于是整栏比面板还宽，正文右侧被切掉一截。 */
#detail .dwrap{grid-template-columns:minmax(0,1fr);gap:16px}
#detail .dimg-wrap{aspect-ratio:16/10}
/* 竖图在面板里单独给一个更高的框（这条必须带 #detail，否则被上面那条盖掉） */
#detail .dimg-wrap.fit{aspect-ratio:4/5}

/* --- 左下角提示 --- */
#footline{
  position:fixed;left:26px;bottom:30px;z-index:20;
  display:flex;flex-direction:column;gap:4px;
  font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint);
  pointer-events:none;
  opacity:.8;
}
.fl-src{font-size:9.5px;opacity:.7}

/* --- 移动端 --- */
@media (max-width:760px){
  #topbar{padding:12px 14px;gap:10px;flex-wrap:nowrap}
  .brand-en{display:none}
  .brand-cn{font-size:17px}
  .topbar-meta{display:none}
  .search-wrap{width:128px;height:32px}
  .search-wrap.open{width:calc(100vw - 126px)}
  #globe-stage{inset:0}
  #detail{
    top:auto;left:10px;right:10px;bottom:10px;
    width:auto;height:82vh;height:82dvh;
    border-radius:18px;
    transform:translateY(calc(100% + 20px));
  }
  #detail.open{transform:none}
  body.panel-open #globe-stage{transform:translateY(-11%)}
  #footline{display:none}
}

/* ============ 浏览器表面 ============
   这些部件不是画出来的，但一样带设计：选区颜色、滚动条、焦点环。
   它们是最便宜的"这页是被建造的"信号，也是最常被漏掉的一层。 */
::selection{
  /* 原来是无彩的淡蓝底 + 米白字，在近黑的搜索框里读起来就是"一块白斑"。
     换成和国界金线同源的暖金，文字保持原来的冷白，不跳。 */
  background:rgba(198,160,88,.32);
  color:#f2f7ff;
}
::-moz-selection{background:rgba(198,160,88,.32);color:#f2f7ff}

.dscroll::-webkit-scrollbar,
#q-res::-webkit-scrollbar{width:10px}
.dscroll::-webkit-scrollbar-track,
#q-res::-webkit-scrollbar-track{background:transparent}
.dscroll::-webkit-scrollbar-thumb,
#q-res::-webkit-scrollbar-thumb{
  background:rgba(140,168,208,.24);
  border:3px solid transparent;
  background-clip:padding-box;
  border-radius:10px;
}
.dscroll::-webkit-scrollbar-thumb:hover,
#q-res::-webkit-scrollbar-thumb:hover{
  background:rgba(148,182,224,.42);
  background-clip:padding-box;
}
.dscroll{scrollbar-width:thin;scrollbar-color:rgba(140,168,208,.28) transparent}

:focus-visible{
  outline:2px solid rgba(148,182,224,.78);
  outline-offset:3px;
  border-radius:6px;
}
#q:focus-visible{outline-offset:0;border-radius:999px}

/* ============ 正文段落 ============
   中文长段落首行缩进两字，段间留白；不缩进会连成一片很难读。 */
.prose p{
  margin:0 0 .82em;
  text-indent:2em;
  line-height:1.95;
  color:var(--ink-dim);
  font-size:14.5px;
  letter-spacing:.01em;
}
.prose p:last-child{margin-bottom:0}
.prose{padding:0}

/* 面板里的标题层级。
   这里曾经是 11.5px —— 比正文 14.5px 还小，属于排版错误而不是风格选择：
   标题必须比正文大、比正文粗。而且早先那条 `.dtext p.sub-label` 的选择器
   要求 p 标签，实际元素是 div，所以从来没生效过，改了三轮都没改对。
   现在只有这一处定义，17.5px / 700。 */
.sub-label{
  font-size:17px;font-weight:700;letter-spacing:.02em;
  line-height:1.4;color:#eef4ff;
  margin:26px 0 12px;
}
/* 只在"文本流的第一块"才清零上边距。
   之前这条是通用的 :first-child，而「文化特征」正好是 .facets 的第一个子元素，
   于是它的 26px 上边距被吃掉了，标题直接贴在「历史与民俗」正文下面。 */
#d-body > .sub-label:first-child{margin-top:0}
.facets > .sub-label:first-child{margin-top:22px}

/* ============ 球面地名标注 ============
   像地图那样：纯文字、无胶囊底、带投影保证在浅色地表上也读得清。
   每帧由 JS 投影定位，转到背面淡出，互相重叠的按重要度让位。
   尺寸分三级：大洲最轻、大洋斜体、国家名最实。 */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.mlabel{
  position:absolute;left:0;top:0;
  /* 拖地球的时候鼠标会从地名上划过去。地名是 DOM 文本，浏览器默认会当成
     文本选择来处理：划一下就整片反白，松手还变成可复制的选区，
     连"双击重置"都被打断。地图上的文字不该是可选中文本。 */
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  white-space:nowrap;opacity:0;
  font-size:13px;letter-spacing:.04em;
  color:#fff;
  /* 白字压白雪（亚洲正好落在西伯利亚雪原上）的解法：
     用"深色描边 + 浅色填充"，先描边后填充（paint-order），白底黑底都分得开。
     注意描边宽度是**相对字号**的：13px 的中文笔画只有 1px 出头，
     描边一旦到 0.8px 就会从里外两侧把笔画吃光，字变成一块灰饼 ——
     所以字号提到 14px，描边压到 0.5px。 */
  /* 0.5px 的硬描边在雪原上还是太细：西伯利亚、格陵兰那一带白底白字，
     描边一淡就糊成一片。改用"细描边 + 三层渐隐暗晕" —— 硬描边负责紧贴笔画
     的那一圈，暗晕负责向外扩出 3px 的过渡，白底和深色海面都能压住。
     别再加大描边：14px 的中文笔画只有 1px 出头，描边一粗就从里外把字吃成灰饼。 */
  -webkit-text-stroke:.45px rgba(0,0,0,.62);
  paint-order:stroke fill;
  text-shadow:0 0 1px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.62),0 0 6px rgba(0,0,0,.38),0 1px 2px rgba(0,0,0,.5);
  /* 这里原来有 transition:opacity .26s。它和"每帧按距离写透明度"打架：
     快速缩放时 300 多个标签各自延迟 0.26 秒才收掉，屏幕上就是一层残影。
     现在每帧直接给值，隐藏即刻生效。 */
  transition:none;
  cursor:pointer;          /* 只有 pointer-events:auto 的（有 iso 的）才会显示手型 */
}
.mlabel.mc{
  /* 大洲名之前 58% 透明度、字距 0.42em，压在雪山白底上根本看不见。
     现在提亮到 0.84、字距收到 0.3em（拉太开会显得更细更虚）。 */
  font-size:14.5px;letter-spacing:.26em;font-weight:600;
  color:rgba(232,241,254,.92);
}
.mlabel.mo{
  font-size:13px;letter-spacing:.24em;font-style:italic;
  color:rgba(180,212,246,.78);
}
/* 岛 / 湖 / 海峡：只在放得很大时才出现，比国名轻一档，但各自有颜色语义 */
.mlabel.mi{font-size:12.5px;color:rgba(214,232,252,.82)}
.mlabel.ml{font-size:12px;font-style:italic;color:rgba(148,206,238,.82)}
.mlabel.ms{
  font-size:11.5px;letter-spacing:.14em;font-style:italic;
  color:rgba(162,202,240,.76);
}
/* 已收录、可点开档案的国家：比普通国名亮一档，hover 变白 */
.mlabel.mk{
  pointer-events:auto;cursor:pointer;
  font-size:13.5px;font-weight:500;
  color:#ffffff;
  /* 这里原来只有一层"向下的投影"。投影只压字的下方，字的上半部分贴着雪原就没了 ——
     补上环形暗晕，最后那层淡蓝光晕是原本的设计，留着。 */
  text-shadow:0 0 1px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.62),
              0 1px 3px rgba(0,0,0,.95),0 0 12px rgba(120,170,235,.5);
}
.mlabel.mk:hover{color:#cfe6ff}

/* ============ 左下角工具按钮 ============ */
#tools{
  position:fixed;left:20px;bottom:20px;z-index:25;
  display:flex;align-items:flex-end;
}
/* 不加面板、不加边框：图标直接落在球面上，靠间距和留白组织。
   深色玻璃框会把球面切掉一块，反而更脏。 */
#tools-body{
  display:flex;flex-direction:column;gap:6px;
}
/* 每个图标自己带一层极淡的圆底：完全透明会看不清，
   但也不能再套整块面板 —— 那样等于把球面切掉一角。 */
#tools-body .tool-btn{
  background:rgba(7,11,19,.58);
  border-color:rgba(126,158,198,.18);
  box-shadow:none;
}
#tools-body .tool-btn svg{stroke:rgba(176,202,238,.82)}
#tools-body .tool-btn:hover{background:rgba(120,160,210,.18);border-color:rgba(150,185,230,.30)}
#tools-body .tool-btn.on{
  background:rgba(58,45,22,.82);border-color:rgba(255,215,138,.65);
  box-shadow:0 0 14px rgba(255,196,96,.18);
}
/* 复位按钮不属于开关，和下面那组拉开距离 */
#tools-body #btn-china{margin-bottom:14px}
.tool-btn{
  width:36px;height:36px;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  /* 同理：小球现在会顶到屏幕边缘，按钮底色必须做实 */
  background:rgba(7,11,19,.9);
  border:1px solid rgba(126,158,198,.26);
  transition:border-color .2s ease,background .2s ease;
}
.tool-btn svg{
  width:15px;height:15px;
  fill:none;stroke:rgba(158,190,228,.7);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .2s ease;
}
.tool-btn:hover{border-color:rgba(150,185,230,.55);background:rgba(19,31,50,.88)}
.tool-btn:hover svg{stroke:rgba(200,222,250,.95)}
/* 点亮态用金色 —— 和地球上的国界线、晨昏线是同一支色。
   开关类按钮（国境线 / 经纬线 / 昼夜分界 / 时间指示）点开都是这个状态。 */
.tool-btn.on{
  border-color:rgba(255,215,138,.72);
  background:rgba(58,45,22,.92);
  box-shadow:0 0 0 1px rgba(255,215,138,.16),0 0 16px rgba(255,196,96,.20);
}
.tool-btn.on svg{stroke:rgba(255,224,152,.98)}
/* 时间指示模式：光标换成一面小旗子，热点在旗杆脚下 */
#globe-stage.time-mode{cursor:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0' y1='0' x2='.9' y2='1'%3E%3Cstop offset='0' stop-color='%23ffeec2'/%3E%3Cstop offset='.55' stop-color='%23f6c85c'/%3E%3Cstop offset='1' stop-color='%23cd9a2e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M9 31.4V5' stroke='%23e9c987' stroke-width='1.9' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='4.2' r='1.9' fill='%23ffe9b3'/%3E%3Ccircle cx='8.4' cy='3.7' r='.7' fill='%23fffdf2' opacity='.9'/%3E%3Cpath d='M10.2 5.6c5.4-1.7 8.6 1.5 13.6.1.5 2.9.4 5.8-.3 8.7-5 1.3-8.6-1.5-13.3.2z' fill='url(%23f)' stroke='%23a97a1f' stroke-width='.9'/%3E%3Cpath d='M10.2 5.6c5.4-1.7 8.6 1.5 13.6.1' stroke='%23fff6da' stroke-width='1' fill='none' opacity='.85'/%3E%3Cpath d='M12.6 7.2c-.7 2.2-.9 4.4-.6 6.6M16.4 6.7c-.6 2.3-.7 4.6-.4 6.9' stroke='%23b98a24' stroke-width='.7' fill='none' opacity='.55'/%3E%3C/svg%3E") 9 32, crosshair}
#globe-stage.time-mode canvas{cursor:inherit}
/* 时间模式下国名标签不接事件：点哪儿都是"问时间"，不能顺手打开档案 */
#globe-stage.time-mode .mlabel{pointer-events:none!important}

/* 点击波纹：三圈金色，错开 90ms 扩散出去 */
.ripple{
  position:fixed;z-index:31;pointer-events:none;
  width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  border:1.4px solid rgba(255,216,140,.95);
  box-shadow:0 0 10px rgba(255,196,96,.45);
  opacity:0;animation:rippleOut .72s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes rippleOut{
  0%{opacity:.95;transform:scale(.35)}
  70%{opacity:.35}
  100%{opacity:0;transform:scale(4.2)}
}

/* 时间气泡：跟着点击的位置走，样式和左侧工具栏同一套 */
#time-pin{
  position:fixed;z-index:32;left:0;top:0;
  transform:translate(-50%,calc(-100% - 14px));
  padding:7px 12px 8px;border-radius:10px;
  background:rgba(10,16,26,.94);
  border:1px solid rgba(255,215,138,.45);
  box-shadow:0 12px 30px rgba(0,0,0,.55);
  color:#f4e7cd;font-size:12.5px;line-height:1.5;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .16s ease;
}
#time-pin.on{opacity:1}
#time-pin b{color:#ffdb8a;font-weight:600;font-variant-numeric:tabular-nums}
#time-pin i{display:block;font-style:normal;font-size:11px;color:rgba(214,206,186,.72);
  letter-spacing:.04em;margin-top:2px;font-variant-numeric:tabular-nums}
#time-pin::after{
  content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
  margin-left:-4px;transform:rotate(45deg);
  background:rgba(10,16,26,.94);
  border-right:1px solid rgba(255,215,138,.45);
  border-bottom:1px solid rgba(255,215,138,.45);
}

/* ============ 2D 平面地图 ============
   横向循环平铺的世界地图：画布本身是 3 份等距圆柱首尾相接，
   默认把 -100°（美洲）放在屏幕正中，于是左右两侧都是亚洲 —— 不会像
   单张 2:1 那样在 16:9 屏幕上被上下留黑、看起来"压扁"。
   画布尺寸固定，平移和缩放只改 CSS transform，不重绘。 */
#map2d{
  position:fixed;inset:0;z-index:6;background:#05070c;
  opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity .42s ease;cursor:grab;
}
#map2d.on{opacity:1;pointer-events:auto}
.map2d-loading{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  color:rgba(200,220,242,.72);font-size:13px;letter-spacing:.08em;
  padding:10px 18px;border-radius:20px;
  background:rgba(8,14,24,.72);border:1px solid rgba(126,158,198,.22);
  opacity:0;transition:opacity .25s ease;pointer-events:none;
}
.map2d-loading.on{opacity:1}
#map2d.dragging{cursor:grabbing}
.map2d-canvas{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
  image-rendering:auto;
}

/* 白底线稿：画布自己铺米白底，卫星图不画 */
#map2d.paper{background:#efe9dd}

/* 进了 2D，左下那排工具（中国 / 国境线 / 经纬线 / 昼夜）全是 3D 概念，
   留着只会点出错觉。整排淡出。 */
#tools{transition:opacity .3s ease}
#map2d.on ~ #tools{opacity:0;pointer-events:none}

/* 浅底上的顶栏文字要转深色，否则品牌名是一块白字浮在米白上 */
#map2d.paper ~ #topbar .brand-cn{color:#26313f;text-shadow:0 1px 0 rgba(255,255,255,.6)}
/* 白点阵在米白底上直接消失。试过 invert(1) 反相成黑点 —— 不行：
   原图 128px、真正的点只有 1573 个像素，缩到 26px 后每个点都落在
   抗锯齿的半透明边缘上，反相完是一坨灰雾。
   改成给圆点阵垫一个深色圆底，白点保持原样，读起来像一枚图章。 */
#map2d.paper ~ #topbar .brand-logo{
  filter:none;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#2b3746 0 46%,rgba(43,55,70,0) 47%);
}
#map2d.paper ~ #topbar #search-panel{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,240,232,.95));
  border-color:rgba(60,78,100,.22);
  box-shadow:0 1px 2px rgba(40,50,70,.10),0 8px 22px rgba(40,50,70,.10);
}
#map2d.paper ~ #topbar #q{color:#1f2b3a}
#map2d.paper ~ #topbar #q::placeholder{color:rgba(60,78,100,.42)}
#map2d.paper ~ #topbar .search-icon{stroke:rgba(60,78,100,.6)}

/* 视图切换按钮：左侧垂直居中，比左下角的工具按钮大一号、圆角方形，
   和那排圆形开关刻意不同，因为它不是"图层开关"而是"换一种看法"。 */
.view-btn{
  position:fixed;left:20px;top:50%;z-index:26;
  width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:13px;cursor:pointer;
  background:linear-gradient(160deg,rgba(16,25,40,.94),rgba(6,10,18,.96));
  border:1px solid rgba(126,158,198,.30);
  box-shadow:0 6px 22px rgba(0,0,0,.45);
  transform:translateY(-50%);
  transition:border-color .2s ease,background .2s ease,transform .2s ease;
}
.view-btn svg{
  width:19px;height:19px;fill:none;stroke:rgba(178,206,238,.82);
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .2s ease;
}
.view-btn:hover{
  border-color:rgba(170,204,244,.62);
  background:linear-gradient(160deg,rgba(26,40,62,.96),rgba(10,16,28,.97));
}
.view-btn:hover svg{stroke:rgba(222,238,255,.98)}
.view-btn.on{border-color:rgba(214,178,110,.72);background:linear-gradient(160deg,rgba(44,38,24,.95),rgba(16,14,10,.97))}
.view-btn.on svg{stroke:rgba(244,214,150,.98)}
/* 白底线稿按钮：排在视图按钮下面一档，只在 2D 状态出现 */
.view-btn.paper{top:calc(50% + 54px);width:38px;height:38px;border-radius:11px}
.view-btn.paper svg{width:16px;height:16px}

/* ============ 正文里的关键词高亮 ============
   用下划线式的高亮条而不是背景块：一整段里出现十几次背景块会像荧光笔乱涂。 */
/* 概念关键词与数字/年代共用一套"细下划线"样式，只靠颜色区分。
   之前关键词是渐变粗条（视觉上像荧光笔），数字是 1px 下划线，
   两种样式混在一段里很乱。 */
.kw{
  color:#9fdcf2;font-weight:700;
  border-bottom:1px solid rgba(130,205,235,.55);
}
.kn{
  color:#ffd9a8;font-weight:700;
  font-variant-numeric:tabular-nums;
  border-bottom:1px solid rgba(255,196,140,.55);
}
/* 高亮词左右要留气口：inline 元素的 padding 不占位，会直接盖到相邻汉字上，
   所以间距必须用 margin（inline 的水平 margin 是参与排版的）。 */
.kw,.kn{margin:0 2px}
/* 从搜索结果定位过来的段落，闪一下让人看到落点 */
.hit-flash{
  animation:hitFlash 1.6s ease-out 1;
  border-radius:6px;
}
@keyframes hitFlash{
  0%{background:rgba(150,200,235,.26);box-shadow:0 0 0 6px rgba(150,200,235,.22)}
  100%{background:transparent;box-shadow:0 0 0 6px transparent}
}

/* ============ 自绘提示气泡 ============
   原生 title 要悬停一秒才出、样式不可控、移动端还没有。 */
.tip{
  position:fixed;z-index:60;left:0;top:0;
  max-width:260px;padding:6px 10px;border-radius:8px;
  font-size:12px;line-height:1.55;color:#e8f0fb;
  background:rgba(10,16,26,.96);
  border:1px solid rgba(120,160,210,.32);
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  pointer-events:none;opacity:0;
  transform:translate(-50%,0) scale(.96);
  transform-origin:50% 0;
  transition:opacity .14s ease,transform .14s ease;
}
.tip.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* 右侧对齐：横向从右边缘长出来，纵向垂直居中 */
.tip.side-right{transform:translate(0,-50%) scale(.96);transform-origin:0 50%}
.tip.side-right.on{transform:translate(0,-50%) scale(1)}

/* ============ 提示（加载完成后短暂出现） ============ */
.toast{
  position:fixed;left:50%;bottom:58px;z-index:28;
  transform:translateX(-50%);
  padding:8px 18px;border-radius:999px;
  font-size:11.5px;letter-spacing:.08em;color:rgba(206,224,246,.9);
  background:rgba(10,17,29,.78);
  border:1px solid rgba(126,158,198,.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:1;transition:opacity .9s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.out{opacity:0}

/* ============ 语言音频：自绘控件 ============
   浏览器原生 <audio controls> 是一整块浅色系统控件，在深色面板里非常扎眼。 */
.aud{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0}
.aud-btn{
  width:28px;height:28px;flex:0 0 auto;padding:0;
  border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(126,158,198,.3);
  transition:border-color .2s ease,background .2s ease;
}
.aud-btn svg{width:10px;height:10px;fill:rgba(178,203,232,.9)}
.aud-btn:hover{border-color:rgba(150,185,230,.6);background:rgba(150,185,230,.12)}
/* 播放中只提亮，不用金色 —— 金色是地球国界的专属 */
.aud.playing .aud-btn{border-color:rgba(178,208,244,.8);background:rgba(150,185,230,.16)}
.aud.playing .aud-btn svg{fill:#e8f2ff}

/* 进度条给足高度：之前只有 3px，在深色面板里几乎看不见，
   看起来就像"只剩按钮和计时器"。 */
.aud-bar{
  flex:1 1 auto;min-width:56px;height:18px;
  display:flex;align-items:center;position:relative;cursor:pointer;
}
.aud-track{
  position:relative;width:100%;height:4px;border-radius:3px;
  background:rgba(160,190,225,.22);
  transition:height .16s ease;
}
.aud-bar:hover .aud-track{height:6px}
.aud-fill{
  position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;
  background:rgba(190,216,248,.85);
  transition:none;   /* 由 rAF 每帧写，交给 transition 反而会卡成 4Hz */
}
.aud.playing .aud-fill{background:rgba(214,232,255,.95)}
.aud-fill::after{
  content:"";position:absolute;right:-4px;top:50%;
  width:8px;height:8px;border-radius:50%;
  transform:translateY(-50%) scale(.001);
  background:#eaf3ff;
  transition:transform .16s ease;
}
.aud-bar:hover .aud-fill::after,
.aud.playing .aud-fill::after{transform:translateY(-50%) scale(1)}
.aud-time{

  font-size:10.5px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
