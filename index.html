<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="2026-10-26-F">
<title>寰宇图志 · Atlas Mundi</title>
<meta name="description" content="寰宇图志：3D 地球上的多模态国家文化图谱">
<style>
  :root{
    --bg:#070a12;
    --bg-2:#0b1020;
    --ink:#e8ecf6;
    --ink-dim:#8e9ab5;
    --ink-faint:#5c6784;
    --line:rgba(140,165,220,.16);
    --line-strong:rgba(140,165,220,.32);
    --gold:#d8b26a;
    --cyan:#6fd6e8;
    --ok:#5fd6a4;
    --bad:#e8798a;
    --card:rgba(255,255,255,.028);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.7;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* 星空：纯 CSS，无外部图片依赖 */
  body::before{
    content:"";
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1.4px 1.4px at 12% 18%, rgba(255,255,255,.85), transparent 60%),
      radial-gradient(1.1px 1.1px at 78% 12%, rgba(255,255,255,.6), transparent 60%),
      radial-gradient(1.6px 1.6px at 33% 62%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.1px 1.1px at 88% 71%, rgba(255,255,255,.7), transparent 60%),
      radial-gradient(1.3px 1.3px at 62% 38%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1px 1px at 8% 82%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 46% 8%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 94% 42%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(circle at 50% -10%, rgba(80,130,220,.16), transparent 55%),
      radial-gradient(circle at 85% 110%, rgba(120,80,200,.12), transparent 55%);
  }
  .wrap{
    position:relative;z-index:1;
    max-width:1120px;
    margin:0 auto;
    padding:clamp(40px,7vw,92px) clamp(20px,4vw,40px) 72px;
  }

  /* ---------- 抬头 ---------- */
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:28px;
  }
  .eyebrow i{
    width:26px;height:1px;background:var(--line-strong);display:inline-block;
  }
  h1{
    font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;
    font-size:clamp(38px,7.4vw,76px);
    font-weight:600;
    letter-spacing:.12em;
    line-height:1.18;
    margin-bottom:6px;
  }
  .latin{
    font-family:Georgia,"Times New Roman",serif;
    font-style:italic;
    font-size:clamp(15px,2.4vw,21px);
    color:var(--gold);
    letter-spacing:.14em;
    margin-bottom:22px;
    opacity:.92;
  }
  .lede{
    font-size:clamp(15px,2.3vw,18px);
    color:var(--ink-dim);
    max-width:46em;
  }
  .lede b{color:var(--ink);font-weight:500}

  /* ---------- 典故 ---------- */
  .quote{
    margin:38px 0 0;
    padding:20px 0 20px 22px;
    border-left:2px solid rgba(216,178,106,.42);
    font-family:"Source Han Serif SC","Noto Serif CJK SC","Songti SC",Georgia,serif;
    color:#c9d2e6;
    font-size:clamp(14px,2.1vw,16.5px);
    line-height:2;
  }
  .quote cite{
    display:block;
    margin-top:10px;
    font-style:normal;
    font-size:12.5px;
    letter-spacing:.1em;
    color:var(--ink-faint);
  }

  /* ---------- 区块标题 ---------- */
  .sec{margin-top:clamp(52px,8vw,84px)}
  .sec-head{
    display:flex;align-items:baseline;gap:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .sec-head h2{
    font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:600;color:var(--ink);
  }
  .sec-head span{
    font-size:12.5px;color:var(--ink-faint);letter-spacing:.02em;
  }

  /* ---------- 三国卡 ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px 20px;
    transition:border-color .25s ease, background .25s ease, transform .25s ease;
    overflow:hidden;
  }
  .card:hover{
    border-color:var(--line-strong);
    background:rgba(255,255,255,.05);
    transform:translateY(-2px);
  }
  .card .flag{
    font-size:11px;letter-spacing:.18em;color:var(--ink-faint);
    text-transform:uppercase;
  }
  .card h3{
    font-size:21px;font-weight:600;margin:6px 0 2px;
    font-family:"Source Han Serif SC","Songti SC",Georgia,serif;
    letter-spacing:.06em;
  }
  .card .en{font-size:12.5px;color:var(--ink-faint);letter-spacing:.04em}
  .mods{
    display:flex;gap:6px;margin-top:18px;flex-wrap:wrap;
  }
  .mods em{
    font-style:normal;font-size:11.5px;
    padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-faint);
    letter-spacing:.04em;
  }
  .card .state{
    margin-top:16px;padding-top:13px;
    border-top:1px dashed var(--line);
    font-size:12px;color:var(--ink-faint);
    display:flex;align-items:center;gap:7px;
  }
  .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);flex:none}

  /* ---------- 自检面板 ---------- */
  .check{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:rgba(255,255,255,.02);
  }
  .row{
    display:grid;
    grid-template-columns:120px 1fr 96px;
    gap:14px;
    align-items:center;
    padding:15px 18px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .row:last-child{border-bottom:0}
  .row .k{color:var(--ink-dim);letter-spacing:.04em}
  .row .u{
    color:var(--ink-faint);
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    font-size:11.5px;
    word-break:break-all;
    line-height:1.55;
  }
  .row .s{
    text-align:right;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .s.ok{color:var(--ok)}
  .s.bad{color:var(--bad)}

  .hint{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-faint);
    line-height:1.85;
  }
  .hint code{
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    font-size:11.5px;
    color:var(--cyan);
    background:rgba(111,214,232,.08);
    padding:1px 6px;
    border-radius:4px;
  }

  /* ---------- 阶段条 ---------- */
  .stages{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .stage{
    background:var(--bg-2);
    padding:16px 18px;
    font-size:12.5px;
  }
  .stage b{
    display:block;font-size:11px;letter-spacing:.16em;
    color:var(--ink-faint);margin-bottom:6px;font-weight:600;
  }
  .stage.done b{color:var(--ok)}
  .stage.doing b{color:var(--gold)}
  .stage.todo{opacity:.5}

  footer{
    margin-top:clamp(56px,9vw,96px);
    padding-top:22px;
    border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
    font-size:12px;color:var(--ink-faint);letter-spacing:.06em;
  }
  footer .r{font-family:Georgia,serif;font-style:italic;color:var(--gold);opacity:.75}

  @media (max-width:560px){
    .row{grid-template-columns:1fr;gap:6px}
    .row .s{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<!-- 全屏 3D 舞台。地球是页面主体，不是"页面里的一个区块" ——
     所以这里用 fixed 铺满视口，其余 UI 全部浮在它上面。 -->
<div id="globe-stage">
  <div class="globe-msg" id="globe-msg">正在准备地球…</div>
</div>

<!-- 顶部悬浮栏：品牌 + 搜索 -->
<header id="topbar">
  <div class="brand">
    <span class="brand-cn">寰宇图志</span>
    <span class="brand-en">Atlas&nbsp;Mundi</span>
  </div>
  <div class="search-wrap">
    <input type="search" id="q" autocomplete="off" spellcheck="false"
           placeholder="哪里能看长城 / 有什么传统节日 / 说什么语言">
    <div class="search-res" id="q-res" hidden></div>
  </div>
  <div class="topbar-meta" id="topbar-meta">3 国 · 5 模态</div>
</header>

<!-- 底部国家导航：点一下，地球飞过去、档案从右侧滑出 -->
<nav id="dock" aria-label="已收录国家"><div id="cards"></div></nav>

<!-- 右侧档案面板 -->
<aside id="detail" aria-hidden="true">
  <button class="dclose" id="d-close" aria-label="关闭档案">×</button>
  <div class="dhead">
    <h2 id="d-title">国家档案</h2>
    <div id="d-sub"></div>
  </div>
  <div class="dscroll"><div id="d-body"></div></div>
</aside>

<!-- 左下角：操作提示与数据来源 -->
<div id="footline">
  <span id="globe-sub">拖动旋转 · 滚轮缩放 · 点击国土开档</span>
  <span class="fl-src">Natural Earth · Wikidata · Wikipedia · Commons · 华为云 OBS</span>
</div>

<!-- 旧版遗留的状态位，保留 id 以免脚本取空 -->
<span id="cards-sub" hidden></span>
<span id="cards-hint" hidden></span>
<span id="search-sub" hidden></span>

<script>
(function () {
  var cardsEl = document.getElementById('cards');
  var hintEl = document.getElementById('cards-hint');
  var subEl = document.getElementById('cards-sub');
  var detail = document.getElementById('detail');
  var dTitle = document.getElementById('d-title');
  var dSub = document.getElementById('d-sub');
  var dBody = document.getElementById('d-body');

  var MOD_LABEL = { image: '地标', audio: '语音', text: '文本', coords: '坐标', geometry: '边界' };
  var CUR = null;

  /* ---------- 素材双源 ----------
     优先从华为云 OBS（上海节点）取图片与音频，实测 0.17 秒；失败自动回退到
     仓库相对路径（GitHub Pages）。回退不是为了好看 —— OBS 欠费、桶策略变更、
     某地节点不通时，页面不至于整片破图。

     注意：OBS 对静态站默认域名强制 Content-Disposition: attachment（平台策略，
     2022 年起上海一等区域生效），所以 OBS 只能做素材源，不能做站点。
     但 <img> 与 <audio> 作为子资源不受该头影响 —— 这点是实测过的，不是推断。 */
  var OBS_BASE = 'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/';

  function assetSrc(rel) {
    if (!rel) return '';
    if (/^https?:\/\//i.test(rel)) return rel;
    return OBS_BASE + rel.replace(/^\/+/, '');
  }

  function setAsset(node, rel) {
    var fellBack = false;
    node.addEventListener('error', function () {
      if (!fellBack) {
        fellBack = true;
        node.src = rel;                       // 回退到仓库相对路径
        return;
      }
      if (typeof node.__onfail === 'function') node.__onfail();
    });
    node.src = assetSrc(rel);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function fail(msg) {
    hintEl.innerHTML = '';
    hintEl.appendChild(el('span', '', msg));
    cardsEl.innerHTML = '';
  }

  /* ---------- 底部国家导航 ----------
     原来这里是一整屏卡片墙。改成胶囊的理由：地球已经是主界面，卡片再占一屏
     就是重复入口；而且"点国家 → 滚到卡片"要求用户滚动，打断观看。
     现在点胶囊 = 地球飞过去 + 档案从右侧滑出，视线不用离开地球。 */
  function renderCards(list) {
    cardsEl.innerHTML = '';
    list.forEach(function (c) {
      var iso = c.iso_a2 || '';
      var b = el('button', 'dock-item');
      b.type = 'button';
      b.dataset.iso = iso;
      b.appendChild(el('span', 'di-iso', iso));
      b.appendChild(el('span', 'di-name', c.name_zh || ''));
      var n = 0;
      Object.keys(MOD_LABEL).forEach(function (k) {
        if (c.modalities && c.modalities[k]) n++;
      });
      b.title = (c.name_zh || '') + ' · ' + n + '/5 模态就绪';
      b.addEventListener('click', function () { openDetail(iso, b); });
      cardsEl.appendChild(b);
    });

    var meta = document.getElementById('topbar-meta');
    if (meta && list.length) {
      var done = list.filter(function (x) { return x.status === 'complete'; }).length;
      meta.textContent = list.length + ' 国 · ' + done + ' 完整';
    }
  }

  /* ---------- 详情 ---------- */
  function openPanel() {
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
    document.body.classList.add('panel-open');
  }

  function closePanel() {
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('panel-open');
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.remove('active');
    });
    if (typeof flyOut === 'function') flyOut();
  }

  function openDetail(iso, item, quiet) {
    Array.prototype.forEach.call(cardsEl.children, function (n) {
      n.classList.toggle('active', n === item);
    });
    if (typeof setActive === 'function') setActive(iso);

    dTitle.textContent = '读取中…';
    dSub.textContent = iso;
    dBody.innerHTML = '';
    openPanel();
    if (typeof flyToCountry === 'function') flyToCountry(iso);

    fetch('data/' + iso.toLowerCase() + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (d) { renderDetail(d, true); })
      .catch(function (e) {
        dTitle.textContent = '档案未就绪';
        dSub.textContent = iso;
        dBody.appendChild(el('p', 'hint',
          '读取 data/' + iso.toLowerCase() + '.json 失败（' + e.message + '）。' +
          '该国家/地区的数据尚未采集，属预期状态。'));
      });
  }

  /* 面板关闭按钮 + Esc */
  (function bindPanel() {
    var btn = document.getElementById('d-close');
    if (btn) btn.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && detail.classList.contains('open')) closePanel();
    });
  })();

  function renderDetail(d, quiet) {
    dTitle.textContent = d.name_zh;
    dSub.textContent = d.name_en + ' · ' + d.iso_a2 + ' / ' + d.iso_a3 + ' · ' + d.qid;

    var wrap = el('div', 'dwrap');

    /* 左：影像 */
    var left = el('div');
    var imgs = d.landmark_images || [];
    if (imgs.length) {
      var picWrap = el('div', 'dimg-wrap loading');
      var pic = el('img', 'dimg');
      picWrap.appendChild(pic);
      var capEl = el('div', 'cap', '');
      var licEl = el('div', 'cap dim', '');
      var strip = imgs.length > 1 ? el('div', 'thumbstrip') : null;
      var items = [];

      function showPic(idx) {
        var it = imgs[idx];
        picWrap.classList.remove('loaded');
        picWrap.classList.add('loading');
        pic.alt = it.caption_zh || it.caption || d.name_zh;
        pic.onload = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('loaded');
          // 竖构图（如埃菲尔铁塔 1400x2591）用 cover 会把塔顶塔基裁掉，
          // 改 contain 装下整张，两侧用底色补。横构图仍用 cover 铺满。
          var portrait = pic.naturalHeight > pic.naturalWidth * 1.15;
          picWrap.classList.toggle('fit', portrait);
        };
        pic.__onfail = function () {
          picWrap.classList.remove('loading');
          picWrap.classList.add('blank');
        };
        setAsset(pic, it.url);
        capEl.textContent = it.caption_zh || it.caption || '';
        licEl.textContent = it.license
          ? '授权：' + it.license + (it.author ? ' · ' + it.author : '')
          : '授权待确认（来源已记录：' + (it.title || 'Commons') + '）';
        items.forEach(function (n, i) { n.classList.toggle('active', i === idx); });
      }

      left.appendChild(picWrap);
      if (strip) {
        imgs.forEach(function (it, i) {
          var t = el('img', 'ts-item');
          t.alt = it.caption_zh || it.caption || (d.name_zh + ' 图片 ' + (i + 1));
          t.title = t.alt;
          t.loading = 'lazy';
          setAsset(t, it.thumb_url || it.url);
          t.addEventListener('click', function () { showPic(i); });
          items.push(t);
          strip.appendChild(t);
        });
      }
      showPic(0);
      if (strip) left.appendChild(strip);
      left.appendChild(capEl);
      left.appendChild(licEl);
    } else {
      left.appendChild(el('div', 'dimg blank', '暂无地标影像'));
    }

    /* 右：结构化 + 文本 */
    var right = el('div');

    var meta = el('dl', 'dmeta');
    [['首都', d.capital || '—'],
     ['大洲', d.continent || '—'],
     ['坐标', d.centroid ? d.centroid[1].toFixed(2) + '°N, ' + d.centroid[0].toFixed(2) + '°E' : '—'],
     ['语言', (d.languages || []).map(function (l) { return l.name_zh; }).join(' / ') || '—'],
     ['边界', d.geometry
        ? 'Natural Earth 50m · ' + ((d.geometry_stats || {}).vertices || '?') + ' 顶点'
        : '待采集']
    ].forEach(function (p) {
      meta.appendChild(el('dt', null, p[0]));
      meta.appendChild(el('dd', null, p[1]));
    });
    right.appendChild(meta);

    // 边界不能只写"已采集"——用户看不见等于没采。这里用等距圆柱投影画成 SVG 轮廓，
    // 无第三方库、离线可用，也顺带验证了阶段 D 要用的 GeoJSON 是好的。
    if (d.geometry) {
      var geoBox = el('div', 'geo-box');
      geoBox.appendChild(el('div', 'sub-label', '国界轮廓'));
      var svgHost = el('div', 'geo-svg', '读取边界数据…');
      geoBox.appendChild(svgHost);
      right.appendChild(geoBox);
      renderOutline(d.geometry, svgHost);
    }

    var txt = el('div', 'dtext');
    if (d.summary_text) txt.appendChild(el('p', null, d.summary_text));
    if (d.custom_text) {
      txt.appendChild(el('p', 'sub-label', '历史与民俗'));
      txt.appendChild(el('p', null, d.custom_text));
    }
    right.appendChild(txt);

    /* 文化特征：由大模型在构建期从摘要与民俗文本抽取，页面只读结果。
       每个标签的 title 属性挂着抽取时的原文片段，鼠标悬停可核对依据。 */
    var facets = d.custom_facets || {};
    var fgroups = [
      ['节庆', facets.festivals],
      ['饮食', facets.cuisine],
      ['宗教', facets.religion],
      ['建筑', facets.architecture],
      ['遗产', facets.heritage]
    ].filter(function (g) { return g[1] && g[1].length; });
    var kws = facets.keywords || [];

    if (fgroups.length || kws.length) {
      var fbox = el('div', 'facets');
      fbox.appendChild(el('div', 'sub-label', '文化特征'));
      if (kws.length) {
        var krow = el('div', 'frow');
        krow.appendChild(el('span', 'fkey', '关键词'));
        var kwrap = el('div', 'fval');
        kws.forEach(function (k) {
          var c = el('span', 'chip chip-kw', k.v || k);
          if (k.evidence) c.title = '原文：' + k.evidence;
          kwrap.appendChild(c);
        });
        krow.appendChild(kwrap);
        fbox.appendChild(krow);
      }
      fgroups.forEach(function (g) {
        var row = el('div', 'frow');
        row.appendChild(el('span', 'fkey', g[0]));
        var wrap = el('div', 'fval');
        g[1].forEach(function (x) {
          var c = el('span', 'chip', x.v || x);
          if (x.evidence) c.title = '原文：' + x.evidence;
          wrap.appendChild(c);
        });
        row.appendChild(wrap);
        fbox.appendChild(row);
      });
      right.appendChild(fbox);
    }

    /* 音频：每个语言一条，区域语言也在内 */
    var withAudio = (d.languages || []).filter(function (l) { return l.audio_url; });

  /* ---------- 国界轮廓（等距圆柱投影，纯 SVG） ---------- */
  function renderOutline(url, host) {
    fetch(url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (gj) {
        var rings = [];
        (gj.features || []).forEach(function (f) {
          var g = f.geometry || {};
          var polys = g.type === 'Polygon' ? [g.coordinates]
            : (g.type === 'MultiPolygon' ? g.coordinates : []);
          polys.forEach(function (poly) {
            poly.forEach(function (ring) { if (ring && ring.length > 2) rings.push(ring); });
          });
        });
        if (!rings.length) { host.textContent = '边界数据为空'; return; }

        var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        rings.forEach(function (ring) {
          ring.forEach(function (pt) {
            if (pt[0] < minX) minX = pt[0];
            if (pt[0] > maxX) maxX = pt[0];
            if (pt[1] < minY) minY = pt[1];
            if (pt[1] > maxY) maxY = pt[1];
          });
        });
        var W = 300, pad = 10;
        var spanX = Math.max(maxX - minX, 0.01);
        var spanY = Math.max(maxY - minY, 0.01);
        var scale = Math.min((W - pad * 2) / spanX, 150 / spanY);
        var H = Math.round(spanY * scale + pad * 2);
        var ox = (W - spanX * scale) / 2;
        var oy = (H - spanY * scale) / 2;

        var d = rings.map(function (ring) {
          return ring.map(function (pt, i) {
            var x = (ox + (pt[0] - minX) * scale).toFixed(1);
            var y = (oy + (maxY - pt[1]) * scale).toFixed(1);
            return (i ? 'L' : 'M') + x + ' ' + y;
          }).join('') + 'Z';
        }).join('');

        host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
          '<path d="' + d + '" fill="rgba(111,214,232,.10)" stroke="rgba(111,214,232,.75)" ' +
          'stroke-width=".8" stroke-linejoin="round"/></svg>';
        host.setAttribute('data-rings', rings.length);
      })
      .catch(function (e) {
        host.textContent = '边界读取失败（' + e.message + '）';
      });
  }

  /* ---------- 知识库检索（2-gram + BM25，纯本地） ----------
     为什么在前端检索而不是每次调大模型：
     1) key 不能进浏览器，公开仓库的静态站更是碰都不能碰；
     2) 三个国家的知识库只有几十条，本地算比一次网络往返快两个数量级；
     3) 断网、无代理也能演示 —— 这是录屏的硬要求。
     中文没有空格，用 2-gram 切分（不分词、不引词典），BM25 打分。 */
  var IDX = null;
  var qInput = document.getElementById('q');
  var qRes = document.getElementById('q-res');
  var qSub = document.getElementById('search-sub');

  function tokenize(text) {
    var s = String(text || '').toLowerCase();
    var toks = [], buf = '', mode = null;
    function flushCJK(b) {
      if (!b) return;
      if (b.length === 1) { toks.push(b); return; }
      for (var i = 0; i < b.length - 1; i++) toks.push(b.substr(i, 2));
    }
    function flushWord(b) { if (b.length >= 2) toks.push(b); }
    for (var i = 0; i < s.length; i++) {
      var ch = s.charAt(i);
      var m = /[\u3400-\u9fff]/.test(ch) ? 'c' : (/[a-z0-9]/.test(ch) ? 'a' : null);
      if (m !== mode) {
        if (mode === 'c') flushCJK(buf);
        else if (mode === 'a') flushWord(buf);
        buf = ''; mode = m;
      }
      if (m) buf += ch;
    }
    if (mode === 'c') flushCJK(buf);
    else if (mode === 'a') flushWord(buf);
    return toks;
  }

  function buildIdx(docs) {
    var postings = {}, df = {}, lens = [];
    docs.forEach(function (d, i) {
      var toks = tokenize(d.index_text);
      lens[i] = toks.length || 1;
      var tf = {};
      toks.forEach(function (t) { tf[t] = (tf[t] || 0) + 1; });
      for (var t in tf) {
        if (!postings[t]) postings[t] = {};
        postings[t][i] = tf[t];
        df[t] = (df[t] || 0) + 1;
      }
    });
    var sum = lens.reduce(function (a, b) { return a + b; }, 0);
    return { docs: docs, postings: postings, df: df, lens: lens,
             avgdl: sum / (docs.length || 1), N: docs.length };
  }

  /* 疑问句里的虚词。中文 2-gram 会把「哪里能看」切成「哪里/里能/能看」，
     这些碎片在多个文档里都出现，是纯噪声 —— 实测「哪里能看长城」会把
     「法国面积有多大？首都是哪里？」顶到第二名，就因为含「哪里」。 */
  var STOP = {};
  ('哪里 里能 能看 什么 怎么 哪些 哪个 多少 哪儿 有什 么地 么语 么节 么样 么东 ' +
   '有哪 些地 请问 一下 告诉 知道 我想 想要 是否 可以 应该 这个 那个 ' +
   '这些 那些 是什 为什 一个 有些 有没 没有 是不 不是').split(' ').forEach(function (w) {
    if (w) STOP[w] = 1;
  });

  var MIN_SCORE = 1.5;   // 绝对阈值：低于此分视为噪声（实测「日本有什么」最高只有 1.74）
  var REL_RATIO = 0.35;  // 相对阈值：只保留最高分的 35% 以上

  function bm25(q, topk) {
    if (!IDX) return [];
    var k1 = 1.5, b = 0.75, score = {};
    tokenize(q).forEach(function (t) {
      if (STOP[t]) return;
      var pl = IDX.postings[t];
      if (!pl) return;
      var n = IDX.df[t] || 0;
      var idf = Math.log(1 + (IDX.N - n + 0.5) / (n + 0.5));
      for (var i in pl) {
        var tf = pl[i], dl = IDX.lens[i];
        score[i] = (score[i] || 0) +
          idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * dl / IDX.avgdl));
      }
    });
    var arr = [];
    for (var i in score) { if (score[i] > MIN_SCORE) arr.push([IDX.docs[i], score[i]]); }
    arr.sort(function (a, b) { return b[1] - a[1]; });
    if (!arr.length) return [];
    var floor = arr[0][1] * REL_RATIO;
    arr = arr.filter(function (x) { return x[1] >= floor; });
    return arr.slice(0, topk || 5);
  }

  function cardOf(iso) {
    var all = cardsEl.children;
    for (var i = 0; i < all.length; i++) {
      if (all[i].dataset && all[i].dataset.iso === iso) return all[i];
    }
    return null;
  }

  function renderResults(q) {
    var hits = bm25(q, 5);

        + '数据集目前只覆盖 3 个国家/地区，问别的本来就答不出来。'));

    hits.forEach(function (h) {

      top.appendChild(el('span', 'sr-q', d.q));

  if (qInput) {
    var qTimer = null;

  Array.prototype.forEach.call(document.querySelectorAll('.sr-ex'), function (btn) {

  function loadSearchIndex() {
    fetch('data/search.json')
      .then(function (r) {

      })
      .then(function (d) {

  /* ---------- 3D 地球 ----------
     设计上的四个决定：

     1) 懒加载。three.min.js 670KB，若在首屏加载会把 LCP 拖到 3 秒以上。
        用 IntersectionObserver 等区块进入视口再加载，首屏完全不受影响。

     2) 不用贴图，只用我们自己的 GeoJSON。真实地球纹理（4K 等距柱状图）动辄
        2~8MB，且来源授权要单独确认；而我们的数据只有 110KB —— 大陆轮廓 + 三国
        国界，全部来自 Natural Earth 与既有 geo/*.geojson。视觉上反而更统一：
        暗球 + 淡色大陆 + 金色国界，和站点其余部分同一套配色。

     3) 球面插值细分。国界相邻两点若相距较远，直接用直线连会在球体内部穿过去
        （弦切进球），表现为"线条沉到球里"。所以每条边按 ≤2° 插值成折线。

     4) 点击拾取要 worldToLocal。射线与球求交得到的是**世界坐标**，而我们要反算
        经纬度，必须先把交点转回 spinGroup 的局部坐标 —— 否则球体转过之后
        算出的经纬度全是错的。 */
  var GLOBE_SRC = [
    'https://atlas-mundi-1419.obs.cn-east-3.myhuaweicloud.com/vendor/three.min.js',
    'vendor/three.min.js'
  ];
  var globe = {
    state: 'idle', ready: false, data: null,
    scene: null, camera: null, renderer: null,
    tilt: null, spin: null, sphere: null,
    groups: {},           // iso -> LineSegments
    matOn: null, matOff: null,
    active: null,
    autoSpin: true,
    inView: false,
    dragging: false,
    last: { x: 0, y: 0 },
    vel: { x: 0, y: 0 },
    idleUntil: 0,
    raf: 0,
    camTarget: 3.02,      // 相机的目标 z，每帧阻尼逼近
    rotTargetY: 0,        // 飞行目标经度（弧度）
    rotTargetX: 0,
    flying: false
  };

  var D2R = Math.PI / 180;
  var R2D = 180 / Math.PI;

  function globeStage() { return document.getElementById('globe-stage'); }
  function globeMsg(text, isErr) {
    var st = globeStage();
    if (!st) return;
    var m = document.getElementById('globe-msg');
    if (!m) {
      m = el('div', 'globe-msg');
      m.id = 'globe-msg';
      st.appendChild(m);
    }
    m.textContent = text;
    m.className = 'globe-msg' + (isErr ? ' err' : '');

  function loadScriptOnce(urls, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { done(new Error('all sources failed')); return; }
      var src = urls[i++];
      var sc = document.createElement('script');
      sc.src = src;
      sc.async = true;
      sc.onload = function () { done(null); };
      sc.onerror = function () {
        sc.remove();
        next();
      };
      document.head.appendChild(sc);
    }

  /* 经纬度 → 球面坐标。y 轴朝北，经度 0 落在 -Z 方向（正对初始相机）。 */
  function llToVec3(lon, lat, r, out) {
    var phi = (90 - lat) * D2R;
    var theta = (lon + 180) * D2R;
    var sp = Math.sin(phi);
    out.set(-r * sp * Math.cos(theta), r * Math.cos(phi), r * sp * Math.sin(theta));
    return out;
  }

  /* 把一条边按 ≤2° 插值成折线，避免弦切进球体 */
  function pushEdge(a, b, r, arr) {
    var dLon = b[0] - a[0];
    if (dLon > 180) dLon -= 360;
    if (dLon < -180) dLon += 360;
    var dLat = b[1] - a[1];
    var steps = Math.max(1, Math.ceil(Math.max(Math.abs(dLon), Math.abs(dLat)) / 2));
    var va = new THREE.Vector3();
    llToVec3(a[0], a[1], r, va);
    for (var i = 1; i <= steps; i++) {
      var t = i / steps;
      var vb = new THREE.Vector3();
      llToVec3(a[0] + dLon * t, a[1] + dLat * t, r, vb);
      arr.push(va.x, va.y, va.z, vb.x, vb.y, vb.z);
      va = vb;
    }

  /* rings（环数组，null 表示断点）→ LineSegments */
  function ringsToLines(rings, radius, material) {
    var pos = [];
    rings.forEach(function (ring) {
      var prev = null;
      for (var i = 0; i < ring.length; i++) {
        var pt = ring[i];
        if (!pt) { prev = null; continue; }
        if (prev) pushEdge(prev, pt, radius, pos);
        prev = pt;
      }
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, material);
  }

  /* 经纬网：每 30° 一条 */
  function graticule(radius) {
    var pos = [];
    var lon, lat, i;
    for (lon = -180; lon < 180; lon += 30) {
      for (i = -88; i < 88; i += 2) {
        pushEdge([lon, i], [lon, i + 2], radius, pos);
      }
    }
    for (lat = -60; lat <= 60; lat += 30) {
      for (i = -178; i < 178; i += 2) {
        pushEdge([i, lat], [i + 2, lat], radius, pos);
      }
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color: 0x2c5478, transparent: true, opacity: 0.42

  }

  /* 世界坐标（球面）→ 经纬度 */
  function vec3ToLL(v) {
    var n = v.clone().normalize();
    var lat = Math.asin(Math.max(-1, Math.min(1, n.y))) * R2D;
    var lon = Math.atan2(n.z, -n.x) * R2D - 180;
    while (lon < -180) lon += 360;
    while (lon > 180) lon -= 360;
    return { lon: lon, lat: lat };
  }

  function countryAt(lon, lat) {
    var list = globe.data.countries || [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i].bbox;
      if (!b) continue;
      // bbox 放宽 2°，球面上点击有像素级误差
      if (lon >= b[0] - 2 && lon <= b[2] + 2 && lat >= b[1] - 2 && lat <= b[3] + 2) {
        return list[i];
      }

    return null;
  }

  function setActive(iso) {
    globe.active = iso;
    Object.keys(globe.groups).forEach(function (k) {
      globe.groups[k].material = (k === iso) ? globe.matOn : globe.matOff;
    });
    Array.prototype.forEach.call(
      document.querySelectorAll('.dock-item'),
      function (n) { n.classList.toggle('active', n.dataset.iso === iso); }
    );
  }

  /* 把某国转到正对相机。
     spin 绕 Y：点 (lon,lat) 的方位角 θ=(lon+180)°，令 θ+ry=90° 即朝向 +Z，
     得 ry = -lon - 90。
     tilt 绕 X：正角度使北极转向相机，故北半球国家用正 lat。 */
  function focusCountry(iso, ms) {
    var c = null;
    (globe.data.countries || []).forEach(function (x) { if (x.iso === iso) c = x; });
    if (!c || !globe.spin) return;
    var toY = -c.center[0] * D2R - Math.PI / 2;
    var toX = c.center[1] * D2R;
    var fromY = globe.spin.rotation.y;
    var fromX = globe.tilt.rotation.x;
    var dY = toY - fromY;
    while (dY > Math.PI) dY -= Math.PI * 2;
    while (dY < -Math.PI) dY += Math.PI * 2;

    globe.idleUntil = performance.now() + dur + 2600;
    globe.autoSpin = false;
    (function step() {
      var k = Math.min(1, (performance.now() - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      globe.spin.rotation.y = fromY + dY * e;
      globe.tilt.rotation.x = fromX + dX * e;
      if (k < 1) requestAnimationFrame(step);
      else globe.autoSpin = true;
    })();
  }

  /* ---------- 地球贴图与材质 ----------
     为什么需要 CORS：<img> 展示图片不受跨域限制，但 WebGL **纹理**必须有
     Access-Control-Allow-Origin，否则纹理会加载失败（画布被污染）。这是
     图片与纹理最容易踩的差别 —— 之前 assets 里的图片能显示，不代表贴图能用。

     所以这里做了三级降级：
       1. OBS（快，但需要桶配 CORS）
       2. 仓库同域（慢，但无跨域问题）
       3. 都没有 → 素色球 + 经纬网 + 大陆轮廓（仍是可用的地球，只是没有地表纹理）
     不管哪一级，页面都不至于空着。 */
  var TEX_BASES = [OBS_BASE + 'assets/tex/', 'assets/tex/'];

  function loadEarthTextures(done) {
    var loader = new THREE.TextureLoader();
    var i = 0;
    var settled = false;

    function finish(day, night) {
      if (settled) return;
      settled = true;
      done(day, night);
    }

    function tryBase() {
      if (i >= TEX_BASES.length) { finish(null, null); return; }
      var base = TEX_BASES[i++];
      loader.load(base + 'earth-day.webp',
        function (day) {
          // 夜景可选：拿不到就只用日间图做昼夜明暗
          loader.load(base + 'earth-night.webp',
            function (night) { finish(day, night); },
            undefined,
            function () { finish(day, null); });
        },
        undefined,
        function () { tryBase(); }        // 这一级失败，换下一级
      );
    }
    tryBase();
  }

  function srgbToLin(c) { return Math.pow(c, 2.2); }

  function earthMaterial(dayTex, nightTex) {
    var hasNight = nightTex ? 1 : 0;
    var uniforms = {
      dayMap: { value: dayTex },
      nightMap: { value: nightTex || dayTex },
      hasNight: { value: hasNight },
      lightDir: { value: new THREE.Vector3(1.0, 0.34, 0.72).normalize() }
    };

    var vert = [
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vV;',
      'void main() {',
      '  vUv = uv;',
      '  vN = normalize(mat3(modelMatrix) * normal);',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vV = normalize(cameraPosition - wp.xyz);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',

      'uniform sampler2D dayMap;',
      'uniform sampler2D nightMap;',

      'uniform vec3 lightDir;',
      'varying vec2 vUv;',
      'varying vec3 vN;',
      'varying vec3 vV;',
      'vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }',
      'vec3 l2s(vec3 c){ return pow(c, vec3(1.0/2.2)); }',
      'void main() {',
      '  vec3 n = normalize(vN);',

      // 晨昏线留一点柔化，硬切会有锯齿
      '  float dayAmt = smoothstep(-0.28, 0.34, ndl);',
      '  vec3 day = s2l(texture2D(dayMap, vUv).rgb);',
      '  vec3 col;',
      '  if (hasNight > 0.5) {',
      '    vec3 night = s2l(texture2D(nightMap, vUv).rgb);',
      // 夜面略微提亮，让城市灯光看得见但不刺眼
      '    col = mix(night * 1.25, day, dayAmt);',
      '  } else {',
      // 没有夜景图时，暗面压到 18%，保留一点轮廓可读性
      '    col = day * mix(0.18, 1.0, dayAmt);',
      '  }',
      // 边缘大气：Fresnel 越靠轮廓越亮，模拟散射
      '  float rim = pow(1.0 - max(dot(n, normalize(vV)), 0.0), 3.2);',
      '  col += vec3(0.13, 0.34, 0.68) * rim * 0.85;',
      // 迎光面轻微提亮，增强立体感
      '  col *= 1.0 + 0.10 * smoothstep(0.55, 1.0, ndl);',
      '  gl_FragColor = vec4(l2s(col), 1.0);',
      '}'
    ].join('\n');

    return new THREE.ShaderMaterial({
      uniforms: uniforms,
      vertexShader: vert,
      fragmentShader: frag
    });
  }

  /* ---------- 相机与飞行动画 ----------
     用"目标值 + 每帧阻尼逼近"而不是 tween 时间轴：这样飞行途中随时可以
     被拖拽打断，不会出现动画和手动操作互相抢控制权。 */
  var CAM_FAR = 3.02;      // 全球视角
  var CAM_NEAR = 1.92;     // 聚焦某国

  function flyTo(lon, lat, camZ) {
    if (!globe.spin) return;
    globe.rotTargetY = -lon * D2R - Math.PI / 2;
    globe.rotTargetX = Math.max(-1.15, Math.min(1.15, lat * D2R));
    globe.camTarget = camZ;
    globe.flying = true;
    globe.autoSpin = false;
  }

  function flyToCountry(iso) {
    var list = (globe.data && globe.data.countries) || [];
    var c = null;
    for (var i = 0; i < list.length; i++) if (list[i].iso === iso) c = list[i];
    if (!c) return;
    flyTo(c.center[0], c.center[1], CAM_NEAR);
    globe.idleUntil = performance.now() + 1e9;   // 面板开着就不自转
  }

  function flyOut() {
    if (!globe.spin) return;
    globe.camTarget = CAM_FAR;
    globe.rotTargetX = 0;
    globe.flying = true;
    globe.autoSpin = true;
    globe.idleUntil = performance.now() + 1500;
  }

  function buildGlobe(data) {
    var stage = globeStage();
    var msg = document.getElementById('globe-msg');
    if (msg) msg.remove();

    var w = stage.clientWidth || 640;
    var h = stage.clientHeight || 480;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
    camera.position.set(0, 0, CAM_FAR);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    stage.appendChild(renderer.domElement);

    var tilt = new THREE.Group();
    var spin = new THREE.Group();
    tilt.add(spin);
    scene.add(tilt);

    /* 先建素色球，贴图到位再换材质。这样即使纹理跨域失败，
       地球仍然是可见的实心球，而不是一片空白。 */
    var fallbackMat = new THREE.MeshBasicMaterial({ color: 0x0e2438 });
    var sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), fallbackMat);
    spin.add(sphere);

    /* 大气：两层。内层贴着球面做轮廓辉光，外层散开做稀薄的气体感。 */
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.013, 64, 48),
      new THREE.MeshBasicMaterial({
        color: 0x4088c8, transparent: true, opacity: 0.11, side: THREE.BackSide
      })
    ));
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.145, 48, 32),
      new THREE.MeshBasicMaterial({
        color: 0x2a6096, transparent: true, opacity: 0.05, side: THREE.BackSide
      })
    ));

    /* 经纬网与大陆轮廓：只在没有贴图时显示（兜底形态）。
       有贴图后它们会显得杂乱，所以贴图一到就隐藏。 */
    var grat = graticule(1.001);
    spin.add(grat);
    var landLine = ringsToLines(data.land || [], 1.0015, new THREE.LineBasicMaterial({
      color: 0x4a7ea8, transparent: true, opacity: 0.40
    }));
    spin.add(landLine);

    /* 三国国界：这是数据标记，贴图之上也要保留，否则看不出"收录了哪里" */
    globe.matOn = new THREE.LineBasicMaterial({
      color: 0xffd98a, transparent: true, opacity: 1
    });
    globe.matOff = new THREE.LineBasicMaterial({
      color: 0xe8c078, transparent: true, opacity: 0.5
    });
    (data.countries || []).forEach(function (c) {
      var line = ringsToLines(c.rings, 1.004, globe.matOff);
      spin.add(line);
      globe.groups[c.iso] = line;
    });

    /* 贴图异步替换 */
    loadEarthTextures(function (dayTex, nightTex) {
      if (!dayTex) {
        var subEl2 = document.getElementById('globe-sub');
        if (subEl2) {
          subEl2.textContent = '纹理未能加载，已回退为轮廓模式（拖动旋转 · 点击国土开档）';
        }
        return;
      }
      sphere.material = earthMaterial(dayTex, nightTex);
      grat.visible = false;
      landLine.visible = false;
      // 贴图到位后，环境光与方向光不再需要（着色全在 shader 里）
      var subEl3 = document.getElementById('globe-sub');
      if (subEl3) subEl3.textContent = '拖动旋转 · 滚轮缩放 · 点击国土开档';
    });

    globe.scene = scene;
    globe.camera = camera;
    globe.renderer = renderer;
    globe.tilt = tilt;
    globe.spin = spin;
    globe.sphere = sphere;
    globe.data = data;
    globe.ready = true;

    // ---- 交互：拖拽 ----
    var cv = renderer.domElement;
    var downAt = { x: 0, y: 0 };
    cv.addEventListener('pointerdown', function (e) {
      globe.dragging = true;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      downAt.x = e.clientX;
      downAt.y = e.clientY;
      globe.vel.x = globe.vel.y = 0;
      cv.classList.add('dragging');
      cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
      globe.autoSpin = false;
      globe.flying = false;        // 手动接管，打断正在进行的飞行
      globe.idleUntil = performance.now() + 1e9;
    });
    cv.addEventListener('pointermove', function (e) {
      if (!globe.dragging) return;
      var dx = e.clientX - globe.last.x;
      var dy = e.clientY - globe.last.y;
      globe.last.x = e.clientX;
      globe.last.y = e.clientY;
      globe.vel.x = dx * 0.005;
      globe.vel.y = dy * 0.005;
      globe.spin.rotation.y += globe.vel.x;
      globe.tilt.rotation.x += globe.vel.y;
      var lim = 78 * D2R;
      globe.tilt.rotation.x = Math.max(-lim, Math.min(lim, globe.tilt.rotation.x));
    });
    function endDrag() {
      if (!globe.dragging) return;
      globe.dragging = false;
      cv.classList.remove('dragging');
      globe.idleUntil = performance.now() + 2200;
    }
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('pointerleave', endDrag);

    // ---- 交互：缩放 ----
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      globe.camTarget = Math.max(1.45, Math.min(4.8,
        globe.camTarget + e.deltaY * 0.0018));
    }, { passive: false });

    // ---- 交互：点击拾取 ----
    var ray = new THREE.Raycaster();
    var ndc = new THREE.Vector2();
    cv.addEventListener('click', function (e) {
      // 拖拽结束时浏览器也会派发 click，位移超过 6px 视为拖动而非点击
      if (Math.abs(e.clientX - downAt.x) + Math.abs(e.clientY - downAt.y) > 6) return;
      var rect = cv.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      var hits = ray.intersectObject(sphere);
      if (!hits.length) return;
      // 关键：交点在世界坐标，必须转回 spin 的局部坐标才能反算经纬度
      var local = globe.spin.worldToLocal(hits[0].point.clone());
      var ll = vec3ToLL(local);
      var c = countryAt(ll.lon, ll.lat);
      if (!c) return;
      setActive(c.iso);
      openDetail(c.iso, cardOf(c.iso), false);
    });

    // ---- 渲染循环 ----
    function render() {
      globe.raf = requestAnimationFrame(render);
      if (document.hidden) return;          // 切到别的标签页就停，省电

      // 飞行：朝目标角度阻尼逼近。用阻尼而不是时间轴 tween，
      // 是为了飞行途中被拖拽打断时不会两套动画抢控制权。
      if (globe.flying && !globe.dragging) {
        var dy = globe.rotTargetY - spin.rotation.y;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        spin.rotation.y += dy * 0.075;
        tilt.rotation.x += (globe.rotTargetX - tilt.rotation.x) * 0.075;
        if (Math.abs(dy) < 0.0015 &&
            Math.abs(globe.rotTargetX - tilt.rotation.x) < 0.0015) {
          globe.flying = false;
        }
      }

      camera.position.z += (globe.camTarget - camera.position.z) * 0.075;

      if (globe.autoSpin && !globe.dragging && !globe.flying &&
          performance.now() > globe.idleUntil) {
        spin.rotation.y += 0.0013;
      }
      if (!globe.dragging && Math.abs(globe.vel.x) + Math.abs(globe.vel.y) > 0.0002) {
        globe.vel.x *= 0.93;
        globe.vel.y *= 0.93;
        spin.rotation.y += globe.vel.x;
        tilt.rotation.x += globe.vel.y;
        var lim2 = 78 * D2R;
        tilt.rotation.x = Math.max(-lim2, Math.min(lim2, tilt.rotation.x));
      }
      renderer.render(scene, camera);
    }
    render();

    // ---- 尺寸变化 ----
    function resize() {
      var w2 = stage.clientWidth, h2 = stage.clientHeight;
      if (!w2 || !h2) return;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2, false);
    }
    if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
    window.addEventListener('resize', resize);

    var sub = document.getElementById('globe-sub');
    if (sub) sub.textContent = data.countries.length + ' 国已上图 · 拖拽旋转';
    setActive((data.countries[0] || {}).iso);
  }

  function startGlobe() {
    if (globe.state !== 'idle') return;
    if (!window.WebGLRenderingContext) {
      globeMsg('当前浏览器不支持 WebGL，3D 地球无法显示。国界轮廓在各国详情页内仍可查看。', true);
      globe.state = 'failed';
      return;
    }
    globe.state = 'loading';
    globeMsg('正在加载地球模型…');
    loadScriptOnce(GLOBE_SRC, function (err) {
      if (err || !window.THREE) {
        globe.state = 'failed';
        globeMsg('3D 模型未能加载（three.js 不可达）。国界轮廓在各国详情页内仍可查看。', true);
        return;
      }
      fetch('geo/globe.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (data) {
          try {
            buildGlobe(data);
            globe.state = 'ok';
          } catch (e2) {
            globe.state = 'failed';
            globeMsg('3D 初始化失败：' + e2.message, true);
          }
        })
        .catch(function (e3) {
          globe.state = 'failed';
          globeMsg('地球数据未能加载（' + e3.message + '）', true);
        });
    });
  }

  /* 首屏就是地球，直接启动。之前那套"滚到区块才加载"已经不适用 ——
     现在地球是页面主体，拖到后面才出现是不可接受的。 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGlobe);
  } else {
    startGlobe();
  }

  /* ---------- 启动 ---------- */
  fetch('data/index.json')
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (idx) {
      renderCards(idx.countries || []);
      var total = (idx.countries || []).length;
      var ready = (idx.countries || []).filter(function (c) { return c.status !== 'placeholder'; }).length;
      subEl.textContent = total + ' 个国家/地区 · ' + ready + ' 条已接入 · schema v' + idx.schema_version;
      hintEl.textContent = '';
      // 注意：这里**不**自动打开任何档案。首屏应该是完整的地球，
      // 由用户点击国土或底部胶囊再展开面板。
      loadSearchIndex();
    })
    .catch(function (e) {
      subEl.textContent = '数据未加载';
      fail('读取 data/index.json 失败：' + e.message +
           '。若你是直接双击打开本地文件（file:// 协议），浏览器会禁止 fetch —— 请用公网地址或起一个本地服务器。');
    });
})();
</script>

  /* 文化特征标签 */
  .facets{margin-top:4px}
  .frow{display:flex;gap:10px;align-items:flex-start;margin-top:7px}
  .fkey{
    flex:0 0 40px;font-size:11px;letter-spacing:.06em;
    color:var(--ink-faint);padding-top:4px;
  }
  .fval{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:12px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--ink-dim);
    background:rgba(255,255,255,.02);cursor:default;
    transition:border-color .2s ease,color .2s ease;
  }
  .chip:hover{border-color:rgba(216,178,106,.5);color:var(--ink)}
  .chip-kw{
    border-color:rgba(216,178,106,.35);
    color:rgba(216,178,106,.92);
    background:rgba(216,178,106,.05);
  }

  /* 国界轮廓 */
  .geo-box{margin-top:4px}
  .geo-svg{
    border:1px solid var(--line);border-radius:10px;
    background:linear-gradient(160deg,#0c1220,#090e1a);
    padding:4px;font-size:12px;color:var(--ink-faint);
  }
  .geo-svg svg{display:block;width:100%;height:auto}

  /* 多图切换 */
  .thumbstrip{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ts-item{
    width:64px;height:46px;object-fit:cover;border-radius:6px;
    border:1px solid var(--line);cursor:pointer;opacity:.55;
    transition:opacity .2s ease,border-color .2s ease;
  }
  .ts-item:hover{opacity:.85}
  .ts-item.active{opacity:1;border-color:rgba(216,178,106,.65)}

  /* 语言音频行 */
  .lang-audio{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line);
  }
  .lang-audio:last-child{border-bottom:0}
  .la-name{font-size:13.5px;color:var(--ink);min-width:84px}
  .la-role{
    font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;
  }
  .la-player{flex:1;height:32px;min-width:0}

  @media (max-width:760px){
    .dwrap{grid-template-columns:1fr}
  }

/* ============ 全屏地球布局 ============ */
/* 这一层覆盖旧的"长页面"排版：不再有文档流滚动，一切浮在 3D 舞台之上。 */
html,body{
  height:100%;overflow:hidden;
}
body{
  margin:0;padding:0;
  background:#04070d;
}

#globe-stage{
  position:fixed;inset:0;z-index:0;
  transform-origin:50% 50%;
  transition:transform .68s cubic-bezier(.22,.61,.36,1);
}
#globe-stage canvas{display:block;width:100%;height:100%}

/* 档案面板打开时，地球整体左移并缩小 —— 比改相机更稳，
   不会触发 canvas 反复 resize，也不会有一次性的抖动。 */
body.panel-open #globe-stage{
  transform:translateX(-19%) scale(.84);
}

/* --- 顶部栏 --- */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:24px;
  padding:16px 26px;
  background:linear-gradient(180deg,rgba(4,7,13,.92) 0%,rgba(4,7,13,.55) 62%,transparent 100%);
  pointer-events:none;              /* 只有子元素可点，避免挡住地球拖拽 */
}
#topbar > *{pointer-events:auto}

.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.brand-cn{
  font-family:var(--serif,"Songti SC",serif);
  font-size:20px;letter-spacing:.16em;color:var(--ink);
}
.brand-en{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);
}

.search-wrap{
  position:relative;flex:1 1 auto;max-width:520px;margin:0 auto;
}
#q{
  width:100%;box-sizing:border-box;
  padding:11px 16px;font-size:13.5px;font-family:inherit;
  color:var(--ink);
  background:rgba(12,20,34,.72);
  border:1px solid rgba(120,150,190,.30);
  border-radius:999px;outline:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .22s ease,background .22s ease,box-shadow .22s ease;
  -webkit-appearance:none;appearance:none;
}
#q::placeholder{color:var(--ink-faint)}
#q:focus{
  border-color:rgba(216,178,106,.62);
  background:rgba(14,22,38,.88);
  box-shadow:0 0 0 3px rgba(216,178,106,.10);
}
#q::-webkit-search-cancel-button{filter:invert(.45)}

.topbar-meta{
  flex:0 0 auto;font-size:11px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}

/* 搜索结果：从搜索框下方浮出 */
#q-res{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  max-height:52vh;overflow-y:auto;
  border-radius:12px;border:1px solid rgba(120,150,190,.28);
  background:rgba(8,13,23,.95);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 48px rgba(0,0,0,.55);
}
#q-res[hidden]{display:none}

/* --- 底部国家导航 --- */
#dock{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  z-index:30;pointer-events:none;
}
#dock #cards{
  display:flex;gap:10px;pointer-events:auto;
}
.dock-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 16px;border-radius:999px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--ink-dim);
  background:rgba(10,16,28,.72);
  border:1px solid rgba(120,150,190,.26);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:border-color .22s ease,background .22s ease,color .22s ease,transform .22s ease;
}
.dock-item:hover{
  border-color:rgba(216,178,106,.55);color:var(--ink);
  transform:translateY(-2px);
}
.dock-item.active{
  border-color:rgba(216,178,106,.85);
  background:rgba(216,178,106,.14);
  color:#f2d9a4;
}
.di-iso{
  font-size:9.5px;letter-spacing:.10em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dock-item.active .di-iso{color:rgba(242,217,164,.75)}

/* --- 右侧档案面板 --- */
#detail{
  position:fixed;top:0;right:0;z-index:40;
  width:min(452px,100vw);height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:rgba(8,13,22,.93);
  border-left:1px solid rgba(120,150,190,.24);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:-24px 0 64px rgba(0,0,0,.5);
  transform:translateX(102%);
  transition:transform .52s cubic-bezier(.22,.61,.36,1);
  visibility:hidden;
}
#detail.open{transform:none;visibility:visible}
#detail[hidden]{display:none}

.dhead{
  padding:22px 26px 16px;border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.dhead h2{
  margin:0;font-family:var(--serif,"Songti SC",serif);
  font-size:23px;font-weight:500;letter-spacing:.06em;color:var(--ink);
}
#d-sub{
  margin-top:5px;font-size:11px;letter-spacing:.07em;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.dscroll{
  flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 26px 30px;
}
.dclose{
  position:absolute;top:16px;right:16px;
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;cursor:pointer;
  color:var(--ink-dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line);font-family:inherit;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.dclose:hover{color:var(--ink);border-color:rgba(216,178,106,.5);background:rgba(216,178,106,.10)}

/* 面板里空间窄，详情原本的两列网格改为单列 */
#detail .dwrap{grid-template-columns:1fr;gap:16px}
#detail .dimg-wrap{aspect-ratio:16/10}

/* --- 左下角提示 --- */
#footline{
  position:fixed;left:26px;bottom:30px;z-index:20;
  display:flex;flex-direction:column;gap:4px;
  font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint);
  pointer-events:none;
  opacity:.8;
}
.fl-src{font-size:9.5px;opacity:.7}

/* --- 移动端 --- */
@media (max-width:760px){
  #topbar{padding:12px 14px;gap:12px;flex-wrap:wrap}
  .brand-en{display:none}
  .brand-cn{font-size:17px}
  .topbar-meta{display:none}
  .search-wrap{max-width:none;order:3;flex-basis:100%;margin-top:2px}
  #q{font-size:13px;padding:10px 14px}
  #dock{bottom:20px}
  .dock-item{padding:8px 13px;font-size:12px}
  #detail{
    width:100vw;height:78vh;height:78dvh;top:auto;bottom:0;
    border-left:0;border-top:1px solid rgba(120,150,190,.26);
    border-radius:18px 18px 0 0;
    transform:translateY(102%);
  }
  #detail.open{transform:none}
  body.panel-open #globe-stage{transform:translateY(-14%) scale(.9)}
  #footline{display:none}
}
</style>
</body>
</html>
